name: Phase 13 Final Format

on:
  push:
    branches:
      - feat/phase13-home-command-center

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier tests/e2e/mobile-layout-audit.spec.ts tests/e2e/phase13-home-command-center.spec.ts tests/e2e/phase9-home-ui.spec.ts tests/unit/app/GameApp.officialTournament.test.tsx tests/unit/app/GameApp.officialTournamentRetry.test.tsx tests/unit/features/home/HomePracticeSchedule.test.tsx --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "style: format Phase 13 final tests"
          git push origin HEAD:feat/phase13-home-command-center
