name: Phase16 Nullable Match Type Patch

on:
  push:
    branches:
      - feat/phase16-match-command-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply nullable match compatibility patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/app/GameApp.tsx')
          text = path.read_text()
          old = 'import type { SimulateMatchResult } from "../domain/match/simulateMatch";'
          new = 'import type { MatchStepResult } from "../domain/match/simulateMatch";'
          if old not in text:
              raise SystemExit('GameApp match result import anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '  const [, setLatestMatchResult] = useState<SimulateMatchResult | null>(null);',
              '  const [, setLatestMatchResult] = useState<MatchStepResult | null>(null);',
              1,
          )
          text = text.replace(
              '    useState<SimulateMatchResult | null>(null);',
              '    useState<MatchStepResult | null>(null);',
              1,
          )
          path.write_text(text)

          path = Path('src/features/match/MatchScreen.tsx')
          text = path.read_text()
          text = text.replace(
              'import type { SimulateMatchResult } from "../../domain/match/simulateMatch";',
              'import type { MatchStepResult } from "../../domain/match/simulateMatch";',
              1,
          )
          text = text.replace(
              '  result: SimulateMatchResult | null;',
              '  result: MatchStepResult | null;',
              1,
          )
          text = text.replace(
              '  const matchComplete = Boolean(result && visibleEventIndex >= lastEventIndex);',
              '  const matchComplete = Boolean(\n    result?.analysis && visibleEventIndex >= lastEventIndex,\n  );',
              1,
          )
          start = text.index('  const winnerDisplayName =\n')
          end = text.index('  const homeShortName =', start)
          winner = '''  const winnerDisplayName = result.analysis
            ? presentation?.homeTeam.schoolId === result.analysis.winnerSchoolId
              ? presentation.homeTeam.displayName
              : presentation?.awayTeam.schoolId === result.analysis.winnerSchoolId
                ? presentation.awayTeam.displayName
                : state.schools[result.analysis.winnerSchoolId]?.name
            : null;
          '''
          text = text[:start] + winner + text[end:]
          text = text.replace(
              '  const userWon = result.analysis.winnerSchoolId === state.userSchoolId;',
              '  const userWon = result.analysis?.winnerSchoolId === state.userSchoolId;',
              1,
          )
          text = text.replace(
              '  if (!currentEvent || !winnerDisplayName) {\n    throw new Error("completed match is missing presentation data");\n  }',
              '  if (!currentEvent) {\n    throw new Error("match is missing presentation data");\n  }\n  if (matchComplete && !winnerDisplayName) {\n    throw new Error("completed match is missing winner presentation data");\n  }',
              1,
          )
          path.write_text(text)
          PY
          npx prettier --write src/app/GameApp.tsx src/features/match/MatchScreen.tsx
          git rm .github/workflows/phase16-step-type-patch.yml
      - name: Commit compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support incomplete match presentation typing"
          git push
