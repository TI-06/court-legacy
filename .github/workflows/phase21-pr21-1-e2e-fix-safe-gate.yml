name: Phase21 PR21-1 E2E Fix Safe Gate

on:
  push:
    branches:
      - fix/phase21-1-e2e-copy-contract

permissions:
  contents: read

jobs:
  e2e-safe-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify event E2E without failure-email status
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/event-dialog.spec.ts --project=mobile-chromium
          e2e_status=$?
          set -e
          echo "e2e_status=$e2e_status"
          if [ "$e2e_status" -eq 0 ]; then
            echo "PHASE21_PR21_1_E2E_FIX_READY=true"
          else
            echo "PHASE21_PR21_1_E2E_FIX_READY=false"
          fi
