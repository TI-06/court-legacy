name: Phase21-4 Long Run Audit

on:
  push:
    branches:
      - tmp/phase21-4-social-effects-event-balance

permissions:
  contents: read

jobs:
  long-run-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Run deterministic 156-week audit twice
        shell: bash
        run: |
          TEST=tests/unit/domain/events/phase21RelationshipLongRun.test.ts
          if [ ! -f "$TEST" ]; then
            echo "Task6 test not present yet; workflow setup only."
            exit 0
          fi
          npx vitest run "$TEST" --reporter=verbose
          npx vitest run "$TEST" --reporter=verbose
          npm run typecheck
