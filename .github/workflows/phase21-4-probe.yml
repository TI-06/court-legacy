name: Phase21-4 Task3 TDD Probe

on:
  push:
    branches:
      - tmp/phase21-4-social-effects-event-balance

permissions:
  contents: write

jobs:
  task3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Add Task3 RED tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          notification_test = Path("tests/unit/domain/notifications/gameNotifications.test.ts")
          text = notification_test.read_text(encoding="utf-8")
          old = '''          socialGrowth: {
                    contributions: [],
                    rawPercentPoints: 0,
                    appliedPercentPoints: 0,
                    capped: false,
                  },
          '''
          new = '''          socialGrowth: {
                    contributions: [
                      {
                        code: "relationship-partner",
                        label: "相棒",
                        percentPoints: 3,
                        relatedPlayerId: state.schools[state.userSchoolId]!.playerIds[1]!,
                      },
                      {
                        code: "relationship-mentor",
                        label: "師弟",
                        percentPoints: 4,
                        relatedPlayerId: state.schools[state.userSchoolId]!.playerIds[1]!,
                      },
                    ],
                    rawPercentPoints: 7,
                    appliedPercentPoints: 5,
                    capped: true,
                  },
          '''
          if old not in text:
              raise SystemExit("notification socialGrowth fixture marker missing")
          text = text.replace(old, new, 1)
          assertion_marker = '''      abilityChanges: { serve: 2, jump: 1 },
            });
          '''
          assertion_replacement = '''      abilityChanges: { serve: 2, jump: 1 },
              socialGrowth: {
                rawPercentPoints: 7,
                appliedPercentPoints: 5,
                capped: true,
                contributions: [
                  {
                    code: "relationship-partner",
                    label: "相棒",
                    percentPoints: 3,
                  },
                  {
                    code: "relationship-mentor",
                    label: "師弟",
                    percentPoints: 4,
                  },
                ],
              },
            });
            const capturedRelatedPlayerId =
              notification.payload.players[0]!.socialGrowth.contributions[0]!
                .relatedPlayerId;
            result.playerLogs[0]!.socialGrowth.contributions[0]!.relatedPlayerId = playerId;
            expect(
              notification.payload.players[0]!.socialGrowth.contributions[0]!
                .relatedPlayerId,
            ).toBe(capturedRelatedPlayerId);
          '''
          if assertion_marker not in text:
              raise SystemExit("notification assertion marker missing")
          text = text.replace(assertion_marker, assertion_replacement, 1)
          notification_test.write_text(text, encoding="utf-8")

          ui_test = Path("tests/unit/features/home/TrainingResultNotificationSheet.test.tsx")
          ui = ui_test.read_text(encoding="utf-8")
          fixture_marker = '''          abilityChanges: {
                    spike: 2,
                    jump: 1,
                  },
          '''
          fixture_replacement = '''          abilityChanges: {
                    spike: 2,
                    jump: 1,
                  },
                  socialGrowth: {
                    contributions: [
                      {
                        code: "relationship-partner",
                        label: "相棒",
                        percentPoints: 3,
                        relatedPlayerId: school.playerIds[1]!,
                      },
                      {
                        code: "relationship-mentor",
                        label: "師弟",
                        percentPoints: 4,
                        relatedPlayerId: school.playerIds[1]!,
                      },
                    ],
                    rawPercentPoints: 7,
                    appliedPercentPoints: 5,
                    capped: true,
                  },
          '''
          if fixture_marker not in ui:
              raise SystemExit("UI fixture marker missing")
          ui = ui.replace(fixture_marker, fixture_replacement, 1)
          ui_assert_marker = '''    expect(within(dialog).getByText("怪我あり")).toBeVisible();
          '''
          ui_assert_replacement = '''    expect(within(dialog).getByText("怪我あり")).toBeVisible();
            expect(within(dialog).getByText("相棒 +3%")).toBeVisible();
            expect(within(dialog).getByText("師弟 +4%")).toBeVisible();
            expect(within(dialog).getByText("関係性効果は上限 +5%")).toBeVisible();
          '''
          if ui_assert_marker not in ui:
              raise SystemExit("UI assertion marker missing")
          ui = ui.replace(ui_assert_marker, ui_assert_replacement, 1)
          ui_test.write_text(ui, encoding="utf-8")
          PY
          npx prettier \
            tests/unit/domain/notifications/gameNotifications.test.ts \
            tests/unit/features/home/TrainingResultNotificationSheet.test.tsx --write
      - name: Verify RED
        shell: bash
        run: |
          set +e
          npx vitest run \
            tests/unit/domain/notifications/gameNotifications.test.ts \
            tests/unit/features/home/TrainingResultNotificationSheet.test.tsx \
            > /tmp/task3-red.log 2>&1
          status=$?
          set -e
          cat /tmp/task3-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected Task3 RED, but tests passed"
            exit 1
          fi
          grep -q "socialGrowth\|相棒 +3%\|関係性効果" /tmp/task3-red.log
      - name: Implement Task3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          notification_path = Path("src/domain/notifications/gameNotifications.ts")
          text = notification_path.read_text(encoding="utf-8")
          import_marker = 'import type { TrainingResult } from "../training/resolveWeeklyTraining";\n'
          social_import = 'import type { RelationshipTrainingModifierSummary } from "../training/relationshipTrainingModifiers";\n'
          if social_import not in text:
              if import_marker not in text:
                  raise SystemExit("notification training import marker missing")
              text = text.replace(import_marker, import_marker + social_import, 1)
          field_marker = '  abilityChanges: Partial<Record<AbilityKey, number>>;\n'
          if '  socialGrowth: RelationshipTrainingModifierSummary;\n' not in text:
              if field_marker not in text:
                  raise SystemExit("notification player field marker missing")
              text = text.replace(
                  field_marker,
                  field_marker + '  socialGrowth: RelationshipTrainingModifierSummary;\n',
                  1,
              )
          builder_marker = '      abilityChanges: { ...log.abilityChanges },\n'
          builder_add = '''      abilityChanges: { ...log.abilityChanges },
                socialGrowth: {
                  contributions: log.socialGrowth.contributions.map((contribution) => ({
                    ...contribution,
                  })),
                  rawPercentPoints: log.socialGrowth.rawPercentPoints,
                  appliedPercentPoints: log.socialGrowth.appliedPercentPoints,
                  capped: log.socialGrowth.capped,
                },
          '''
          if 'contributions: log.socialGrowth.contributions.map' not in text:
              if builder_marker not in text:
                  raise SystemExit("notification builder marker missing")
              text = text.replace(builder_marker, builder_add, 1)
          notification_path.write_text(text, encoding="utf-8")

          sheet_path = Path("src/features/home/TrainingResultNotificationSheet.tsx")
          sheet = sheet_path.read_text(encoding="utf-8")
          insertion_marker = '''                      <div className="training-result-notification__changes">
          '''
          social_block = '''                      {player.socialGrowth.contributions.length > 0 ? (
                            <div
                              className="training-result-notification__social"
                              aria-label="人間関係効果"
                            >
                              <div className="training-result-notification__social-chips">
                                {player.socialGrowth.contributions.map((contribution) => (
                                  <span
                                    key={`${contribution.code}:${contribution.relatedPlayerId}`}
                                  >
                                    {contribution.label} +{contribution.percentPoints}%
                                  </span>
                                ))}
                              </div>
                              {player.socialGrowth.capped ? (
                                <small>
                                  関係性効果は上限 +{player.socialGrowth.appliedPercentPoints}%
                                </small>
                              ) : null}
                            </div>
                          ) : null}

          '''
          if 'className="training-result-notification__social"' not in sheet:
              if insertion_marker not in sheet:
                  raise SystemExit("sheet changes marker missing")
              sheet = sheet.replace(insertion_marker, social_block + insertion_marker, 1)
          sheet_path.write_text(sheet, encoding="utf-8")

          css_path = Path("src/features/home/training-result-notification.css")
          css = css_path.read_text(encoding="utf-8")
          if '.training-result-notification__social {' not in css:
              css += '''

          .training-result-notification__social {
            display: grid;
            gap: 5px;
          }

          .training-result-notification__social-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
          }

          .training-result-notification__social-chips span {
            padding: 5px 7px;
            color: #5d4310;
            font-size: var(--game-font-label);
            font-weight: 900;
            line-height: 1.25;
            background: #fff4d5;
            border: 1px solid #e5ca83;
            border-radius: 8px;
          }

          .training-result-notification__social small {
            color: #6b5a36;
            font-size: var(--game-font-label);
            font-weight: 800;
            line-height: 1.3;
          }
          '''
          css_path.write_text(css, encoding="utf-8")
          PY
          npx prettier \
            src/domain/notifications/gameNotifications.ts \
            src/features/home/TrainingResultNotificationSheet.tsx \
            src/features/home/training-result-notification.css --write
          git diff --check
      - name: Verify GREEN
        run: |
          npx vitest run \
            tests/unit/domain/notifications/gameNotifications.test.ts \
            tests/unit/features/home/TrainingResultNotificationSheet.test.tsx \
            tests/unit/domain/training/resolveWeeklyTraining.test.ts \
            tests/unit/domain/player/playerDevelopmentHistory.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit Task3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/domain/notifications/gameNotifications.ts \
            src/features/home/TrainingResultNotificationSheet.tsx \
            src/features/home/training-result-notification.css \
            tests/unit/domain/notifications/gameNotifications.test.ts \
            tests/unit/features/home/TrainingResultNotificationSheet.test.tsx
          git commit -m "feat: show social growth in training results"
          git push origin HEAD:tmp/phase21-4-social-effects-event-balance
