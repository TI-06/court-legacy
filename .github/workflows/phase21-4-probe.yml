name: Phase21-4 Task2 TDD Probe

on:
  push:
    branches:
      - tmp/phase21-4-social-effects-event-balance

permissions:
  contents: write

jobs:
  task2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Add Task2 RED integration tests
        shell: bash
        run: |
          cat >> tests/unit/domain/training/resolveWeeklyTraining.test.ts <<'EOF'

          describe("Phase21 social training integration", () => {
            function socialFixture() {
              const state = createTrainingState();
              const school = state.schools[state.userSchoolId]!;
              const mentor = school.playerIds[0]!;
              const protege = school.playerIds[1]!;
              state.playerRelationshipBonds = {};
              state.players[mentor] = { ...state.players[mentor]!, injury: null };
              state.players[protege] = { ...state.players[protege]!, injury: null };
              const pair = [mentor, protege].sort() as [PlayerId, PlayerId];
              state.playerRelationshipBonds[pair.join("::")] = {
                playerIds: pair,
                tags: [
                  {
                    kind: "partner",
                    establishedDate: state.date,
                    sourceEventId: null,
                    lastReinforcedDate: state.date,
                    belowThresholdSince: null,
                  },
                  {
                    kind: "mentor",
                    establishedDate: state.date,
                    sourceEventId: null,
                    lastReinforcedDate: state.date,
                    belowThresholdSince: null,
                    mentorPlayerId: mentor,
                    protegePlayerId: protege,
                  },
                ],
              };
              return { state, school, mentor, protege, plan: createPlan(school.playerIds) };
            }

            it("collapses raw social contributions to one capped 105 percent modifier", () => {
              const { state, protege, plan } = socialFixture();
              const resolution = resolveWeeklyTraining({
                state,
                schoolId: state.userSchoolId,
                plan,
                data,
                random: new FixedRandom(100),
              });
              const log = resolution.result.playerLogs.find(
                (entry) => entry.playerId === protege,
              )!;

              expect(log.socialGrowth).toMatchObject({
                rawPercentPoints: 7,
                appliedPercentPoints: 5,
                capped: true,
              });
              expect(log.socialGrowth.contributions).toHaveLength(2);
              expect(
                log.modifiers.filter(
                  (modifier) => modifier.code === "relationship-social",
                ),
              ).toEqual([
                { code: "relationship-social", label: "人間関係", percent: 105 },
              ]);
            });

            it("does not enable social growth from an injured counterpart", () => {
              const { state, mentor, protege, plan } = socialFixture();
              state.players[mentor] = {
                ...state.players[mentor]!,
                injury: {
                  injuryId: "injury.test",
                  severity: "minor",
                  remainingWeeks: 1,
                  recurrenceRisk: 0,
                },
              };

              const resolution = resolveWeeklyTraining({
                state,
                schoolId: state.userSchoolId,
                plan,
                data,
                random: new FixedRandom(100),
              });
              const log = resolution.result.playerLogs.find(
                (entry) => entry.playerId === protege,
              )!;
              expect(log.socialGrowth.appliedPercentPoints).toBe(0);
              expect(
                log.modifiers.some(
                  (modifier) => modifier.code === "relationship-social",
                ),
              ).toBe(false);
            });

            it("does not enable social growth from an auto-rested counterpart", () => {
              const { state, mentor, protege, plan } = socialFixture();
              const resolution = resolveWeeklyTraining({
                state,
                schoolId: state.userSchoolId,
                plan,
                data,
                random: new FixedRandom(100),
                restingPlayerIds: new Set<PlayerId>([mentor]),
              });
              const log = resolution.result.playerLogs.find(
                (entry) => entry.playerId === protege,
              )!;
              expect(log.socialGrowth.appliedPercentPoints).toBe(0);
            });

            it("does not enable social growth from an instruction.rest counterpart", () => {
              const { state, mentor, protege, plan } = socialFixture();
              plan.individualAssignments = plan.individualAssignments.map((assignment) =>
                assignment.playerId === mentor
                  ? { ...assignment, instructionId: "instruction.rest" }
                  : assignment,
              );

              const resolution = resolveWeeklyTraining({
                state,
                schoolId: state.userSchoolId,
                plan,
                data,
                random: new FixedRandom(100),
              });
              const log = resolution.result.playerLogs.find(
                (entry) => entry.playerId === protege,
              )!;
              expect(log.socialGrowth.appliedPercentPoints).toBe(0);
            });
          });
          EOF
          npx prettier tests/unit/domain/training/resolveWeeklyTraining.test.ts --write
      - name: Verify RED
        shell: bash
        run: |
          set +e
          npx vitest run tests/unit/domain/training/resolveWeeklyTraining.test.ts > /tmp/task2-red.log 2>&1
          status=$?
          set -e
          cat /tmp/task2-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected Task2 RED, but tests passed"
            exit 1
          fi
          grep -q "socialGrowth\|relationship-social" /tmp/task2-red.log
      - name: Implement Task2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          growth_path = Path("src/domain/training/calculateGrowth.ts")
          growth = growth_path.read_text(encoding="utf-8")
          if '| "relationship-social"' not in growth:
              growth = growth.replace(
                  '  | "assistant-coach-first-year"\n  | "academic";',
                  '  | "assistant-coach-first-year"\n  | "relationship-social"\n  | "academic";',
                  1,
              )
              growth = growth.replace(
                  '    | "assistant-coach-first-year";',
                  '    | "assistant-coach-first-year"\n    | "relationship-social";',
                  1,
              )
          growth_path.write_text(growth, encoding="utf-8")

          path = Path("src/domain/training/resolveWeeklyTraining.ts")
          text = path.read_text(encoding="utf-8")

          import_marker = '''import {
            calculateGrowth,
            type AdditionalGrowthModifier,
            type GrowthModifier,
          } from "./calculateGrowth";
          '''
          relationship_import = '''import {
            calculateRelationshipTrainingModifier,
            type RelationshipTrainingModifierSummary,
          } from "./relationshipTrainingModifiers";
          '''
          if 'from "./relationshipTrainingModifiers"' not in text:
              if import_marker not in text:
                  raise SystemExit("calculateGrowth import marker missing")
              text = text.replace(import_marker, import_marker + relationship_import, 1)

          if '  socialGrowth: RelationshipTrainingModifierSummary;\n' not in text:
              marker = '  modifiers: GrowthModifier[];\n'
              if marker not in text:
                  raise SystemExit("PlayerGrowthLog marker missing")
              text = text.replace(marker, marker + '  socialGrowth: RelationshipTrainingModifierSummary;\n', 1)

          if 'function emptySocialGrowth()' not in text:
              marker = '''function clampState(value: number) {
            return Math.max(0, Math.min(100, Math.round(value)));
          }

          '''
              insert = '''function clampState(value: number) {
            return Math.max(0, Math.min(100, Math.round(value)));
          }

          function emptySocialGrowth(): RelationshipTrainingModifierSummary {
            return {
              contributions: [],
              rawPercentPoints: 0,
              appliedPercentPoints: 0,
              capped: false,
            };
          }

          '''
              if marker not in text:
                  raise SystemExit("clampState marker missing")
              text = text.replace(marker, insert, 1)

          if '    socialGrowth: emptySocialGrowth(),\n' not in text:
              marker = '    modifiers: [],\n'
              if marker not in text:
                  raise SystemExit("emptyLog modifiers marker missing")
              text = text.replace(marker, marker + '    socialGrowth: emptySocialGrowth(),\n', 1)

          if 'const activeTrainingPlayerIds = new Set<PlayerId>' not in text:
              marker = '''  const assignments: IndividualTrainingAssignment[] = [];
            const includeDynamics = input.schoolId === input.state.userSchoolId;

          '''
              insert = '''  const assignments: IndividualTrainingAssignment[] = [];
            const includeDynamics = input.schoolId === input.state.userSchoolId;
            const activeTrainingPlayerIds = new Set<PlayerId>(
              validated.school.playerIds.filter((id) => {
                const player = input.state.players[id]!;
                const instruction =
                  validated.instructionByPlayerId.get(id) ?? validated.fallback;
                return (
                  !input.restingPlayerIds?.has(id) &&
                  !player.injury &&
                  instruction.id !== "instruction.rest"
                );
              }),
            );

          '''
              if marker not in text:
                  raise SystemExit("active set insertion marker missing")
              text = text.replace(marker, insert, 1)

          if '    log.socialGrowth = calculateRelationshipTrainingModifier(' not in text:
              marker = '''    const original = input.state.players[id]!;
              const log = emptyLog(id);

          '''
              insert = '''    const original = input.state.players[id]!;
              const log = emptyLog(id);
              log.socialGrowth = calculateRelationshipTrainingModifier(
                input.state,
                id,
                activeTrainingPlayerIds,
              );

          '''
              if marker not in text:
                  raise SystemExit("loop log marker missing")
              text = text.replace(marker, insert, 1)

          old_extra = '''    const extraModifiers = includeDynamics
                ? [
                    ...(input.additionalGrowthModifiers ?? []),
                    ...calculateDynamicsTrainingModifiers(original),
                    ...assistantCoachTrainingModifiers(
                      input.state,
                      original,
                      instruction.targetAbilities,
                    ),
                  ]
                : (input.additionalGrowthModifiers ?? []);
          '''
          new_extra = '''    const socialModifiers: AdditionalGrowthModifier[] =
                log.socialGrowth.appliedPercentPoints > 0
                  ? [
                      {
                        code: "relationship-social",
                        label: "人間関係",
                        percent: 100 + log.socialGrowth.appliedPercentPoints,
                      },
                    ]
                  : [];
              const extraModifiers = includeDynamics
                ? [
                    ...(input.additionalGrowthModifiers ?? []),
                    ...calculateDynamicsTrainingModifiers(original),
                    ...assistantCoachTrainingModifiers(
                      input.state,
                      original,
                      instruction.targetAbilities,
                    ),
                    ...socialModifiers,
                  ]
                : [...(input.additionalGrowthModifiers ?? []), ...socialModifiers];
          '''
          if 'code: "relationship-social"' not in text:
              if old_extra not in text:
                  raise SystemExit("extra modifier block marker missing")
              text = text.replace(old_extra, new_extra, 1)

          path.write_text(text, encoding="utf-8")
          PY
          npx prettier src/domain/training/calculateGrowth.ts src/domain/training/resolveWeeklyTraining.ts --write
          git diff --check
      - name: Verify GREEN
        run: |
          npx vitest run \
            tests/unit/domain/training/phase21RelationshipTrainingModifiers.test.ts \
            tests/unit/domain/training/resolveWeeklyTraining.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit Task2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/training/calculateGrowth.ts src/domain/training/resolveWeeklyTraining.ts tests/unit/domain/training/resolveWeeklyTraining.test.ts
          git commit -m "feat: apply visible capped social training growth"
          git push origin HEAD:tmp/phase21-4-social-effects-event-balance
