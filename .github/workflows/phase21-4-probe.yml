name: Phase21-4 Format Fix

on:
  push:
    branches:
      - tmp/phase21-4-social-effects-event-balance

permissions:
  contents: write

jobs:
  format-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Apply repository formatting
        run: |
          npx prettier tests/unit/domain/events/phase21RelationshipLongRun.test.ts --write
          npx prettier tests/unit/domain/events/phase21RelationshipLongRun.test.ts --check
          git diff --check
      - name: Commit formatting fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/domain/events/phase21RelationshipLongRun.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git commit -m "style: format Phase21 relationship audit"
          git push origin HEAD:tmp/phase21-4-social-effects-event-balance
