name: Phase21-4 Task3 Green Probe

on:
  push:
    branches:
      - tmp/phase21-4-social-effects-event-balance

permissions:
  contents: write

jobs:
  task3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Apply Task3 implementation, tests, and typed fixtures
        shell: bash
        run: |
          cat >> tests/unit/domain/notifications/gameNotifications.test.ts <<'EOF'

          describe("Phase21 social growth notification snapshot", () => {
            it("copies the resolved social growth summary instead of retaining mutable references", () => {
              const state = createDemoGame();
              const school = state.schools[state.userSchoolId]!;
              const playerId = school.playerIds[0]!;
              const relatedPlayerId = school.playerIds[1]!;
              const result: TrainingResult = {
                schoolId: state.userSchoolId,
                teamTrainingMenuId: state.weeklySchedule.trainingPlan.teamTrainingMenuId,
                individualAssignments: state.weeklySchedule.trainingPlan.individualAssignments,
                playerLogs: [
                  {
                    playerId,
                    abilityChanges: {},
                    totalAbilityGrowth: 0,
                    fatigueChange: 0,
                    conditionChange: 0,
                    trustChange: 0,
                    academicRestricted: false,
                    injuryRisk: 0,
                    injury: null,
                    skippedReason: null,
                    modifiers: [],
                    socialGrowth: {
                      contributions: [
                        {
                          code: "relationship-partner",
                          label: "相棒",
                          percentPoints: 3,
                          relatedPlayerId,
                        },
                        {
                          code: "relationship-mentor",
                          label: "師弟",
                          percentPoints: 4,
                          relatedPlayerId,
                        },
                      ],
                      rawPercentPoints: 7,
                      appliedPercentPoints: 5,
                      capped: true,
                    },
                  },
                ],
                injuredPlayerIds: [],
                randomCursor: state.randomCursor,
              };

              const notification = buildTrainingResultNotification({
                stateBeforeTraining: state,
                result,
                data: gameData,
              });
              expect(notification.payload.players[0]).toMatchObject({
                socialGrowth: {
                  rawPercentPoints: 7,
                  appliedPercentPoints: 5,
                  capped: true,
                  contributions: [
                    { code: "relationship-partner", label: "相棒", percentPoints: 3 },
                    { code: "relationship-mentor", label: "師弟", percentPoints: 4 },
                  ],
                },
              });
              result.playerLogs[0]!.socialGrowth.contributions[0]!.relatedPlayerId = playerId;
              expect(
                notification.payload.players[0]!.socialGrowth.contributions[0]!
                  .relatedPlayerId,
              ).toBe(relatedPlayerId);
            });
          });
          EOF

          cat >> tests/unit/features/home/TrainingResultNotificationSheet.test.tsx <<'EOF'

          describe("Phase21 social growth presentation", () => {
            it("shows contributor chips and the capped applied value", () => {
              const notification = createNotification();
              const player = notification.payload.players[0]!;
              const state = createDemoGame();
              const relatedPlayerId = state.schools[state.userSchoolId]!.playerIds[1]!;
              player.socialGrowth = {
                contributions: [
                  {
                    code: "relationship-partner",
                    label: "相棒",
                    percentPoints: 3,
                    relatedPlayerId,
                  },
                  {
                    code: "relationship-mentor",
                    label: "師弟",
                    percentPoints: 4,
                    relatedPlayerId,
                  },
                ],
                rawPercentPoints: 7,
                appliedPercentPoints: 5,
                capped: true,
              };
              render(
                <TrainingResultNotificationSheet
                  notification={notification}
                  onClose={vi.fn()}
                />,
              );
              const dialog = screen.getByRole("dialog", { name: "今週の練習結果" });
              expect(within(dialog).getByText("相棒 +3%")).toBeVisible();
              expect(within(dialog).getByText("師弟 +4%")).toBeVisible();
              expect(within(dialog).getByText("関係性効果は上限 +5%")).toBeVisible();
            });
          });
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          notification_path = Path("src/domain/notifications/gameNotifications.ts")
          text = notification_path.read_text(encoding="utf-8")
          import_marker = 'import type { TrainingResult } from "../training/resolveWeeklyTraining";\n'
          social_import = 'import type { RelationshipTrainingModifierSummary } from "../training/relationshipTrainingModifiers";\n'
          if import_marker not in text:
              raise SystemExit("notification import marker missing")
          text = text.replace(import_marker, import_marker + social_import, 1)
          field_marker = '  abilityChanges: Partial<Record<AbilityKey, number>>;\n'
          if field_marker not in text:
              raise SystemExit("notification field marker missing")
          text = text.replace(
              field_marker,
              field_marker + '  socialGrowth: RelationshipTrainingModifierSummary;\n',
              1,
          )
          builder_marker = '      abilityChanges: { ...log.abilityChanges },\n'
          if builder_marker not in text:
              raise SystemExit("notification builder marker missing")
          text = text.replace(
              builder_marker,
              builder_marker + '''      socialGrowth: {
                contributions: log.socialGrowth.contributions.map((contribution) => ({
                  ...contribution,
                })),
                rawPercentPoints: log.socialGrowth.rawPercentPoints,
                appliedPercentPoints: log.socialGrowth.appliedPercentPoints,
                capped: log.socialGrowth.capped,
              },
          ''',
              1,
          )
          notification_path.write_text(text, encoding="utf-8")

          sheet_path = Path("src/features/home/TrainingResultNotificationSheet.tsx")
          sheet = sheet_path.read_text(encoding="utf-8")
          marker = '                      <div className="training-result-notification__changes">\n'
          if marker not in sheet:
              raise SystemExit("sheet changes marker missing")
          sheet = sheet.replace(
              marker,
              '''                      {player.socialGrowth.contributions.length > 0 ? (
                            <div
                              className="training-result-notification__social"
                              aria-label="人間関係効果"
                            >
                              <div className="training-result-notification__social-chips">
                                {player.socialGrowth.contributions.map((contribution) => (
                                  <span
                                    key={`${contribution.code}:${contribution.relatedPlayerId}`}
                                  >
                                    {contribution.label} +{contribution.percentPoints}%
                                  </span>
                                ))}
                              </div>
                              {player.socialGrowth.capped ? (
                                <small>
                                  関係性効果は上限 +{player.socialGrowth.appliedPercentPoints}%
                                </small>
                              ) : null}
                            </div>
                          ) : null}

          ''' + marker,
              1,
          )
          sheet_path.write_text(sheet, encoding="utf-8")

          css_path = Path("src/features/home/training-result-notification.css")
          css = css_path.read_text(encoding="utf-8")
          css += '''

          .training-result-notification__social {
            display: grid;
            gap: 5px;
          }

          .training-result-notification__social-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
          }

          .training-result-notification__social-chips span {
            padding: 5px 7px;
            color: #5d4310;
            font-size: var(--game-font-label);
            font-weight: 900;
            line-height: 1.25;
            background: #fff4d5;
            border: 1px solid #e5ca83;
            border-radius: 8px;
          }

          .training-result-notification__social small {
            color: #6b5a36;
            font-size: var(--game-font-label);
            font-weight: 800;
            line-height: 1.3;
          }
          '''
          css_path.write_text(css, encoding="utf-8")

          empty_social = '''socialGrowth: {
            contributions: [],
            rawPercentPoints: 0,
            appliedPercentPoints: 0,
            capped: false,
          },'''

          for filename in [
              "tests/unit/features/home/TrainingResultNotificationSheet.test.tsx",
              "tests/unit/features/home/HomeScreen.test.tsx",
              "tests/unit/features/home/homeCommandCenter.test.ts",
          ]:
              p = Path(filename)
              source = p.read_text(encoding="utf-8")
              # Add the new required notification field to the first presentation fixture.
              if filename.endswith("TrainingResultNotificationSheet.test.tsx"):
                  pattern = re.compile(
                      r'(?P<indent>\s*)abilityChanges: \{\n(?P=indent)  spike: 2,\n(?P=indent)  jump: 1,\n(?P=indent)\},'
                  )
              else:
                  pattern = re.compile(r'^(?P<indent>\s*)abilityChanges: \{\},\s*$', re.MULTILINE)
              match = pattern.search(source)
              if not match:
                  raise SystemExit(f"notification fixture marker missing: {filename}")
              indent = match.group("indent")
              formatted = "\n".join(indent + line if line else line for line in empty_social.splitlines())
              source = source[:match.end()] + "\n" + formatted + source[match.end():]
              p.write_text(source, encoding="utf-8")
          PY

          npx prettier \
            src/domain/notifications/gameNotifications.ts \
            src/features/home/TrainingResultNotificationSheet.tsx \
            src/features/home/training-result-notification.css \
            tests/unit/domain/notifications/gameNotifications.test.ts \
            tests/unit/features/home/TrainingResultNotificationSheet.test.tsx \
            tests/unit/features/home/HomeScreen.test.tsx \
            tests/unit/features/home/homeCommandCenter.test.ts --write
          git diff --check
      - name: Verify GREEN
        run: |
          npx vitest run \
            tests/unit/domain/notifications/gameNotifications.test.ts \
            tests/unit/features/home/TrainingResultNotificationSheet.test.tsx \
            tests/unit/features/home/HomeScreen.test.tsx \
            tests/unit/features/home/homeCommandCenter.test.ts \
            tests/unit/domain/training/resolveWeeklyTraining.test.ts \
            tests/unit/domain/player/playerDevelopmentHistory.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit Task3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/domain/notifications/gameNotifications.ts \
            src/features/home/TrainingResultNotificationSheet.tsx \
            src/features/home/training-result-notification.css \
            tests/unit/domain/notifications/gameNotifications.test.ts \
            tests/unit/features/home/TrainingResultNotificationSheet.test.tsx \
            tests/unit/features/home/HomeScreen.test.tsx \
            tests/unit/features/home/homeCommandCenter.test.ts
          git commit -m "feat: show social growth in training results"
          git push origin HEAD:tmp/phase21-4-social-effects-event-balance
