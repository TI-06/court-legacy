name: Phase21-4 Notification Codec RED Probe

on:
  push:
    branches:
      - tmp/phase21-4-social-effects-event-balance

permissions:
  contents: read

jobs:
  notification-codec-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Confirm persistence regression reproduces
        shell: bash
        run: |
          set +e
          npx vitest run tests/unit/persistence/phase21NotificationCodec.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the new persistence regression test to be RED before the codec fix."
            exit 1
          fi
          echo "Expected RED reproduced without failing the workflow."
