name: Phase21-4 Event Integration Green Probe

on:
  push:
    branches:
      - tmp/phase21-4-social-effects-event-balance

permissions:
  contents: write

jobs:
  event-integration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Apply Task4 and Task5
        shell: bash
        run: |
          cat > src/domain/events/characterEventWeight.ts <<'EOF'
          import type { GameDataRegistry } from "../../data/dataRegistry";
          import { relationshipKey, type GameState } from "../model/GameState";
          import type { PlayerId } from "../model/identifiers";
          import type { EventDefinition } from "../validation/gameDataSchema";

          const clamp = (value: number, minimum: number, maximum: number) =>
            Math.max(minimum, Math.min(maximum, Math.round(value)));

          function intersects(left: readonly string[], right: readonly string[]): boolean {
            const rightSet = new Set(right);
            return left.some((value) => rightSet.has(value));
          }

          function isRelationshipCategory(event: EventDefinition): boolean {
            return event.category === "relationship" || event.category === "rivalry";
          }

          function bondMatchesEvent(
            state: GameState,
            event: EventDefinition,
            actorPlayerIds: readonly PlayerId[],
          ): boolean {
            if (actorPlayerIds.length !== 2 || actorPlayerIds[0] === actorPlayerIds[1]) {
              return false;
            }
            const bond = state.playerRelationshipBonds[
              relationshipKey(actorPlayerIds[0]!, actorPlayerIds[1]!)
            ];
            if (!bond) return false;
            const tags = new Set(event.tags);
            return bond.tags.some((tag) => {
              if (tag.kind === "rival") {
                return (
                  event.category === "rivalry" ||
                  tags.has("competition") ||
                  tags.has("rivalry")
                );
              }
              if (tag.kind === "mentor") {
                return tags.has("mentor") || tags.has("guidance");
              }
              return (
                tags.has("pair") ||
                tags.has("cooperation") ||
                tags.has("coordination")
              );
            });
          }

          export function characterEventWeightMultiplier(
            state: GameState,
            data: GameDataRegistry,
            event: EventDefinition,
            actorPlayerIds: readonly PlayerId[],
          ): number {
            let score = 100;
            let personalityTagBonus = 0;
            let personalityRelationshipBias = 0;
            let characterTraitTagBonus = 0;
            let characterTraitRelationshipBias = 0;
            const relationshipCategory = isRelationshipCategory(event);

            for (const actorId of actorPlayerIds) {
              const player = state.players[actorId];
              if (!player) continue;
              const personality = data.personalities.get(player.personalityId);
              if (personality) {
                if (intersects(personality.tags, event.tags)) {
                  personalityTagBonus += 10;
                }
                if (relationshipCategory) {
                  personalityRelationshipBias += Math.round(
                    personality.relationshipGrowth / 2,
                  );
                }
              }
              for (const traitId of player.revealedHiddenTraitIds ?? []) {
                const trait = data.characterTraits.get(traitId);
                if (!trait) continue;
                if (intersects(trait.eventTags, event.tags)) {
                  characterTraitTagBonus += 15;
                }
                if (relationshipCategory) {
                  characterTraitRelationshipBias += trait.relationshipBias;
                }
              }
            }

            score += Math.min(20, personalityTagBonus);
            score += relationshipCategory
              ? clamp(personalityRelationshipBias, -15, 15)
              : 0;
            score += Math.min(30, characterTraitTagBonus);
            score += relationshipCategory
              ? clamp(characterTraitRelationshipBias, -15, 15)
              : 0;
            if (bondMatchesEvent(state, event, actorPlayerIds)) {
              score += 20;
            }
            return clamp(score, 75, 150);
          }
          EOF

          cat > src/domain/events/selectEvent.ts <<'EOF'
          import type { GameDataRegistry } from "../../data/dataRegistry";
          import type { EventDefinition } from "../validation/gameDataSchema";
          import type { PendingEvent, ScheduledEventFollowUp } from "../model/Event";
          import { relationshipKey, type GameState } from "../model/GameState";
          import type { PlayerId } from "../model/identifiers";
          import { eventId } from "../model/identifiers";
          import type { RandomSource } from "../random/SeededRandom";
          import { weightedChoice } from "../random/weightedChoice";
          import { characterEventWeightMultiplier } from "./characterEventWeight";
          import { isEventEligibleForActors } from "./eventEligibility";

          interface EventCandidate {
            event: EventDefinition;
            actorPlayerIds: PlayerId[];
            weight: number;
          }

          export interface EventSelectionResult {
            state: GameState;
            pendingEvent: PendingEvent | null;
          }

          export function eventActorPairKey(
            actorPlayerIds: readonly PlayerId[],
          ): string | null {
            if (
              actorPlayerIds.length !== 2 ||
              !actorPlayerIds[0] ||
              !actorPlayerIds[1] ||
              actorPlayerIds[0] === actorPlayerIds[1]
            ) {
              return null;
            }
            return relationshipKey(actorPlayerIds[0], actorPlayerIds[1]);
          }

          export function eventSelectionWeight(
            state: GameState,
            data: GameDataRegistry,
            event: EventDefinition,
            actorPlayerIds: readonly PlayerId[],
          ): number {
            const recentEventPenalty = state.eventMemory.recentEventIds.includes(
              eventId(event.id),
            )
              ? 0.2
              : 1;
            const recentCategoryPenalty = state.eventMemory.recentCategoryIds.includes(
              event.category,
            )
              ? 0.35
              : 1;
            const pairKey = eventActorPairKey(actorPlayerIds);
            const pairPenalty =
              pairKey && state.eventMemory.recentActorPairKeys.includes(pairKey)
                ? 0.2
                : 1;
            return Math.max(
              1,
              Math.round(
                event.weight *
                  (characterEventWeightMultiplier(
                    state,
                    data,
                    event,
                    actorPlayerIds,
                  ) /
                    100) *
                  recentEventPenalty *
                  recentCategoryPenalty *
                  pairPenalty,
              ),
            );
          }

          function combinations<T>(items: readonly T[], count: number): T[][] {
            if (count === 0) return [[]];
            const result: T[][] = [];
            const visit = (start: number, chosen: T[]) => {
              if (chosen.length === count) {
                result.push(chosen);
                return;
              }
              for (let index = start; index < items.length; index += 1) {
                const item = items[index];
                if (item !== undefined) visit(index + 1, [...chosen, item]);
              }
            };
            visit(0, []);
            return result;
          }

          function createPendingEvent(
            state: GameState,
            event: EventDefinition,
            actorPlayerIds: PlayerId[],
            followUp?: ScheduledEventFollowUp,
          ): PendingEvent {
            return {
              eventId: eventId(event.id),
              actorPlayerIds,
              targetSchoolId: null,
              surfacedDate: state.date,
              choiceIds: event.choices.map((choice) => choice.id),
              chainId: followUp?.chainId ?? null,
              chainStage: followUp?.chainStage ?? null,
            };
          }

          function selectDueFollowUp(
            state: GameState,
            data: GameDataRegistry,
          ): { followUp: ScheduledEventFollowUp; event: EventDefinition } | null {
            const due = state.eventMemory.scheduledFollowUps
              .filter((followUp) => followUp.eligibleDate <= state.date)
              .sort((left, right) => left.eligibleDate.localeCompare(right.eligibleDate));
            for (const followUp of due) {
              const event = data.events.get(followUp.eventId);
              if (
                event &&
                isEventEligibleForActors(state, event, followUp.actorPlayerIds)
              ) {
                return { followUp, event };
              }
            }
            return null;
          }

          function pruneInvalidDueFollowUps(
            state: GameState,
            data: GameDataRegistry,
          ): ScheduledEventFollowUp[] {
            return state.eventMemory.scheduledFollowUps.filter((followUp) => {
              if (followUp.eligibleDate > state.date) return true;
              const event = data.events.get(followUp.eventId);
              return Boolean(
                event &&
                  isEventEligibleForActors(state, event, followUp.actorPlayerIds),
              );
            });
          }

          function collectFollowUpOnlyEventIds(data: GameDataRegistry): Set<string> {
            const followUpOnlyIds = new Set<string>();
            for (const event of data.events.values()) {
              for (const choice of event.choices) {
                if (choice.followUp) followUpOnlyIds.add(choice.followUp.eventId);
                for (const effect of choice.effects) {
                  if (effect.type === "schedule-event") {
                    followUpOnlyIds.add(effect.eventId);
                  }
                }
              }
            }
            return followUpOnlyIds;
          }

          function normalCandidates(
            state: GameState,
            data: GameDataRegistry,
            avoidRecentActors: boolean,
            followUpOnlyIds: ReadonlySet<string>,
          ): EventCandidate[] {
            const school = state.schools[state.userSchoolId];
            if (!school) return [];
            const playerIds = school.playerIds.filter((id) => state.players[id]);
            const recentActors = new Set(
              state.eventMemory.recentPrimaryActorPlayerIds,
            );
            const candidates: EventCandidate[] = [];

            for (const event of data.events.values()) {
              if (followUpOnlyIds.has(event.id)) continue;
              for (const actorPlayerIds of combinations(playerIds, event.actorCount)) {
                const primaryActor = actorPlayerIds[0];
                if (
                  avoidRecentActors &&
                  primaryActor &&
                  recentActors.has(primaryActor)
                ) {
                  continue;
                }
                if (!isEventEligibleForActors(state, event, actorPlayerIds)) {
                  continue;
                }
                candidates.push({
                  event,
                  actorPlayerIds,
                  weight: eventSelectionWeight(
                    state,
                    data,
                    event,
                    actorPlayerIds,
                  ),
                });
              }
            }
            return candidates;
          }

          export function selectNextEvent(
            state: GameState,
            data: GameDataRegistry,
            random: RandomSource,
          ): EventSelectionResult {
            if (state.pendingEvent) {
              return { state, pendingEvent: state.pendingEvent };
            }

            const dueFollowUp = selectDueFollowUp(state, data);
            const prunedFollowUps = pruneInvalidDueFollowUps(state, data);
            if (dueFollowUp) {
              const remaining = prunedFollowUps.filter(
                (candidate) => candidate !== dueFollowUp.followUp,
              );
              const pendingEvent = createPendingEvent(
                state,
                dueFollowUp.event,
                dueFollowUp.followUp.actorPlayerIds,
                dueFollowUp.followUp,
              );
              const nextState = {
                ...state,
                randomCursor: random.cursor,
                pendingEvent,
                eventMemory: {
                  ...state.eventMemory,
                  scheduledFollowUps: remaining,
                },
              };
              return { state: nextState, pendingEvent };
            }

            const followUpOnlyIds = collectFollowUpOnlyEventIds(data);
            let candidates = normalCandidates(state, data, true, followUpOnlyIds);
            if (candidates.length === 0) {
              candidates = normalCandidates(state, data, false, followUpOnlyIds);
            }
            if (candidates.length === 0) {
              return {
                state: {
                  ...state,
                  randomCursor: random.cursor,
                  eventMemory: {
                    ...state.eventMemory,
                    scheduledFollowUps: prunedFollowUps,
                  },
                },
                pendingEvent: null,
              };
            }

            const selected = weightedChoice(
              candidates.map((candidate) => ({
                value: candidate,
                weight: candidate.weight,
              })),
              random,
            );
            if (!selected) return { state, pendingEvent: null };
            const pendingEvent = createPendingEvent(
              state,
              selected.event,
              selected.actorPlayerIds,
            );
            const nextState = {
              ...state,
              randomCursor: random.cursor,
              pendingEvent,
              eventMemory: {
                ...state.eventMemory,
                scheduledFollowUps: prunedFollowUps,
              },
            };
            return { state: nextState, pendingEvent };
          }
          EOF

          cat > tests/unit/domain/events/phase21CharacterEventWeight.test.ts <<'EOF'
          import { createDemoGame, gameData } from "../../../../src/app/createDemoGame";
          import { relationshipKey } from "../../../../src/domain/model/GameState";
          import type { PlayerId } from "../../../../src/domain/model/identifiers";
          import { characterEventWeightMultiplier } from "../../../../src/domain/events/characterEventWeight";
          import type {
            CharacterTraitDefinition,
            EventDefinition,
            PersonalityDefinition,
          } from "../../../../src/domain/validation/gameDataSchema";

          const personalityId = "personality.phase21-weight";
          const traitId = "character.phase21-weight";

          function registry(input: {
            relationshipGrowth?: number;
            personalityTags?: string[];
            relationshipBias?: number;
            traitTags?: string[];
          } = {}) {
            const personality: PersonalityDefinition = {
              id: personalityId,
              name: "重み確認",
              description: "Phase21重み確認用",
              trainingStability: 0,
              moraleVolatility: 0,
              relationshipGrowth: input.relationshipGrowth ?? 20,
              pressureModifier: 0,
              tags: input.personalityTags ?? ["focus"],
            };
            const characterTrait: CharacterTraitDefinition = {
              id: traitId,
              name: "重み個性",
              description: "Phase21重み確認用",
              eventTags: input.traitTags ?? ["focus"],
              relationshipBias: input.relationshipBias ?? 10,
              discoveryConditions: [{ type: "trust-min", value: 1 }],
            };
            return {
              ...gameData,
              personalities: new Map([
                ...gameData.personalities,
                [personality.id, personality] as const,
              ]),
              characterTraits: new Map([
                ...gameData.characterTraits,
                [characterTrait.id, characterTrait] as const,
              ]),
            };
          }

          function event(overrides: Partial<EventDefinition> = {}): EventDefinition {
            const base = [...gameData.events.values()][0]!;
            return {
              ...base,
              id: "event.phase21-weight",
              category: "relationship",
              tags: ["focus", "cooperation"],
              ...overrides,
            };
          }

          function actors(revealed = true) {
            const state = structuredClone(createDemoGame());
            const ids = state.schools[state.userSchoolId]!.playerIds.slice(0, 2) as [
              PlayerId,
              PlayerId,
            ];
            for (const id of ids) {
              state.players[id] = {
                ...state.players[id]!,
                personalityId,
                hiddenTraitIds: [traitId],
                revealedHiddenTraitIds: revealed ? [traitId] : [],
              };
            }
            state.playerRelationshipBonds = {};
            return { state, ids };
          }

          describe("Phase21 character-aware event weight", () => {
            it("uses public personality but ignores an unrevealed hidden character trait", () => {
              const { state, ids } = actors(false);
              expect(
                characterEventWeightMultiplier(state, registry(), event(), [ids[0]]),
              ).toBe(120);
            });
            it("adds only revealed character trait tags and relationship bias", () => {
              const { state, ids } = actors(true);
              expect(
                characterEventWeightMultiplier(state, registry(), event(), [ids[0]]),
              ).toBe(145);
            });
            it("adds a matching special bond once and clamps the final multiplier to 150", () => {
              const { state, ids } = actors(true);
              state.playerRelationshipBonds[relationshipKey(ids[0], ids[1])] = {
                playerIds: [...ids].sort() as [PlayerId, PlayerId],
                tags: [
                  {
                    kind: "partner",
                    establishedDate: state.date,
                    sourceEventId: null,
                    lastReinforcedDate: state.date,
                    belowThresholdSince: null,
                  },
                ],
              };
              expect(
                characterEventWeightMultiplier(state, registry(), event(), ids),
              ).toBe(150);
            });
            it("clamps negative relationship tendencies to a floor of 75", () => {
              const { state, ids } = actors(true);
              expect(
                characterEventWeightMultiplier(
                  state,
                  registry({
                    relationshipGrowth: -20,
                    personalityTags: ["other"],
                    relationshipBias: -10,
                    traitTags: ["other"],
                  }),
                  event({ tags: ["focus"] }),
                  ids,
                ),
              ).toBe(75);
            });
            it("does not apply relationship bias outside relationship/rivalry categories", () => {
              const { state, ids } = actors(false);
              expect(
                characterEventWeightMultiplier(
                  state,
                  registry({ personalityTags: ["other"] }),
                  event({ category: "practice", tags: ["focus"] }),
                  [ids[0]],
                ),
              ).toBe(100);
            });
          });
          EOF

          cat > tests/unit/domain/events/phase21PairRepetition.test.ts <<'EOF'
          import { createDemoGame, gameData } from "../../../../src/app/createDemoGame";
          import { relationshipKey } from "../../../../src/domain/model/GameState";
          import { eventId, type PlayerId } from "../../../../src/domain/model/identifiers";
          import { SeededRandom } from "../../../../src/domain/random/SeededRandom";
          import { resolveEventChoice } from "../../../../src/domain/events/resolveEventChoice";
          import {
            eventActorPairKey,
            eventSelectionWeight,
          } from "../../../../src/domain/events/selectEvent";
          import type { EventDefinition } from "../../../../src/domain/validation/gameDataSchema";

          function neutralEvent(overrides: Partial<EventDefinition> = {}): EventDefinition {
            const base = [...gameData.events.values()][0]!;
            return {
              ...base,
              id: "event.phase21-pair-weight",
              category: "individual",
              tags: [],
              weight: 100,
              actorCount: 2,
              choices: [
                {
                  id: "accept",
                  label: "受け入れる",
                  detail: "確認用",
                  effects: [{ type: "trust-change", amount: 1 }],
                },
                {
                  id: "decline",
                  label: "見送る",
                  detail: "確認用",
                  effects: [{ type: "trust-change", amount: 0 }],
                },
              ],
              ...overrides,
            };
          }

          describe("Phase21 actor pair repetition", () => {
            it("creates a canonical key only for exactly two distinct actors", () => {
              const state = createDemoGame();
              const [left, right, third] = state.schools[state.userSchoolId]!.playerIds;
              expect(eventActorPairKey([right!, left!])).toBe(relationshipKey(left!, right!));
              expect(eventActorPairKey([left!])).toBeNull();
              expect(eventActorPairKey([left!, left!])).toBeNull();
              expect(eventActorPairKey([left!, right!, third!])).toBeNull();
            });

            it("applies the exact recent-pair 0.20 penalty without bypassing existing penalties", () => {
              const state = structuredClone(createDemoGame());
              const actors = state.schools[state.userSchoolId]!.playerIds.slice(0, 2) as [
                PlayerId,
                PlayerId,
              ];
              const event = neutralEvent();
              state.eventMemory.recentActorPairKeys = [];
              expect(eventSelectionWeight(state, gameData, event, actors)).toBe(100);
              state.eventMemory.recentActorPairKeys = [relationshipKey(...actors)];
              expect(eventSelectionWeight(state, gameData, event, actors)).toBe(20);
              state.eventMemory.recentEventIds = [eventId(event.id)];
              state.eventMemory.recentCategoryIds = [event.category];
              expect(eventSelectionWeight(state, gameData, event, actors)).toBe(1);
            });

            it("records the resolved pair canonically and retains only the latest six", () => {
              const state = structuredClone(createDemoGame());
              const actors = state.schools[state.userSchoolId]!.playerIds.slice(0, 2) as [
                PlayerId,
                PlayerId,
              ];
              const event = neutralEvent();
              const data = {
                ...gameData,
                events: new Map([...gameData.events, [event.id, event] as const]),
              };
              state.eventMemory.recentActorPairKeys = [
                "a::b",
                "c::d",
                "e::f",
                "g::h",
                "i::j",
                "k::l",
              ];
              state.pendingEvent = {
                eventId: eventId(event.id),
                actorPlayerIds: [...actors],
                targetSchoolId: null,
                surfacedDate: state.date,
                choiceIds: event.choices.map((choice) => choice.id),
                chainId: null,
                chainStage: null,
              };
              const resolved = resolveEventChoice(
                state,
                "accept",
                data,
                new SeededRandom(state.seed, state.randomCursor),
              );
              expect(resolved.state.eventMemory.recentActorPairKeys).toHaveLength(6);
              expect(resolved.state.eventMemory.recentActorPairKeys.at(-1)).toBe(
                relationshipKey(...actors),
              );
              expect(resolved.state.eventMemory.recentActorPairKeys).not.toContain("a::b");
            });

            it("does not append pair memory for a one-actor event", () => {
              const state = structuredClone(createDemoGame());
              const actor = state.schools[state.userSchoolId]!.playerIds[0]!;
              const event = neutralEvent({ actorCount: 1 });
              const data = {
                ...gameData,
                events: new Map([...gameData.events, [event.id, event] as const]),
              };
              state.eventMemory.recentActorPairKeys = ["a::b"];
              state.pendingEvent = {
                eventId: eventId(event.id),
                actorPlayerIds: [actor],
                targetSchoolId: null,
                surfacedDate: state.date,
                choiceIds: event.choices.map((choice) => choice.id),
                chainId: null,
                chainStage: null,
              };
              const resolved = resolveEventChoice(
                state,
                "accept",
                data,
                new SeededRandom(state.seed, state.randomCursor),
              );
              expect(resolved.state.eventMemory.recentActorPairKeys).toEqual(["a::b"]);
            });
          });
          EOF

          python - <<'PY'
          from pathlib import Path
          resolve_path = Path("src/domain/events/resolveEventChoice.ts")
          text = resolve_path.read_text(encoding="utf-8")
          import_marker = 'import { eventCareerKey } from "./eventEligibility";\n'
          if import_marker not in text:
              raise SystemExit("resolve import marker missing")
          text = text.replace(
              import_marker,
              import_marker + 'import { eventActorPairKey } from "./selectEvent";\n',
              1,
          )
          primary_marker = '  const primaryActor = pending.actorPlayerIds[0];\n'
          if primary_marker not in text:
              raise SystemExit("primary actor marker missing")
          text = text.replace(
              primary_marker,
              primary_marker + '  const actorPairKey = eventActorPairKey(pending.actorPlayerIds);\n',
              1,
          )
          memory_marker = '''      recentPrimaryActorPlayerIds: primaryActor
                ? pushLimited(
                    nextState.eventMemory.recentPrimaryActorPlayerIds,
                    primaryActor,
                    8,
                  )
                : nextState.eventMemory.recentPrimaryActorPlayerIds,
          '''
          if memory_marker not in text:
              raise SystemExit("recent primary memory marker missing")
          text = text.replace(
              memory_marker,
              memory_marker + '''      recentActorPairKeys: actorPairKey
                ? pushLimited(
                    nextState.eventMemory.recentActorPairKeys,
                    actorPairKey,
                    6,
                  )
                : nextState.eventMemory.recentActorPairKeys,
          ''',
              1,
          )
          resolve_path.write_text(text, encoding="utf-8")
          PY

