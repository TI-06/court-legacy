name: Phase20-2 Task3 Safe Check

on:
  push:
    branches:
      - "feature/phase20-2-player-concern-guidance"

permissions:
  contents: write

jobs:
  notification-safe-check:
    if: github.event.head_commit.message != 'phase20-2-task3-green'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Extend notification codec
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/persistence/gameStateCodec.ts')
          text = path.read_text()
          old = '''const notificationStateSchema = z
            .object({
              items: z.array(trainingResultNotificationSchema).max(20),
            })
            .strict();'''
          new = '''const concernResolutionNotificationSchema = z
            .object({
              id: z.string().min(1),
              type: z.literal("concern-resolution"),
              createdGameDate: gameDateSchema,
              academicYearIndex: z.number().int().positive(),
              weekOfYear: z.number().int().positive(),
              readAtGameDate: gameDateSchema.nullable(),
              payload: z
                .object({
                  items: z
                    .array(
                      z
                        .object({
                          playerId: playerIdSchema,
                          displayName: z.string().min(1),
                          concernCode: z.enum([
                            "playing-time",
                            "role-mismatch",
                            "injury-overuse",
                            "team-slump",
                          ]),
                          concernTitle: z.string().min(1),
                        })
                        .strict(),
                    )
                    .max(64),
                })
                .strict(),
            })
            .strict();

          const gameNotificationSchema = z.discriminatedUnion("type", [
            trainingResultNotificationSchema,
            concernResolutionNotificationSchema,
          ]);

          const notificationStateSchema = z
            .object({
              items: z.array(gameNotificationSchema).max(20),
            })
            .strict()
            .transform((state) => ({
              items: state.items.filter(
                (item, index, items) =>
                  !items.slice(index + 1).some((candidate) => candidate.type === item.type),
              ),
            }));'''
          if old not in text:
              raise SystemExit('notification state schema target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write src/persistence/gameStateCodec.ts src/domain/notifications/gameNotifications.ts tests/unit/domain/notifications/phase20ConcernNotifications.test.ts tests/unit/persistence/phase20ConcernNotificationCodec.test.ts
      - name: Run focused notification tests
        run: npx vitest run tests/unit/domain/notifications/gameNotifications.test.ts tests/unit/domain/notifications/phase20ConcernNotifications.test.ts tests/unit/persistence/gameStateCodec.test.ts tests/unit/persistence/phase20ConcernNotificationCodec.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified codec change
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/persistence/gameStateCodec.ts src/domain/notifications/gameNotifications.ts tests/unit/domain/notifications/phase20ConcernNotifications.test.ts tests/unit/persistence/phase20ConcernNotificationCodec.test.ts
          git commit -m "phase20-2-task3-green"
          git push
