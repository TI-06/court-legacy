name: Format PR 250

on:
  push:
    branches:
      - feat/phase49-post-max-facility-investments

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase49-post-max-facility-investments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: >
          npx prettier --write
          src/domain/school/schoolInvestment.ts
          src/features/school/school-economy.css
          src/features/school/SchoolScreen.tsx
          tests/unit/domain/school/schoolInvestment.test.ts
          worker/game/applyGameAction.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/school/schoolInvestment.ts src/features/school/school-economy.css src/features/school/SchoolScreen.tsx tests/unit/domain/school/schoolInvestment.test.ts worker/game/applyGameAction.ts
          git commit -m "style: format school investment changes"
          git push
