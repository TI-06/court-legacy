name: Task 6 RED Check

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - tests/unit/services/SupabaseAuthClient.test.ts
      - tests/unit/features/auth/LoginScreen.test.tsx
      - .github/workflows/task6-red-temp.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run focused Task 6 tests
        run: npm test -- tests/unit/services/SupabaseAuthClient.test.ts tests/unit/features/auth/LoginScreen.test.tsx
