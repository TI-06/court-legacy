name: Format calculate growth

on:
  push:
    branches:
      - feat/facility-50-assistant-coach

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier src/domain/training/calculateGrowth.ts --write
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/training/calculateGrowth.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format facility growth calculation"
          git push origin HEAD:feat/facility-50-assistant-coach
