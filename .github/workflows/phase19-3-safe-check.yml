name: Phase19-3 Safe Check

on:
  push:
    branches:
      - feature/phase19-economy-facility-coach-balance
    paths:
      - .github/workflows/phase19-3-safe-check.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format candidate and capture full verification
        shell: bash
        run: |
          set +e
          npx prettier --write \
            docs/superpowers/plans/2026-09-14-phase19-economy-facility-coach-balance.md \
            src/domain/school/facilityUpgrade.ts \
            tests/unit/domain/school/phase19EconomyFacilityCoachBalance.test.ts
          format_status=$?

          npm run verify
          verify_status=$?
          npm run release:check
          release_status=$?

          echo "PHASE19_3_FORMAT_STATUS=${format_status}"
          echo "PHASE19_3_VERIFY_STATUS=${verify_status}"
          echo "PHASE19_3_RELEASE_STATUS=${release_status}"

          if [ "$format_status" -eq 0 ] && [ "$verify_status" -eq 0 ] && [ "$release_status" -eq 0 ]; then
            git config user.name "court-legacy-bot"
            git config user.email "court-legacy-bot@users.noreply.github.com"
            git add \
              docs/superpowers/plans/2026-09-14-phase19-economy-facility-coach-balance.md \
              src/domain/school/facilityUpgrade.ts \
              tests/unit/domain/school/phase19EconomyFacilityCoachBalance.test.ts
            if ! git diff --cached --quiet; then
              git commit -m "style: format phase19-3 balance changes"
              git push origin HEAD:feature/phase19-economy-facility-coach-balance
            fi
          fi
          exit 0
