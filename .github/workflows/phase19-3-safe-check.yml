name: Phase19-3 Safe Check

on:
  push:
    branches:
      - feature/phase19-economy-facility-coach-balance
    paths:
      - .github/workflows/phase19-3-safe-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify focused Lv.50 reachability
        shell: bash
        run: |
          set +e
          npx prettier tests/soak/phase19FacilityFocusSoak.test.ts --check
          format_status=$?
          npm run typecheck
          typecheck_status=$?
          PHASE19_FACILITY_FOCUS_RUN=1 npx vitest run tests/soak/phase19FacilityFocusSoak.test.ts
          focus_status=$?

          echo "PHASE19_3_FOCUS_FORMAT_STATUS=${format_status}"
          echo "PHASE19_3_FOCUS_TYPECHECK_STATUS=${typecheck_status}"
          echo "PHASE19_3_FOCUS_SOAK_STATUS=${focus_status}"
          exit 0
