name: Phase19-3 Safe Check

on:
  push:
    branches:
      - feature/phase19-economy-facility-coach-balance
    paths:
      - .github/workflows/phase19-3-safe-check.yml
      - scripts/phase19-3-update-baselines.py

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply approved baselines and verify candidate
        shell: bash
        run: |
          set +e
          python scripts/phase19-3-update-baselines.py
          patch_status=$?

          if [ "$patch_status" -eq 0 ]; then
            npx prettier --write \
              docs/superpowers/plans/2026-09-14-phase19-economy-facility-coach-balance.md \
              src/domain/school/facilityUpgrade.ts \
              tests/unit/domain/school/phase19EconomyFacilityCoachBalance.test.ts \
              tests/unit/domain/school/schoolEconomy.test.ts \
              tests/unit/domain/school/facilityUpgrade.test.ts \
              tests/unit/domain/generation/generateWorld.test.ts \
              tests/unit/app/GameAppActions.test.tsx \
              tests/unit/app/createBrowserAppDependencies.test.ts \
              tests/unit/app/createBrowserAppDependencies.schoolEconomy.test.ts \
              tests/unit/features/school/AppSchoolCalendarFlow.test.tsx \
              tests/unit/soak/soakDeterminism.test.ts \
              tests/unit/soak/soakDriver.test.ts
            format_status=$?
          else
            format_status=99
          fi

          if [ "$patch_status" -eq 0 ] && [ "$format_status" -eq 0 ]; then
            npx vitest run \
              tests/unit/domain/school/phase19EconomyFacilityCoachBalance.test.ts \
              tests/unit/domain/school/schoolEconomy.test.ts \
              tests/unit/domain/school/facilityUpgrade.test.ts \
              tests/unit/domain/generation/generateWorld.test.ts \
              tests/unit/app/GameAppActions.test.tsx \
              tests/unit/app/createBrowserAppDependencies.test.ts \
              tests/unit/app/createBrowserAppDependencies.schoolEconomy.test.ts \
              tests/unit/features/school/AppSchoolCalendarFlow.test.tsx \
              tests/unit/soak/soakDeterminism.test.ts \
              tests/unit/soak/soakDriver.test.ts \
              tests/unit/worker/phase19EconomyFacilityCoachAction.test.ts \
              tests/unit/features/school/SchoolScreen.test.tsx \
              tests/unit/features/school/AssistantCoachStaffScreen.test.tsx
            focused_status=$?
            npm run typecheck
            typecheck_status=$?
          else
            focused_status=99
            typecheck_status=99
          fi

          if [ "$focused_status" -eq 0 ] && [ "$typecheck_status" -eq 0 ]; then
            npm run verify
            verify_status=$?
            npm run release:check
            release_status=$?
          else
            verify_status=99
            release_status=99
          fi

          echo "PHASE19_3_PATCH_STATUS=${patch_status}"
          echo "PHASE19_3_FORMAT_STATUS=${format_status}"
          echo "PHASE19_3_FOCUSED_STATUS=${focused_status}"
          echo "PHASE19_3_TYPECHECK_STATUS=${typecheck_status}"
          echo "PHASE19_3_VERIFY_STATUS=${verify_status}"
          echo "PHASE19_3_RELEASE_STATUS=${release_status}"

          if [ "$patch_status" -eq 0 ] && \
             [ "$format_status" -eq 0 ] && \
             [ "$focused_status" -eq 0 ] && \
             [ "$typecheck_status" -eq 0 ] && \
             [ "$verify_status" -eq 0 ] && \
             [ "$release_status" -eq 0 ]; then
            git config user.name "court-legacy-bot"
            git config user.email "court-legacy-bot@users.noreply.github.com"
            git add \
              docs/superpowers/plans/2026-09-14-phase19-economy-facility-coach-balance.md \
              src/domain/school/facilityUpgrade.ts \
              tests/unit/domain/school/phase19EconomyFacilityCoachBalance.test.ts \
              tests/unit/domain/school/schoolEconomy.test.ts \
              tests/unit/domain/school/facilityUpgrade.test.ts \
              tests/unit/domain/generation/generateWorld.test.ts \
              tests/unit/app/GameAppActions.test.tsx \
              tests/unit/app/createBrowserAppDependencies.test.ts \
              tests/unit/app/createBrowserAppDependencies.schoolEconomy.test.ts \
              tests/unit/features/school/AppSchoolCalendarFlow.test.tsx \
              tests/unit/soak/soakDeterminism.test.ts \
              tests/unit/soak/soakDriver.test.ts
            if ! git diff --cached --quiet; then
              git commit -m "test: update phase19-3 approved baselines"
              git push origin HEAD:feature/phase19-economy-facility-coach-balance
            fi
          fi
          exit 0
