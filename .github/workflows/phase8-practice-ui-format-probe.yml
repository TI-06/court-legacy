name: Phase 8 practice UI format probe

on:
  push:
    branches:
      - feature/phase8-mobile-game-loop-impl

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Print Prettier diff
        run: |
          npx prettier src/features/match/PracticeMatchPlanning.tsx --write
          git diff -- src/features/match/PracticeMatchPlanning.tsx
          exit 1
