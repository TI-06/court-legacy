name: Phase15 Format Preview

on:
  push:
    branches:
      - feat/phase15-tactics-foundation
    paths:
      - .github/workflows/phase15-format-preview.yml
      - tests/unit/worker/phase15PvpPublicTactics.test.ts
      - worker/routes/pvpChallenge.ts
      - worker/routes/pvpPublish.ts

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format target files
        run: npx prettier tests/unit/worker/phase15PvpPublicTactics.test.ts worker/routes/pvpChallenge.ts worker/routes/pvpPublish.ts --write
      - name: Print formatted files
        run: |
          echo '===FILE:tests/unit/worker/phase15PvpPublicTactics.test.ts==='
          cat tests/unit/worker/phase15PvpPublicTactics.test.ts
          echo '===FILE:worker/routes/pvpChallenge.ts==='
          cat worker/routes/pvpChallenge.ts
          echo '===FILE:worker/routes/pvpPublish.ts==='
          cat worker/routes/pvpPublish.ts
          echo '===END==='
