name: Phase15 Format Preview

on:
  push:
    branches:
      - feat/phase15-tactics-foundation
    paths:
      - .github/workflows/phase15-format-preview.yml
      - tests/unit/worker/phase15PvpPublicTactics.test.ts
      - worker/routes/pvpChallenge.ts
      - worker/routes/pvpPublish.ts

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format target files
        run: npx prettier tests/unit/worker/phase15PvpPublicTactics.test.ts worker/routes/pvpChallenge.ts worker/routes/pvpPublish.ts --write
      - name: Commit formatted files
        run: |
          if git diff --quiet -- tests/unit/worker/phase15PvpPublicTactics.test.ts worker/routes/pvpChallenge.ts worker/routes/pvpPublish.ts; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/worker/phase15PvpPublicTactics.test.ts worker/routes/pvpChallenge.ts worker/routes/pvpPublish.ts
          git commit -m "style: format Phase 15 PvP tactics"
          git push origin HEAD:feat/phase15-tactics-foundation
