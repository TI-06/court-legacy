name: Feature Facility Coach Dev

on:
  push:
    branches:
      - feat/facility-50-assistant-coach

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply approved integration
        run: python .github/scripts/apply-facility-coach-integration.py
      - run: npm ci --no-audit --fund=false
      - name: Format changed implementation
        run: >-
          npx prettier --write
          worker/game/actionSchema.ts
          worker/game/applyGameAction.ts
          src/domain/calendar/academicYearProgression.ts
          src/domain/school/assistantCoach.ts
          src/domain/school/facilityUpgrade.ts
          src/domain/training/calculateGrowth.ts
          src/domain/training/resolveWeeklyTraining.ts
          src/features/school/SchoolNavigationTabs.tsx
          src/features/school/SchoolScreen.tsx
          src/features/school/school-screen.css
          tests/unit/features/school/AssistantCoachStaffScreen.test.tsx
      - name: Focused regression tests
        run: >-
          npx vitest run
          tests/unit/domain/school/facilityUpgrade.test.ts
          tests/unit/domain/training/calculateGrowth.test.ts
          tests/unit/worker/assistantCoachAction.test.ts
          tests/unit/domain/calendar/assistantCoachYearExpiry.test.ts
          tests/unit/domain/training/assistantCoachTraining.test.ts
          tests/unit/features/school/AssistantCoachStaffScreen.test.tsx
      - name: Full verification
        run: npm run verify
      - name: Commit integrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/game/actionSchema.ts worker/game/applyGameAction.ts src/domain/calendar/academicYearProgression.ts src/features/school/SchoolNavigationTabs.tsx src/features/school/SchoolScreen.tsx src/features/school/school-screen.css tests/unit/features/school/AssistantCoachStaffScreen.test.tsx
          git diff --cached --check
          git commit -m "feat: integrate assistant coach contracts"
          git push origin HEAD:feat/facility-50-assistant-coach
