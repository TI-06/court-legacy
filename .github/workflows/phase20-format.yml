name: Phase20 Format

on:
  push:
    branches:
      - "feature/phase20-1-rivalry-legacy-foundation"

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore-format-phase20-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format Phase20 files
        run: |
          npx prettier --write \
            docs/superpowers/plans/2026-09-14-phase20-pr20-1-rivalry-legacy-foundation.md \
            docs/superpowers/plans/2026-09-14-phase20-pr20-2-player-concern-guidance.md \
            docs/superpowers/plans/2026-09-14-phase20-pr20-3-practice-offer-quality.md \
            src/domain/world/rivalryHistory.ts \
            src/features/match/MatchStatPanels.tsx \
            src/features/match/rivalryPresentation.ts \
            src/features/school/SchoolLegacyPanel.tsx \
            src/features/season/seasonProgressPresentation.ts \
            tests/unit/domain/world/rivalryHistory.test.ts \
            tests/unit/features/school/SchoolLegacyPanel.test.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-14-phase20-pr20-1-rivalry-legacy-foundation.md \
                  docs/superpowers/plans/2026-09-14-phase20-pr20-2-player-concern-guidance.md \
                  docs/superpowers/plans/2026-09-14-phase20-pr20-3-practice-offer-quality.md \
                  src/domain/world/rivalryHistory.ts \
                  src/features/match/MatchStatPanels.tsx \
                  src/features/match/rivalryPresentation.ts \
                  src/features/school/SchoolLegacyPanel.tsx \
                  src/features/season/seasonProgressPresentation.ts \
                  tests/unit/domain/world/rivalryHistory.test.ts \
                  tests/unit/features/school/SchoolLegacyPanel.test.tsx
          git commit -m "chore-format-phase20-1"
          git push
