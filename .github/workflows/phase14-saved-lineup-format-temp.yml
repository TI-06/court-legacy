name: Phase14 Saved Lineup temporary formatter

on:
  push:
    branches:
      - feat/phase14-saved-lineup-ux

permissions:
  contents: write

# Temporary implementation/formatter workflow for PR14-3. Remove before merge.
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase14-saved-lineup-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply saved-lineup patch
        run: python .github/scripts/phase14_saved_lineup_patch.py
      - run: npx prettier . --write
      - name: Commit implementation and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: manage saved lineups from Player Hub"
          git push origin HEAD:feat/phase14-saved-lineup-ux
