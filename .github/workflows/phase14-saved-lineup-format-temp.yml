name: Phase14 Saved Lineup temporary formatter

on:
  push:
    branches:
      - feat/phase14-saved-lineup-ux

permissions:
  contents: write

# Temporary implementation/formatter workflow for PR14-3. Remove before merge.
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase14-saved-lineup-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply normal saved-lineup UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected marker not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          team = "src/features/team/TeamScreen.tsx"
          replace(
              team,
              '} from "../../domain/team/repositionTeamSelection";\nimport { validateTeamSelection } from "../../domain/team/validateTeamSelection";',
              '} from "../../domain/team/repositionTeamSelection";\nimport { selectSavedLineupSlots } from "../../domain/team/savedLineupSelectors";\nimport type { SavedLineupSlot } from "../../domain/team/teamPlanningTypes";\nimport { validateTeamSelection } from "../../domain/team/validateTeamSelection";',
          )
          replace(
              team,
              'interface TeamScreenProps {\n  state: GameState;\n  selection: TeamSelection;\n  onChange: (selection: TeamSelection) => void;\n  pending?: boolean;\n}',
              '''interface TeamScreenProps {
          state: GameState;
          selection: TeamSelection;
          onChange: (selection: TeamSelection) => void;
          pending?: boolean;
          planningPending?: boolean;
          onSaveLineupPreset?: (
            slot: SavedLineupSlot,
            name: string,
            selection: TeamSelection,
          ) => void | Promise<void>;
          onDeleteLineupPreset?: (slot: SavedLineupSlot) => void | Promise<void>;
          }''',
          )
          replace(
              team,
              'export function TeamScreen({\n  state,\n  selection,\n  onChange,\n  pending = false,\n}: TeamScreenProps) {',
              '''export function TeamScreen({
          state,
          selection,
          onChange,
          pending = false,
          planningPending = false,
          onSaveLineupPreset,
          onDeleteLineupPreset,
          }: TeamScreenProps) {''',
          )
          replace(
              team,
              '  const [actionError, setActionError] = useState<string | null>(null);',
              '''  const [actionError, setActionError] = useState<string | null>(null);
          const [savedLineupNames, setSavedLineupNames] = useState<
            Record<SavedLineupSlot, string | undefined>
          >({ 1: undefined, 2: undefined, 3: undefined });''',
          )
          replace(
              team,
              '  const issues = validateTeamSelection({\n    state,\n    schoolId: state.userSchoolId,\n    selection,\n  });\n  const lockedIds = new Set(selection.substitutionPolicy.starterLockPlayerIds);',
              '''  const issues = validateTeamSelection({
            state,
            schoolId: state.userSchoolId,
            selection,
          });
          const savedLineupSlots = useMemo(() => selectSavedLineupSlots(state), [state]);
          const currentLineupValid = issues.length === 0;
          const lockedIds = new Set(selection.substitutionPolicy.starterLockPlayerIds);''',
          )
          replace(
              team,
              '  const emitSelection = (next: TeamSelection) => {\n    setReplacements([]);\n    setActionError(null);\n    onChange(next);\n  };',
              '''  const savedLineupName = (
            slot: SavedLineupSlot,
            presetName: string | null,
          ): string => savedLineupNames[slot] ?? presetName ?? "";

          const saveCurrentLineupToSlot = (
            slot: SavedLineupSlot,
            presetName: string | null,
          ) => {
            const name = savedLineupName(slot, presetName).trim();
            if (planningPending || !currentLineupValid || !name) return;
            void onSaveLineupPreset?.(slot, name, selection);
          };

          const emitSelection = (next: TeamSelection) => {
            setReplacements([]);
            setActionError(null);
            onChange(next);
          };''',
          )

          panel_marker = '        <section\n          className="team-panel team-policy-panel"\n          aria-labelledby="policy-heading"\n        >'
          panel = '''<section
            className="team-panel saved-lineup-panel"
            aria-labelledby="saved-lineup-heading"
          >
            <div className="team-section-heading team-section-heading--compact">
              <div>
                <p className="section-kicker">3つまで登録</p>
                <h3 id="saved-lineup-heading">保存編成</h3>
              </div>
            </div>
            <div className="saved-lineup-grid">
              {savedLineupSlots.map((slotView) => {
                const name = savedLineupName(
                  slotView.slot,
                  slotView.preset?.name ?? null,
                );
                const saveDisabled =
                  planningPending || !currentLineupValid || !name.trim();
                return (
                  <article
                    className={`saved-lineup-card saved-lineup-card--${slotView.status}`}
                    data-testid={`saved-lineup-slot-${slotView.slot}`}
                    key={slotView.slot}
                  >
                    <div className="saved-lineup-card__heading">
                      <strong>スロット{slotView.slot}</strong>
                      <span>
                        {slotView.status === "empty"
                          ? "未保存"
                          : slotView.status === "valid"
                            ? "使用可能"
                            : "再設定が必要"}
                      </span>
                    </div>
                    <input
                      aria-label={`保存編成名 スロット${slotView.slot}`}
                      disabled={planningPending}
                      maxLength={24}
                      onChange={(event) =>
                        setSavedLineupNames((current) => ({
                          ...current,
                          [slotView.slot]: event.currentTarget.value,
                        }))
                      }
                      placeholder={`スロット${slotView.slot}の名前`}
                      type="text"
                      value={name}
                    />
                    {slotView.status === "invalid" && slotView.issueMessage ? (
                      <p className="saved-lineup-card__issue">
                        {slotView.issueMessage}
                      </p>
                    ) : null}
                    <div className="saved-lineup-card__actions">
                      {slotView.status === "empty" ? (
                        <button
                          disabled={saveDisabled}
                          onClick={() => saveCurrentLineupToSlot(slotView.slot, null)}
                          type="button"
                        >
                          現在の編成を保存
                        </button>
                      ) : (
                        <>
                          <button
                            disabled={planningPending || slotView.status !== "valid"}
                            onClick={() => {
                              if (slotView.status === "valid" && slotView.preset) {
                                onChange(structuredClone(slotView.preset.selection));
                              }
                            }}
                            type="button"
                          >
                            適用
                          </button>
                          <button
                            disabled={saveDisabled}
                            onClick={() =>
                              saveCurrentLineupToSlot(
                                slotView.slot,
                                slotView.preset?.name ?? null,
                              )
                            }
                            type="button"
                          >
                            上書き保存
                          </button>
                          <button
                            disabled={planningPending}
                            onClick={() => void onDeleteLineupPreset?.(slotView.slot)}
                            type="button"
                          >
                            削除
                          </button>
                        </>
                      )}
                    </div>
                  </article>
                );
              })}
            </div>
          </section>

          <section
            className="team-panel team-policy-panel"
            aria-labelledby="policy-heading"
          >'''
          replace(team, panel_marker, panel)

          hub = "src/features/team/PlayerHubScreen.tsx"
          replace(
              hub,
              'import type { PlayerId } from "../../domain/model/identifiers";\n',
              'import type { PlayerId } from "../../domain/model/identifiers";\nimport type { SavedLineupSlot } from "../../domain/team/teamPlanningTypes";\n',
          )
          replace(
              hub,
              '  onSetDevelopmentPriorities?: (playerIds: PlayerId[]) => void | Promise<void>;\n}',
              '''  onSetDevelopmentPriorities?: (playerIds: PlayerId[]) => void | Promise<void>;
          onSaveLineupPreset?: (
            slot: SavedLineupSlot,
            name: string,
            selection: TeamSelection,
          ) => void | Promise<void>;
          onDeleteLineupPreset?: (slot: SavedLineupSlot) => void | Promise<void>;
          }''',
          )
          replace(
              hub,
              '  onChangeTraining,\n  onSetDevelopmentPriorities,\n}: PlayerHubScreenProps) {',
              '''  onChangeTraining,
          onSetDevelopmentPriorities,
          onSaveLineupPreset,
          onDeleteLineupPreset,
          }: PlayerHubScreenProps) {''',
          )
          replace(
              hub,
              '        <TeamScreen onChange={onChange} selection={selection} state={state} />',
              '''        <TeamScreen
          onChange={onChange}
          onDeleteLineupPreset={onDeleteLineupPreset}
          onSaveLineupPreset={onSaveLineupPreset}
          pending={planningPending}
          planningPending={planningPending}
          selection={selection}
          state={state}
        />''',
          )

          app = "src/app/GameApp.tsx"
          replace(
              app,
              'import { autoSelectTeam } from "../domain/team/autoSelectTeam";\n',
              'import { autoSelectTeam } from "../domain/team/autoSelectTeam";\nimport type { SavedLineupSlot } from "../domain/team/teamPlanningTypes";\n',
          )
          replace(
              app,
              '  const acceptPracticeOffer = async () => {',
              '''  const saveLineupPreset = async (
            slot: SavedLineupSlot,
            name: string,
            selection: TeamSelection,
          ) => {
            await cloudSession.runAction(
              { type: "save-lineup-preset", slot, name, selection },
              "保存編成を保存しています…",
            );
          };

          const deleteLineupPreset = async (slot: SavedLineupSlot) => {
            await cloudSession.runAction(
              { type: "delete-lineup-preset", slot },
              "保存編成を削除しています…",
            );
          };

          const acceptPracticeOffer = async () => {''',
          )
          replace(
              app,
              '        onChangeTraining={changePlayerTraining}\n        onSetDevelopmentPriorities={saveDevelopmentPriorities}',
              '        onChangeTraining={changePlayerTraining}\n        onDeleteLineupPreset={deleteLineupPreset}\n        onSaveLineupPreset={saveLineupPreset}\n        onSetDevelopmentPriorities={saveDevelopmentPriorities}',
          )

          css = Path("src/features/team/team-direct.css")
          marker = "/* Phase14 saved lineup management */"
          current_css = css.read_text()
          if marker not in current_css:
              css.write_text(current_css + '''

          /* Phase14 saved lineup management */
          .saved-lineup-panel {
            min-width: 0;
          }

          .saved-lineup-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            min-width: 0;
            gap: 8px;
          }

          .saved-lineup-card {
            display: grid;
            min-width: 0;
            padding: 10px;
            gap: 7px;
            background: rgb(7 20 35 / 72%);
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 12px;
          }

          .saved-lineup-card--invalid {
            border-color: rgb(255 102 95 / 45%);
          }

          .saved-lineup-card__heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 0;
            gap: 6px;
          }

          .saved-lineup-card__heading strong {
            font-size: 12px;
          }

          .saved-lineup-card__heading span {
            color: var(--game-text-muted, #a9b8ca);
            font-size: 10px;
            font-weight: 800;
          }

          .saved-lineup-card--valid .saved-lineup-card__heading span {
            color: #77d59a;
          }

          .saved-lineup-card--invalid .saved-lineup-card__heading span,
          .saved-lineup-card__issue {
            color: #ff8c86;
          }

          .saved-lineup-card input {
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            min-height: 44px;
            padding: 0 9px;
            color: var(--game-text, #f4f7fb);
            font: inherit;
            font-size: 12px;
            background: rgb(255 255 255 / 6%);
            border: 1px solid rgb(255 255 255 / 14%);
            border-radius: 9px;
          }

          .saved-lineup-card__issue {
            margin: 0;
            font-size: 10px;
            line-height: 1.4;
          }

          .saved-lineup-card__actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            min-width: 0;
            gap: 6px;
          }

          .saved-lineup-card__actions button {
            min-width: 0;
            min-height: 38px;
            padding: 6px 8px;
            color: var(--game-text, #f4f7fb);
            font: inherit;
            font-size: 10px;
            font-weight: 900;
            background: rgb(31 120 171 / 20%);
            border: 1px solid rgb(116 216 255 / 25%);
            border-radius: 8px;
          }

          .saved-lineup-card__actions button:disabled {
            opacity: 0.45;
          }

          @media (max-width: 420px) {
            .saved-lineup-grid {
              grid-template-columns: 1fr;
            }
          }
          ''')
          PY
      - run: npx prettier . --write
      - name: Commit implementation and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: manage saved lineups from Player Hub"
          git push origin HEAD:feat/phase14-saved-lineup-ux
