name: Toolchain Export

on:
  push:
    branches:
      - fix/player-art-rendering

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-art-rendering
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Archive installed dependencies
        run: tar -czf node-modules-linux-x64.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: node-modules-linux-x64
          path: node-modules-linux-x64.tar.gz
          retention-days: 1
