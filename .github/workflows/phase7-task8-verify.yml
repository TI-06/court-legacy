name: Phase 7 Task 8 Verify

on:
  push:
    branches:
      - feature/court-legacy-v2-phase7-team-dynamics

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase7-team-dynamics
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format Task 8 files
        run: |
          npx prettier tests/unit/worker/pvpDynamicsLeakage.test.ts .github/workflows/phase7-task8-verify.yml --write
      - name: Verify ranked PvP isolation
        run: |
          npx vitest run tests/unit/worker/pvpDynamicsLeakage.test.ts tests/unit/worker/buildPvpSimulationState.test.ts tests/unit/worker/pvpPublish.test.ts tests/unit/worker/pvpChallenge.test.ts tests/unit/worker/pvpTournamentLeakage.test.ts
          npm run typecheck
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/worker/pvpDynamicsLeakage.test.ts .github/workflows/phase7-task8-verify.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format phase 7 task 8 tests"
            git push origin HEAD:feature/court-legacy-v2-phase7-team-dynamics
          fi
