name: Phase20-3 Task2 Safe Check

on:
  push:
    branches:
      - "feature/phase20-3-practice-offer-frequency"

permissions:
  contents: read

jobs:
  practice-offer-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Run focused Phase20-3 tests
        run: npx vitest run tests/unit/domain/weekly/practiceMatchPlanning.test.ts tests/unit/domain/weekly/phase20PracticeOfferFrequency.test.ts tests/unit/persistence/gameStateCodec.test.ts tests/unit/persistence/phase20PracticeOfferHistoryCodec.test.ts
      - name: Typecheck
        run: npm run typecheck
