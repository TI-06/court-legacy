name: Format JSON imports

on:
  push:
    branches: ["feature/m2-event-catalog-85"]
    paths:
      - "src/data/events/eventCatalog.ts"
      - ".github/workflows/format-json-imports.yml"

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-event-catalog-85
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run verify
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/format-json-imports.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: JSONイベント読込を整形" || exit 0
          git push origin HEAD:feature/m2-event-catalog-85
