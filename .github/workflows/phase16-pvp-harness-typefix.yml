name: Phase16 PvP harness typefix

on:
  push:
    branches: [feat/phase16-official-pvp-completion]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: python scripts/phase16_pvp_harness_typefix.py
      - run: npx prettier --write src/app/createBrowserAppDependencies.ts tests/unit/app/Phase16PvpMatchCommand.test.tsx
      - run: npm run typecheck
      - run: npx vitest run tests/unit/app/Phase16PvpMatchCommand.test.tsx tests/unit/app/Phase16OfficialMatchCommand.test.tsx
      - name: Commit verified fix and cleanup
        run: |
          git rm .github/workflows/phase16-pvp-harness-typefix.yml scripts/phase16_pvp_harness_typefix.py
          git add src/app/createBrowserAppDependencies.ts tests/unit/app/Phase16PvpMatchCommand.test.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: type-safe resumable PvP browser harness"
          git push
