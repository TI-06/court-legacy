name: Phase20 Safe Check

on:
  push:
    branches:
      - "feature/phase20-1-rivalry-legacy-foundation"

permissions:
  contents: write

jobs:
  safe-check:
    if: github.event.head_commit.message != 'fix-verified-phase20-1-tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Fix verified test issues
        run: |
          python - <<'PY'
          from pathlib import Path

          typed = Path('tests/unit/domain/world/rivalryHistory.test.ts')
          typed_text = typed.read_text()
          typed_old = ') as typeof player.abilities,'
          typed_new = ') as unknown as typeof player.abilities,'
          if typed_old not in typed_text:
              raise SystemExit('expected fixture cast not found')
          typed.write_text(typed_text.replace(typed_old, typed_new, 1))

          legacy = Path('tests/unit/features/school/SchoolLegacyPanel.test.tsx')
          legacy_text = legacy.read_text()
          legacy_old = 'expect(within(legacy).getByText(rival.shortName)).toBeVisible();'
          legacy_new = '''const opponentCard = within(legacy).getByTestId("school-legacy-opponent");\n    expect(within(opponentCard).getByText(rival.shortName)).toBeVisible();'''
          if legacy_old not in legacy_text:
              raise SystemExit('expected legacy assertion not found')
          legacy.write_text(legacy_text.replace(legacy_old, legacy_new, 1))
          PY
          npx prettier --write \
            tests/unit/domain/world/rivalryHistory.test.ts \
            tests/unit/features/school/SchoolLegacyPanel.test.tsx
      - name: Verify
        run: npm run verify
      - name: Verify release metadata and evidence
        run: npm run release:check
      - name: Run Phase18 soak smoke preset
        run: npm run soak:smoke
      - name: Commit verified fixes
        run: |
          if git diff --quiet; then
            echo "No fixes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/unit/domain/world/rivalryHistory.test.ts \
            tests/unit/features/school/SchoolLegacyPanel.test.tsx
          git commit -m "fix-verified-phase20-1-tests"
          git push
