name: Format PR 244

on:
  push:
    branches:
      - fix/scout-search-item-effects

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scout-search-item-effects
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier --write src/domain/shop/shopCatalog.ts src/features/scouting/ScoutingScreen.tsx tests/unit/features/scouting/ScoutingScreen.test.tsx tests/unit/worker/scoutingBoard.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/shop/shopCatalog.ts src/features/scouting/ScoutingScreen.tsx tests/unit/features/scouting/ScoutingScreen.test.tsx tests/unit/worker/scoutingBoard.test.ts
          git commit -m "style: format scout search item changes"
          git push
