name: Account Auth Branch Formatter

on:
  push:
    branches: [feat/account-id-auth]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/account-id-auth
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --offline --ignore-scripts --no-audit --fund=false
      - name: Format account auth files
        run: >-
          npx --no-install prettier --write
          docs/superpowers/plans/2026-09-04-account-id-auth.md
          docs/superpowers/specs/2026-09-04-account-id-auth-design.md
          src/app/AppBootstrap.tsx
          src/features/auth/LoginScreen.tsx
          src/features/auth/PasswordResetScreen.tsx
          src/features/auth/auth.css
          src/features/onboarding/SchoolSetupScreen.tsx
          src/features/onboarding/onboarding.css
          src/services/api/GameApiClient.ts
          src/services/auth/AuthClient.ts
          src/services/auth/MockAuthClient.ts
          src/services/auth/SupabaseAuthClient.ts
          supabase/migrations/202609040007_account_profiles.sql
          tests/unit/app/AppBootstrap.test.tsx
          tests/unit/features/auth/LoginScreen.test.tsx
          tests/unit/features/auth/PasswordResetScreen.test.tsx
          tests/unit/features/onboarding/SchoolSetupScreen.test.tsx
          tests/unit/services/SupabaseAuthClient.test.ts
          worker/auth/AccountAuthService.ts
          worker/index.ts
          worker/router.ts
          worker/routes/accountLogin.ts
          worker/routes/accountProfile.ts
          worker/routes/accountRegister.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src supabase tests worker
          git commit -m "style: format account auth implementation"
          git push
