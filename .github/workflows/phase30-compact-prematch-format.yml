name: Phase30 Compact Prematch Format Diagnostic

on:
  push:
    branches:
      - diag/phase30-compact-prematch-format

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Show exact Prettier diff
        shell: bash
        run: |
          npx prettier src/features/match/PreMatchLineupScreen.tsx src/features/match/pre-match-lineup.css --write
          git diff -- src/features/match/PreMatchLineupScreen.tsx src/features/match/pre-match-lineup.css
