name: Phase15 Format Once

on:
  push:
    branches: [feat/phase15-tactics-ux]
    paths:
      - .github/workflows/phase15-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase15-tactics-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier tests/unit/features/match/PreMatchLineupScreen.test.tsx --write
      - shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/features/match/PreMatchLineupScreen.test.tsx
          git commit -m "chore: format Phase15 pre-match tactics test"
          git push origin HEAD:feat/phase15-tactics-ux
