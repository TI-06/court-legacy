name: Phase16 PvP status RED

on:
  push:
    branches:
      - feat/phase16-official-pvp-completion
    paths:
      - .github/workflows/phase16-pvp-status-red.yml

permissions:
  contents: write

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format test
        run: npx prettier --write tests/unit/worker/phase16PvpChallengeRoutes.test.ts
      - name: Run focused RED
        run: |
          set +e
          npx vitest run tests/unit/worker/phase16PvpChallengeRoutes.test.ts
          status=$?
          set -e
          git rm .github/workflows/phase16-pvp-status-red.yml
          git add tests/unit/worker/phase16PvpChallengeRoutes.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: format Phase16 PvP status RED"
          git push
          exit $status
