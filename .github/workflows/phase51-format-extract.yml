name: Phase51 Format Extract

on:
  push:
    branches:
      - tmp/phase51-format
    paths:
      - ".github/workflows/phase51-format-extract.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply Prettier
        run: |
          npx prettier \
            src/data/events/phase51-top-team-clinic.json \
            src/domain/school/schoolSpecialProjectActivities.ts \
            src/features/school/school-economy.css \
            src/features/school/SchoolScreen.tsx \
            tests/unit/domain/events/eventSelection.test.ts \
            tests/unit/domain/school/schoolSpecialProjectActivities.test.ts \
            tests/unit/worker/applyGameAction.test.ts \
            --write
      - name: Package formatted files
        run: |
          mkdir -p formatted/src/data/events
          mkdir -p formatted/src/domain/school
          mkdir -p formatted/src/features/school
          mkdir -p formatted/tests/unit/domain/events
          mkdir -p formatted/tests/unit/domain/school
          mkdir -p formatted/tests/unit/worker
          cp src/data/events/phase51-top-team-clinic.json formatted/src/data/events/
          cp src/domain/school/schoolSpecialProjectActivities.ts formatted/src/domain/school/
          cp src/features/school/school-economy.css formatted/src/features/school/
          cp src/features/school/SchoolScreen.tsx formatted/src/features/school/
          cp tests/unit/domain/events/eventSelection.test.ts formatted/tests/unit/domain/events/
          cp tests/unit/domain/school/schoolSpecialProjectActivities.test.ts formatted/tests/unit/domain/school/
          cp tests/unit/worker/applyGameAction.test.ts formatted/tests/unit/worker/
      - uses: actions/upload-artifact@v4
        with:
          name: phase51-formatted
          path: formatted
