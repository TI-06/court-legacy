name: Phase51 Result Dialog Format

on:
  push:
    branches:
      - tmp/phase51-format
    paths:
      - ".github/workflows/phase51-format-extract.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Checkout feature branch
        run: |
          git fetch origin feat/phase51-experience-projects
          git checkout -B phase51-format-target origin/feat/phase51-experience-projects
      - run: npm ci --no-audit --fund=false
      - name: Apply Prettier
        run: npx prettier src/features/home/SpecialProjectActivityResultDialog.tsx --write
      - uses: actions/upload-artifact@v4
        with:
          name: phase51-result-dialog-formatted
          path: src/features/home/SpecialProjectActivityResultDialog.tsx
