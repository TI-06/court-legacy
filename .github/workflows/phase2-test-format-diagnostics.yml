name: Phase 2 Task 2 Format Diagnostics

on:
  pull_request:

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format Task 2 tests
        run: npx prettier tests/unit/domain/generation/playerVariation.test.ts tests/unit/domain/generation/playerTraitTiering.test.ts --write
      - name: Show formatting diff
        run: git diff -- tests/unit/domain/generation/playerVariation.test.ts tests/unit/domain/generation/playerTraitTiering.test.ts
