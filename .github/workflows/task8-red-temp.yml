name: Task 8 Format

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - src/persistence/RecoveryCache.ts
      - src/app/useGameSession.ts
      - src/ui/status/OperationStatusBar.tsx
      - tests/unit/persistence/RecoveryCache.test.ts
      - tests/unit/app/useGameSession.test.tsx
      - tests/unit/ui/OperationStatusBar.test.tsx
      - .github/workflows/task8-red-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format Task 8 files
        run: npx prettier src/app/useGameSession.ts src/persistence/RecoveryCache.ts src/ui/status/OperationStatusBar.tsx tests/unit/persistence/RecoveryCache.test.ts tests/unit/app/useGameSession.test.tsx tests/unit/ui/OperationStatusBar.test.tsx --write
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TI-06"
          git config user.email "iretaku.shop@gmail.com"
          git add src/app/useGameSession.ts src/persistence/RecoveryCache.ts src/ui/status/OperationStatusBar.tsx tests/unit/persistence/RecoveryCache.test.ts tests/unit/app/useGameSession.test.tsx tests/unit/ui/OperationStatusBar.test.tsx
          git commit -m "style: format Task 8 files"
          git push
