name: Task 10 Cloud Actions Focused Check

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - src/app/GameApp.tsx
      - src/app/createBrowserAppDependencies.ts
      - tests/unit/app/GameAppActions.test.tsx
      - tests/unit/app/createBrowserAppDependencies.test.ts
      - .github/workflows/task8-red-temp.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run cloud action integration tests
        run: npm test -- tests/unit/app/GameAppActions.test.tsx tests/unit/app/createBrowserAppDependencies.test.ts
