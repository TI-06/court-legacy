name: Task 8 Focused Check

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - src/persistence/RecoveryCache.ts
      - src/app/useGameSession.ts
      - src/ui/status/OperationStatusBar.tsx
      - tests/unit/persistence/RecoveryCache.test.ts
      - tests/unit/app/useGameSession.test.tsx
      - tests/unit/ui/OperationStatusBar.test.tsx
      - .github/workflows/task8-red-temp.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run focused Task 8 tests
        run: npm test -- tests/unit/persistence/RecoveryCache.test.ts tests/unit/app/useGameSession.test.tsx tests/unit/ui/OperationStatusBar.test.tsx
