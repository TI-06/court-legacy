name: Task 9 App Focused Check

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - src/App.tsx
      - tests/unit/App.test.tsx
      - .github/workflows/task8-red-temp.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run App composition test
        run: npm test -- tests/unit/App.test.tsx
