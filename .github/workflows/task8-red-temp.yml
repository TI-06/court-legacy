name: Task 9 Focused Check

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - src/ui/shell/appNavigation.ts
      - src/ui/theme/GameIcon.tsx
      - src/features/team/PlayerHubScreen.tsx
      - src/features/team/player-hub.css
      - tests/unit/ui/shell/BottomGameNav.test.tsx
      - tests/unit/features/team/PlayerHubScreen.test.tsx
      - .github/workflows/task8-red-temp.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run focused Task 9 tests
        run: npm test -- tests/unit/ui/shell/BottomGameNav.test.tsx tests/unit/features/team/PlayerHubScreen.test.tsx
