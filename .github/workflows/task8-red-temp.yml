name: Temporary App Format

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - tests/unit/App.test.tsx
      - .github/workflows/task8-red-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format App test
        run: npx prettier tests/unit/App.test.tsx --write
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TI-06"
          git config user.email "iretaku.shop@gmail.com"
          git add tests/unit/App.test.tsx
          git commit -m "style: format App integration test"
          git push
