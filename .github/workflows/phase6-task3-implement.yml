name: Phase 6 Task 3 Implement

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  implement-task3:
    if: github.event.head_commit.message != 'feat: migrate game state for official tournaments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Implement schema v3 generation and migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          world_path = Path('src/domain/generation/generateWorld.ts')
          world = world_path.read_text()
          if 'import { createOfficialSeason } from "../tournament/createOfficialSeason";' not in world:
              world = world.replace(
                  'import { weightedChoice } from "../random/weightedChoice";\n',
                  'import { weightedChoice } from "../random/weightedChoice";\nimport { createOfficialSeason } from "../tournament/createOfficialSeason";\n',
              )
          old_return = '''  return {\n    schemaVersion: CURRENT_GAME_SCHEMA_VERSION,\n    seed: input.seed,\n    randomCursor: random.cursor,\n    date: "2026-04-01",\n    yearIndex: 1,\n    userSchoolId,\n    schools,\n    players,\n    playerRelationships,\n    calendar: {\n      currentDate: "2026-04-01",\n      academicYear: 1,\n      weekOfYear: 1,\n      monthPolicyId: null,\n      activities: [],\n      completedActivityIds: [],\n    },\n    activeMatch: null,\n    pendingEvent: null,\n    history: createEmptyGameHistory(),\n    eventMemory: createEmptyEventMemory(),\n    settings: createDefaultGameSettings(),\n    world: {\n      nextGenerationalTalentYear,\n      generationalTalentPlayerIds: [],\n      rivalryScores: {},\n      destinyRivalSchoolId: null,\n    },\n  };'''
          new_return = '''  const baseState = {\n    schemaVersion: CURRENT_GAME_SCHEMA_VERSION,\n    seed: input.seed,\n    randomCursor: random.cursor,\n    date: "2026-04-01",\n    yearIndex: 1,\n    userSchoolId,\n    schools,\n    players,\n    playerRelationships,\n    calendar: {\n      currentDate: "2026-04-01",\n      academicYear: 1,\n      weekOfYear: 1,\n      monthPolicyId: null,\n      activities: [],\n      completedActivityIds: [],\n    },\n    activeMatch: null,\n    pendingEvent: null,\n    history: createEmptyGameHistory(),\n    eventMemory: createEmptyEventMemory(),\n    settings: createDefaultGameSettings(),\n    world: {\n      nextGenerationalTalentYear,\n      generationalTalentPlayerIds: [],\n      rivalryScores: {},\n      destinyRivalSchoolId: null,\n    },\n  } satisfies Omit<GameState, "officialSeason">;\n\n  return {\n    ...baseState,\n    officialSeason: createOfficialSeason({ state: baseState }),\n  };'''
          if old_return not in world:
              raise SystemExit('generateWorld return block not found')
          world_path.write_text(world.replace(old_return, new_return))

          codec_path = Path('src/persistence/gameStateCodec.ts')
          codec = codec_path.read_text()
          if 'import { createOfficialSeason } from "../domain/tournament/createOfficialSeason";' not in codec:
              codec = codec.replace(
                  'import { z } from "zod";\n',
                  'import { z } from "zod";\nimport { createOfficialSeason } from "../domain/tournament/createOfficialSeason";\n',
              )
          codec = codec.replace(
              '    world: objectSchema,\n    recruiting: recruitingStateSchema.optional(),',
              '    world: objectSchema,\n    officialSeason: objectSchema,\n    recruiting: recruitingStateSchema.optional(),',
          )
          migration_pattern = re.compile(
              r'function migrateVersionZero\(legacy: Record<string, unknown>\): unknown \{.*?\n\}\n\nexport function decodeGameState',
              re.S,
          )
          migration_replacement = '''type OfficialSeasonSource = Parameters<\n  typeof createOfficialSeason\n>[0]["state"];\n\nfunction historyWithOfficialTournaments(\n  history: unknown,\n): Record<string, unknown> {\n  const legacyHistory =\n    history && typeof history === "object" && !Array.isArray(history)\n      ? (history as Record<string, unknown>)\n      : {};\n\n  return {\n    ...legacyHistory,\n    officialTournaments: [],\n  };\n}\n\nfunction migrateVersionTwo(legacy: Record<string, unknown>): unknown {\n  const migrated = {\n    ...legacy,\n    schemaVersion: CURRENT_GAME_SCHEMA_VERSION,\n    history: historyWithOfficialTournaments(legacy.history),\n  };\n\n  return {\n    ...migrated,\n    officialSeason: createOfficialSeason({\n      state: migrated as unknown as OfficialSeasonSource,\n    }),\n  };\n}\n\nfunction migrateVersionZero(legacy: Record<string, unknown>): unknown {\n  const legacySettings =\n    legacy.settings && typeof legacy.settings === "object"\n      ? (legacy.settings as Record<string, unknown>)\n      : {};\n\n  return migrateVersionTwo({\n    ...legacy,\n    schemaVersion: 2,\n    playerRelationships: {},\n    settings: {\n      ...createDefaultGameSettings(),\n      ...legacySettings,\n    },\n  });\n}\n\nfunction migrateVersionOne(legacy: Record<string, unknown>): unknown {\n  return migrateVersionTwo({\n    ...legacy,\n    schemaVersion: 2,\n    playerRelationships: {},\n  });\n}\n\nfunction migrateLegacyState(value: unknown): unknown {\n  const probe = versionProbeSchema.safeParse(value);\n  if (!probe.success) {\n    throw new Error("セーブデータの形式が正しくありません");\n  }\n\n  const version = probe.data.schemaVersion;\n  if (version > CURRENT_GAME_SCHEMA_VERSION) {\n    throw new Error("新しいバージョンのセーブデータです");\n  }\n\n  if (version === CURRENT_GAME_SCHEMA_VERSION) {\n    return value;\n  }\n\n  const legacy = value as Record<string, unknown>;\n  if (version === 0) {\n    return migrateVersionZero(legacy);\n  }\n  if (version === 1) {\n    return migrateVersionOne(legacy);\n  }\n  if (version === 2) {\n    return migrateVersionTwo(legacy);\n  }\n\n  throw new Error(`未対応のセーブデータ形式です: ${String(version)}`);\n}\n\nexport function decodeGameState'''
          codec, count = migration_pattern.subn(migration_replacement, codec)
          if count != 1:
              raise SystemExit(f'codec migration block replacement count={count}')
          codec_path.write_text(codec)

          test_path = Path('tests/unit/persistence/phase6GameStateMigration.test.ts')
          test = test_path.read_text()
          test = test.replace(
              'structuredClone(current.history) as Record<\n      string,\n      unknown\n    >;',
              'structuredClone(current.history) as unknown as Record<string, unknown>;',
          )
          test_path.write_text(test)
          PY
      - name: Format Task 3 files
        run: >-
          npx prettier
          src/domain/model/GameState.ts
          src/domain/generation/generateWorld.ts
          src/persistence/gameStateCodec.ts
          tests/unit/domain/generation/phase6InitialWorld.test.ts
          tests/unit/persistence/phase6GameStateMigration.test.ts
          --write
      - name: Verify Task 3 focused tests and types
        run: |
          npm test -- tests/unit/domain/generation/phase6InitialWorld.test.ts tests/unit/persistence/phase6GameStateMigration.test.ts tests/unit/persistence/gameStateCodec.test.ts
          npm run typecheck
      - name: Commit Task 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/model/GameState.ts src/domain/generation/generateWorld.ts src/persistence/gameStateCodec.ts tests/unit/domain/generation/phase6InitialWorld.test.ts tests/unit/persistence/phase6GameStateMigration.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: migrate game state for official tournaments"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
