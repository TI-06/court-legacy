name: Phase51 Invitational Format Diagnostic

on:
  push:
    branches:
      - feat/phase51-invitational-cup
    paths:
      - ".github/workflows/phase51-invitational-format.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show formatted diff
        run: |
          npx prettier src/domain/school/invitationalCup.ts src/features/match/preMatchPreparation.ts tests/unit/domain/school/invitationalCup.test.ts worker/game/applyGameAction.ts --write
          git diff -- src/domain/school/invitationalCup.ts src/features/match/preMatchPreparation.ts tests/unit/domain/school/invitationalCup.test.ts worker/game/applyGameAction.ts
