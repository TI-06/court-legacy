name: Format school calendar branch

on:
  push:
    branches:
      - feature/m1-school-calendar-fixed-nav

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-school-calendar-fixed-nav
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier docs/superpowers/specs/2026-07-29-school-calendar-fixed-nav-design.md docs/superpowers/plans/2026-07-29-school-calendar-fixed-nav.md tests/e2e/mobile-layout-audit.spec.ts --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-07-29-school-calendar-fixed-nav-design.md docs/superpowers/plans/2026-07-29-school-calendar-fixed-nav.md tests/e2e/mobile-layout-audit.spec.ts
          git commit -m "style: format school calendar design and tests"
          git push origin HEAD:feature/m1-school-calendar-fixed-nav
