name: Phase10 stale test fix

on:
  push:
    branches:
      - feature/phase10-mobile-ui-completion
    paths:
      - .github/workflows/phase10-stale-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase10-mobile-ui-completion
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Update stale Phase10 selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          scouting = Path('tests/unit/app/GameApp.scouting.test.tsx')
          text = scouting.read_text()
          old = 'screen.getByRole("button", { name: "新入生スカウト" })'
          new = 'screen.getByRole("button", { name: /^新入生スカウト/ })'
          if text.count(old) != 1:
              raise SystemExit('scouting selector anchor mismatch')
          scouting.write_text(text.replace(old, new, 1))
          actions = Path('tests/unit/app/GameAppActions.test.tsx')
          text = actions.read_text()
          old = "\n".join([
              '    const starterLock = screen.getAllByRole("button", {',
              '      name: /^先発固定 /,',
              '    })[0]!;',
              '    fireEvent.click(starterLock);',
          ])
          new = "\n".join([
              '    fireEvent.click(',
              '      screen.getByRole("button", { name: "ローテーション1を変更" }),',
              '    );',
              '    const lineupDialog = screen.getByRole("dialog", {',
              '      name: "ローテーション1の選手を選択",',
              '    });',
              '    fireEvent.click(',
              '      within(lineupDialog).getByRole("button", { name: /先発固定/ }),',
              '    );',
          ])
          if text.count(old) != 1:
              raise SystemExit('team selection test anchor mismatch')
          text = text.replace(old, new, 1)
          status_old = '    expect(await screen.findByRole("status")).toHaveTextContent("保存済み ✓");'
          status_new = '    expect(await screen.findByText("保存済み ✓")).toBeVisible();'
          if status_old not in text:
              raise SystemExit('save status anchor mismatch')
          head, sep, tail = text.rpartition(status_old)
          actions.write_text(head + status_new + tail)
          PY
          npx prettier tests/unit/app/GameApp.scouting.test.tsx tests/unit/app/GameAppActions.test.tsx --write
      - name: Run focused stale tests
        run: npm test -- tests/unit/app/GameApp.scouting.test.tsx tests/unit/app/GameAppActions.test.tsx
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/app/GameApp.scouting.test.tsx tests/unit/app/GameAppActions.test.tsx
          git diff --cached --quiet || git commit -m "test: align app flows with phase10 mobile ui"
          git push origin HEAD:feature/phase10-mobile-ui-completion
