name: Admin Production Readiness Probe
on:
  push:
    branches: [feat/phase68-admin-production-check-20261017]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --fund=false
      - run: npx prettier --write scripts/checkAdminDeployment.mjs package.json docs/phase68-admin-dashboard.md
      - name: Commit formatted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/checkAdminDeployment.mjs package.json docs/phase68-admin-dashboard.md
          if ! git diff --staged --quiet; then
            git commit -m "style(admin): format production readiness tools"
            git push origin HEAD:feat/phase68-admin-production-check-20261017
          fi
      - name: Check live Worker without credentials
        shell: bash
        run: |
          set +e
          node scripts/checkAdminDeployment.mjs
          result=$?
          echo "Production admin readiness check exit code: ${result}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Production readiness result: ${result} (0 ready, 2 missing secrets, 3 old deployment)"
          exit 0
