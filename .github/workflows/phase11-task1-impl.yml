name: Phase11 Task1 Implement

on:
  push:
    branches: ["feature/phase11-home-week-progression"]
    paths: [".github/workflows/phase11-task1-impl.yml"]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase11-home-week-progression
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Restore proven RED test
        run: |
          cat > tests/unit/worker/phase11WeekProgression.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { createInitialGame } from "../../../src/app/createInitialGame";
          import { isWeeklyActionCompleted } from "../../../src/domain/calendar/weekProgression";
          import { autoSelectTeam } from "../../../src/domain/team/autoSelectTeam";
          import { advanceOfficialTournamentsThroughWeek, findDueUserOfficialMatch } from "../../../src/domain/tournament/progressOfficialTournaments";
          import type { CloudGameSnapshot } from "../../../worker/data/GameStore";
          import { applyGameAction } from "../../../worker/game/applyGameAction";

          function createSnapshot(seed: string): CloudGameSnapshot {
            const state = createInitialGame({
              seed,
              schoolName: "青葉高校",
              schoolShortName: "青葉",
              coachName: "高橋 監督",
              regionId: "region.chiba",
              uniform: { primary: "#17365D", secondary: "#FFFFFF", accent: "#D99B2B" },
            });
            return { userId: "phase11-user", schoolDbId: "00000000-0000-4000-8000-000000000111", revision: 1, state, teamSelection: autoSelectTeam({ state, schoolId: state.userSchoolId }) };
          }

          function schedulePractice(snapshot: CloudGameSnapshot): void {
            const opponent = Object.values(snapshot.state.schools).find((school) => school.id !== snapshot.state.userSchoolId);
            if (!opponent) throw new Error("practice opponent fixture missing");
            snapshot.state.weeklySchedule.practiceMatch.scheduledOpponentId = opponent.id;
            snapshot.state.weeklySchedule.practiceMatch.scheduledBy = "outgoing";
          }

          describe("Phase11 home-driven week progression", () => {
            it("resolves a scheduled practice match before advancing the date", () => {
              const snapshot = createSnapshot("phase11-practice");
              schedulePractice(snapshot);
              const historyBefore = snapshot.state.history.matches.length;
              const first = applyGameAction(snapshot, { type: "advance-week" });
              expect(first.state.date).toBe(snapshot.state.date);
              expect(isWeeklyActionCompleted(first.state, "training")).toBe(true);
              expect(isWeeklyActionCompleted(first.state, "practice-match")).toBe(true);
              expect(first.state.history.matches).toHaveLength(historyBefore + 1);
              expect(first.outcome).toMatchObject({ weekAdvanced: false, pendingMatchPresentation: { kind: "practice" } });
              const afterMatch = { ...snapshot, state: first.state, teamSelection: first.teamSelection };
              const count = first.state.notifications.items.length;
              const second = applyGameAction(afterMatch, { type: "advance-week" });
              expect(second.state.date).not.toBe(snapshot.state.date);
              expect(second.state.history.matches).toHaveLength(historyBefore + 1);
              expect(second.state.notifications.items).toHaveLength(count);
              expect(second.outcome).toMatchObject({ weekAdvanced: true, pendingMatchPresentation: null });
            });

            it("resolves official first and skips scheduled practice after official activity", () => {
              const snapshot = createSnapshot("phase11-official");
              let state = advanceOfficialTournamentsThroughWeek({ ...snapshot.state, calendar: { ...snapshot.state.calendar, weekOfYear: 9 } });
              expect(findDueUserOfficialMatch(state)).not.toBeNull();
              const prepared = { ...snapshot, state, teamSelection: autoSelectTeam({ state, schoolId: state.userSchoolId }) };
              schedulePractice(prepared);
              const historyBefore = prepared.state.history.matches.length;
              const first = applyGameAction(prepared, { type: "advance-week" });
              expect(first.state.date).toBe(prepared.state.date);
              expect(first.outcome).toMatchObject({ weekAdvanced: false, pendingMatchPresentation: { kind: "official" } });
              expect(first.state.history.matches).toHaveLength(historyBefore + 1);
              expect(isWeeklyActionCompleted(first.state, "practice-match")).toBe(false);
              const afterOfficial = { ...prepared, state: first.state, teamSelection: first.teamSelection };
              const second = applyGameAction(afterOfficial, { type: "advance-week" });
              expect(second.outcome).toMatchObject({ weekAdvanced: true, pendingMatchPresentation: null });
              expect(second.state.date).not.toBe(prepared.state.date);
              expect(isWeeklyActionCompleted(second.state, "practice-match")).toBe(false);
              expect(second.state.history.matches).toHaveLength(historyBefore + 1);
            });
          });
          EOF
      - name: Implement authoritative progression
        run: |
          cat > src/domain/calendar/advanceWeekOutcome.ts <<'EOF'
          import type { AcademicYearTransitionSummary } from "./academicYearProgression";
          import type { SimulateMatchResult } from "../match/simulateMatch";
          import type { PlayerId, SchoolId } from "../model/identifiers";
          import type { TournamentCircuit, TournamentLevel, TournamentRound } from "../tournament/tournamentTypes";
          import type { TrainingResult } from "../training/resolveWeeklyTraining";

          export interface MatchTeamPresentation { schoolId: SchoolId; displayName: string; shortName: string; }
          export interface PendingMatchPresentation {
            kind: "practice" | "official";
            simulation: SimulateMatchResult;
            homeTeam: MatchTeamPresentation;
            awayTeam: MatchTeamPresentation;
            official?: { tournamentId: string; circuit: TournamentCircuit; level: TournamentLevel; round: TournamentRound; };
          }
          export interface AdvanceWeekOutcome {
            trainingResult?: TrainingResult;
            pendingMatchPresentation: PendingMatchPresentation | null;
            weekAdvanced: boolean;
            academicYearTransition: AcademicYearTransitionSummary | null;
            recoveredPlayerIds: PlayerId[];
            healedPlayerIds: PlayerId[];
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('worker/game/applyGameAction.ts'); t=p.read_text()
          t=t.replace('import { advanceGameWeek } from "../../src/domain/calendar/academicYearProgression";\n','import { advanceGameWeek } from "../../src/domain/calendar/academicYearProgression";\nimport type { AdvanceWeekOutcome, PendingMatchPresentation } from "../../src/domain/calendar/advanceWeekOutcome";\n')
          t=t.replace('import { simulateMatch } from "../../src/domain/match/simulateMatch";','import { simulateMatch, type SimulateMatchResult } from "../../src/domain/match/simulateMatch";')
          t=t.replace('import { resolveWeeklyTraining } from "../../src/domain/training/resolveWeeklyTraining";','import { resolveWeeklyTraining, type TrainingResult } from "../../src/domain/training/resolveWeeklyTraining";')
          start=t.index('function applyAdvanceWeek('); end=t.index('function applyMarkNotificationRead(',start)
          block='''function teamPresentation(
            state: GameState,
            schoolId: SimulateMatchResult["match"]["homeSchoolId"],
            fallback?: { displayName: string; shortName: string },
          ): PendingMatchPresentation["homeTeam"] {
            const school = state.schools[schoolId];
            if (school) return { schoolId, displayName: school.name, shortName: school.shortName };
            if (fallback) return { schoolId, ...fallback };
            throw new Error(`match presentation school not found: ${schoolId}`);
          }

          function practicePresentation(state: GameState, applied: AppliedGameAction): PendingMatchPresentation {
            const simulation = applied.outcome as SimulateMatchResult;
            return { kind: "practice", simulation, homeTeam: teamPresentation(state, simulation.match.homeSchoolId), awayTeam: teamPresentation(state, simulation.match.awaySchoolId) };
          }

          function officialPresentation(state: GameState, applied: AppliedGameAction): PendingMatchPresentation {
            const outcome = applied.outcome as {
              officialMatch: { tournamentId: string; circuit: "interhigh" | "spring-high"; level: "prefectural" | "national"; round: "round-of-16" | "quarterfinal" | "semifinal" | "final"; opponent: { displayName: string; shortName: string } };
              simulation: SimulateMatchResult;
            };
            const simulation = outcome.simulation;
            const fallback = { displayName: outcome.officialMatch.opponent.displayName, shortName: outcome.officialMatch.opponent.shortName };
            return {
              kind: "official", simulation,
              homeTeam: teamPresentation(state, simulation.match.homeSchoolId, simulation.match.homeSchoolId === state.userSchoolId ? undefined : fallback),
              awayTeam: teamPresentation(state, simulation.match.awaySchoolId, simulation.match.awaySchoolId === state.userSchoolId ? undefined : fallback),
              official: { tournamentId: outcome.officialMatch.tournamentId, circuit: outcome.officialMatch.circuit, level: outcome.officialMatch.level, round: outcome.officialMatch.round },
            };
          }

          function hasUserOfficialMatchOnCurrentDate(state: GameState): boolean {
            return state.history.matches.some((match) => match.date === state.date && match.tournamentId !== null && (match.homeSchoolId === state.userSchoolId || match.awaySchoolId === state.userSchoolId));
          }

          function applyAdvanceWeek(state: GameState, teamSelection: TeamSelection): AppliedGameAction {
            let currentState = state;
            let trainingResult: TrainingResult | undefined;
            if (!isWeeklyActionCompleted(currentState, "training")) {
              const stateBeforeTraining = currentState;
              const training = applyTraining(currentState, teamSelection, { type: "training", plan: currentState.weeklySchedule.trainingPlan });
              const resolvedTrainingResult = training.outcome as TrainingResult;
              const notification = buildTrainingResultNotification({ stateBeforeTraining, result: resolvedTrainingResult, data: gameData });
              currentState = { ...training.state, notifications: appendNotification(training.state.notifications, notification) };
              trainingResult = resolvedTrainingResult;
            }
            if (hasRequiredOfficialMatch(currentState)) {
              const official = applyOfficialMatch(currentState, teamSelection);
              const outcome: AdvanceWeekOutcome = { trainingResult, pendingMatchPresentation: officialPresentation(currentState, official), weekAdvanced: false, academicYearTransition: null, recoveredPlayerIds: [], healedPlayerIds: [] };
              return { state: official.state, teamSelection: official.teamSelection, outcome };
            }
            const scheduled = currentState.weeklySchedule.practiceMatch.scheduledOpponentId !== null;
            if (scheduled && !isWeeklyActionCompleted(currentState, "practice-match") && !hasUserOfficialMatchOnCurrentDate(currentState)) {
              const practice = applyPracticeMatch(currentState, teamSelection);
              const outcome: AdvanceWeekOutcome = { trainingResult, pendingMatchPresentation: practicePresentation(currentState, practice), weekAdvanced: false, academicYearTransition: null, recoveredPlayerIds: [], healedPlayerIds: [] };
              return { state: practice.state, teamSelection: practice.teamSelection, outcome };
            }
            try {
              const progression = advanceGameWeek(currentState, gameData);
              const nextState = progression.academicYearTransition ? progression.state : surfaceWeeklyEvent(progression.state, gameData);
              const nextSelection = progression.academicYearTransition ? autoSelectTeam({ state: nextState, schoolId: nextState.userSchoolId }) : teamSelection;
              const outcome: AdvanceWeekOutcome = { trainingResult, pendingMatchPresentation: null, weekAdvanced: true, academicYearTransition: progression.academicYearTransition, recoveredPlayerIds: progression.recoveredPlayerIds, healedPlayerIds: progression.healedPlayerIds };
              return { state: nextState, teamSelection: nextSelection, outcome };
            } catch (error) {
              return conflict("advance_week_unavailable", error instanceof Error ? error.message : "週を進められません");
            }
          }

          '''
          p.write_text(t[:start]+block+t[end:])
          PY
      - name: Update existing expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/unit/worker/deferredTrainingPlan.test.ts'); t=p.read_text()
          t=t.replace('officialMatchRequired: false,','weekAdvanced: true,\n      pendingMatchPresentation: null,')
          t=t.replace('before an official match redirect','before an official match presentation')
          t=t.replace('expect(findDueUserOfficialMatch(result.state)).not.toBeNull();','expect(findDueUserOfficialMatch(result.state)).toBeNull();')
          t=t.replace('officialMatchRequired: true,','weekAdvanced: false,\n      pendingMatchPresentation: { kind: "official" },')
          p.write_text(t)

          p=Path('tests/unit/worker/officialMatchAction.test.ts'); t=p.read_text()
          title='  it("blocks week advancement while an official match is required, then allows it after completion", () => {'
          start=t.index(title); end=t.index('\n  });',start)+len('\n  });')
          new='''  it("resolves a due official match through week progression before advancing", () => {
            const snapshot = officialWeekSnapshot({ trained: true });
            const official = applyGameAction(snapshot, { type: "advance-week" });
            expect(official.state.date).toBe(snapshot.state.date);
            expect(official.outcome).toMatchObject({ weekAdvanced: false, pendingMatchPresentation: { kind: "official" } });
            const completedSnapshot: CloudGameSnapshot = { ...snapshot, state: official.state, teamSelection: official.teamSelection };
            const advanced = applyGameAction(completedSnapshot, { type: "advance-week" });
            expect(advanced.state.date).not.toBe(snapshot.state.date);
            expect(advanced.state.calendar.weekOfYear).toBe(10);
          });'''
          p.write_text(t[:start]+new+t[end:])
          PY
      - name: Format and verify GREEN
        run: |
          npx prettier --write src/domain/calendar/advanceWeekOutcome.ts worker/game/applyGameAction.ts tests/unit/worker/phase11WeekProgression.test.ts tests/unit/worker/deferredTrainingPlan.test.ts tests/unit/worker/officialMatchAction.test.ts
          npm test -- tests/unit/worker/phase11WeekProgression.test.ts tests/unit/worker/applyGameAction.test.ts tests/unit/worker/deferredTrainingPlan.test.ts tests/unit/worker/officialMatchAction.test.ts
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/domain/calendar/advanceWeekOutcome.ts worker/game/applyGameAction.ts tests/unit/worker/phase11WeekProgression.test.ts tests/unit/worker/deferredTrainingPlan.test.ts tests/unit/worker/officialMatchAction.test.ts
          git commit -m "feat: drive pve matches through week progression"
          git push origin HEAD:feature/phase11-home-week-progression
