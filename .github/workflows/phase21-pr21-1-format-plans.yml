name: Phase21 Plan Formatting

on:
  push:
    branches:
      - feat/phase21-1-fullscreen-events-personality

permissions:
  contents: write

jobs:
  format-plans:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Format Phase21 plans
        run: >-
          npx prettier --write
          docs/superpowers/plans/2026-09-15-phase21-pr21-1-fullscreen-events-personality.md
          docs/superpowers/plans/2026-09-15-phase21-pr21-2-relationship-model-persistence.md
          docs/superpowers/plans/2026-09-15-phase21-pr21-3-hidden-character-traits.md
          docs/superpowers/plans/2026-09-15-phase21-pr21-4-social-effects-event-balance.md
      - name: Verify plan formatting
        run: >-
          npx prettier --check
          docs/superpowers/plans/2026-09-15-phase21-pr21-1-fullscreen-events-personality.md
          docs/superpowers/plans/2026-09-15-phase21-pr21-2-relationship-model-persistence.md
          docs/superpowers/plans/2026-09-15-phase21-pr21-3-hidden-character-traits.md
          docs/superpowers/plans/2026-09-15-phase21-pr21-4-social-effects-event-balance.md
      - name: Commit formatting and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/phase21-pr21-1-format-plans.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/superpowers/plans/2026-09-15-phase21-pr21-1-fullscreen-events-personality.md \
            docs/superpowers/plans/2026-09-15-phase21-pr21-2-relationship-model-persistence.md \
            docs/superpowers/plans/2026-09-15-phase21-pr21-3-hidden-character-traits.md \
            docs/superpowers/plans/2026-09-15-phase21-pr21-4-social-effects-event-balance.md \
            .github/workflows/phase21-pr21-1-format-plans.yml
          git commit -m "docs: format Phase21 implementation plans"
          git push origin HEAD:${GITHUB_REF_NAME}
