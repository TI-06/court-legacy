name: V2 Final Temporary Formatter

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - scripts/verifyStructure.mjs
      - scripts/verify.mjs
      - .github/workflows/v2-final-format-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format final verification scripts
        run: npx prettier --write scripts/verifyStructure.mjs scripts/verify.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verifyStructure.mjs scripts/verify.mjs
          git commit -m "style: format final V2 verification scripts"
          git push origin HEAD:feature/court-legacy-v2-phase1
