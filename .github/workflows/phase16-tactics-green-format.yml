name: Phase16 Tactics Green Format

on:
  push:
    branches:
      - feat/phase16-match-command-ux

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-match-command-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format tactics implementation
        run: npx prettier src/features/match/MatchCommandPanel.tsx --write
      - name: Commit formatted implementation and remove helper
        run: |
          rm .github/workflows/phase16-tactics-green-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/match/MatchCommandPanel.tsx .github/workflows/phase16-tactics-green-format.yml
          git commit -m "feat: finalize match tactics command sheet"
          git push
