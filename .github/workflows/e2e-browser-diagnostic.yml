name: E2E Browser Diagnostic

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - .github/workflows/e2e-browser-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Add temporary Playwright diagnostic
        run: |
          cat > tests/e2e/__auth-diagnostic.spec.ts <<'EOF'
          import { test } from "@playwright/test";
          import { readdir, readFile } from "node:fs/promises";
          import { join } from "node:path";

          test("prints the exact Playwright webServer render", async ({ page }) => {
            const assets = await readdir("dist/client/assets");
            const jsFiles = assets.filter((name) => name.endsWith(".js"));
            const bundles = await Promise.all(
              jsFiles.map((name) => readFile(join("dist/client/assets", name), "utf8")),
            );
            console.log("bundle_has_e2e_session=", bundles.some((text) => text.includes("e2e-access-token")));

            const consoleMessages: string[] = [];
            const pageErrors: string[] = [];
            page.on("console", (message) => consoleMessages.push(`${message.type()}: ${message.text()}`));
            page.on("pageerror", (error) => pageErrors.push(error.stack || error.message));

            await page.goto("/");
            await page.waitForTimeout(1000);
            console.log("body=", (await page.locator("body").innerText()).slice(0, 3000));
            console.log("headings=", await page.locator("h1,h2,h3").allInnerTexts());
            console.log("navCount=", await page.locator("nav").count());
            console.log("console=", consoleMessages);
            console.log("pageErrors=", pageErrors);
          });
          EOF
      - name: Run exact Playwright webServer path
        run: npx playwright test tests/e2e/__auth-diagnostic.spec.ts --workers=1 --retries=0 --reporter=list
