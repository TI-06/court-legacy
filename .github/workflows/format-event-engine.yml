name: Format event engine

on:
  push:
    branches: [feature/m2-event-engine]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-event-engine
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier src/domain/events src/domain/generation/generateWorld.ts src/features/home/EventDialog.tsx src/ui/BottomSheet.tsx tests/unit/domain/events --write
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/events src/domain/generation/generateWorld.ts src/features/home/EventDialog.tsx src/ui/BottomSheet.tsx tests/unit/domain/events
          if ! git diff --cached --quiet; then
            git commit -m "style: format event engine"
            git push origin HEAD:feature/m2-event-engine
          fi
