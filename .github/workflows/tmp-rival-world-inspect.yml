name: Temporary Rival World Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-rival-world-progression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Integrate world progression
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          import_anchor = 'import { SeededRandom } from "./domain/random/SeededRandom";\n'
          import_line = 'import { recordMatchOutcome } from "./domain/world/rivalWorldProgression";\n'
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line)

          old = '''      const updatedState = {
                ...current.gameState,
                randomCursor: simulation.match.randomCursor,
                activeMatch: simulation.match,
                history: {
                  ...current.gameState.history,
                  matches: [
                    ...current.gameState.history.matches,
                    {
                      matchId: simulation.match.id,
                      date: current.gameState.date,
                      homeSchoolId: simulation.match.homeSchoolId,
                      awaySchoolId: simulation.match.awaySchoolId,
                      winnerSchoolId: simulation.analysis.winnerSchoolId,
                      homeSetsWon: simulation.match.homeSetsWon,
                      awaySetsWon: simulation.match.awaySetsWon,
                      tournamentId: null,
                    },
                  ],
                },
              };
'''
          new = '''      const matchState = {
                ...current.gameState,
                randomCursor: simulation.match.randomCursor,
                activeMatch: simulation.match,
              };
              const updatedState = recordMatchOutcome(matchState, {
                matchId: simulation.match.id,
                date: current.gameState.date,
                homeSchoolId: simulation.match.homeSchoolId,
                awaySchoolId: simulation.match.awaySchoolId,
                winnerSchoolId: simulation.analysis.winnerSchoolId,
                homeSetsWon: simulation.match.homeSetsWon,
                awaySetsWon: simulation.match.awaySetsWon,
                tournamentId: null,
              });
'''
          if old not in text:
              raise SystemExit('App match-history block not found')
          app.write_text(text.replace(old, new))

          world = Path('src/domain/generation/generateWorld.ts')
          text = world.read_text()
          anchor = '      rivalryScores: {},\n'
          addition = '      rivalryScores: {},\n      destinyRivalSchoolId: null,\n'
          if 'destinyRivalSchoolId: null' not in text:
              if anchor not in text:
                  raise SystemExit('world initializer anchor not found')
              text = text.replace(anchor, addition)
          world.write_text(text)
          PY
          npm ci
          npm run format
          rm .github/workflows/tmp-rival-world-inspect.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 試合と年度更新へライバル世界進行を接続"
          git push origin HEAD:feature/m3-rival-world-progression
