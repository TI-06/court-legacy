name: Phase 5 Unit Count

on:
  push:
    branches:
      - feature/court-legacy-v2-phase5-shop-mvp

jobs:
  unit-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run unit suite with count
        run: npm test
