name: Apply shop target integration

on:
  push:
    branches:
      - feature/court-legacy-v2-phase5-shop-mvp
    paths:
      - .github/workflows/apply-shop-target-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase5-shop-mvp
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: python scripts/applyShopTargetIntegration.py
      - run: npx prettier --write src/app/GameApp.tsx src/features/training/TrainingScreen.tsx src/features/shop/ShopScreen.tsx src/features/scouting/ScoutingScreen.tsx
      - run: npm run test -- tests/unit/features/shop/ShopTargetUx.test.tsx tests/unit/features/shop/ShopScreen.test.tsx tests/unit/features/scouting/ScoutingScreen.test.tsx tests/unit/features/training/TrainingFlow.test.tsx tests/unit/app/GameApp.shop.test.tsx
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/GameApp.tsx src/features/training/TrainingScreen.tsx src/features/shop/ShopScreen.tsx src/features/scouting/ScoutingScreen.tsx
          git commit -m "feat: integrate targeted shop item UX"
          git push origin HEAD:feature/court-legacy-v2-phase5-shop-mvp
