name: Phase57 Midset Focused

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase57-midset-focused.yml"
      - "src/domain/match/simulateMatch.ts"
      - "tests/unit/domain/match/phase16ResumableMatch.test.ts"
      - "tests/unit/worker/phase16PracticeMatchSession.test.ts"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx vitest run tests/unit/worker/phase16PracticeMatchSession.test.ts --reporter=verbose
