name: Phase56 format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Show exact Prettier diff
        run: |
          npx prettier tests/unit/features/team/TeamTacticsPanel.test.tsx --write
          git diff -- tests/unit/features/team/TeamTacticsPanel.test.tsx
