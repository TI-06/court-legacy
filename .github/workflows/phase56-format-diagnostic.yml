name: Phase56 format diagnostic

on:
  push:
    branches:
      - feat/phase56-team-identity-ui

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Show exact Prettier diff
        run: |
          npx prettier src/features/team/TeamTacticsPanel.tsx tests/unit/features/team/TeamTacticsPanel.test.tsx --write
          git diff -- src/features/team/TeamTacticsPanel.tsx tests/unit/features/team/TeamTacticsPanel.test.tsx
