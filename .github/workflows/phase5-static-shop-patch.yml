name: Phase 5 Static Shop Patch

on:
  push:
    branches:
      - feature/court-legacy-v2-phase5-shop-mvp

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Patch static shop E2E adapter
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/app/createBrowserAppDependencies.ts")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match, got {text.count(old)} for:\n{old}")
              text = text.replace(old, new, 1)

          replace_once(
              'import type { ScoutReport } from "../domain/scouting/scoutReport";\n',
              'import type { ScoutReport } from "../domain/scouting/scoutReport";\n'
              'import {\n'
              '  applyFatigueRecovery,\n'
              '  isFatigueRecoveryEligible,\n'
              '} from "../domain/shop/shopEffects";\n',
          )

          replace_once(
              'export const E2E_ACTION_DELAY_MS_KEY = "court-legacy:e2e-action-delay-ms";\n',
              'export const E2E_ACTION_DELAY_MS_KEY = "court-legacy:e2e-action-delay-ms";\n'
              'export const E2E_SHOP_LOSE_NEXT_RESPONSE_KEY =\n'
              '  "court-legacy:e2e-shop-lose-next-response";\n',
          )

          replace_once(
              'function readHarnessDelay(): number {\n'
              '  const parsed = Number(readSessionStorage(E2E_ACTION_DELAY_MS_KEY) ?? 0);\n'
              '  return Number.isFinite(parsed) ? Math.max(0, Math.min(parsed, 5_000)) : 0;\n'
              '}\n',
              'function readHarnessDelay(): number {\n'
              '  const parsed = Number(readSessionStorage(E2E_ACTION_DELAY_MS_KEY) ?? 0);\n'
              '  return Number.isFinite(parsed) ? Math.max(0, Math.min(parsed, 5_000)) : 0;\n'
              '}\n\n'
              'function consumeHarnessLostShopResponse(\n'
              '  operationType: "purchase" | "use",\n'
              '): boolean {\n'
              '  if (readSessionStorage(E2E_SHOP_LOSE_NEXT_RESPONSE_KEY) !== operationType) {\n'
              '    return false;\n'
              '  }\n'
              '  writeSessionStorage(E2E_SHOP_LOSE_NEXT_RESPONSE_KEY, "");\n'
              '  return true;\n'
              '}\n\n'
              'function tightenHarnessRange(\n'
              '  range: ScoutReport["estimatedOverall"],\n'
              '  halfWidth: number,\n'
              '): ScoutReport["estimatedOverall"] {\n'
              '  const midpoint = Math.round((range.min + range.max) / 2);\n'
              '  return {\n'
              '    min: Math.max(0, midpoint - halfWidth),\n'
              '    max: Math.min(100, midpoint + halfWidth),\n'
              '  };\n'
              '}\n',
          )

          replace_once(
              '      commitRevision: (revision) => {\n'
              '        const snapshot = this.requireSnapshot();\n'
              '        this.replaceSnapshot({ ...snapshot, revision });\n'
              '      },\n'
              '    });\n',
              '      commitRevision: (revision) => {\n'
              '        const snapshot = this.requireSnapshot();\n'
              '        this.replaceSnapshot({ ...snapshot, revision });\n'
              '      },\n'
              '      commitUse: (request, revision) =>\n'
              '        this.commitHarnessShopUse(request, revision),\n'
              '    });\n',
          )

          replace_once(
              '  private requireSnapshot(): CloudGameSnapshot {\n'
              '    if (!this.snapshot) {\n'
              '      throw new ApiError(\n'
              '        409,\n'
              '        "game_not_ready",\n'
              '        "学校データを作成してから操作してください",\n'
              '      );\n'
              '    }\n'
              '    return this.snapshot;\n'
              '  }\n\n'
              '  async bootstrap() {\n'
              '    return this.snapshot\n',
              '  private requireSnapshot(): CloudGameSnapshot {\n'
              '    if (!this.snapshot) {\n'
              '      throw new ApiError(\n'
              '        409,\n'
              '        "game_not_ready",\n'
              '        "学校データを作成してから操作してください",\n'
              '      );\n'
              '    }\n'
              '    return this.snapshot;\n'
              '  }\n\n'
              '  private syncPersistedHarnessSnapshotIfNewer(): void {\n'
              '    if (!this.persistAcrossReloads) return;\n'
              '    const persisted = readPersistedHarnessSnapshot();\n'
              '    if (persisted && (!this.snapshot || persisted.revision > this.snapshot.revision)) {\n'
              '      this.snapshot = persisted;\n'
              '    }\n'
              '  }\n\n'
              '  private commitHarnessShopUse(\n'
              '    request: ShopUseRequest,\n'
              '    revision: number,\n'
              '  ): Record<string, unknown> {\n'
              '    const snapshot = this.requireSnapshot();\n'
              '    if (request.itemId === "fatigue-recovery") {\n'
              '      if (request.target?.type !== "player") {\n'
              '        throw new ApiError(409, "invalid_target", "回復対象を確認してください");\n'
              '      }\n'
              '      const school = snapshot.state.schools[snapshot.state.userSchoolId];\n'
              '      const targetId = playerId(request.target.playerId);\n'
              '      if (!school?.playerIds.includes(targetId)) {\n'
              '        throw new ApiError(409, "target_not_found", "回復対象を確認できません");\n'
              '      }\n'
              '      const target = snapshot.state.players[targetId];\n'
              '      if (!target || !isFatigueRecoveryEligible(target)) {\n'
              '        throw new ApiError(409, "invalid_target", "この選手は回復不要です");\n'
              '      }\n'
              '      const recovered = applyFatigueRecovery(target);\n'
              '      this.replaceSnapshot({\n'
              '        ...snapshot,\n'
              '        revision,\n'
              '        state: {\n'
              '          ...snapshot.state,\n'
              '          players: {\n'
              '            ...snapshot.state.players,\n'
              '            [targetId]: recovered.player,\n'
              '          },\n'
              '        },\n'
              '      });\n'
              '      return {\n'
              '        playerId: targetId,\n'
              '        before: recovered.before,\n'
              '        after: recovered.after,\n'
              '      };\n'
              '    }\n\n'
              '    if (request.itemId === "training-efficiency-boost") {\n'
              '      if (snapshot.state.shopEffects?.nextTrainingGrowthBoost) {\n'
              '        throw new ApiError(\n'
              '          409,\n'
              '          "effect_already_pending",\n'
              '          "練習効率アップはすでに有効です",\n'
              '        );\n'
              '      }\n'
              '      this.replaceSnapshot({\n'
              '        ...snapshot,\n'
              '        revision,\n'
              '        state: {\n'
              '          ...snapshot.state,\n'
              '          shopEffects: {\n'
              '            ...snapshot.state.shopEffects,\n'
              '            nextTrainingGrowthBoost: {\n'
              '              percent: 20,\n'
              '              remainingUses: 1,\n'
              '              sourceItemId: "training-efficiency-boost",\n'
              '            },\n'
              '          },\n'
              '        },\n'
              '      });\n'
              '      return { pending: true, percent: 20 };\n'
              '    }\n\n'
              '    if (\n'
              '      request.itemId === "scout-research" ||\n'
              '      request.itemId === "potential-appraisal"\n'
              '    ) {\n'
              '      if (request.target?.type !== "scouting-candidate") {\n'
              '        throw new ApiError(409, "invalid_target", "候補選手を確認してください");\n'
              '      }\n'
              '      const cycleKey = harnessScoutingCycleKey(snapshot.state);\n'
              '      const reports = this.scoutingReports.get(cycleKey);\n'
              '      const candidate = reports?.find(\n'
              '        (report) => report.candidateId === request.target!.candidateId,\n'
              '      );\n'
              '      if (!reports || !candidate) {\n'
              '        throw new ApiError(\n'
              '          409,\n'
              '          "candidate_unavailable",\n'
              '          "この候補は現在のスカウト候補に含まれていません",\n'
              '        );\n'
              '      }\n'
              '      const next = reports.map((report) => {\n'
              '        if (report.candidateId !== candidate.candidateId) return report;\n'
              '        return request.itemId === "scout-research"\n'
              '          ? {\n'
              '              ...report,\n'
              '              estimatedOverall: tightenHarnessRange(report.estimatedOverall, 4),\n'
              '              estimatedPotential: tightenHarnessRange(\n'
              '                report.estimatedPotential,\n'
              '                5,\n'
              '              ),\n'
              '              confidence: "high" as const,\n'
              '            }\n'
              '          : {\n'
              '              ...report,\n'
              '              estimatedPotential: tightenHarnessRange(\n'
              '                report.estimatedPotential,\n'
              '                2,\n'
              '              ),\n'
              '              confidence: "high" as const,\n'
              '            };\n'
              '      });\n'
              '      this.scoutingReports.set(cycleKey, next);\n'
              '      this.replaceSnapshot({ ...snapshot, revision });\n'
              '      return request.itemId === "scout-research"\n'
              '        ? {\n'
              '            candidateId: candidate.candidateId,\n'
              '            overallPrecision: "researched",\n'
              '            potentialPrecision: "researched",\n'
              '          }\n'
              '        : {\n'
              '            candidateId: candidate.candidateId,\n'
              '            overallPrecision: "researched",\n'
              '            potentialPrecision: "appraised",\n'
              '          };\n'
              '    }\n\n'
              '    this.replaceSnapshot({ ...snapshot, revision });\n'
              '    return { itemId: request.itemId };\n'
              '  }\n\n'
              '  async bootstrap() {\n'
              '    this.syncPersistedHarnessSnapshotIfNewer();\n'
              '    return this.snapshot\n',
          )

          replace_once(
              '  async getShop() {\n'
              '    return this.shopHarness.getStatus();\n'
              '  }\n\n'
              '  async purchaseShopItem(_accessToken: string, request: ShopPurchaseRequest) {\n'
              '    return this.shopHarness.purchase(request);\n'
              '  }\n\n'
              '  async useShopItem(_accessToken: string, request: ShopUseRequest) {\n'
              '    return this.shopHarness.use(request);\n'
              '  }\n',
              '  async getShop() {\n'
              '    this.syncPersistedHarnessSnapshotIfNewer();\n'
              '    return this.shopHarness.getStatus();\n'
              '  }\n\n'
              '  async purchaseShopItem(_accessToken: string, request: ShopPurchaseRequest) {\n'
              '    this.syncPersistedHarnessSnapshotIfNewer();\n'
              '    await this.pvpDelay();\n'
              '    const response = this.shopHarness.purchase(request);\n'
              '    if (consumeHarnessLostShopResponse("purchase")) {\n'
              '      throw new ApiError(null, "network_error", "サーバーに接続できませんでした");\n'
              '    }\n'
              '    return response;\n'
              '  }\n\n'
              '  async useShopItem(_accessToken: string, request: ShopUseRequest) {\n'
              '    this.syncPersistedHarnessSnapshotIfNewer();\n'
              '    await this.pvpDelay();\n'
              '    const response = this.shopHarness.use(request);\n'
              '    if (consumeHarnessLostShopResponse("use")) {\n'
              '      throw new ApiError(null, "network_error", "サーバーに接続できませんでした");\n'
              '    }\n'
              '    return response;\n'
              '  }\n',
          )

          path.write_text(text)
          PY
          npx prettier src/app/createBrowserAppDependencies.ts --write
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/createBrowserAppDependencies.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: align static shop adapter with Phase 5 effects"
          git push
