name: Phase 6 Task 8 Format App Integration

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  format-app-integration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier
          src/features/home/HomeScreen.tsx
          src/features/home/home.css
          tests/unit/features/home/HomeScreen.test.tsx
          tests/unit/app/GameApp.officialTournament.test.tsx
          --write
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomeScreen.tsx src/features/home/home.css tests/unit/features/home/HomeScreen.test.tsx tests/unit/app/GameApp.officialTournament.test.tsx
          git commit -m "chore: format Phase 6 app integration files"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
