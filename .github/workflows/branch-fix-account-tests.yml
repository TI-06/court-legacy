name: Account Auth Mock Fixer

on:
  push:
    branches: [feat/account-id-auth]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/account-id-auth
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --offline --ignore-scripts --no-audit --fund=false
      - name: Replace legacy auth mocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = '''    signInWithGoogle: vi.fn().mockResolvedValue(undefined),\n    signInWithEmail: vi.fn().mockResolvedValue(undefined),\n'''
          new = '''    signInWithCredentials: vi.fn().mockResolvedValue(undefined),\n    registerAccount: vi.fn().mockResolvedValue(undefined),\n    requestPasswordReset: vi.fn().mockResolvedValue(undefined),\n    updatePassword: vi.fn().mockResolvedValue(undefined),\n    isPasswordRecovery: vi.fn().mockReturnValue(false),\n'''
          changed = []
          for path in Path('tests').rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
                  changed.append(str(path))
          print('\n'.join(changed))
          PY
          npx --no-install prettier --write tests/unit tests/unit/services/SupabaseAuthClient.test.ts
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test: update auth client mocks"
          git push
