name: Source Export

on:
  push:
    branches:
      - fix/player-art-rendering

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-art-rendering
      - uses: actions/upload-artifact@v4
        with:
          name: court-legacy-source
          path: |
            src
            tests
            scripts
            docs
            package.json
            package-lock.json
            tsconfig*.json
            vite.config.ts
            vitest.config.ts
            playwright.config.ts
            eslint.config.js
          retention-days: 1
