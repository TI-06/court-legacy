name: PR65 E2E Rollover Fix

on:
  push:
    branches:
      - feat/scout-inventory-radar-grades

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scout-inventory-radar-grades
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Exercise year rollover without rebuilding the static backend
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/shop-flow.spec.ts')
          text = path.read_text()
          old = '''  await page.reload();
            await openShop(page);
            await expect(
              page.getByText(
                `年度 ${nextYearIndex} ・ 購入/使用上限は年度ごとに更新`,
              ),
            ).toBeVisible();
          '''.replace('          ', '')
          new = '''  await page
            .getByRole("button", { name: "その他へ戻る", exact: true })
            .click();
          await page.getByRole("button", { name: "ショップ", exact: true }).click();
          await expect(page.getByRole("heading", { name: "ショップ" })).toBeVisible();
          await expect(
            page.getByText(
              `年度 ${nextYearIndex} ・ 購入/使用上限は年度ごとに更新`,
            ),
          ).toBeVisible();
          '''
          if old not in text:
              raise SystemExit('rollover navigation block not found; refusing blind edit')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/pr65-e2e-rollover-fix.yml
      - name: Format changed test
        run: npx prettier tests/e2e/shop-flow.spec.ts --write
      - name: Verify repository
        run: npm run verify
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify rollover E2E
        run: npx playwright test tests/e2e/shop-flow.spec.ts --grep 'academic year rollover carries inventory'
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'test: align rollover e2e with carried inventory backend'
          git push origin HEAD:feat/scout-inventory-radar-grades
