name: Phase51 Soak Format Diagnostic

on:
  push:
    branches:
      - test/phase51-special-project-soak
    paths:
      - ".github/workflows/phase51-soak-format.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show formatted diff
        run: |
          npx prettier src/dev/soak/runBalanceSoak.ts src/dev/soak/soakMetrics.ts tests/unit/soak/soakDriver.test.ts --write
          git diff -- src/dev/soak/runBalanceSoak.ts src/dev/soak/soakMetrics.ts tests/unit/soak/soakDriver.test.ts
