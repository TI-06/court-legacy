name: Phase21 PR21-2 Task2 GREEN

on:
  push:
    branches:
      - feat/phase21-2-relationship-model-persistence

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply Task2 implementation
        id: apply
        continue-on-error: true
        run: |
          python3 .github/phase21-task2-apply.py
          npx prettier --write src/domain/validation/gameDataSchema.ts src/domain/events/eventEligibility.ts src/domain/events/resolveEventChoice.ts
      - name: Run focused tests
        id: tests
        continue-on-error: true
        run: npx vitest run tests/unit/domain/events/phase21SpecialRelationshipEffects.test.ts tests/unit/domain/relationships/specialRelationships.test.ts tests/unit/domain/relationships/relationshipPresentation.test.ts
      - name: Run typecheck
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Report result
        run: |
          echo "apply=${{ steps.apply.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          echo "types=${{ steps.types.outcome }}"
      - name: Commit verified Task2 implementation
        if: ${{ steps.apply.outcome == 'success' && steps.tests.outcome == 'success' && steps.types.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm .github/phase21-task2-apply.py .github/workflows/phase21-pr21-2-task2-green.yml
          git config user.name "TI-06"
          git config user.email "iretaku.shop@gmail.com"
          git add -A
          git commit -m "feat: support special relationship event transitions"
          git push origin HEAD:feat/phase21-2-relationship-model-persistence
