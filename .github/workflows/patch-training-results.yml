name: Patch training result toggle

on:
  push:
    branches:
      - feature/m1-week-loop-training-sheet

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-week-loop-training-sheet
      - name: Replace details event with explicit button
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/features/training/TrainingScreen.tsx")
          text = path.read_text()
          old = '''          <details
            className="training-result-details"
            onToggle={(event) => setResultsExpanded(event.currentTarget.open)}
          >
            <summary>選手別の結果を確認</summary>
'''
          new = '''          <div
            className={`training-result-details${resultsExpanded ? " training-result-details--open" : ""}`}
          >
            <button
              aria-expanded={resultsExpanded}
              onClick={() => setResultsExpanded((current) => !current)}
              type="button"
            >
              選手別の結果を確認
            </button>
'''
          if old not in text:
              raise SystemExit("training result opening block not found")
          text = text.replace(old, new, 1)
          if "          </details>" not in text:
              raise SystemExit("training result closing tag not found")
          text = text.replace("          </details>", "          </div>", 1)
          path.write_text(text)
      - name: Format and commit
        shell: bash
        run: |
          npm ci
          npm run format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/training/TrainingScreen.tsx
          git commit -m "fix: use explicit training result toggle [skip ci]"
          git push origin HEAD:feature/m1-week-loop-training-sheet
