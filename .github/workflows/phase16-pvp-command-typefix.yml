name: Phase16 PvP command typefix

on:
  push:
    branches:
      - feat/phase16-official-pvp-completion
    paths:
      - .github/workflows/phase16-pvp-command-typefix.yml

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Align receipt fixture with store contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/unit/worker/phase16PvpChallengeRoutes.test.ts')
          s = p.read_text()
          s = s.replace('      resultingCursor: 77,\n', '')
          s = s.replace('      createdAt: "2026-09-10T09:32:00.000Z",\n', '')
          p.write_text(s)
          PY
      - run: npx prettier --write worker/routes/pvpChallengeCommand.ts tests/unit/worker/phase16PvpChallengeRoutes.test.ts
      - name: Focused tests
        run: npx vitest run tests/unit/worker/phase16PvpChallengeRoutes.test.ts tests/unit/worker/router.test.ts tests/unit/worker/phase16PvpCommandReceiptStore.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Cleanup and commit
        if: always()
        run: |
          git rm .github/workflows/phase16-pvp-command-typefix.yml
          git add worker/routes/pvpChallengeCommand.ts tests/unit/worker/phase16PvpChallengeRoutes.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: align PvP command receipt types"
          git push
