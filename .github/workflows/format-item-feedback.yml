name: Format item results
on:
  push:
    branches:
      - feat/phase67-item-effect-feedback-20261017
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase67-item-effect-feedback-20261017
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier --write src/features/shop/ShopScreen.tsx src/features/home/HomeQuickItems.tsx src/features/home/HomeScreen.tsx src/app/GameApp.tsx src/features/team/PlayerHubScreen.tsx src/features/home/home-quick-items.css src/features/team/player-hub.css tests/unit/features/shop/ContextualShopResults.test.tsx
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/shop/ShopScreen.tsx src/features/home/HomeQuickItems.tsx src/features/home/HomeScreen.tsx src/app/GameApp.tsx src/features/team/PlayerHubScreen.tsx src/features/home/home-quick-items.css src/features/team/player-hub.css tests/unit/features/shop/ContextualShopResults.test.tsx
          if ! git diff --staged --quiet; then
            git commit -m "style(items): apply Prettier"
            git push origin HEAD:feat/phase67-item-effect-feedback-20261017
          fi
