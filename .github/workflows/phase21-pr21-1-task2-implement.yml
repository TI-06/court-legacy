name: Phase21 PR21-1 Task2 Implement

on:
  push:
    branches:
      - feat/phase21-1-fullscreen-events-personality

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Apply focused Task2 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 occurrence, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # PlayerHubScreen imports and props.
          replace_once(
              "src/features/team/PlayerHubScreen.tsx",
              'import { getPlayerDevelopmentPresentation } from "../../domain/player/playerDevelopmentPresentation";\n',
              'import { getPlayerDevelopmentPresentation } from "../../domain/player/playerDevelopmentPresentation";\nimport { getPlayerPersonalityPresentation } from "../../domain/player/playerPersonalityPresentation";\n',
          )
          replace_once(
              "src/features/team/PlayerHubScreen.tsx",
              'import { individualTrainingInstructions } from "../../data/individualTrainingInstructions";\n',
              'import type { GameDataRegistry } from "../../data/dataRegistry";\nimport { individualTrainingInstructions } from "../../data/individualTrainingInstructions";\n',
          )
          replace_once(
              "src/features/team/PlayerHubScreen.tsx",
              'interface PlayerHubScreenProps {\n  state: GameState;\n',
              'interface PlayerHubScreenProps {\n  state: GameState;\n  data: GameDataRegistry;\n',
          )
          replace_once(
              "src/features/team/PlayerHubScreen.tsx",
              'export function PlayerHubScreen({\n  state,\n  selection,\n',
              'export function PlayerHubScreen({\n  state,\n  data,\n  selection,\n',
          )
          replace_once(
              "src/features/team/PlayerHubScreen.tsx",
              '    const development = getPlayerDevelopmentPresentation(selectedPlayer);\n    const growth = summarizePlayerGrowth(state, selectedPlayer.id);\n',
              '    const development = getPlayerDevelopmentPresentation(selectedPlayer);\n    const personalityDefinition = data.personalities.get(selectedPlayer.personalityId);\n    const personality = personalityDefinition\n      ? getPlayerPersonalityPresentation(personalityDefinition)\n      : null;\n    const growth = summarizePlayerGrowth(state, selectedPlayer.id);\n',
          )
          replace_once(
              "src/features/team/PlayerHubScreen.tsx",
              '''        </section>\n\n        <section\n          className="player-detail__growth-summary"\n          aria-label="最近の成長"\n        >\n''',
              '''        </section>\n\n        {personality ? (\n          <section className="player-detail__personality" aria-label="性格">\n            <div className="player-detail__personality-heading">\n              <h3>性格</h3>\n              <strong>{personality.name}</strong>\n            </div>\n            <p>{personality.description}</p>\n            <div\n              className="player-detail__personality-tendencies"\n              aria-label="性格の傾向"\n            >\n              <span>練習 {personality.trainingStability}</span>\n              <span>関係構築 {personality.relationshipBuilding}</span>\n              <span>プレッシャー {personality.pressureResponse}</span>\n              <span>士気 {personality.moraleVolatility}</span>\n            </div>\n          </section>\n        ) : null}\n\n        <section\n          className="player-detail__growth-summary"\n          aria-label="最近の成長"\n        >\n''',
          )

          # GameApp passes the existing registry.
          replace_once(
              "src/app/GameApp.tsx",
              '    ) : activeTab === "team" ? (\n      <PlayerHubScreen\n        initialPlayerId={teamInitialPlayerId}\n',
              '    ) : activeTab === "team" ? (\n      <PlayerHubScreen\n        data={gameData}\n        initialPlayerId={teamInitialPlayerId}\n',
          )

          # Existing PlayerHub tests use the real game registry at every render site.
          test_path = Path("tests/unit/features/team/PlayerHubScreen.test.tsx")
          test_text = test_path.read_text(encoding="utf-8")
          old_import = 'import { createDemoGame } from "../../../../src/app/createDemoGame";'
          if test_text.count(old_import) != 1:
              raise SystemExit("PlayerHubScreen.test.tsx: createDemoGame import anchor mismatch")
          test_text = test_text.replace(
              old_import,
              'import { createDemoGame, gameData } from "../../../../src/app/createDemoGame";',
              1,
          )
          occurrences = test_text.count("    <PlayerHubScreen\n")
          if occurrences != 2:
              raise SystemExit(f"PlayerHubScreen.test.tsx: expected 2 render sites, found {occurrences}")
          test_text = test_text.replace(
              "    <PlayerHubScreen\n",
              "    <PlayerHubScreen\n      data={gameData}\n",
          )
          test_path.write_text(test_text, encoding="utf-8")

          # Match the established compact game-panel visual language.
          css_path = Path("src/features/team/player-hub.css")
          css = css_path.read_text(encoding="utf-8")
          marker = ".player-detail__growth-summary {\n"
          if css.count(marker) != 1:
              raise SystemExit("player-hub.css: growth-summary anchor mismatch")
          personality_css = '''.player-detail__personality {\n  display: grid;\n  min-width: 0;\n  padding: 10px 11px;\n  gap: 7px;\n  background:\n    linear-gradient(135deg, rgb(244 122 24 / 8%), transparent 58%),\n    rgb(11 26 45 / 92%);\n  border: 1px solid rgb(255 255 255 / 10%);\n  border-radius: 12px;\n}\n\n.player-detail__personality-heading {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  min-width: 0;\n  gap: 8px;\n}\n\n.player-detail__personality-heading h3,\n.player-detail__personality p {\n  margin: 0;\n}\n\n.player-detail__personality-heading h3 {\n  font-size: 13px;\n}\n\n.player-detail__personality-heading strong {\n  color: #ffd99a;\n  font-size: 14px;\n}\n\n.player-detail__personality p {\n  color: var(--game-text-muted, #a9b8ca);\n  font-size: 11px;\n  line-height: 1.5;\n}\n\n.player-detail__personality-tendencies {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 5px;\n}\n\n.player-detail__personality-tendencies span {\n  min-width: 0;\n  padding: 6px 7px;\n  overflow: hidden;\n  color: #eef9ff;\n  font-size: 10px;\n  font-weight: 800;\n  text-align: center;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  background: rgb(31 120 171 / 16%);\n  border: 1px solid rgb(116 216 255 / 18%);\n  border-radius: 8px;\n}\n\n'''
          css_path.write_text(css.replace(marker, personality_css + marker, 1), encoding="utf-8")
          PY
      - name: Format changed files
        run: npx prettier --write src/features/team/PlayerHubScreen.tsx src/app/GameApp.tsx src/features/team/player-hub.css tests/unit/features/team/PlayerHubScreen.test.tsx tests/unit/features/team/phase21PlayerPersonalityDetail.test.tsx src/domain/player/playerPersonalityPresentation.ts tests/unit/domain/player/playerPersonalityPresentation.test.ts
      - name: Verify Task2 without failing workflow
        id: verify
        shell: bash
        run: |
          set +e
          npx vitest run \
            tests/unit/domain/player/playerPersonalityPresentation.test.ts \
            tests/unit/features/team/phase21PlayerPersonalityDetail.test.tsx \
            tests/unit/features/team/PlayerHubScreen.test.tsx
          test_status=$?
          npm run typecheck
          type_status=$?
          set -e
          if [ "$test_status" -ne 0 ] || [ "$type_status" -ne 0 ]; then
            echo "Task2 verification did not pass; leaving branch unmodified for diagnosis."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Task2 focused tests and typecheck passed."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit verified Task2 and remove this workflow
        if: steps.verify.outputs.ready == 'true'
        shell: bash
        run: |
          rm .github/workflows/phase21-pr21-1-task2-implement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/team/PlayerHubScreen.tsx src/app/GameApp.tsx src/features/team/player-hub.css tests/unit/features/team/PlayerHubScreen.test.tsx tests/unit/features/team/phase21PlayerPersonalityDetail.test.tsx .github/workflows/phase21-pr21-1-task2-implement.yml
          git commit -m "feat: show player personality in Player Hub"
          git push origin HEAD:${GITHUB_REF_NAME}
