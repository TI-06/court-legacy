name: Phase4 Task5 GREEN fix

on:
  push:
    branches:
      - feature/court-legacy-v2-phase4-async-pvp
    paths:
      - .github/workflows/phase4-task5-green-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase4-async-pvp
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Patch atomic PvP challenge persistence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/202608280004_async_pvp.sql')
          sql = path.read_text()

          old = '''  v_winner_user_id uuid;
            v_match_id uuid;
          begin'''.replace('            ', '  ')
          new = '''  v_winner_user_id uuid;
            v_match_id uuid;
            v_match_created_at timestamptz;
            v_defender_school_name text;
            v_defender_school_short_name text;
          begin'''.replace('            ', '  ')
          if old not in sql:
              raise SystemExit('declaration anchor not found')
          sql = sql.replace(old, new, 1)

          old = '''    return;
            end if;

            if (
              select count(*) >= 3'''.replace('            ', '  ')
          new = '''    return;
            end if;

            select snapshots.school_name, snapshots.school_short_name
            into v_defender_school_name, v_defender_school_short_name
            from public.pvp_team_snapshots as snapshots
            where snapshots.id = p_defender_snapshot_id
              and snapshots.user_id = p_defender_user_id
              and snapshots.is_active
            for share;

            if not found then
              raise exception using errcode = 'P0001', message = 'pvp_opponent_inactive';
            end if;

            if (
              select count(*) >= 3'''.replace('            ', '  ')
          if old not in sql:
              raise SystemExit('active snapshot anchor not found')
          sql = sql.replace(old, new, 1)

          old = '''  returning pvp_matches.id into v_match_id;

            insert into public.pvp_operations(user_id, operation_id, kind, response)
            values (
              p_challenger_user_id,
              btrim(p_operation_id),
              'challenge',
              jsonb_build_object('matchId', v_match_id)
            );'''.replace('            ', '  ')
          new = '''  returning pvp_matches.id, pvp_matches.created_at
            into v_match_id, v_match_created_at;

            insert into public.pvp_operations(user_id, operation_id, kind, response)
            values (
              p_challenger_user_id,
              btrim(p_operation_id),
              'challenge',
              jsonb_build_object(
                'operationId', btrim(p_operation_id),
                'revision', p_challenger_source_revision,
                'seasonId', p_season_id,
                'matchId', v_match_id,
                'opponent', jsonb_build_object(
                  'snapshotId', p_defender_snapshot_id,
                  'schoolName', v_defender_school_name,
                  'schoolShortName', v_defender_school_short_name
                ),
                'rating', jsonb_build_object(
                  'before', v_challenger_rating,
                  'after', v_challenger_after,
                  'delta', v_challenger_after - v_challenger_rating
                ),
                'result', p_result,
                'createdAt', v_match_created_at
              )
            );'''.replace('            ', '  ')
          if old not in sql:
              raise SystemExit('operation response anchor not found')
          sql = sql.replace(old, new, 1)
          path.write_text(sql)

          route = Path('worker/routes/pvpChallenge.ts')
          text = route.read_text()
          old = '''      if (containsErrorCode(error, "pvp_operation_conflict")) {
                  return operationConflict();
                }
                if (containsErrorCode(error, "pvp_self_match")) {'''.replace('                ', '      ')
          new = '''      if (containsErrorCode(error, "pvp_operation_conflict")) {
                  return operationConflict();
                }
                if (containsErrorCode(error, "pvp_opponent_inactive")) {
                  return jsonError(
                    409,
                    "pvp_opponent_inactive",
                    "この公開チームは更新済みです。対戦相手一覧を更新してください",
                  );
                }
                if (containsErrorCode(error, "pvp_self_match")) {'''.replace('                ', '      ')
          if old not in text:
              raise SystemExit('route error anchor not found')
          route.write_text(text.replace(old, new, 1))
          PY
      - name: Format TypeScript
        run: npx prettier worker/routes/pvpChallenge.ts worker/pvp/simulatePvpMatch.ts worker/router.ts tests/unit/worker/pvpChallenge.test.ts tests/unit/worker/pvpMigration.test.ts --write
      - name: Commit GREEN fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608280004_async_pvp.sql worker/routes/pvpChallenge.ts worker/pvp/simulatePvpMatch.ts worker/router.ts tests/unit/worker/pvpChallenge.test.ts tests/unit/worker/pvpMigration.test.ts
          git commit -m "feat: harden atomic PvP challenges"
          git push origin HEAD:feature/court-legacy-v2-phase4-async-pvp
