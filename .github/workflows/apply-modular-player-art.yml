name: Apply Modular Player Art

on:
  push:
    branches:
      - fix/player-art-rendering

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-art-rendering
      - name: Inspect staged chunks
        run: |
          wc -c .github/modular-player-art/part-*
          sha256sum .github/modular-player-art/part-*
          printf 'invalid characters:\n'
          LC_ALL=C grep -nH '[^A-Za-z0-9+/=[:space:]]' .github/modular-player-art/part-* || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: python -m pip install Pillow
      - run: npm ci
      - name: Apply staged source update
        run: |
          cat .github/modular-player-art/part-* | tr -d '\r\n\t ' | base64 -d > /tmp/modular-player-art.tar.gz
          echo "aea184c15740ec0abd765b91a7fd8c23565a26a0a4b872f86d9963eb6e46de23  /tmp/modular-player-art.tar.gz" | sha256sum -c -
          tar -xzf /tmp/modular-player-art.tar.gz -C .
          rm -rf .github/modular-player-art
          rm .github/workflows/apply-modular-player-art.yml
          npm run art:generate
          npm run art:verify
          npm run verify
      - name: Commit implementation and generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement modular general player art"
          git push origin HEAD:fix/player-art-rendering
