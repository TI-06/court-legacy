name: Phase16 PvP remove unused import

on:
  push:
    branches:
      - feat/phase16-official-pvp-completion
    paths:
      - .github/workflows/phase16-pvp-remove-unused-import.yml

permissions:
  contents: write

jobs:
  typefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: sed -i '/PersistedPvpMatchSession,/d' tests/unit/worker/pvpChallenge.test.ts
      - run: npx prettier --write tests/unit/worker/pvpChallenge.test.ts
      - run: npm run typecheck
      - name: Cleanup and commit
        if: always()
        run: |
          git rm .github/workflows/phase16-pvp-remove-unused-import.yml
          git add tests/unit/worker/pvpChallenge.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: finish PvP challenge mock type migration"
          git push
