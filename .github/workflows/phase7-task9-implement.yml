name: Phase 7 Task 9 Implement

on:
  push:
    branches:
      - feature/court-legacy-v2-phase7-team-dynamics

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase7-team-dynamics
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Wire Task 9 UI
        run: |
          python - <<'PY'
          from pathlib import Path

          home_path = Path("src/features/home/HomeScreen.tsx")
          home = home_path.read_text()
          import_anchor = 'import type { SimulateMatchResult } from "../../domain/match/simulateMatch";\n'
          import_line = 'import type { CohesionTrend } from "../../domain/dynamics/teamDynamicsTypes";\n'
          if import_line not in home:
              if import_anchor not in home:
                  raise SystemExit("home import anchor missing")
              home = home.replace(import_anchor, import_line + import_anchor, 1)
          function_anchor = '\nfunction average(values: readonly number[]): number {'
          trend_block = '''
          const cohesionTrendLabels: Record<CohesionTrend, string> = {
            rising: "上向き",
            stable: "横ばい",
            falling: "低下",
          };
          '''
          if "const cohesionTrendLabels" not in home:
              if function_anchor not in home:
                  raise SystemExit("home trend anchor missing")
              home = home.replace(function_anchor, trend_block + function_anchor, 1)
          metric_anchor = '''        <article className="metric-card">
                    <span>部員</span>
                    <strong>{players.length}</strong>
                    <small>
                      {injuredCount > 0 ? `怪我 ${injuredCount}人` : "怪我なし"}
                    </small>
                  </article>
                </section>'''
          metric_replacement = '''        <article className="metric-card">
                    <span>部員</span>
                    <strong>{players.length}</strong>
                    <small>
                      {injuredCount > 0 ? `怪我 ${injuredCount}人` : "怪我なし"}
                    </small>
                  </article>
                  <article className="metric-card">
                    <span>結束力</span>
                    <strong>{state.teamDynamics.cohesion}</strong>
                    <small>{cohesionTrendLabels[state.teamDynamics.cohesionTrend]}</small>
                  </article>
                </section>'''
          if "<span>結束力</span>" not in home:
              if metric_anchor not in home:
                  raise SystemExit("home metric anchor missing")
              home = home.replace(metric_anchor, metric_replacement, 1)
          home_path.write_text(home)

          app_path = Path("src/app/GameApp.tsx")
          app = app_path.read_text()
          save_anchor = '''  const saveTeamSelection = async (selection: TeamSelection) => {
            await cloudSession.runAction(
              { type: "team-selection", selection },
              "スタメンを保存しています…",
            );
          };
          '''
          save_replacement = save_anchor + '''
          const saveTeamLeadership = async (
            captainPlayerId: PlayerId,
            viceCaptainPlayerId: PlayerId,
          ) => {
            await cloudSession.runAction(
              {
                type: "set-team-leadership",
                captainPlayerId,
                viceCaptainPlayerId,
              },
              "役職を保存しています…",
            );
          };
          '''
          if "const saveTeamLeadership" not in app:
              if save_anchor not in app:
                  raise SystemExit("game app leadership anchor missing")
              app = app.replace(save_anchor, save_replacement, 1)
          player_hub_anchor = '''      <PlayerHubScreen
                onChange={saveTeamSelection}
                selection={teamSelection}
                state={gameState}
              />'''
          player_hub_replacement = '''      <PlayerHubScreen
                leadershipPending={cloudSession.operation.status === "submitting"}
                onAssignLeadership={saveTeamLeadership}
                onChange={saveTeamSelection}
                selection={teamSelection}
                state={gameState}
              />'''
          if "onAssignLeadership={saveTeamLeadership}" not in app:
              if player_hub_anchor not in app:
                  raise SystemExit("game app PlayerHub anchor missing")
              app = app.replace(player_hub_anchor, player_hub_replacement, 1)
          app_path.write_text(app)

          team_path = Path("src/features/team/TeamScreen.tsx")
          team = team_path.read_text()
          css_anchor = 'import "./team-direct.css";\n'
          css_line = 'import "./team-dynamics.css";\n'
          if css_line not in team:
              if css_anchor not in team:
                  raise SystemExit("team css anchor missing")
              team = team.replace(css_anchor, css_anchor + css_line, 1)
          locked_anchor = '''  const lockedIds = new Set(selection.substitutionPolicy.starterLockPlayerIds);
          '''
          locked_replacement = locked_anchor + '''  const captain = state.teamDynamics.captainPlayerId
            ? playerById[state.teamDynamics.captainPlayerId]
            : null;
          '''
          if "const captain = state.teamDynamics.captainPlayerId" not in team:
              if locked_anchor not in team:
                  raise SystemExit("team captain anchor missing")
              team = team.replace(locked_anchor, locked_replacement, 1)
          summary_anchor = '''      </section>

                <section className="team-summary" aria-label="編成サマリー">'''
          summary_replacement = '''      </section>

                <section className="team-dynamics-inline" aria-label="チーム状態サマリー">
                  <span>
                    結束力 <strong>{state.teamDynamics.cohesion}</strong>
                  </span>
                  <span>
                    主将 <strong>{captain ? playerName(captain) : "未設定"}</strong>
                  </span>
                </section>

                <section className="team-summary" aria-label="編成サマリー">'''
          if 'aria-label="チーム状態サマリー"' not in team:
              if summary_anchor not in team:
                  raise SystemExit("team summary anchor missing")
              team = team.replace(summary_anchor, summary_replacement, 1)
          team_path.write_text(team)
          PY
      - name: Format Task 9 files
        run: |
          npx prettier src/features/team/TeamDynamicsPanel.tsx src/features/team/team-dynamics.css src/features/team/PlayerHubScreen.tsx src/features/team/TeamScreen.tsx src/features/home/HomeScreen.tsx src/app/GameApp.tsx tests/unit/features/team/TeamDynamicsPanel.test.tsx tests/unit/features/team/PlayerHubScreen.test.tsx tests/unit/features/home/HomeScreen.test.tsx .github/workflows/phase7-task9-implement.yml --write
      - name: Verify Task 9 focused UI
        run: |
          npx vitest run tests/unit/features/team/TeamDynamicsPanel.test.tsx tests/unit/features/team/PlayerHubScreen.test.tsx tests/unit/features/team/TeamSelectionFlow.test.tsx tests/unit/features/home/HomeScreen.test.tsx tests/unit/app/GameAppActions.test.tsx tests/unit/app/teamLeadershipBrowserAuthority.test.ts
          npm run typecheck
      - name: Commit Task 9 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/team/TeamDynamicsPanel.tsx src/features/team/team-dynamics.css src/features/team/PlayerHubScreen.tsx src/features/team/TeamScreen.tsx src/features/home/HomeScreen.tsx src/app/GameApp.tsx tests/unit/features/team/TeamDynamicsPanel.test.tsx tests/unit/features/team/PlayerHubScreen.test.tsx tests/unit/features/home/HomeScreen.test.tsx .github/workflows/phase7-task9-implement.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat: add team dynamics management ui"
            git push origin HEAD:feature/court-legacy-v2-phase7-team-dynamics
          fi
