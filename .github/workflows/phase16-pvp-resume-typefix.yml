name: Phase16 PvP resume typefix
on:
  push:
    branches: [feat/phase16-official-pvp-completion]
permissions:
  contents: write
jobs:
  typefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Remove unused test helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/unit/worker/phase16PvpCommandResumeRoutes.test.ts')
          s = p.read_text()
          s = s.replace('import type {\n  CloudGameSnapshot,\n  GameStore,\n} from "../../../worker/data/GameStore";\n', 'import type { CloudGameSnapshot } from "../../../worker/data/GameStore";\n')
          start = s.index('function gameStore(snapshot: CloudGameSnapshot): GameStore {')
          end = s.index('\nfunction storeForSession(', start)
          s = s[:start] + s[end + 1:]
          p.write_text(s)
          PY
      - run: npx prettier --write tests/unit/worker/phase16PvpCommandResumeRoutes.test.ts
      - run: npx vitest run tests/unit/worker/phase16PvpCommandResumeRoutes.test.ts tests/unit/worker/phase16PvpChallengeRoutes.test.ts tests/unit/worker/router.test.ts
      - run: npm run typecheck
      - name: Cleanup and commit
        if: always()
        run: |
          git rm .github/workflows/phase16-pvp-resume-typefix.yml
          git add tests/unit/worker/phase16PvpCommandResumeRoutes.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: remove unused PvP resume helper"
          git push
