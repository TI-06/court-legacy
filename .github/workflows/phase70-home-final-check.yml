name: Phase70 Home Final Check
on:
  push:
    branches: [fix/phase70-roster-stats-home-items-20261017]
permissions:
  contents: write
jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --fund=false
      - run: npx prettier --write tests/unit/app/GameApp.shop.test.tsx
      - run: npm run typecheck
      - run: npx vitest run tests/unit/app/GameApp.shop.test.tsx tests/unit/features/home/HomeQuickItems.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/app/GameApp.shop.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(home): format integrated camp regression"
            git push origin HEAD:fix/phase70-roster-stats-home-items-20261017
          fi
