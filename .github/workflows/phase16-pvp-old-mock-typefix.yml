name: Phase16 PvP old mock typefix

on:
  push:
    branches:
      - feat/phase16-official-pvp-completion
    paths:
      - .github/workflows/phase16-pvp-old-mock-typefix.yml

permissions:
  contents: write

jobs:
  typefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Update legacy challenge mock contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/unit/worker/pvpChallenge.test.ts')
          s = p.read_text()
          s = s.replace('  PublishedPvpTeamSnapshot,\n  PvPStore,\n', '  PersistedPvpMatchSession,\n  PublishedPvpTeamSnapshot,\n  PvpMatchSessionStore,\n')
          s = s.replace('): PvPStore & { committed: CommitRatedPvpMatchInput[] } {', '): PvpMatchSessionStore & { committed: CommitRatedPvpMatchInput[] } {')
          s = s.replace('  const store: PvPStore & { committed: CommitRatedPvpMatchInput[] } = {', '  const store: PvpMatchSessionStore & { committed: CommitRatedPvpMatchInput[] } = {')
          marker = '    listHistory: vi.fn(async () => []),\n'
          addition = marker + '''    createMatchSession: vi.fn(async () => {\n      throw new Error("not used");\n    }),\n    getMatchSession: vi.fn(async () => null),\n    getMatchSessionCommandReceipt: vi.fn(async () => null),\n    saveMatchSessionCommand: vi.fn(async () => {\n      throw new Error("not used");\n    }),\n    storeMatchSessionFinalResponse: vi.fn(async () => {\n      throw new Error("not used");\n    }),\n'''
          if marker not in s:
              raise SystemExit('listHistory marker missing')
          s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY
      - run: npx prettier --write tests/unit/worker/pvpChallenge.test.ts
      - run: npm run typecheck
      - name: Cleanup and commit
        if: always()
        run: |
          git rm .github/workflows/phase16-pvp-old-mock-typefix.yml
          git add tests/unit/worker/pvpChallenge.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: update legacy PvP challenge store mock"
          git push
