name: Phase10 player lineup gate

on:
  push:
    branches:
      - feature/phase10-mobile-ui-completion
    paths:
      - .github/workflows/phase10-player-lineup-gate.yml

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase10-mobile-ui-completion
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format focused files
        run: npx prettier src/domain/team/repositionTeamSelection.ts tests/unit/domain/team/repositionTeamSelection.test.ts src/features/team/PlayerHubScreen.tsx src/features/team/player-hub.css tests/unit/features/team/PlayerHubScreen.test.tsx src/features/team/TeamScreen.tsx src/features/team/team-direct.css tests/unit/features/team/TeamSelectionFlow.test.tsx --write
      - name: Run focused tests
        run: npm test -- tests/unit/domain/team/repositionTeamSelection.test.ts tests/unit/features/team/PlayerHubScreen.test.tsx tests/unit/features/team/TeamSelectionFlow.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/team/repositionTeamSelection.ts tests/unit/domain/team/repositionTeamSelection.test.ts src/features/team/PlayerHubScreen.tsx src/features/team/player-hub.css tests/unit/features/team/PlayerHubScreen.test.tsx src/features/team/TeamScreen.tsx src/features/team/team-direct.css tests/unit/features/team/TeamSelectionFlow.test.tsx
          git diff --cached --quiet || git commit -m "style: format phase10 player lineup ui"
          git push origin HEAD:feature/phase10-mobile-ui-completion
