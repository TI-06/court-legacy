name: Phase 3 Browser Boundary Format

on:
  pull_request:

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier tests/unit/app/createBrowserAppDependencies.test.ts --write
      - run: git diff -- tests/unit/app/createBrowserAppDependencies.test.ts
