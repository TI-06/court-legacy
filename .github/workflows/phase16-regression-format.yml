name: Phase16 Regression Format

on:
  push:
    branches:
      - feat/phase16-match-command-ux

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format regression test
        run: |
          npx prettier --write tests/unit/worker/phase11WeekProgression.test.ts
          git rm .github/workflows/phase16-regression-format.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: format Phase16 week progression regression"
          git push
