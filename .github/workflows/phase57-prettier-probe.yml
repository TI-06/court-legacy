name: Phase57 Prettier Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/dev/soak/runBalanceSoak.ts"
      - ".github/workflows/phase57-prettier-probe.yml"

permissions:
  contents: read

jobs:
  prettier-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Show exact Prettier diff
        run: |
          npx prettier src/dev/soak/runBalanceSoak.ts --write
          git diff -- src/dev/soak/runBalanceSoak.ts
