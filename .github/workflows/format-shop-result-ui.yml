name: Format shop result UI

on:
  push:
    branches:
      - feature/court-legacy-v2-phase5-shop-mvp
    paths:
      - .github/workflows/format-shop-result-ui.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase5-shop-mvp
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/shop/ShopScreen.tsx src/features/scouting/ScoutingScreen.tsx tests/unit/app/GameApp.shopResult.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/shop/ShopScreen.tsx src/features/scouting/ScoutingScreen.tsx tests/unit/app/GameApp.shopResult.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format shop result UI"
          git push origin HEAD:feature/court-legacy-v2-phase5-shop-mvp
