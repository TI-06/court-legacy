name: Generate featured art

on:
  push:
    branches:
      - feature/m6-game-ui-refresh
    paths:
      - scripts/generate_featured_character_art.py
      - .github/workflows/generate-featured-art.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m6-game-ui-refresh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/generate_featured_character_art.py
      - name: Commit generated WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/characters/featured
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: generate featured player WebP art"
          git push origin HEAD:feature/m6-game-ui-refresh
