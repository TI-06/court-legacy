name: Phase21 PR21-1 Task2 Expected RED

on:
  push:
    branches:
      - feat/phase21-1-fullscreen-events-personality

permissions:
  contents: read

jobs:
  expected-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Verify Player Hub personality test is RED
        shell: bash
        run: |
          set +e
          npx vitest run tests/unit/features/team/phase21PlayerPersonalityDetail.test.tsx
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED, but Player Hub personality test passed unexpectedly."
            exit 1
          fi
          echo "Expected RED confirmed; workflow remains green by design."
