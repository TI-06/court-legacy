name: Fix character layout once

on:
  push:
    branches:
      - feature/m5-character-world-integration

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-character-world-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Fix character sizing and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          character = Path('src/ui/PlayerCharacter.tsx')
          text = character.read_text(encoding='utf-8')
          old = '''        <SchoolEmblem
          school={school}
          compact
'''
          new = '''        <SchoolEmblem
          school={school}
          className="ui-school-emblem--jersey"
          compact
'''
          if old not in text:
              raise SystemExit('PlayerCharacter emblem block not found')
          character.write_text(text.replace(old, new, 1), encoding='utf-8')

          character_css = Path('src/ui/character-world.css')
          css = character_css.read_text(encoding='utf-8')
          anchor = '''.ui-school-emblem--compact {
  width: 24px;
  height: 24px;
}
'''
          replacement = '''.ui-school-emblem--compact {
  width: 24px;
  height: 24px;
}

.ui-player-character .ui-school-emblem--jersey {
  width: 8px;
  height: 8px;
}
'''
          if anchor not in css:
              raise SystemExit('character-world compact emblem block not found')
          character_css.write_text(css.replace(anchor, replacement, 1), encoding='utf-8')

          hero_css = Path('src/ui/featured-player-hero.css')
          hero = hero_css.read_text(encoding='utf-8')
          replacements = [
              ('grid-template-columns: 116px minmax(0, 1fr);', 'grid-template-columns: 124px minmax(0, 1fr);'),
              ('width: 150px;\n    max-width: none;', 'width: 124px;\n    max-width: 100%;'),
              ('grid-template-columns: 102px minmax(0, 1fr);', 'grid-template-columns: 104px minmax(0, 1fr);'),
              ('width: 132px;', 'width: 104px;'),
          ]
          for old, new in replacements:
              if old not in hero:
                  raise SystemExit(f'hero CSS value not found: {old}')
              hero = hero.replace(old, new, 1)
          hero_css.write_text(hero, encoding='utf-8')
          PY
          npm run format
          rm .github/workflows/fix-character-layout-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: キャラクター表示のモバイル寸法を補正"
          git push
