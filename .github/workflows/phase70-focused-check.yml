name: Phase70 Focused Check
on:
  push:
    branches: [fix/phase70-roster-4up-scoring-feedback-20261017]
permissions:
  contents: write
jobs:
  format-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --fund=false
      - name: Format touched files
        run: |
          npx prettier --write src/features/team/PlayerHubScreen.tsx src/features/team/player-hub.css src/domain/match/userMatchPerformance.ts src/features/team/playerSeasonLeaderboard.ts src/features/home/HomeQuickItems.tsx src/features/shop/ShopScreen.tsx src/features/team/playerCareerPresentation.ts tests/unit/domain/match/userMatchPerformance.test.ts tests/unit/features/team/playerSeasonLeaderboard.test.ts tests/unit/features/team/Phase54SeasonLeaderboard.test.tsx tests/unit/features/home/HomeQuickItems.test.tsx tests/e2e/phase61-player-roster-pager.spec.ts tests/unit/features/shop/ShopUseResultUx.test.tsx tests/unit/features/team/playerCareerPresentation.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/team/PlayerHubScreen.tsx src/features/team/player-hub.css src/domain/match/userMatchPerformance.ts src/features/team/playerSeasonLeaderboard.ts src/features/home/HomeQuickItems.tsx src/features/shop/ShopScreen.tsx src/features/team/playerCareerPresentation.ts tests/unit/domain/match/userMatchPerformance.test.ts tests/unit/features/team/playerSeasonLeaderboard.test.ts tests/unit/features/team/Phase54SeasonLeaderboard.test.tsx tests/unit/features/home/HomeQuickItems.test.tsx tests/e2e/phase61-player-roster-pager.spec.ts tests/unit/features/shop/ShopUseResultUx.test.tsx tests/unit/features/team/playerCareerPresentation.test.ts
          if ! git diff --staged --quiet; then
            git commit -m "style: format Phase70 roster and stat fixes"
            git push origin HEAD:fix/phase70-roster-4up-scoring-feedback-20261017
          fi
      - run: npm run typecheck
      - name: Focused regression tests
        run: npx vitest run tests/unit/domain/match/userMatchPerformance.test.ts tests/unit/features/team/playerSeasonLeaderboard.test.ts tests/unit/features/team/Phase54SeasonLeaderboard.test.tsx tests/unit/features/home/HomeQuickItems.test.tsx tests/unit/features/shop/ShopUseResultUx.test.tsx tests/unit/features/team/playerCareerPresentation.test.ts
