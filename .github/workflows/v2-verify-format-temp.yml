name: V2 Verify Temporary Formatter

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - tests/unit/scripts/verifyStructure.test.ts
      - .github/workflows/v2-verify-format-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format structural verification test
        run: npx prettier --write tests/unit/scripts/verifyStructure.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/scripts/verifyStructure.test.ts
          git commit -m "style: format structural verification guard"
          git push origin HEAD:feature/court-legacy-v2-phase1
