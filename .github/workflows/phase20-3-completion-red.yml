name: Phase20-3 Completion RED

on:
  push:
    branches:
      - "fix/phase20-3-practice-offer-spec-completion"

permissions:
  contents: read

jobs:
  expected-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Confirm completion contract is RED before implementation
        shell: bash
        run: |
          set +e
          npx vitest run \
            tests/unit/domain/weekly/phase20PracticeOfferCompletion.test.ts \
            tests/unit/persistence/phase20PracticeOfferCanonicalCodec.test.ts
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected RED tests, but they were already GREEN"
            exit 1
          fi
          echo "Expected RED confirmed (vitest exit $code)"
