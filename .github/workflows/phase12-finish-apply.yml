name: Phase 12 Finish Apply

on:
  push:
    branches: [feature/phase12-game-loop-polish]
    paths:
      - scripts/phase12-finish-apply.py
      - scripts/phase12-week-progression-cleanup.py
      - .github/workflows/phase12-finish-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase12-game-loop-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Confirm focused tests are RED
        shell: bash
        run: |
          set +e
          npx vitest run \
            tests/unit/features/team/Phase12LineupClarity.test.tsx \
            tests/unit/features/school/Phase12SchoolCompact.test.tsx \
            tests/unit/domain/team/Phase12FatigueIndependence.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected Phase 12 final tests to fail before implementation."
            exit 1
          fi
          echo "RED confirmed as expected."
      - name: Apply final Phase 12 implementation
        run: python scripts/phase12-finish-apply.py
      - name: Remove obsolete weekly recovery plumbing
        run: python scripts/phase12-week-progression-cleanup.py
      - name: Format changed code
        run: npm run format
      - name: Confirm focused tests GREEN
        run: |
          npx vitest run \
            tests/unit/features/team/Phase12LineupClarity.test.tsx \
            tests/unit/features/team/TeamSelectionFlow.test.tsx \
            tests/unit/features/school/Phase12SchoolCompact.test.tsx \
            tests/unit/features/school/SchoolScreen.test.tsx \
            tests/unit/domain/team/Phase12FatigueIndependence.test.ts \
            tests/unit/domain/team/autoSelectTeam.test.ts
      - name: Diagnose GameAppActions - training plan
        run: npx vitest run tests/unit/app/GameAppActions.test.tsx -t "saves the weekly training plan"
      - name: Diagnose GameAppActions - practice match
        run: npx vitest run tests/unit/app/GameAppActions.test.tsx -t "resolves a scheduled practice match"
      - name: Diagnose GameAppActions - facility upgrade
        run: npx vitest run tests/unit/app/GameAppActions.test.tsx -t "persists a facility upgrade"
      - name: Diagnose GameAppActions - training then advance
        run: npx vitest run tests/unit/app/GameAppActions.test.tsx -t "advances the week on the server"
      - name: Diagnose GameAppActions - event choice
        run: npx vitest run tests/unit/app/GameAppActions.test.tsx -t "persists an event choice"
      - name: Diagnose GameAppActions - team selection
        run: npx vitest run tests/unit/app/GameAppActions.test.tsx -t "persists team selection changes"
      - name: Diagnose GameAppActions - revision conflict
        run: npx vitest run tests/unit/app/GameAppActions.test.tsx -t "renders the refreshed cloud snapshot"
      - name: Verify formatting
        run: npm run format:check
      - name: Verify lint
        run: npm run lint
      - name: Verify typecheck
        run: npm run typecheck
      - name: Verify V2 structure
        run: node scripts/verifyStructureCli.mjs
      - name: Verify production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify unit tests - training after Phase 12 migration
        run: npx vitest run tests/unit/domain/training
      - name: Verify unit tests - weekly after Phase 12 migration
        run: npx vitest run tests/unit/domain/weekly
      - name: Verify unit tests - player and team
        run: npx vitest run tests/unit/domain/player tests/unit/domain/team
      - name: Verify unit tests - training data
        run: |
          npx vitest run \
            tests/unit/data/phase12TrainingInstructions.test.ts \
            tests/unit/data/individualTrainingInstructions.test.ts
      - name: Verify unit tests - remaining domain and data after Phase 12 migration
        run: |
          npx vitest run \
            tests/unit/domain/calendar \
            tests/unit/domain/dynamics \
            tests/unit/domain/events \
            tests/unit/domain/generation \
            tests/unit/domain/match \
            tests/unit/domain/notifications \
            tests/unit/domain/pvp \
            tests/unit/domain/school \
            tests/unit/domain/scouting \
            tests/unit/domain/selectors \
            tests/unit/domain/shop \
            tests/unit/domain/tournament \
            tests/unit/data \
            tests/integration
      - name: Verify unit tests - persistence services and scripts after Phase 12 migration
        run: |
          npx vitest run \
            tests/unit/persistence \
            tests/unit/services \
            tests/unit/scripts
      - name: Verify ui - App
        run: npx vitest run tests/unit/App.test.tsx
      - name: Verify app - AppBootstrap
        run: npx vitest run tests/unit/app/AppBootstrap.test.tsx
      - name: Verify app - ApplicationRoot
        run: npx vitest run tests/unit/app/ApplicationRoot.test.ts
      - name: Verify app - GameApp notifications
        run: npx vitest run tests/unit/app/GameApp.notifications.test.tsx
      - name: Verify app - GameApp officialTournament
        run: npx vitest run tests/unit/app/GameApp.officialTournament.test.tsx
      - name: Verify app - GameApp officialTournamentRetry
        run: npx vitest run tests/unit/app/GameApp.officialTournamentRetry.test.tsx
      - name: Verify app - GameApp practiceScheduling
        run: npx vitest run tests/unit/app/GameApp.practiceScheduling.test.tsx
      - name: Verify app - GameApp pvp
        run: npx vitest run tests/unit/app/GameApp.pvp.test.tsx
      - name: Verify app - GameApp scouting
        run: npx vitest run tests/unit/app/GameApp.scouting.test.tsx
      - name: Verify app - GameApp shop
        run: npx vitest run tests/unit/app/GameApp.shop.test.tsx
      - name: Verify app - GameApp shopResult
        run: npx vitest run tests/unit/app/GameApp.shopResult.test.tsx
      - name: Verify app - GameAppActions
        run: npx vitest run tests/unit/app/GameAppActions.test.tsx
      - name: Verify app - createBrowserAppDependencies
        run: npx vitest run tests/unit/app/createBrowserAppDependencies.test.ts
      - name: Verify app - teamLeadershipBrowserAuthority
        run: npx vitest run tests/unit/app/teamLeadershipBrowserAuthority.test.ts
      - name: Verify app - tournamentBrowserAuthority
        run: npx vitest run tests/unit/app/tournamentBrowserAuthority.test.ts
      - name: Verify app - useGameSession
        run: npx vitest run tests/unit/app/useGameSession.test.tsx
      - name: Verify ui - features auth
        run: npx vitest run tests/unit/features/auth
      - name: Verify ui - features dashboard
        run: npx vitest run tests/unit/features/dashboard
      - name: Verify ui - features events
        run: npx vitest run tests/unit/features/events
      - name: Verify ui - features match
        run: npx vitest run tests/unit/features/match
      - name: Verify ui - features more
        run: npx vitest run tests/unit/features/more
      - name: Verify ui - features pvp
        run: npx vitest run tests/unit/features/pvp
      - name: Verify ui - features school
        run: npx vitest run tests/unit/features/school
      - name: Verify ui - features settings
        run: npx vitest run tests/unit/features/settings
      - name: Verify ui - features shop
        run: npx vitest run tests/unit/features/shop
      - name: Verify ui - features team
        run: npx vitest run tests/unit/features/team
      - name: Verify ui - features tournament
        run: npx vitest run tests/unit/features/tournament
      - name: Verify ui - features training
        run: npx vitest run tests/unit/features/training
      - name: Verify ui - ui
        run: npx vitest run tests/unit/ui
      - name: Verify unit tests - worker
        run: npx vitest run tests/unit/worker
      - name: Verify production build
        run: npm run build
      - name: Remove temporary apply assets
        run: rm -f scripts/phase12-finish-apply.py scripts/phase12-week-progression-cleanup.py .github/workflows/phase12-finish-apply.yml
      - name: Commit final Phase 12 polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982982+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finish Phase 12 game loop polish"
          git push origin HEAD:feature/phase12-game-loop-polish
