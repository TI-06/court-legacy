name: Phase16 official client GREEN

on:
  push:
    branches: [feat/phase16-official-pvp-completion]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Accept official authoritative presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/GameApp.tsx')
          s = p.read_text()
          old = '    if (!presentation || presentation.kind !== "practice") return;'
          if old not in s:
              raise SystemExit('target guard not found')
          s = s.replace(old, '    if (!presentation) return;', 1)
          p.write_text(s)
          PY
      - run: npx prettier --write src/app/GameApp.tsx tests/unit/app/Phase16OfficialMatchCommand.test.tsx
      - run: npx vitest run tests/unit/app/Phase16OfficialMatchCommand.test.tsx tests/unit/app/Phase16GameAppMatchCommand.test.tsx
      - run: npm run typecheck
      - name: Cleanup and commit
        if: always()
        run: |
          git rm .github/workflows/phase16-official-client-green.yml
          git add src/app/GameApp.tsx tests/unit/app/Phase16OfficialMatchCommand.test.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: connect official match commands in GameApp"
          git push
