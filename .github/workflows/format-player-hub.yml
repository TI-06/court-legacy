name: Format player hub

on:
  push:
    branches:
      - feature/m6-game-ui-refresh
    paths:
      - .github/workflows/format-player-hub.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m6-game-ui-refresh
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/domain/selectors/playerPresentation.ts src/features/team/PlayerHubScreen.tsx src/features/team/player-hub.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/selectors/playerPresentation.ts src/features/team/PlayerHubScreen.tsx src/features/team/player-hub.css
          git commit -m "style: format player hub implementation"
          git push
