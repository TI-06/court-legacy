name: Phase51 Soak Format Check

on:
  push:
    branches:
      - test/phase51-special-project-soak
    paths:
      - ".github/workflows/phase51-soak-format-check.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier src/dev/soak/runBalanceSoak.ts --write
          git diff -- src/dev/soak/runBalanceSoak.ts
