name: Temporary UI Readability Safe Gate

on:
  push:
    branches: [tmp/ui-contrast-audit]

concurrency:
  group: ui-readability-safe-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  safe-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - id: verify
        name: Run full verify
        continue-on-error: true
        run: npm run verify
      - name: Install Chromium
        if: always()
        run: npx playwright install --with-deps chromium
      - id: e2e
        name: Run full mobile E2E
        if: always()
        continue-on-error: true
        run: npm run test:e2e
      - name: Record safe gate outcomes
        if: always()
        shell: bash
        run: |
          {
            echo "verify=${{ steps.verify.outcome }}"
            echo "e2e=${{ steps.e2e.outcome }}"
          } | tee ui-readability-safe-gate.txt
      - name: Upload safe gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-readability-safe-gate
          path: ui-readability-safe-gate.txt
          retention-days: 7
      - name: Upload Playwright diagnostics
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ui-readability-playwright
          path: |
            playwright-report
            test-results
          retention-days: 7
