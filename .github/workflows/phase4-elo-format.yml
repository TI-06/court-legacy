name: Phase4 Elo format

on:
  push:
    branches: ["feature/court-legacy-v2-phase4-async-pvp"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply Prettier
        run: |
          npx prettier src/domain/pvp/elo.ts --write
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/pvp/elo.ts
          git commit -m "style: format PvP Elo implementation"
          git push origin HEAD:feature/court-legacy-v2-phase4-async-pvp
