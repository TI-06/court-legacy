name: Temporary Task 4 Formatter

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - .github/workflows/format-task4-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format Task 4 files
        run: >-
          npx prettier
          tests/unit/worker/onboarding.test.ts
          worker/data/SupabaseGameStore.ts
          worker/routes/bootstrap.ts
          worker/routes/onboarding.ts
          --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/worker/onboarding.test.ts worker/data/SupabaseGameStore.ts worker/routes/bootstrap.ts worker/routes/onboarding.ts
          git commit -m "style: format cloud bootstrap implementation"
          git push
