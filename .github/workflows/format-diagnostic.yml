name: Format Diagnostic

on:
  push:
    branches:
      - fix/recover-stale-active-match
    paths:
      - ".github/workflows/format-diagnostic.yml"

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier worker/game/applyGameAction.ts tests/unit/worker/phase16PracticeMatchSession.test.ts --write
          git diff -- worker/game/applyGameAction.ts tests/unit/worker/phase16PracticeMatchSession.test.ts
