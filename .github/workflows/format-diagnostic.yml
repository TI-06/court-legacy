name: Format Diagnostic

on:
  push:
    branches: ["feature/court-legacy-v2-phase5-shop-mvp"]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Print formatted shop E2E
        run: npx prettier tests/e2e/shop-flow.spec.ts
