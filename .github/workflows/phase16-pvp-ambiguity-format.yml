name: Phase16 PvP ambiguity format

on:
  push:
    branches: [feat/phase16-official-pvp-completion]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier --write tests/unit/app/Phase16PvpMatchCommand.test.tsx
      - run: npx vitest run tests/unit/app/Phase16PvpMatchCommand.test.tsx
      - run: npm run typecheck
      - name: Commit and cleanup
        if: always()
        run: |
          git rm .github/workflows/phase16-pvp-ambiguity-format.yml
          git add tests/unit/app/Phase16PvpMatchCommand.test.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: format PvP ambiguity recovery coverage"
          git push
