name: Format Static Shop

on:
  push:
    branches:
      - feature/court-legacy-v2-phase5-shop-mvp

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format static shop harness
        run: |
          npx prettier src/app/StaticShopHarness.ts --write
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/StaticShopHarness.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: format static shop harness"
          git push
