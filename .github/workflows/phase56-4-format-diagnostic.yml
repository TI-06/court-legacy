name: Phase56-4 format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Show exact Prettier diff
        run: |
          npx prettier docs/superpowers/reports/2026-10-03-phase56-4-team-identity-balance-results.md src/dev/soak/runTeamIdentityMatrix.ts src/domain/match/simulateMatch.ts src/domain/team/teamIdentity.ts --write
          git diff -- docs/superpowers/reports/2026-10-03-phase56-4-team-identity-balance-results.md src/dev/soak/runTeamIdentityMatrix.ts src/domain/match/simulateMatch.ts src/domain/team/teamIdentity.ts
