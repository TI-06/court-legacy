name: Phase 3 Scouting Screen Format

on:
  pull_request:

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier src/features/scouting/ScoutingScreen.tsx --write
      - run: git diff -- src/features/scouting/ScoutingScreen.tsx
