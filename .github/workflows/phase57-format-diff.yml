name: Phase57 Format Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/domain/season/seasonStory.ts"
      - "src/features/home/HomeCommandCenter.tsx"
      - ".github/workflows/phase57-format-diff.yml"

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Show exact Prettier diff
        run: |
          npx prettier src/domain/season/seasonStory.ts src/features/home/HomeCommandCenter.tsx --write
          git diff -- src/domain/season/seasonStory.ts src/features/home/HomeCommandCenter.tsx
