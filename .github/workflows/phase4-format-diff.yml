name: Phase4 format diff

on:
  push:
    branches: ["feature/court-legacy-v2-phase4-async-pvp"]

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply Prettier
        run: |
          npx prettier docs/superpowers/plans/2026-08-28-phase4-async-pvp.md tests/unit/domain/pvp/season.test.ts --write
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-08-28-phase4-async-pvp.md tests/unit/domain/pvp/season.test.ts
          git commit -m "style: format Phase 4 plan and tests"
          git push origin HEAD:feature/court-legacy-v2-phase4-async-pvp
