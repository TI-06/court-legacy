name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture player hub diagnostics
        run: |
          mkdir -p diagnostics
          npm run lint > diagnostics/lint.txt 2>&1 || true
          npm run typecheck > diagnostics/typecheck.txt 2>&1 || true
          npm run test > diagnostics/full-tests.txt 2>&1 || true
          npm run build > diagnostics/build.txt 2>&1 || true
      - name: Upload player hub diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: player-hub-quality
          path: diagnostics
          retention-days: 1
      - name: Verify formatting, lint, types, tests, and build
        run: npm run verify

  mobile-e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile E2E tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
