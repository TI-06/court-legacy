name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Task 2 files
        run: >-
          npx prettier
          src/ui/player-art/generatedArtManifest.ts
          tests/unit/ui/player-art/generatedArtManifest.test.ts
          --write
      - name: Upload Task 2 formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-task-2
          path: |
            src/ui/player-art/generatedArtManifest.ts
            tests/unit/ui/player-art/generatedArtManifest.test.ts
          retention-days: 1
      - name: Verify formatting, lint, types, tests, and build
        run: npm run verify

  mobile-e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile E2E tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
