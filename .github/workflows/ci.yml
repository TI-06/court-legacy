name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate exact formatted files
        run: npx prettier src/domain/match/simulateMatch.ts tests/unit/domain/match/simulateMatch.test.ts --write
      - name: Upload formatted match files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-match-engine
          path: |
            src/domain/match/simulateMatch.ts
            tests/unit/domain/match/simulateMatch.test.ts
          retention-days: 3
      - name: Verify formatting, lint, types, tests, and build
        shell: bash
        run: |
          set +e
          npm run verify > verify-output.txt 2>&1
          status=$?
          tail -320 verify-output.txt
          exit $status
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-engine-verification
          path: verify-output.txt
          retention-days: 3
