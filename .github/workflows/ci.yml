name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-game-data-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-game-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install and lock Zod
        run: npm install zod@4.4.3 --save-exact --legacy-peer-deps
      - name: Format source
        run: npm run format
      - name: Commit dependency and formatting changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: lock Zod and format game data [skip ci]"
          git push origin HEAD:feature/m1-game-data
