name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm install --legacy-peer-deps --silent
      - name: Upload generated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
          retention-days: 3
      - name: Run quality verification
        id: verify
        shell: bash
        run: |
          set +e
          npm run verify > verify-output.txt 2>&1
          status=$?
          tail -160 verify-output.txt
          exit $status
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: verify-output.txt
          retention-days: 3
