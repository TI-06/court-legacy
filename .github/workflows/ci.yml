name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-world-branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-world-generation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Format world generation files
        run: >-
          npx prettier
          src/domain/generation/generatePlayer.ts
          src/domain/generation/generateSchool.ts
          tests/unit/domain/generation/generatePlayer.test.ts
          tests/unit/domain/generation/generateWorld.test.ts
          --write
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/generation tests/unit/domain/generation
          git commit -m "chore: format world generation [skip ci]"
          git push origin HEAD:feature/m1-world-generation
