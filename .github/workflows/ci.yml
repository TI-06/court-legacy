name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-domain-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/m1-domain-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-domain-foundation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run format
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format domain foundation [skip ci]"
          git push origin HEAD:feature/m1-domain-foundation
