name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-team-selection-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-team-selection-ui
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Format team selection UI
        run: npm run format
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format team selection UI [skip ci]"
          git push origin HEAD:feature/m1-team-selection-ui
