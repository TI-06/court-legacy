name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Audit production dependencies
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "npm audit attempt ${attempt}/3"
            if npm audit --omit=dev --audit-level=high \
              --fetch-retries=2 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=5000 \
              --fetch-timeout=15000; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Phase29-5 final formatting diagnostic
        run: |
          npx prettier src/features/match/PracticeMatchReviewPanel.tsx --write
          git diff -- src/features/match/PracticeMatchReviewPanel.tsx
      - name: Verify formatting, lint, types, tests, and build
        run: npm run verify
      - name: Verify release metadata and evidence
        run: npm run release:check
      - name: Run Phase18 soak smoke preset
        run: npm run soak:smoke

  mobile-e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile E2E tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
