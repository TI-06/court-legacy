name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Prepare formatted match engine
        shell: bash
        run: |
          npx prettier src/domain/match/simulateMatch.ts tests/unit/domain/match/simulateMatch.test.ts --write
          python - <<'PY'
          from pathlib import Path
          path = Path('src/domain/match/simulateMatch.ts')
          text = path.read_text()
          block = '''  const opponentServeErrors = points.filter(
            (event) => event.detailCode === "point.serve-error",
          ).length;
'''
          if block in text:
              text = text.replace(block, '', 1)
          path.write_text(text)
          PY
          npx prettier src/domain/match/simulateMatch.ts --write
      - name: Upload prepared match files
        uses: actions/upload-artifact@v4
        with:
          name: prepared-match-engine
          path: |
            src/domain/match/simulateMatch.ts
            tests/unit/domain/match/simulateMatch.test.ts
          retention-days: 3
      - name: Verify prepared match engine
        shell: bash
        run: |
          set +e
          npm run lint > verify-output.txt 2>&1
          status=$?
          if [ $status -eq 0 ]; then npm run typecheck >> verify-output.txt 2>&1; status=$?; fi
          if [ $status -eq 0 ]; then npx vitest run tests/unit/domain/match/simulateMatch.test.ts >> verify-output.txt 2>&1; status=$?; fi
          tail -360 verify-output.txt
          exit $status
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-match-verification
          path: verify-output.txt
          retention-days: 3
