name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --legacy-peer-deps --silent
      - name: Run unit tests
        id: unit-tests
        shell: bash
        run: |
          set +e
          npm run test -- --reporter=verbose > test-output.txt 2>&1
          status=$?
          tail -120 test-output.txt
          exit $status
      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: test-output.txt
          retention-days: 3
