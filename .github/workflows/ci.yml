name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Audit production dependencies
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "npm audit attempt ${attempt}/3"
            if npm audit --omit=dev --audit-level=high \
              --fetch-retries=2 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=5000 \
              --fetch-timeout=15000; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Format Phase35 files for recovery
        run: npx prettier --write src/domain/scouting/scoutingSearchResult.ts src/features/scouting/scouting.css src/features/scouting/ScoutingScreen.tsx tests/unit/domain/scouting/scoutingSearchBudget.test.ts tests/unit/domain/scouting/scoutingSearchResult.test.ts tests/unit/worker/academicYearRecruitment.test.ts tests/unit/worker/router.test.ts tests/unit/worker/scoutingBoard.test.ts tests/unit/worker/scoutingRecruitment.test.ts tests/unit/worker/scoutingRecruitmentCapacity.test.ts tests/unit/worker/shop/resolveShopUse.test.ts tests/unit/worker/shop/scoutCandidateItems.test.ts tests/unit/worker/shopSecurity.test.ts worker/data/SupabaseScoutingStore.ts worker/routes/scoutingBoard.ts worker/scouting/serverScoutingBoard.ts
      - name: Commit formatted Phase35 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/scouting/scoutingSearchResult.ts src/features/scouting/scouting.css src/features/scouting/ScoutingScreen.tsx tests/unit/domain/scouting/scoutingSearchBudget.test.ts tests/unit/domain/scouting/scoutingSearchResult.test.ts tests/unit/worker/academicYearRecruitment.test.ts tests/unit/worker/router.test.ts tests/unit/worker/scoutingBoard.test.ts tests/unit/worker/scoutingRecruitment.test.ts tests/unit/worker/scoutingRecruitmentCapacity.test.ts tests/unit/worker/shop/resolveShopUse.test.ts tests/unit/worker/shop/scoutCandidateItems.test.ts tests/unit/worker/shopSecurity.test.ts worker/data/SupabaseScoutingStore.ts worker/routes/scoutingBoard.ts worker/scouting/serverScoutingBoard.ts
          git commit -m "style: format phase35 scouting changes"
          git push origin HEAD:${{ github.head_ref }}
      - name: Package formatted Phase35 files
        run: zip -q phase35-formatted.zip src/domain/scouting/scoutingSearchResult.ts src/features/scouting/scouting.css src/features/scouting/ScoutingScreen.tsx tests/unit/domain/scouting/scoutingSearchBudget.test.ts tests/unit/domain/scouting/scoutingSearchResult.test.ts tests/unit/worker/academicYearRecruitment.test.ts tests/unit/worker/router.test.ts tests/unit/worker/scoutingBoard.test.ts tests/unit/worker/scoutingRecruitment.test.ts tests/unit/worker/scoutingRecruitmentCapacity.test.ts tests/unit/worker/shop/resolveShopUse.test.ts tests/unit/worker/shop/scoutCandidateItems.test.ts tests/unit/worker/shopSecurity.test.ts worker/data/SupabaseScoutingStore.ts worker/routes/scoutingBoard.ts worker/scouting/serverScoutingBoard.ts
      - name: Upload formatted Phase35 files
        uses: actions/upload-artifact@v4
        with:
          name: phase35-formatted
          path: phase35-formatted.zip
          retention-days: 1
      - name: Verify release metadata and evidence
        run: npm run release:check
      - name: Run Phase18 soak smoke preset
        run: npm run soak:smoke

  mobile-e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile E2E tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
