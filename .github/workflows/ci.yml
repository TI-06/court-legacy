name: CI

on:
  push:
    branches: ["feature/m1-team-selection"]

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Add locked libero safety regression and fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/unit/domain/team/autoSelectTeam.test.ts')
          test_text = test_path.read_text()
          test_marker = '  it("does not mutate the supplied selection", () => {'
          test_case = '''  it("benches an injured locked libero when injury exceptions are enabled", () => {
            const { state, school } = prepareRoleRoster();
            const base = autoSelectTeam({ state, schoolId: school.id });
            const lockedId = base.liberoPlayerId!;
            state.players[lockedId] = {
              ...state.players[lockedId]!,
              injury: {
                injuryId: "injury.knee",
                severity: "moderate",
                remainingWeeks: 4,
                recurrenceRisk: 25,
              },
            };

            const result = resolveLockedStarters({
              state,
              schoolId: school.id,
              selection: {
                ...base,
                substitutionPolicy: {
                  ...base.substitutionPolicy,
                  starterLockPlayerIds: [lockedId],
                  allowInjuryBenching: true,
                },
              },
            });

            expect(result.selection.liberoPlayerId).not.toBe(lockedId);
            expect(result.selection.benchPlayerIds).toContain(lockedId);
            expect(result.replacements).toContainEqual(
              expect.objectContaining({ playerId: lockedId, reason: "injury" }),
            );
          });

'''
          if 'benches an injured locked libero' not in test_text:
              if test_marker not in test_text:
                  raise SystemExit('test insertion marker not found')
              test_text = test_text.replace(test_marker, test_case + test_marker, 1)
              test_path.write_text(test_text)

          source_path = Path('src/domain/team/autoSelectTeam.ts')
          source_text = source_path.read_text()
          helper_marker = 'function eligibleReplacementCandidates(\n'
          helper = '''function swapLiberoPlayer(
            selection: TeamSelection,
            outgoingPlayerId: PlayerId,
            incomingPlayerId: PlayerId,
          ): void {
            if (selection.liberoPlayerId !== outgoingPlayerId) {
              throw new Error(`libero player not found: ${outgoingPlayerId}`);
            }

            selection.liberoPlayerId = incomingPlayerId;
            selection.benchPlayerIds = selection.benchPlayerIds
              .filter((playerId) => playerId !== incomingPlayerId)
              .concat(outgoingPlayerId);
          }

'''
          if 'function swapLiberoPlayer(' not in source_text:
              if helper_marker not in source_text:
                  raise SystemExit('helper insertion marker not found')
              source_text = source_text.replace(helper_marker, helper + helper_marker, 1)

          old_block = '''  for (const lockedId of lockedIds) {
            const assignment = selection.rotation.find(
              (item) => item.playerId === lockedId,
            );
            if (!assignment) {
              continue;
            }
            const player = input.state.players[lockedId];
            if (!player) {
              continue;
            }
            const reason = safetyReason(player, selection);
            if (!reason) {
              continue;
            }

            const candidates = eligibleReplacementCandidates(
              input.state,
              selection,
              lockedIds,
            );
            if (candidates.length === 0) {
              continue;
            }
            const replacement = stableBest(candidates, player.preferredPosition);
            swapRotationPlayer(selection, lockedId, replacement.id);
            replacements.push({
              playerId: lockedId,
              replacementPlayerId: replacement.id,
              reason,
            });
          }
'''
          new_block = '''  for (const lockedId of lockedIds) {
            const isRotationPlayer = selection.rotation.some(
              (item) => item.playerId === lockedId,
            );
            const isLibero = selection.liberoPlayerId === lockedId;
            if (!isRotationPlayer && !isLibero) {
              continue;
            }
            const player = input.state.players[lockedId];
            if (!player) {
              continue;
            }
            const reason = safetyReason(player, selection);
            if (!reason) {
              continue;
            }

            const candidates = eligibleReplacementCandidates(
              input.state,
              selection,
              lockedIds,
            );
            if (candidates.length === 0) {
              continue;
            }
            const replacement = stableBest(
              candidates,
              isLibero ? "L" : player.preferredPosition,
            );
            if (isLibero) {
              swapLiberoPlayer(selection, lockedId, replacement.id);
            } else {
              swapRotationPlayer(selection, lockedId, replacement.id);
            }
            replacements.push({
              playerId: lockedId,
              replacementPlayerId: replacement.id,
              reason,
            });
          }
'''
          if old_block not in source_text:
              raise SystemExit('locked starter replacement block not found')
          source_text = source_text.replace(old_block, new_block, 1)
          source_path.write_text(source_text)
          PY
          npm run format
          npx vitest run tests/unit/domain/team/autoSelectTeam.test.ts
      - name: Commit review fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/team/autoSelectTeam.ts tests/unit/domain/team/autoSelectTeam.test.ts
          git commit -m "fix: apply safety exceptions to locked libero [skip ci]"
          git push origin HEAD:feature/m1-team-selection
