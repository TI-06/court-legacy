name: CI

on:
  push:
    branches: ["feature/m1-team-selection"]

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Apply review fix
        run: python scripts/apply_team_selection_review_fix.py
      - name: Format and test
        run: |
          npm run format
          npx vitest run tests/unit/domain/team/autoSelectTeam.test.ts
      - name: Commit review fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/team/autoSelectTeam.ts tests/unit/domain/team/autoSelectTeam.test.ts
          git commit -m "fix: apply safety exceptions to locked libero [skip ci]"
          git push origin HEAD:feature/m1-team-selection
