name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Render Prettier diagnostics
        run: |
          mkdir -p .diagnostics
          npx prettier tests/unit/domain/selectors/playerPresentation.test.ts > .diagnostics/playerPresentation.test.ts
          npx prettier tests/unit/features/team/PlayerHubScreen.test.tsx > .diagnostics/PlayerHubScreen.test.tsx
      - name: Upload Prettier diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: player-hub-prettier
          path: .diagnostics
          retention-days: 1
      - name: Verify formatting, lint, types, tests, and build
        run: npm run verify

  mobile-e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile E2E tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
