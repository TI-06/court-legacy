name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/m0-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m0-foundation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --legacy-peer-deps --silent
      - run: npm run format
      - name: Commit formatting and lockfile
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format source and lock dependencies [skip ci]"
          git push origin HEAD:feature/m0-foundation
