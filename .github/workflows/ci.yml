name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Prepare exact formatted sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/domain/match/simulateMatch.ts')
          text = path.read_text()
          block = '''  const opponentServeErrors = points.filter(
            (event) => event.detailCode === "point.serve-error",
          ).length;
'''
          if block in text:
              text = text.replace(block, '', 1)
          path.write_text(text)
          PY
          npx prettier src/domain/match/simulateMatch.ts tests/unit/domain/match/simulateMatch.test.ts docs/superpowers/specs/2026-07-28-match-engine-design.md --write
      - name: Upload formatted match sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-match-engine
          path: |
            src/domain/match/simulateMatch.ts
            tests/unit/domain/match/simulateMatch.test.ts
            docs/superpowers/specs/2026-07-28-match-engine-design.md
          retention-days: 3
      - name: Verify formatting, lint, types, tests, and build
        shell: bash
        run: |
          set +e
          npm run verify > verify-output.txt 2>&1
          status=$?
          tail -320 verify-output.txt
          exit $status
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-engine-verification
          path: verify-output.txt
          retention-days: 3
