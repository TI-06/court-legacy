name: CI

on:
  push:
    branches: ["feature/m1-match-engine"]

permissions:
  contents: write

jobs:
  apply-match-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Format and remove unused analysis value
        shell: bash
        run: |
          npx prettier src/domain/match/simulateMatch.ts tests/unit/domain/match/simulateMatch.test.ts --write
          python - <<'PY'
          from pathlib import Path
          path = Path('src/domain/match/simulateMatch.ts')
          text = path.read_text()
          block = '''  const opponentServeErrors = points.filter(
            (event) => event.detailCode === "point.serve-error",
          ).length;
'''
          if block not in text:
              raise SystemExit('unused analysis block not found')
          path.write_text(text.replace(block, '', 1))
          PY
          npx prettier src/domain/match/simulateMatch.ts --write
          npm run lint
          npm run typecheck
          npx vitest run tests/unit/domain/match/simulateMatch.test.ts
      - name: Commit match engine fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/match/simulateMatch.ts tests/unit/domain/match/simulateMatch.test.ts
          git commit -m "fix: format and validate match engine [skip ci]"
          git push origin HEAD:feature/m1-match-engine
