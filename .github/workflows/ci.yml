name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate exact growth formatting
        run: npx prettier src/domain/training/calculateGrowth.ts --write
      - name: Upload formatted growth file
        uses: actions/upload-artifact@v4
        with:
          name: formatted-growth-file
          path: src/domain/training/calculateGrowth.ts
          retention-days: 3
      - name: Verify formatting, lint, types, tests, and build
        shell: bash
        run: |
          set +e
          npm run verify > verify-output.txt 2>&1
          status=$?
          tail -240 verify-output.txt
          exit $status
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-verification
          path: verify-output.txt
          retention-days: 3

  mobile-e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile E2E tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
