name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify formatting, lint, types, tests, and build
        run: npm run verify
      - name: Probe original Canva asset
        env:
          ORIGINAL_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:1055/quality:100/uri:ifs%3A%2F%2FM%2Ff53b1c60-a41a-4b5c-a2fb-a3eb5c9fd5aa/watermark:F/width:1491?csig=AAAAAAAAAAAAAAAAAAAAAEXsuE6tmdosk2ilT-EeQBCvkiUoEDvGLns63PpwMC2e&exp=1785848501&osig=AAAAAAAAAAAAAAAAAAAAALRKoBAABDOYsLaWG9S_EL3DdN1tewA1kFIHd29YNdlw&signer=media-rpc&x-canva-quality=thumbnail'
        run: |
          mkdir -p /tmp/canva-probe
          status=$(curl --location --silent --show-error --write-out '%{http_code}' --output /tmp/canva-probe/original.png "$ORIGINAL_URL" || true)
          echo "$status" > /tmp/canva-probe/status.txt
          file /tmp/canva-probe/original.png > /tmp/canva-probe/file.txt || true
          python - <<'PY' > /tmp/canva-probe/image.txt 2>&1 || true
          from PIL import Image
          image = Image.open('/tmp/canva-probe/original.png')
          print(image.size, image.mode)
          PY
      - name: Upload Canva original probe
        uses: actions/upload-artifact@v4
        with:
          name: canva-original-probe
          path: /tmp/canva-probe
          retention-days: 1
      - name: Upload character art review bundle
        uses: actions/upload-artifact@v4
        with:
          name: character-art-review
          path: |
            src/assets/characters/featured
            src/assets/player-parts/v1/all-parts-atlas.webp
          retention-days: 1

  mobile-e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile E2E tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
