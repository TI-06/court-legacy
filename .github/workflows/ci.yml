name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-unused-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-team-selection
      - name: Remove unused test import
        shell: bash
        run: |
          sed -i '/import type { PlayerId } from .*identifiers/d' tests/unit/domain/team/autoSelectTeam.test.ts
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/domain/team/autoSelectTeam.test.ts
          git commit -m "test: remove unused team selection import [skip ci]"
          git push origin HEAD:feature/m1-team-selection
