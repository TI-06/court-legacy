name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --legacy-peer-deps --silent
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test -- --reporter=verbose 2>&1 | tail -120
