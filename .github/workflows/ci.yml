name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  pull_request_target:
    types: [reopened]

permissions:
  contents: read

jobs:
  repair-match-engine:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.number == 9 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-match-engine
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install formatter
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Format and clean match engine
        shell: bash
        run: |
          npx prettier src/domain/match/simulateMatch.ts tests/unit/domain/match/simulateMatch.test.ts --write
          python - <<'PY'
          from pathlib import Path
          path = Path('src/domain/match/simulateMatch.ts')
          text = path.read_text()
          block = '''  const opponentServeErrors = points.filter(
            (event) => event.detailCode === "point.serve-error",
          ).length;
          '''
          if block not in text:
              raise SystemExit('expected unused block was not found')
          path.write_text(text.replace(block, '', 1))
          PY
          npx prettier src/domain/match/simulateMatch.ts --write
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/match/simulateMatch.ts tests/unit/domain/match/simulateMatch.test.ts
          git commit -m "fix: format and clean match engine"
          git push origin HEAD:feature/m1-match-engine

  quality:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify formatting, lint, types, tests, and build
        run: npm run verify

  mobile-e2e:
    if: github.event_name != 'pull_request_target'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile E2E tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
