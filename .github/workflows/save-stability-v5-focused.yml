name: Save Stability V5 Focused

on:
  push:
    branches:
      - fix/save-delta-batching-v5

permissions:
  contents: read

jobs:
  save-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Check formatting
        run: |
          npx prettier --write worker/data/statePatch.ts tests/unit/worker/data/statePatch.test.ts
          git diff -- worker/data/statePatch.ts tests/unit/worker/data/statePatch.test.ts
          exit 1
      - name: Run focused save tests
        run: >-
          npx vitest run
          tests/unit/worker/data/statePatch.test.ts
          tests/unit/worker/data/SupabaseGameStore.test.ts
          tests/unit/worker/data/saveDeltaBatchingV5Migration.test.ts
          tests/unit/diagnostics/saveDeltaBatchingV5Endurance.test.ts
          --reporter=verbose
      - name: Typecheck
        run: npm run typecheck
