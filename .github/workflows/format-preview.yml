name: Format Preview

on:
  push:
    branches:
      - fix/long-term-balance-gameplay-ux

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Show Prettier diff
        run: |
          npx prettier --write \
            docs/superpowers/plans/2026-09-07-long-term-balance-gameplay-ux.md \
            src/domain/weekly/practiceMatchPlanning.ts \
            src/domain/world/rivalWorldProgression.ts \
            src/features/scouting/ScoutingScreen.tsx \
            tests/unit/domain/weekly/practiceMatchPlanning.test.ts \
            tests/unit/features/scouting/ScoutingScreen.test.tsx
          git diff -- \
            docs/superpowers/plans/2026-09-07-long-term-balance-gameplay-ux.md \
            src/domain/weekly/practiceMatchPlanning.ts \
            src/domain/world/rivalWorldProgression.ts \
            src/features/scouting/ScoutingScreen.tsx \
            tests/unit/domain/weekly/practiceMatchPlanning.test.ts \
            tests/unit/features/scouting/ScoutingScreen.test.tsx
