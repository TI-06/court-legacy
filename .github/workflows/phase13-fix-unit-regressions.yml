name: Phase 13 Fix Unit Regressions

on:
  push:
    branches:
      - feat/phase13-home-command-center

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply focused regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          for root in [Path('src'), Path('tests')]:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx'}:
                      continue
                  text = path.read_text()
                  updated = text.replace('次の週へ進む', '今週を進める')
                  if updated != text:
                      path.write_text(updated)

          home_path = Path('src/features/home/HomeCommandCenter.tsx')
          home = home_path.read_text()
          old_open = '''        <div
          className="home-command-summary__metrics"
          data-testid="home-team-status"
          aria-label="チーム状況"
        >'''
          new_open = '''        <section
          className="home-command-summary__metrics"
          data-testid="home-team-status"
          aria-label="チーム状況"
        >'''
          if old_open not in home:
              raise SystemExit('missing home metrics opening anchor')
          home = home.replace(old_open, new_open, 1)
          old_close = '''        </div>
      </section>

      <section
        className="home-command-section"'''
          new_close = '''        </section>
      </section>

      <section
        className="home-command-section"'''
          if old_close not in home:
              raise SystemExit('missing home metrics closing anchor')
          home = home.replace(old_close, new_close, 1)
          home_path.write_text(home)

          for filename in [
              'tests/unit/app/GameApp.officialTournament.test.tsx',
              'tests/unit/app/GameApp.officialTournamentRetry.test.tsx',
          ]:
              path = Path(filename)
              text = path.read_text()
              old = 'fireEvent.click(screen.getByRole("button", { name: "今週を進める" }));'
              new = 'fireEvent.click(\n      screen.getByRole("button", { name: "公式戦 試合準備" }),\n    );'
              if old not in text:
                  raise SystemExit(f'missing official task anchor: {filename}')
              path.write_text(text.replace(old, new, 1))
          PY
          npx prettier src/features/home/HomeCommandCenter.tsx src/features/match/PracticeMatchPlanning.tsx src/features/tournament/TournamentScreen.tsx tests/unit/app/GameAppActions.test.tsx tests/unit/app/GameApp.officialTournament.test.tsx tests/unit/app/GameApp.officialTournamentRetry.test.tsx tests/unit/features/training/TrainingFlow.test.tsx tests/e2e/phase9-home-ui.spec.ts tests/e2e/home-match-flow.spec.ts tests/e2e/mobile-layout-audit.spec.ts --write
      - name: Commit regression fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix: align legacy Home flows with Phase 13"
          git push origin HEAD:feat/phase13-home-command-center
