name: Phase21 PR21-2 Task1 GREEN

on:
  push:
    branches:
      - feat/phase21-2-relationship-model-persistence

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Apply Task1 implementation
        id: apply
        continue-on-error: true
        run: |
          python3 .github/phase21-task1-apply.py
          python3 .github/phase21-task1-fix.py
          npx prettier --write src/domain/relationships src/domain/model/GameState.ts src/domain/model/Player.ts src/domain/model/Event.ts src/domain/generation/generatePlayer.ts src/domain/generation/generateWorld.ts
      - name: Run focused tests
        id: tests
        continue-on-error: true
        run: npx vitest run tests/unit/domain/relationships/relationshipPresentation.test.ts tests/unit/domain/relationships/specialRelationships.test.ts
      - name: Run typecheck
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Report result
        run: |
          echo "apply=${{ steps.apply.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          echo "types=${{ steps.types.outcome }}"
      - name: Commit verified implementation
        if: ${{ steps.apply.outcome == 'success' && steps.tests.outcome == 'success' && steps.types.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm .github/phase21-task1-apply.py .github/phase21-task1-fix.py .github/workflows/phase21-pr21-2-task1-green.yml
          git config user.name "TI-06"
          git config user.email "iretaku.shop@gmail.com"
          git add -A
          git commit -m "feat: add Phase21 relationship state model"
          git push origin HEAD:feat/phase21-2-relationship-model-persistence
