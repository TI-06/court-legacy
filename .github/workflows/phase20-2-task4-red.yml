name: Phase20-2 Task4 RED

on:
  push:
    branches:
      - "feature/phase20-2-player-concern-guidance"

permissions:
  contents: read

jobs:
  official-concern-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx vitest run tests/unit/domain/tournament/phase20ConcernResolutionNotification.test.ts
