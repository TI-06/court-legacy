name: Phase10 Apply Task3 Once

on:
  push:
    branches:
      - feature/phase10-training-player-mobile-ui
    paths:
      - .github/workflows/phase10-apply-task3-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase10-training-player-mobile-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply Task 3 implementation
        shell: python
        run: |
          from pathlib import Path

          path = Path("worker/game/applyGameAction.ts")
          text = path.read_text()

          import_anchor = 'import { matchId } from "../../src/domain/model/identifiers";\n'
          notification_import = "\n".join([
              'import { matchId } from "../../src/domain/model/identifiers";',
              'import {',
              '  appendNotification,',
              '  buildTrainingResultNotification,',
              '  markNotificationRead,',
              '} from "../../src/domain/notifications/gameNotifications";',
              '',
          ])
          assert text.count(import_anchor) == 1
          text = text.replace(import_anchor, notification_import, 1)

          function_start = text.index('function applyAdvanceWeek(')
          training_start = text.index(
              '  if (!isWeeklyActionCompleted(currentState, "training")) {',
              function_start,
          )
          training_end = text.index(
              '\n\n  if (hasRequiredOfficialMatch(currentState)) {',
              training_start,
          )
          new_training = "\n".join([
              '  if (!isWeeklyActionCompleted(currentState, "training")) {',
              '    const stateBeforeTraining = currentState;',
              '    const training = applyTraining(currentState, teamSelection, {',
              '      type: "training",',
              '      plan: currentState.weeklySchedule.trainingPlan,',
              '    });',
              '    const resolvedTrainingResult = training.outcome as Parameters<',
              '      typeof buildTrainingResultNotification',
              '    >[0]["result"];',
              '    const notification = buildTrainingResultNotification({',
              '      stateBeforeTraining,',
              '      result: resolvedTrainingResult,',
              '      data: gameData,',
              '    });',
              '    currentState = {',
              '      ...training.state,',
              '      notifications: appendNotification(',
              '        training.state.notifications,',
              '        notification,',
              '      ),',
              '    };',
              '    trainingResult = resolvedTrainingResult;',
              '  }',
          ])
          text = text[:training_start] + new_training + text[training_end:]

          facility_anchor = 'function applyFacilityUpgrade(\n'
          mark_read = "\n".join([
              'function applyMarkNotificationRead(',
              '  state: GameState,',
              '  teamSelection: TeamSelection,',
              '  action: Extract<GameAction, { type: "mark-notification-read" }>,',
              '): AppliedGameAction {',
              '  return {',
              '    state: {',
              '      ...state,',
              '      notifications: markNotificationRead(',
              '        state.notifications,',
              '        action.notificationId,',
              '        state.date,',
              '      ),',
              '    },',
              '    teamSelection,',
              '  };',
              '}',
              '',
          ])
          assert text.count(facility_anchor) == 1
          text = text.replace(facility_anchor, mark_read + facility_anchor, 1)

          switch_anchor = '    case "facility-upgrade":\n'
          switch_addition = "\n".join([
              '    case "mark-notification-read":',
              '      return applyMarkNotificationRead(state, teamSelection, action);',
              '',
          ])
          assert text.count(switch_anchor) == 1
          text = text.replace(switch_anchor, switch_addition + switch_anchor, 1)

          path.write_text(text)
      - name: Format Task 3 files
        run: npx prettier --write worker/game/applyGameAction.ts worker/game/actionSchema.ts tests/unit/worker/applyGameAction.test.ts tests/unit/worker/gameAction.test.ts tests/unit/worker/deferredTrainingPlan.test.ts tests/unit/worker/officialMatchAction.test.ts
      - name: Run focused Task 3 tests
        run: npm test -- tests/unit/worker/applyGameAction.test.ts tests/unit/worker/gameAction.test.ts tests/unit/worker/deferredTrainingPlan.test.ts tests/unit/worker/officialMatchAction.test.ts
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/game/applyGameAction.ts worker/game/actionSchema.ts tests/unit/worker/applyGameAction.test.ts tests/unit/worker/gameAction.test.ts tests/unit/worker/deferredTrainingPlan.test.ts tests/unit/worker/officialMatchAction.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: persist training notifications through game actions"
            git push origin HEAD:feature/phase10-training-player-mobile-ui
          fi
