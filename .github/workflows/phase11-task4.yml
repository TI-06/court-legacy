name: Phase11 Task4

on:
  push:
    branches:
      - feature/phase11-home-week-progression
    paths:
      - .github/workflows/phase11-task4.yml

permissions:
  contents: write

jobs:
  task4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase11-home-week-progression
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: python .github/phase11_task4.py
      - name: Commit Task4
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/home/TrainingResultNotificationSheet.tsx src/features/home/training-result-notification.css tests/unit/features/home/TrainingResultNotificationSheet.test.tsx
          git commit -m "feat: improve training result sheet contrast"
          git push origin HEAD:feature/phase11-home-week-progression
