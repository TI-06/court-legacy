name: Format feature branch

on:
  push:
    branches:
      - feature/m1-school-calendar-fixed-nav

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-school-calendar-fixed-nav
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier docs src tests --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src tests
          git commit -m "style: format school calendar feature"
          git push origin HEAD:feature/m1-school-calendar-fixed-nav
