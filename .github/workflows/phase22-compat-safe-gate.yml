name: Phase22-2 Compatibility Safe Gate

on:
  push:
    branches:
      - tmp/phase22-2-ci-compat-fix

permissions:
  contents: write

jobs:
  compat-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply compatibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          match_path = Path("src/features/match/MatchScreen.tsx")
          match_text = match_path.read_text(encoding="utf-8")
          old_label = '{result.analysis ? "ダイジェスト末尾へ" : "次の判断まで進む"}'
          new_label = '{result.analysis ? "結果まで進む" : "次の判断まで進む"}'
          if old_label not in match_text:
              raise SystemExit("legacy result button label target missing")
          match_path.write_text(match_text.replace(old_label, new_label, 1), encoding="utf-8")

          home_path = Path("tests/unit/features/home/HomeScreen.test.tsx")
          home_text = home_path.read_text(encoding="utf-8")
          old_test = '''  it("emits a team command from the training task", () => {
            const props = createProps();
            render(<HomeScreen {...props} />);

            fireEvent.click(screen.getByRole("button", { name: "練習 確認" }));
            expect(props.onCommand).toHaveBeenCalledWith({ target: "team" });
          });'''
          old_test = "\n".join(line[10:] if line.startswith("          ") else line for line in old_test.splitlines())
          new_test = '''  it("emits a team command when individual training is unconfigured", () => {
            const props = createProps();
            const school = props.state.schools[props.state.userSchoolId]!;
            const unconfiguredPlayerId = school.playerIds.at(-1)!;
            props.state.weeklySchedule.trainingPlan.individualAssignments =
              props.state.weeklySchedule.trainingPlan.individualAssignments.filter(
                (assignment) => assignment.playerId !== unconfiguredPlayerId,
              );
            render(<HomeScreen {...props} />);

            fireEvent.click(
              screen.getByRole("button", { name: "個人練習を設定" }),
            );
            expect(props.onCommand).toHaveBeenCalledWith({ target: "team" });
          });'''
          new_test = "\n".join(line[10:] if line.startswith("          ") else line for line in new_test.splitlines())
          if old_test not in home_text:
              raise SystemExit("legacy Home training test target missing")
          home_path.write_text(home_text.replace(old_test, new_test, 1), encoding="utf-8")
          PY
      - name: Format and verify focused regressions
        shell: bash
        run: |
          npx prettier --write src/features/match/MatchScreen.tsx tests/unit/features/home/HomeScreen.test.tsx
          npm test -- \
            tests/unit/features/home/HomeScreen.test.tsx \
            tests/unit/features/home/Phase22HomeTraining.test.tsx \
            tests/unit/features/match/MatchFlow.test.tsx \
            tests/unit/features/phase13GameLoopPolish.test.tsx \
            tests/unit/features/match/Phase16MatchScreenCommandSummary.test.tsx \
            tests/unit/features/match/Phase22MatchSkip.test.tsx \
            tests/unit/worker/phase22MatchSkip.test.ts
          npm run typecheck
          npx prettier --check src/features/match/MatchScreen.tsx tests/unit/features/home/HomeScreen.test.tsx
          npx eslint src/features/match/MatchScreen.tsx tests/unit/features/home/HomeScreen.test.tsx
      - name: Commit verified fixes
        shell: bash
        run: |
          git add src/features/match/MatchScreen.tsx tests/unit/features/home/HomeScreen.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve Phase22 match and home compatibility"
          git push origin HEAD:tmp/phase22-2-ci-compat-fix
