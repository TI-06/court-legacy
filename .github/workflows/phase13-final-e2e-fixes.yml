name: Phase 13 Final E2E Fixes

on:
  push:
    branches:
      - feat/phase13-home-command-center

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: node scripts/phase13-final-e2e-fixes.mjs
      - run: npx prettier src/features/home/homeCommandCenter.ts src/features/home/HomeCommandCenter.tsx src/features/home/home-command-center.css tests/e2e/*.spec.ts tests/e2e/homeTestHelpers.ts --write
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home tests/e2e
          git diff --cached --check
          git commit -m "fix: complete Phase 13 mobile E2E migration"
          git push origin HEAD:feat/phase13-home-command-center
