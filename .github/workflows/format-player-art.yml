name: Format Player Art Changes

on:
  push:
    branches:
      - fix/player-art-rendering

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-art-rendering
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply Prettier
        run: npx prettier --write src/ui/player-art/generatedArtManifest.ts tests/e2e/general-player-art.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/player-art/generatedArtManifest.ts tests/e2e/general-player-art.spec.ts
          if git diff --cached --quiet; then
            echo "Formatting is already current"
          else
            git commit -m "style: format generated player art changes"
            git push origin HEAD:fix/player-art-rendering
          fi
