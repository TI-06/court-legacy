name: Phase14 Player Hub temporary formatter

on:
  push:
    branches:
      - feat/phase14-player-hub-ui

permissions:
  contents: write

# Temporary implementation runner. This workflow is removed before merge.
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase14-player-hub-ui
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Connect Player Hub planning to authoritative GameApp action
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/GameApp.tsx")
          text = path.read_text(encoding="utf-8")

          callback_anchor = '''  const acceptPracticeOffer = async () => {
          '''
          callback = '''  const saveDevelopmentPriorities = async (playerIds: PlayerId[]) => {
            await cloudSession.runAction(
              { type: "set-development-priorities", playerIds },
              "重点育成を保存しています…",
            );
          };

          '''
          if "const saveDevelopmentPriorities" not in text:
              if callback_anchor not in text:
                  raise SystemExit("GameApp callback anchor not found")
              text = text.replace(callback_anchor, callback + callback_anchor, 1)

          props_old = '''        onChangeTraining={changePlayerTraining}
                  trainingPending={cloudSession.operation.status === "submitting"}'''
          props_new = '''        onChangeTraining={changePlayerTraining}
                  onSetDevelopmentPriorities={saveDevelopmentPriorities}
                  planningPending={cloudSession.operation.status === "submitting"}
                  trainingPending={cloudSession.operation.status === "submitting"}'''
          if "onSetDevelopmentPriorities={saveDevelopmentPriorities}" not in text:
              if props_old not in text:
                  raise SystemExit("PlayerHubScreen props anchor not found")
              text = text.replace(props_old, props_new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - run: npx prettier . --write
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: persist Player Hub development priorities"
          git push origin HEAD:feat/phase14-player-hub-ui
