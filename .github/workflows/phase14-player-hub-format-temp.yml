name: Phase14 Player Hub temporary formatter

on:
  push:
    branches:
      - feat/phase14-player-hub-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase14-player-hub-ui
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply Task2 test typing fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/features/team/PlayerHubScreen.test.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''interface RenderOptions {
            onSetDevelopmentPriorities?: ReturnType<typeof vi.fn>;
            planningPending?: boolean;
          }'''.replace("          ", "")
          new = '''interface RenderOptions {
            onSetDevelopmentPriorities?: (playerIds: string[]) => void;
            planningPending?: boolean;
          }'''.replace("          ", "")
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - run: npx prettier . --write
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: type Player Hub priority callback mock"
          git push origin HEAD:feat/phase14-player-hub-ui
