name: Debug Prettier Scouting

on:
  push:
    branches:
      - fix/scouting-actions-practice-schedule
    paths:
      - .github/workflows/debug-prettier-scouting.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scouting-actions-practice-schedule
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply Prettier
        run: npx prettier src/features/scouting/ScoutingScreen.tsx --write
      - name: Commit exact formatting
        run: |
          if git diff --quiet -- src/features/scouting/ScoutingScreen.tsx; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/scouting/ScoutingScreen.tsx
          git commit -m "style: apply exact prettier output"
          git push origin HEAD:fix/scouting-actions-practice-schedule
