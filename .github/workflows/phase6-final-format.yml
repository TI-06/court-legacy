name: Phase 6 Final Format

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  final-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier README.md --write
      - run: npm run verify
      - name: Commit formatted README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format phase 6 documentation"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
