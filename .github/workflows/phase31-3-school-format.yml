name: Phase31-3 School Format Diagnostic

on:
  push:
    branches:
      - diag/phase31-3-school-format

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Show exact Prettier diff
        shell: bash
        run: |
          npx prettier src/features/school/SchoolScreen.tsx src/features/school/school-screen.css --write
          git diff -- src/features/school/SchoolScreen.tsx src/features/school/school-screen.css
