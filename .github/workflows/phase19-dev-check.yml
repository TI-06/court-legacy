name: Phase19 Safe Dev Check

on:
  push:
    branches:
      - feature/phase19-player-growth-balance

permissions:
  contents: read

concurrency:
  group: phase19-safe-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify Phase19 candidate without notification-red
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/phase19-typecheck.log 2>&1
          typecheck_status=$?
          npx vitest run tests/unit/domain/player/playerDevelopmentBalance.test.ts tests/unit/domain/training/longTermAbilityGrowth.test.ts tests/unit/domain/training/calculateGrowth.test.ts tests/unit/domain/training/resolveWeeklyTraining.test.ts tests/unit/worker/phase19MatchExperience.test.ts tests/unit/worker/applyGameAction.test.ts > /tmp/phase19-focused.log 2>&1
          focused_status=$?
          npm run verify > /tmp/phase19-verify.log 2>&1
          verify_status=$?
          npm run release:check > /tmp/phase19-release.log 2>&1
          release_status=$?
          npm run soak:balance > /tmp/phase19-soak.log 2>&1
          soak_status=$?

          cat /tmp/phase19-typecheck.log
          cat /tmp/phase19-focused.log
          cat /tmp/phase19-verify.log
          cat /tmp/phase19-release.log
          cat /tmp/phase19-soak.log
          echo "PHASE19_TYPECHECK_STATUS=${typecheck_status}"
          echo "PHASE19_FOCUSED_STATUS=${focused_status}"
          echo "PHASE19_VERIFY_STATUS=${verify_status}"
          echo "PHASE19_RELEASE_STATUS=${release_status}"
          echo "PHASE19_SOAK_BALANCE_STATUS=${soak_status}"
          exit 0
