name: Phase19 Safe Dev Check

on:
  push:
    branches:
      - feature/phase19-player-growth-balance

permissions:
  contents: read

concurrency:
  group: phase19-safe-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  long-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run Phase19 long soak without notification-red
        shell: bash
        run: |
          set +e
          rm -rf /tmp/phase19-long
          node scripts/runBalanceSoak.mjs --preset long --output /tmp/phase19-long > /tmp/phase19-long.log 2>&1
          soak_status=$?
          cat /tmp/phase19-long.log
          if [ -d /tmp/phase19-long ]; then
            for file in /tmp/phase19-long/*.json; do
              [ -f "$file" ] || continue
              node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const y=r.yearly.at(-1); console.log(JSON.stringify({seed:r.metadata.seed,seasons:r.metadata.completedSeasons,final:{userStrength:y.userStrength,cpu:y.cpuStrength,ability:y.playerAbility,national:y.nationalParticipantStrength,growth:y.yearlyGrowthTotal,growthByGrowthType:y.growthByGrowthType,growthTypeCounts:y.growthTypeCounts,playerTierCounts:y.playerTierCounts}},null,2));' "$file"
            done
          fi
          echo "PHASE19_SOAK_LONG_STATUS=${soak_status}"
          exit 0
