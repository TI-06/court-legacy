name: Format year transition test

on:
  push:
    branches: [feature/m3-annual-progression]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-annual-progression
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier tests/unit/features/home/YearTransitionDialog.test.tsx --write
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/features/home/YearTransitionDialog.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format year transition test"
            git push origin HEAD:feature/m3-annual-progression
          fi
