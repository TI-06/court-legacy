name: Apply match stat integrity fix

on:
  push:
    branches:
      - fix/match-result-stat-integrity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/match-result-stat-integrity
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply implementation
        run: python scripts/_apply_match_stat_integrity_fix.py
      - name: Format touched files
        run: npx prettier src/features/match/matchPresentation.ts src/features/match/MatchStatPanels.tsx src/features/match/MatchScreen.tsx tests/unit/features/match/matchPresentation.test.ts tests/unit/features/match/MatchFlow.test.tsx --write
      - name: Verify focused regressions
        run: npx vitest run tests/unit/features/match/matchPresentation.test.ts tests/unit/features/match/MatchFlow.test.tsx
      - name: Verify full project
        run: npm run verify
      - name: Remove temporary tooling
        run: git rm .github/workflows/red-match-stat-integrity.yml .github/workflows/apply-match-stat-integrity-fix.yml scripts/_apply_match_stat_integrity_fix.py
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/match/matchPresentation.ts src/features/match/MatchStatPanels.tsx src/features/match/MatchScreen.tsx tests/unit/features/match/matchPresentation.test.ts tests/unit/features/match/MatchFlow.test.tsx
          git commit -m "fix: reconcile volleyball match result stats"
          git push origin HEAD:fix/match-result-stat-integrity
