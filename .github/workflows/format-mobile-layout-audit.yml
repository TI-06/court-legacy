name: Format mobile layout audit

on:
  push:
    branches:
      - feature/m6-game-ui-refresh
    paths:
      - .github/workflows/format-mobile-layout-audit.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m6-game-ui-refresh
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/mobile-layout-audit.spec.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/mobile-layout-audit.spec.ts
          git commit -m "style: format mobile layout audit"
          git push
