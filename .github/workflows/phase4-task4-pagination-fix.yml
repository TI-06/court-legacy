name: Phase4 Task4 pagination fix

on:
  push:
    branches:
      - feature/court-legacy-v2-phase4-async-pvp

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Patch stable history cursor
        run: python -c "from pathlib import Path; import base64; p=Path('supabase/migrations/202608280004_async_pvp.sql'); t=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in t or new in t; p.write_text(t.replace(old,new,1))"
      - name: Format changed TypeScript
        run: npx prettier tests/unit/worker/pvpMigration.test.ts tests/unit/worker/pvpQueries.test.ts worker/routes/pvpHistory.ts worker/routes/pvpRanking.ts --write
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608280004_async_pvp.sql tests/unit/worker/pvpMigration.test.ts tests/unit/worker/pvpQueries.test.ts worker/routes/pvpHistory.ts worker/routes/pvpRanking.ts
          git commit -m "fix: stabilize PvP query pagination"
          git push origin HEAD:feature/court-legacy-v2-phase4-async-pvp
