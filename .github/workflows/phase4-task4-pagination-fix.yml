name: Phase4 Task4 pagination fix

on:
  push:
    branches: ["feature/court-legacy-v2-phase4-async-pvp"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Patch stable history cursor and format files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("supabase/migrations/202608280004_async_pvp.sql")
          text = path.read_text()
          old = """  where matches.season_id = p_season_id
            and (matches.challenger_user_id = p_user_id or matches.defender_user_id = p_user_id)
            and (p_cursor is null or matches.id::text < p_cursor)
          order by matches.created_at desc, matches.id desc
"""
          new = """  where matches.season_id = p_season_id
            and (matches.challenger_user_id = p_user_id or matches.defender_user_id = p_user_id)
            and (
              p_cursor is null
              or (matches.created_at, matches.id::text) < (
                split_part(p_cursor, '|', 1)::timestamptz,
                split_part(p_cursor, '|', 2)
              )
            )
          order by matches.created_at desc, matches.id desc
"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("expected list_pvp_history cursor clause not found")
          PY
          npx prettier tests/unit/worker/pvpMigration.test.ts tests/unit/worker/pvpQueries.test.ts worker/routes/pvpHistory.ts worker/routes/pvpRanking.ts --write
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608280004_async_pvp.sql tests/unit/worker/pvpMigration.test.ts tests/unit/worker/pvpQueries.test.ts worker/routes/pvpHistory.ts worker/routes/pvpRanking.ts
          git commit -m "fix: stabilize PvP query pagination"
          git push origin HEAD:feature/court-legacy-v2-phase4-async-pvp
