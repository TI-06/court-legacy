name: Phase30 Live Feedback Format Diagnostic

on:
  push:
    branches:
      - diag/phase30-live-feedback-format

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Show exact Prettier diff
        shell: bash
        run: |
          npx prettier src/features/match/match.css src/features/match/matchCommandPresentation.ts tests/unit/features/match/matchCommandPresentation.test.ts --write
          git diff -- src/features/match/match.css src/features/match/matchCommandPresentation.ts tests/unit/features/match/matchCommandPresentation.test.ts
