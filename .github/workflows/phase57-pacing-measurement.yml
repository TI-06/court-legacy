name: Phase57 Pacing Measurement

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase57-pacing-measurement.yml"
      - "src/dev/soak/runBalanceSoak.ts"
      - "tests/soak/phase18BalanceSoak.test.ts"

permissions:
  contents: read

jobs:
  pacing-10-season:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Run 10-season pacing soak
        run: node scripts/runBalanceSoak.mjs --preset balance --seed phase57-pacing-10

  pacing-30-season:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Run 30-season pacing soak
        run: node scripts/runBalanceSoak.mjs --preset long --seed phase57-pacing-30
