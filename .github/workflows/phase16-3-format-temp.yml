name: Phase16-3 temporary formatter

on:
  push:
    branches:
      - feat/phase16-official-pvp-completion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format Phase16-3 files
        run: |
          npx prettier --write docs/superpowers/plans/2026-09-10-phase16-official-pvp-completion.md tests/unit/worker/phase16OfficialMatchSession.test.ts
      - name: Commit formatting and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-10-phase16-official-pvp-completion.md tests/unit/worker/phase16OfficialMatchSession.test.ts
          git rm .github/workflows/phase16-3-format-temp.yml
          git commit -m "style: format Phase16-3 plan and RED test"
          git push origin HEAD:feat/phase16-official-pvp-completion
