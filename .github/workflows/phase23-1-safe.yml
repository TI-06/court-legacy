name: Phase23-1 National Representatives Safe Gate

on:
  push:
    branches:
      - tmp/phase23-1-national-representatives

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Format Phase23 files
        run: >-
          npx prettier --write
          src/domain/world/nationalRepresentativeSchools.ts
          src/domain/season/schoolRankings.ts
          src/domain/tournament/createNationalStage.ts
          tests/unit/domain/season/schoolRankings.test.ts
          tests/unit/domain/tournament/nationalStage.test.ts
      - name: Run focused Phase23 tests
        id: focused
        continue-on-error: true
        run: >-
          npm test -- --run
          tests/unit/domain/season/schoolRankings.test.ts
          tests/unit/domain/tournament/nationalStage.test.ts
          tests/unit/features/season/seasonProgressPresentation.test.ts
      - name: Run full verify
        id: verify
        if: steps.focused.outcome == 'success'
        continue-on-error: true
        run: npm run verify
      - name: Report safe gate
        if: always()
        run: |
          echo "focused=${{ steps.focused.outcome }}"
          echo "verify=${{ steps.verify.outcome }}"
      - name: Commit verified Phase23 changes
        if: steps.focused.outcome == 'success' && steps.verify.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase23-1-safe.yml
          git add src/domain/world/nationalRepresentativeSchools.ts
          git add src/domain/season/schoolRankings.ts
          git add src/domain/tournament/createNationalStage.ts
          git add tests/unit/domain/season/schoolRankings.test.ts
          git add tests/unit/domain/tournament/nationalStage.test.ts
          git add .github/workflows/phase23-1-safe.yml
          git commit -m "feat: add national representative school world"
          git push
