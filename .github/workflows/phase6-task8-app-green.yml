name: Phase 6 Task 8 App Green

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  app-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Wire official tournament into GameApp
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/GameApp.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              if old not in text:
                  raise SystemExit(f'patch target not found:\n{old}')
              text = text.replace(old, new, 1)

          replace_once(
              'import type { TeamSelection } from "../domain/model/TeamSelection";\n',
              'import type { TeamSelection } from "../domain/model/TeamSelection";\nimport { selectNextOfficialEvent } from "../domain/tournament/tournamentSelectors";\nimport type {\n  TournamentCircuit,\n  TournamentLevel,\n} from "../domain/tournament/tournamentTypes";\n',
          )
          replace_once(
              'import { TrainingScoutingEntry } from "../features/training/TrainingScoutingEntry";\n',
              'import { TrainingScoutingEntry } from "../features/training/TrainingScoutingEntry";\nimport { TournamentScreen } from "../features/tournament/TournamentScreen";\n',
          )
          replace_once(
              'type MatchView = "practice" | "pvp";\n',
              'type MatchView = "practice" | "pvp";\ntype OfficialTournamentView = {\n  circuit: TournamentCircuit;\n  level: TournamentLevel;\n};\n',
          )
          replace_once(
              '  const [matchView, setMatchView] = useState<MatchView>("practice");\n',
              '  const [matchView, setMatchView] = useState<MatchView>("practice");\n  const [officialTournamentView, setOfficialTournamentView] =\n    useState<OfficialTournamentView | null>(null);\n',
          )
          replace_once(
              '    if (tab !== "match") {\n      setMatchView("practice");\n      setPvpError(null);\n    }\n',
              '    if (tab !== "match") {\n      setMatchView("practice");\n      setOfficialTournamentView(null);\n      setPvpError(null);\n    }\n',
          )
          replace_once(
              '  const openFreshPracticeMatch = () => {\n    if (!practiceMatchCompleted) {\n      setActiveMatchResult(null);\n      setMatchView("practice");\n      setActiveTab("match");\n    }\n  };\n\n  const startPracticeMatch = async () => {\n',
              '  const openFreshPracticeMatch = () => {\n    if (!practiceMatchCompleted) {\n      setActiveMatchResult(null);\n      setOfficialTournamentView(null);\n      setMatchView("practice");\n      setActiveTab("match");\n    }\n  };\n\n  const openOfficialTournament = () => {\n    const nextOfficial = selectNextOfficialEvent(gameState);\n    if (!nextOfficial) return;\n    setActiveMatchResult(null);\n    setOfficialTournamentView({\n      circuit: nextOfficial.circuit,\n      level: nextOfficial.level,\n    });\n    setMatchView("practice");\n    setActiveTab("match");\n  };\n\n  const startOfficialMatch = async () => {\n    await cloudSession.runAction(\n      { type: "official-match" },\n      "大会結果を保存しています…",\n    );\n  };\n\n  const startPracticeMatch = async () => {\n',
          )
          replace_once(
              '  const openPvp = () => {\n    setMatchView("pvp");\n',
              '  const openPvp = () => {\n    setOfficialTournamentView(null);\n    setMatchView("pvp");\n',
          )
          replace_once(
              '        onOpenMatch={openFreshPracticeMatch}\n        onOpenTeam={() => setActiveTab("team")}\n',
              '        onOpenMatch={openFreshPracticeMatch}\n        onOpenOfficialTournament={openOfficialTournament}\n        onOpenTeam={() => setActiveTab("team")}\n',
          )
          replace_once(
              '    ) : activeTab === "match" && matchView === "pvp" ? (\n',
              '    ) : activeTab === "match" && officialTournamentView ? (\n      <TournamentScreen\n        circuit={officialTournamentView.circuit}\n        level={officialTournamentView.level}\n        onBack={() => {\n          setOfficialTournamentView(null);\n          setMatchView("practice");\n        }}\n        onStartOfficialMatch={() => {\n          void startOfficialMatch();\n        }}\n        pending={cloudSession.operation.status === "submitting"}\n        state={gameState}\n        trainingCompleted={trainingCompleted}\n      />\n    ) : activeTab === "match" && matchView === "pvp" ? (\n',
          )

          path.write_text(text)
          PY
      - run: npx prettier src/app/GameApp.tsx --write
      - name: Verify app integration
        run: |
          npm test -- tests/unit/app/GameApp.officialTournament.test.tsx tests/unit/features/home/HomeScreen.test.tsx tests/unit/features/tournament/TournamentScreen.test.tsx
          npm run typecheck
      - name: Commit app integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/GameApp.tsx
          git commit -m "feat: connect official tournament UI"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
