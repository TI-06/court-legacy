name: Phase15 Prettier preview

on:
  push:
    branches:
      - feat/phase15-tactics-foundation

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Print formatted test
        run: |
          npx prettier tests/unit/worker/phase15MatchTacticsOverride.test.ts --write
          cat tests/unit/worker/phase15MatchTacticsOverride.test.ts
