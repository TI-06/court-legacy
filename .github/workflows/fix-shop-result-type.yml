name: Fix shop result type

on:
  push:
    branches:
      - feature/court-legacy-v2-phase5-shop-mvp
    paths:
      - .github/workflows/fix-shop-result-type.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase5-shop-mvp
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Fix exported ability type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/shop/ShopScreen.tsx')
          text = path.read_text()
          text = text.replace(
              'import type { AbilityKey } from "../../domain/model/Player";',
              'import type { PlayerAbilities } from "../../domain/model/Player";',
          )
          text = text.replace(
              'type ShopView = "products" | "inventory";',
              'type AbilityKey = keyof PlayerAbilities;\n\ntype ShopView = "products" | "inventory";',
          )
          path.write_text(text)
          PY
      - run: npx prettier --write src/features/shop/ShopScreen.tsx
      - run: npm run typecheck
      - run: npm run test -- tests/unit/features/shop/ShopUseResultUx.test.tsx tests/unit/app/GameApp.shopResult.test.tsx
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/shop/ShopScreen.tsx
          git commit -m "fix: use exported player ability type"
          git push origin HEAD:feature/court-legacy-v2-phase5-shop-mvp
