name: V2 Temporary Formatter

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - src/app/createBrowserAppDependencies.ts
      - tests/e2e/mobile-layout-audit.spec.ts
      - tests/e2e/v2-auth-game-flow.spec.ts
      - .github/workflows/v2-format-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format V2 files
        run: npx prettier --write src/app/createBrowserAppDependencies.ts tests/e2e/mobile-layout-audit.spec.ts tests/e2e/v2-auth-game-flow.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/createBrowserAppDependencies.ts tests/e2e/mobile-layout-audit.spec.ts tests/e2e/v2-auth-game-flow.spec.ts
          git commit -m "style: format V2 E2E changes"
          git push origin HEAD:feature/court-legacy-v2-phase1
