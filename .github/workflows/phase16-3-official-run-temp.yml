name: Phase16-3 official patch runner

on:
  push:
    branches:
      - feat/phase16-official-pvp-completion

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: python scripts/phase16-official-patch.py
      - run: npx prettier --write worker/game/applyGameAction.ts
      - run: npx vitest run tests/unit/worker/phase16OfficialMatchSession.test.ts
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/game/applyGameAction.ts
          git rm scripts/phase16-official-patch.py .github/workflows/phase16-3-official-run-temp.yml
          git commit -m "feat: make official matches resumable"
          git push origin HEAD:feat/phase16-official-pvp-completion
