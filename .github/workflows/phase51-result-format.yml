name: Phase51 Result Format Diagnostic

on:
  push:
    branches:
      - fix/phase51-joint-training-result
    paths:
      - ".github/workflows/phase51-result-format.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show formatted diff
        run: |
          npx prettier tests/unit/features/home/SpecialProjectActivityResultDialog.test.tsx --write
          git diff -- tests/unit/features/home/SpecialProjectActivityResultDialog.test.tsx
