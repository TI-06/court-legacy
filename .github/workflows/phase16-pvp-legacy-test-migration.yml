name: Phase16 PvP legacy test migration

on:
  push:
    branches: [feat/phase16-official-pvp-completion]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Rewrite legacy PvP challenge expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/unit/worker/pvpChallenge.test.ts')
          s = p.read_text()
          s = s.replace('''    createMatchSession: vi.fn(async () => {\n      throw new Error("not used");\n    }),''', '''    createMatchSession: vi.fn(async (input) => ({\n      challengerUserId: input.challengerUserId,\n      operationId: input.operationId,\n      defenderSnapshotId: input.defenderSnapshotId,\n      challengerSourceRevision: input.challengerSourceRevision,\n      currentCursor: input.currentCursor,\n      privateSession: input.privateSession,\n      publicResponse: input.publicResponse,\n      finalResponse: null,\n      createdAt: "2026-08-28T07:30:00.000Z",\n      updatedAt: "2026-08-28T07:30:00.000Z",\n    })),''')
          start = s.index('  it("simulates from authoritative state and commits only a sanitized server result"')
          end = s.index('\n  it("replays a stored challenge response', start)
          replacement = '''  it("starts from authoritative state, persists a private session, and returns only a sanitized public segment", async () => {\n    const snapshot = createCloudSnapshot();\n    const store = pvpStore();\n    const handler = createPvpChallengeHandler({\n      gameStore: gameStore(snapshot),\n      pvpStore: store,\n      now: () => new Date("2026-08-28T07:30:00.000Z"),\n      createMatchNonce: () => "fixed-start-nonce",\n    });\n\n    const response = await handler(request(challengeBody()), {\n      id: CHALLENGER_USER_ID,\n    });\n    const body = await response.json();\n\n    expect(response.status).toBe(200);\n    expect(store.commitRatedMatch).not.toHaveBeenCalled();\n    expect(store.createMatchSession).toHaveBeenCalledTimes(1);\n    expect(store.createMatchSession).toHaveBeenCalledWith(\n      expect.objectContaining({\n        challengerUserId: CHALLENGER_USER_ID,\n        operationId: "challenge-001",\n        defenderSnapshotId: DEFENDER_SNAPSHOT_ID,\n        challengerSourceRevision: 12,\n        currentCursor: expect.any(Number),\n        privateSession: expect.any(Object),\n        publicResponse: expect.any(Object),\n      }),\n    );\n    expect(body).toMatchObject({\n      status: "in-progress",\n      operationId: "challenge-001",\n      revision: 12,\n      seasonId: "2026-08",\n      opponent: {\n        snapshotId: DEFENDER_SNAPSHOT_ID,\n        schoolName: "白波高校",\n        schoolShortName: "白波",\n      },\n      segment: { status: "in-progress", operationId: "challenge-001" },\n    });\n    const serialized = JSON.stringify(body);\n    for (const forbidden of [\n      "abilities",\n      "potential",\n      "tier",\n      "hiddenTraitIds",\n      "homeSelection",\n      "awaySelection",\n      "actorPlayerId",\n      "simulationState",\n      "runtime",\n    ]) {\n      expect(serialized).not.toContain(forbidden);\n    }\n  });\n'''
          s = s[:start] + replacement + s[end:]
          start = s.index('  it("returns the DB-enforced daily opponent limit without a separate rating write"')
          end = s.index('\n  it("uses the canonical atomic-store result', start)
          replacement = '''  it("defers rating and daily-opponent-limit enforcement until the final command", async () => {\n    const snapshot = createCloudSnapshot();\n    const store = pvpStore();\n    vi.mocked(store.commitRatedMatch).mockRejectedValue(\n      new Error("pvp_daily_opponent_limit"),\n    );\n    const handler = createPvpChallengeHandler({\n      gameStore: gameStore(snapshot),\n      pvpStore: store,\n      now: () => new Date("2026-08-28T07:30:00.000Z"),\n    });\n\n    const response = await handler(request(challengeBody("challenge-fourth")), {\n      id: CHALLENGER_USER_ID,\n    });\n\n    expect(response.status).toBe(200);\n    expect((await response.json()).status).toBe("in-progress");\n    expect(store.commitRatedMatch).not.toHaveBeenCalled();\n    expect(store.createMatchSession).toHaveBeenCalledTimes(1);\n    expect(store.listRanking).not.toHaveBeenCalled();\n    expect(store.listHistory).not.toHaveBeenCalled();\n  });\n'''
          s = s[:start] + replacement + s[end:]
          start = s.index('  it("uses the canonical atomic-store result when concurrent duplicate requests race"')
          end = s.index('\n});', start)
          replacement = '''  it("uses the canonical persisted session response when concurrent duplicate starts race", async () => {\n    const snapshot = createCloudSnapshot();\n    const store = pvpStore();\n    vi.mocked(store.createMatchSession).mockImplementation(async (input) => {\n      const canonicalResponse = {\n        status: "in-progress",\n        operationId: input.operationId,\n        revision: input.challengerSourceRevision,\n        seasonId: "2026-08",\n        opponent: {\n          snapshotId: DEFENDER_SNAPSHOT_ID,\n          schoolName: "白波高校",\n          schoolShortName: "白波",\n        },\n        segment: {\n          status: "in-progress",\n          operationId: input.operationId,\n          matchId: "canonical-session-match",\n          phase: "coach-decision",\n          currentSetNumber: 2,\n          challengerSetsWon: 1,\n          defenderSetsWon: 0,\n          currentScore: { challenger: 7, defender: 5 },\n          sets: [],\n          pendingDecisionReason: "set-break",\n          events: [],\n        },\n      };\n      return {\n        challengerUserId: input.challengerUserId,\n        operationId: input.operationId,\n        defenderSnapshotId: input.defenderSnapshotId,\n        challengerSourceRevision: input.challengerSourceRevision,\n        currentCursor: input.currentCursor,\n        privateSession: input.privateSession,\n        publicResponse: canonicalResponse,\n        finalResponse: null,\n        createdAt: "2026-08-28T07:30:00.000Z",\n        updatedAt: "2026-08-28T07:30:00.000Z",\n      };\n    });\n    const handler = createPvpChallengeHandler({\n      gameStore: gameStore(snapshot),\n      pvpStore: store,\n    });\n\n    const response = await handler(request(challengeBody("challenge-race")), {\n      id: CHALLENGER_USER_ID,\n    });\n    const body = await response.json();\n\n    expect(response.status).toBe(200);\n    expect(body.segment.matchId).toBe("canonical-session-match");\n    expect(body.segment.currentScore).toEqual({ challenger: 7, defender: 5 });\n    expect(store.commitRatedMatch).not.toHaveBeenCalled();\n  });\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - run: npx prettier --write tests/unit/worker/pvpChallenge.test.ts
      - name: Focused regression
        run: >-
          npx vitest run
          tests/unit/worker/pvpChallenge.test.ts
          tests/unit/worker/phase16PvpChallengeRoutes.test.ts
          tests/unit/worker/phase16PvpCommandResumeRoutes.test.ts
          tests/unit/worker/phase16PvpCommandFinalizationRoutes.test.ts
          tests/unit/worker/router.test.ts
          tests/unit/worker/pvpDynamicsLeakage.test.ts
          tests/unit/worker/pvpTournamentLeakage.test.ts
          tests/unit/worker/phase15PvpPublicTactics.test.ts
      - run: npm run typecheck
      - name: Commit and cleanup
        if: always()
        run: |
          git rm .github/workflows/phase16-pvp-legacy-test-migration.yml
          git add tests/unit/worker/pvpChallenge.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: align PvP challenge regressions with resumable sessions"
          git push
