name: Diagnose Player Art

on:
  push:
    branches:
      - fix/player-art-rendering
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: pip install pillow
      - name: Build atlas diagnostics
        run: |
          mkdir -p /tmp/player-art-diagnostics
          cp src/assets/player-parts/v1/all-parts-atlas.webp /tmp/player-art-diagnostics/
          cp src/assets/characters/featured/*/full-neutral.webp /tmp/player-art-diagnostics/ || true
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          atlas_path = Path('src/assets/player-parts/v1/all-parts-atlas.webp')
          atlas = Image.open(atlas_path).convert('RGBA')
          tile_w, tile_h = 256, 384
          indices = [index * 4 for index in range(32)]

          full_grid = Image.new('RGBA', (8 * tile_w, 4 * tile_h), (5, 11, 20, 255))
          card_grid = Image.new('RGBA', (8 * 96, 4 * 128), (5, 11, 20, 255))

          for position, index in enumerate(indices):
              x = (index % 8) * tile_w
              y = (index // 8) * tile_h
              tile = atlas.crop((x, y, x + tile_w, y + tile_h))
              gx = (position % 8) * tile_w
              gy = (position // 8) * tile_h
              full_grid.alpha_composite(tile, (gx, gy))

              card = tile.resize((64, 96), Image.Resampling.LANCZOS)
              cell_x = (position % 8) * 96
              cell_y = (position // 8) * 128
              card_grid.alpha_composite(card, (cell_x + 16, cell_y + 8))
              draw = ImageDraw.Draw(card_grid)
              draw.text((cell_x + 4, cell_y + 108), str(index), fill=(255, 255, 255, 255))

          full_grid.convert('RGB').save('/tmp/player-art-diagnostics/base-tiles-full.jpg', quality=92)
          card_grid.convert('RGB').save('/tmp/player-art-diagnostics/base-tiles-card-size.jpg', quality=92)
          print('atlas', atlas.size)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture built roster rendering
        run: |
          cat > tests/e2e/player-art-diagnostic.spec.ts <<'TS'
          import { writeFileSync } from "node:fs";
          import { expect, test } from "@playwright/test";

          test("capture current roster player art", async ({ page }) => {
            await page.goto("/");
            const navigation = page.getByRole("navigation", { name: "主要メニュー" });
            await navigation.getByRole("button", { name: "選手", exact: true }).click();
            await expect(page.getByRole("heading", { name: "選手一覧" })).toBeVisible();
            await page.locator(".player-hub-card .player-art").first().waitFor();

            await page.screenshot({
              path: "/tmp/player-art-diagnostics/roster-browser.png",
              fullPage: true,
            });
            await page.locator(".player-hub-card").first().screenshot({
              path: "/tmp/player-art-diagnostics/first-card-browser.png",
            });

            const rendering = await page
              .locator(".player-hub-card .player-art")
              .evaluateAll((elements) =>
                elements.slice(0, 8).map((element) => {
                  const rect = element.getBoundingClientRect();
                  const base = element.querySelector<HTMLElement>(
                    ".player-art__layer--base",
                  );
                  const style = base ? getComputedStyle(base) : null;
                  return {
                    signature: element.getAttribute("data-art-signature"),
                    width: rect.width,
                    height: rect.height,
                    layerCount: element.querySelectorAll(".player-art__layer").length,
                    backgroundImage: style?.backgroundImage ?? null,
                    backgroundPosition: style?.backgroundPosition ?? null,
                    backgroundSize: style?.backgroundSize ?? null,
                  };
                }),
              );
            writeFileSync(
              "/tmp/player-art-diagnostics/browser-rendering.json",
              JSON.stringify(rendering, null, 2),
            );
          });
          TS
          npx playwright test tests/e2e/player-art-diagnostic.spec.ts --project=mobile-chromium
          rm tests/e2e/player-art-diagnostic.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: player-art-diagnostics
          path: /tmp/player-art-diagnostics
          retention-days: 1
