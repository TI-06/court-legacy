name: Generate General Player Portrait Atlas

on:
  push:
    branches:
      - fix/player-art-rendering

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-art-rendering
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: pip install pillow numpy opencv-python-headless
      - name: Generate portrait atlas
        run: python scripts/generate_general_player_headshot_atlas.py
      - name: Build portrait review sheet
        run: |
          mkdir -p /tmp/player-art-review
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          atlas = Image.open(
              Path("src/assets/player-parts/v1/all-parts-atlas.webp")
          ).convert("RGBA")
          tile_width, tile_height = 256, 384
          review = Image.new("RGBA", (8 * 112, 4 * 160), (5, 11, 20, 255))
          draw = ImageDraw.Draw(review)

          for position in range(32):
              entry_index = position * 4
              source_x = (entry_index % 8) * tile_width
              source_y = (entry_index // 8) * tile_height
              portrait = atlas.crop(
                  (
                      source_x,
                      source_y,
                      source_x + tile_width,
                      source_y + tile_height,
                  )
              )
              portrait = portrait.resize((96, 144), Image.Resampling.LANCZOS)
              cell_x = (position % 8) * 112
              cell_y = (position // 8) * 160
              review.alpha_composite(portrait, (cell_x + 8, cell_y))
              draw.text((cell_x + 4, cell_y + 145), str(position), fill="white")

          review.convert("RGB").save(
              "/tmp/player-art-review/general-player-portrait-grid.jpg",
              quality=94,
          )
          PY
      - name: Commit generated atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/player-parts/v1/all-parts-atlas.webp
          if git diff --cached --quiet; then
            echo "Atlas is already current"
          else
            git commit -m "feat: generate high-quality general player portraits"
            git push origin HEAD:fix/player-art-rendering
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture roster with generated portraits
        run: |
          cat > tests/e2e/general-player-portrait-review.spec.ts <<'TS'
          import { expect, test } from "@playwright/test";

          test("capture roster portraits", async ({ page }) => {
            await page.goto("/");
            const navigation = page.getByRole("navigation", { name: "主要メニュー" });
            await navigation.getByRole("button", { name: "選手", exact: true }).click();
            await expect(page.getByRole("heading", { name: "選手一覧" })).toBeVisible();
            await page.locator(".player-hub-card .player-art").first().waitFor();
            await page.waitForTimeout(600);
            await page.screenshot({
              path: "/tmp/player-art-review/roster-browser.png",
              fullPage: true,
            });
            await page.locator(".player-hub-card").nth(1).screenshot({
              path: "/tmp/player-art-review/general-player-card.png",
            });
          });
          TS
          npx playwright test tests/e2e/general-player-portrait-review.spec.ts --project=mobile-chromium
          rm tests/e2e/general-player-portrait-review.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: general-player-portrait-review
          path: /tmp/player-art-review
          retention-days: 2
