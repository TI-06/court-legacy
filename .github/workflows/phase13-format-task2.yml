name: Phase 13 Format Task 2

on:
  push:
    branches:
      - feat/phase13-home-command-center

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier src/features/home/HomeCommandCenter.tsx src/features/home/home-command-center.css src/features/home/HomeScreen.tsx tests/unit/features/home/HomeScreen.test.tsx --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomeCommandCenter.tsx src/features/home/home-command-center.css src/features/home/HomeScreen.tsx tests/unit/features/home/HomeScreen.test.tsx
          git commit -m "style: format Phase 13 Home UI"
          git push origin HEAD:feat/phase13-home-command-center
