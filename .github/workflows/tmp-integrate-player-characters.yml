name: Temporary Player Character Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m4-character-assembly
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Integrate character UI
        run: |
          npm ci
          node scripts/tmp-integrate-player-characters.mjs
          npm run format
          rm scripts/tmp-integrate-player-characters.mjs
          rm .github/workflows/tmp-integrate-player-characters.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: チームと練習画面へ3.5頭身キャラクターを統合"
          git push origin HEAD:feature/m4-character-assembly
