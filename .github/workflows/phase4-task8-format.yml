name: Phase4 Task8 format

on:
  push:
    branches:
      - feature/court-legacy-v2-phase4-async-pvp
    paths:
      - .github/workflows/phase4-task8-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase4-async-pvp
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier tests/e2e/pvp-flow.spec.ts tests/unit/domain/pvp/eloStress.test.ts README.md --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/pvp-flow.spec.ts tests/unit/domain/pvp/eloStress.test.ts README.md
          git commit -m "style: format Phase 4 Task 8 files"
          git push origin HEAD:feature/court-legacy-v2-phase4-async-pvp
