name: Task 5 RED Check

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - tests/unit/worker/applyGameAction.test.ts
      - tests/unit/worker/gameAction.test.ts
      - .github/workflows/task5-red-temp.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run focused Task 5 tests
        run: npm test -- tests/unit/worker/applyGameAction.test.ts tests/unit/worker/gameAction.test.ts
