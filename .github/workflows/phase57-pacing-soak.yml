name: Phase57 Pacing Soak

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/dev/soak/runBalanceSoak.ts"
      - ".github/workflows/phase57-pacing-soak.yml"

permissions:
  contents: read

jobs:
  balance-10:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Run 10-season pacing soak
        run: npm run soak:balance -- --seed phase18-release-a,phase18-release-b

  long-30:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Run 30-season pacing soak
        run: npm run soak:long -- --seed phase18-release-a
