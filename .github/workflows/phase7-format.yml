name: Phase 7 Format

on:
  push:
    branches:
      - feature/court-legacy-v2-phase7-team-dynamics

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase7-team-dynamics
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format Phase 7 files
        run: |
          npx prettier docs/superpowers/specs/2026-08-29-phase7-team-dynamics-design.md docs/superpowers/plans/2026-08-29-phase7-team-dynamics.md tests/unit/domain/dynamics/calculateTeamDynamics.test.ts .github/workflows/phase7-format.yml --write
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-08-29-phase7-team-dynamics-design.md docs/superpowers/plans/2026-08-29-phase7-team-dynamics.md tests/unit/domain/dynamics/calculateTeamDynamics.test.ts .github/workflows/phase7-format.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format phase 7 files"
            git push origin HEAD:feature/court-legacy-v2-phase7-team-dynamics
          fi
