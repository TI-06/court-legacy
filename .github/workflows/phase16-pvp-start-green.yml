name: Phase16 PvP start GREEN

on:
  push:
    branches:
      - feat/phase16-official-pvp-completion
    paths:
      - .github/workflows/phase16-pvp-start-green.yml

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier --check worker/routes/pvpChallenge.ts tests/unit/worker/phase16PvpChallengeRoutes.test.ts
      - run: npx vitest run tests/unit/worker/phase16PvpChallengeRoutes.test.ts
      - name: Remove temporary workflow and commit
        if: always()
        run: |
          git rm .github/workflows/phase16-pvp-start-green.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci: clean Phase16 PvP start workflow"
          git push
