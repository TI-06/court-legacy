name: Phase57 Prettier Preview

on:
  push:
    branches:
      - tmp/phase57-prettier-preview

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Print formatted report
        run: |
          echo "__PRETTIER_START__"
          npx prettier docs/superpowers/reports/2026-10-04-phase57-long-session-pacing-audit.md
          echo "__PRETTIER_END__"
