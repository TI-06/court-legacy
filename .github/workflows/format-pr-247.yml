name: Format PR 247

on:
  push:
    branches:
      - feat/annual-development-investment

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/annual-development-investment
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier --write src/domain/model/SchoolManagement.ts src/domain/school/annualInvestment.ts src/features/school/school-screen.css src/features/school/SchoolScreen.tsx tests/unit/domain/school/annualInvestment.test.ts tests/unit/features/school/SchoolScreen.test.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/model/SchoolManagement.ts src/domain/school/annualInvestment.ts src/features/school/school-screen.css src/features/school/SchoolScreen.tsx tests/unit/domain/school/annualInvestment.test.ts tests/unit/features/school/SchoolScreen.test.tsx
          git commit -m "style: format annual investment changes"
          git push
