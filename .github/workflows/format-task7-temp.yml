name: Temporary Task 7 Formatter

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - .github/workflows/format-task7-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format Task 7 files
        run: >-
          npx prettier
          src/App.tsx
          src/app/AppBootstrap.tsx
          src/app/ApplicationRoot.tsx
          src/app/GameApp.tsx
          src/features/onboarding/onboarding.css
          src/features/onboarding/SchoolSetupScreen.tsx
          src/main.tsx
          src/services/api/GameApiClient.ts
          tests/unit/app/AppBootstrap.test.tsx
          tests/unit/services/GameApiClient.test.ts
          --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/app/AppBootstrap.tsx src/app/ApplicationRoot.tsx src/app/GameApp.tsx src/features/onboarding/onboarding.css src/features/onboarding/SchoolSetupScreen.tsx src/main.tsx src/services/api/GameApiClient.ts tests/unit/app/AppBootstrap.test.tsx tests/unit/services/GameApiClient.test.ts
          git commit -m "style: format authenticated game bootstrap"
          git push
