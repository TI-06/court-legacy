name: Phase19-4 Safe Check

on:
  push:
    branches:
      - feature/phase19-match-difficulty-strategic-identities
    paths:
      - .github/workflows/phase19-4-safe-check.yml
      - tests/soak/phase19TacticalMatrix.test.ts

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Capture Task 8 RED without failing workflow
        shell: bash
        env:
          PHASE19_TACTICAL_MATRIX_RUN: "1"
        run: |
          set +e
          npx vitest run tests/soak/phase19TacticalMatrix.test.ts
          matrix=$?
          npm run typecheck
          types=$?
          echo "PHASE19_4_MATRIX_RED_STATUS=${matrix}"
          echo "PHASE19_4_MATRIX_TYPECHECK_STATUS=${types}"
          exit 0
