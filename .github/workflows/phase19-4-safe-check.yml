name: Phase19-4 Safe Check

on:
  push:
    branches:
      - feature/phase19-match-difficulty-strategic-identities
    paths:
      - .github/workflows/phase19-4-safe-check.yml
      - scripts/phase19-4-task2.py

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply Task 2 and capture GREEN
        shell: bash
        run: |
          set +e
          python scripts/phase19-4-task2.py
          patch_status=$?

          if [ "$patch_status" -eq 0 ]; then
            npx prettier --write \
              src/domain/match/simulateMatch.ts \
              tests/unit/domain/match/phase15TacticalTradeoffs.test.ts \
              tests/unit/domain/match/phase19DefenseBias.test.ts
            format_status=$?
          else
            format_status=99
          fi

          if [ "$patch_status" -eq 0 ] && [ "$format_status" -eq 0 ]; then
            npx vitest run \
              tests/unit/domain/match/phase19DefenseBias.test.ts \
              tests/unit/domain/match/phase15TacticalTradeoffs.test.ts \
              tests/unit/domain/match/simulateMatch.test.ts \
              tests/unit/domain/match/phase16RandomCompatibility.test.ts
            focused=$?
            npm run typecheck
            types=$?
          else
            focused=99
            types=99
          fi

          echo "PHASE19_4_DEFENSE_PATCH_STATUS=${patch_status}"
          echo "PHASE19_4_DEFENSE_FORMAT_STATUS=${format_status}"
          echo "PHASE19_4_DEFENSE_GREEN_STATUS=${focused}"
          echo "PHASE19_4_DEFENSE_TYPECHECK_STATUS=${types}"

          if [ "$patch_status" -eq 0 ] && [ "$format_status" -eq 0 ] && [ "$focused" -eq 0 ] && [ "$types" -eq 0 ]; then
            git config user.name "court-legacy-bot"
            git config user.email "court-legacy-bot@users.noreply.github.com"
            git add \
              src/domain/match/simulateMatch.ts \
              tests/unit/domain/match/phase15TacticalTradeoffs.test.ts \
              tests/unit/domain/match/phase19DefenseBias.test.ts
            if ! git diff --cached --quiet; then
              git commit -m "feat: add directional defensive matchups"
              git push origin HEAD:feature/phase19-match-difficulty-strategic-identities
            fi
          fi
          exit 0
