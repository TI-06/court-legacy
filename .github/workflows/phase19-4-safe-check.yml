name: Phase19-4 Safe Check

on:
  push:
    branches:
      - feature/phase19-match-difficulty-strategic-identities
    paths:
      - .github/workflows/phase19-4-safe-check.yml
      - scripts/phase19-4-task8-fix.py
      - tests/soak/phase19TacticalMatrix.test.ts
      - src/domain/team/matchTactics.ts

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify stabilized tactical matrix without failing workflow
        shell: bash
        env:
          PHASE19_TACTICAL_MATRIX_RUN: "1"
        run: |
          set +e
          python scripts/phase19-4-task8-fix.py
          patch_status=$?
          npx prettier --write \
            src/dev/soak/runTacticalMatrix.ts \
            tests/soak/phase19TacticalMatrix.test.ts
          format_status=$?
          npx vitest run --config vitest.soak.config.ts tests/soak/phase19TacticalMatrix.test.ts
          matrix=$?
          npm run typecheck
          types=$?
          echo "PHASE19_4_MATRIX_PATCH_STATUS=${patch_status}"
          echo "PHASE19_4_MATRIX_FORMAT_STATUS=${format_status}"
          echo "PHASE19_4_MATRIX_STATUS=${matrix}"
          echo "PHASE19_4_MATRIX_TYPECHECK_STATUS=${types}"
          if [ "$patch_status" -eq 0 ] && [ "$format_status" -eq 0 ] && [ "$matrix" -eq 0 ] && [ "$types" -eq 0 ]; then
            git config user.name "court-legacy-bot"
            git config user.email "court-legacy-bot@users.noreply.github.com"
            git add src/dev/soak/runTacticalMatrix.ts tests/soak/phase19TacticalMatrix.test.ts
            if ! git diff --cached --quiet; then
              git commit -m "test: add phase19 tactical balance matrix"
              git push origin HEAD:feature/phase19-match-difficulty-strategic-identities
            fi
          fi
          exit 0
