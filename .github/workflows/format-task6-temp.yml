name: Temporary Task 6 Formatter

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - .github/workflows/format-task6-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format Task 6 files
        run: >-
          npx prettier
          src/features/auth/LoginScreen.tsx
          src/services/auth/SupabaseAuthClient.ts
          tests/unit/features/auth/LoginScreen.test.tsx
          tests/unit/services/SupabaseAuthClient.test.ts
          --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/auth/LoginScreen.tsx src/services/auth/SupabaseAuthClient.ts tests/unit/features/auth/LoginScreen.test.tsx tests/unit/services/SupabaseAuthClient.test.ts
          git commit -m "style: format mandatory Supabase login"
          git push
