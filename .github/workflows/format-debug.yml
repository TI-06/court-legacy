name: Format Debug

on:
  push:
    branches:
      - feature/phase8-mobile-game-loop-impl

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Print Prettier diff
        run: |
          npx prettier tests/e2e/event-dialog.spec.ts tests/e2e/official-tournament-flow.spec.ts --write
          git diff -- tests/e2e/event-dialog.spec.ts tests/e2e/official-tournament-flow.spec.ts
          exit 1
