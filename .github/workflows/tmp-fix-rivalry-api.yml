name: Temporary Rivalry API Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-rival-world-progression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply rivalry API fixes
        run: |
          npm ci
          node scripts/tmp-fix-rivalry-api.mjs
          npm run format
          rm scripts/tmp-fix-rivalry-api.mjs
          rm .github/workflows/tmp-fix-rivalry-api.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: 因縁更新を冪等化しスカウト競合へ対応"
          git push origin HEAD:feature/m3-rival-world-progression
