name: Phase10 Format Sheet Test Once

on:
  push:
    branches:
      - feature/phase10-training-player-mobile-ui
    paths:
      - .github/workflows/phase10-format-sheet-test-once.yml

permissions:
  contents: write

jobs:
  format-and-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase10-training-player-mobile-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format sheet test
        run: npx prettier --write tests/unit/features/home/TrainingResultNotificationSheet.test.tsx
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/features/home/TrainingResultNotificationSheet.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format training notification sheet test"
            git push origin HEAD:feature/phase10-training-player-mobile-ui
          fi
      - name: Confirm detail-sheet RED
        run: npm test -- tests/unit/features/home/TrainingResultNotificationSheet.test.tsx
