name: Phase22-3 Final UI Gate

on:
  push:
    branches:
      - tmp/phase22-3-compact-player-list

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply verified compact-control refinement
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          screen_path = Path('src/features/team/PlayerHubScreen.tsx')
          text = screen_path.read_text()

          anchor = '''    const maxTrendGrowth = Math.max(
      1,
      ...growth.trend12.map((point) => point.totalAbilityGrowth),
    );

    return (
'''
          replacement = '''    const maxTrendGrowth = Math.max(
      1,
      ...growth.trend12.map((point) => point.totalAbilityGrowth),
    );
    const selectedIsPriority = priorityIds.includes(selectedPlayer.id);
    const priorityCapReached = priorityIds.length >= 3;

    return (
'''
          if anchor not in text:
              raise SystemExit('detail state anchor not found')
          text = text.replace(anchor, replacement, 1)

          quick_anchor = '''        <section className="player-detail__quick-actions" aria-label="選手設定">
          <button
            aria-label={`${playerName(selectedPlayer)} 個人練習 ${assignmentName(selectedPlayer.id)}`}
'''
          quick_replacement = '''        <section className="player-detail__quick-actions" aria-label="選手設定">
          <button
            aria-label={
              selectedIsPriority
                ? `重点育成から外す ${playerName(selectedPlayer)}`
                : `重点育成に追加 ${playerName(selectedPlayer)}`
            }
            className={`player-priority-chip player-priority-chip--detail${selectedIsPriority ? " player-priority-chip--active" : ""}`}
            disabled={
              planningPending || (!selectedIsPriority && priorityCapReached)
            }
            onClick={() => togglePriority(selectedPlayer.id)}
            type="button"
          >
            <span>重点育成</span>
            <strong>{selectedIsPriority ? "設定中" : "設定する"}</strong>
          </button>
          <button
            aria-label={`${playerName(selectedPlayer)} 個人練習 ${assignmentName(selectedPlayer.id)}`}
'''
          if quick_anchor not in text:
              raise SystemExit('quick action anchor not found')
          text = text.replace(quick_anchor, quick_replacement, 1)

          map_old = '''          const isPriority = item.isPriority;
          const priorityCapReached = priorityIds.length >= 3;
          const isCaptain = state.teamDynamics.captainPlayerId === player.id;
'''
          map_new = '''          const isPriority = item.isPriority;
          const isCaptain = state.teamDynamics.captainPlayerId === player.id;
'''
          if map_old not in text:
              raise SystemExit('roster local state anchor not found')
          text = text.replace(map_old, map_new, 1)

          button_block = '''
              <button
                aria-label={
                  isPriority
                    ? `重点育成から外す ${playerName(player)}`
                    : `重点育成に追加 ${playerName(player)}`
                }
                className={`player-priority-chip player-priority-chip--compact${isPriority ? " player-priority-chip--active" : ""}`}
                disabled={
                  planningPending || (!isPriority && priorityCapReached)
                }
                onClick={() => togglePriority(player.id)}
                type="button"
              >
                {isPriority ? "解除" : "重点"}
              </button>
'''
          if button_block not in text:
              raise SystemExit('compact priority button block not found')
          text = text.replace(button_block, '', 1)
          screen_path.write_text(text)

          css_path = Path('src/features/team/player-hub.css')
          css = css_path.read_text()
          old_row = '''.player-roster__row--compact {
  grid-template-columns: minmax(0, 1fr) 50px;
  align-items: stretch;
  border-radius: 9px;
}
'''
          new_row = '''.player-roster__row--compact {
  grid-template-columns: minmax(0, 1fr);
  align-items: stretch;
  border-radius: 9px;
}
'''
          if old_row not in css:
              raise SystemExit('compact row css anchor not found')
          css = css.replace(old_row, new_row, 1)
          compact_block = '''.player-priority-chip--compact {
  align-self: center;
  min-width: 44px;
  min-height: 44px;
  margin-right: 5px;
  padding: 4px;
  font-size: 9px;
  border-radius: 8px;
}

'''
          if compact_block not in css:
              raise SystemExit('compact priority css anchor not found')
          css = css.replace(compact_block, '', 1)
          old_quick = '''.player-detail__quick-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 6px;
}

.player-training-chip--detail {
  display: flex;
'''
          new_quick = '''.player-detail__quick-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}

.player-training-chip--detail,
.player-priority-chip--detail {
  display: flex;
'''
          if old_quick not in css:
              raise SystemExit('detail action css anchor not found')
          css = css.replace(old_quick, new_quick, 1)
          old_strong = '''.player-training-chip--detail strong {
  color: #fff;
  font-size: 12px;
}
'''
          new_strong = '''.player-training-chip--detail strong,
.player-priority-chip--detail strong {
  color: #fff;
  font-size: 12px;
}
'''
          if old_strong not in css:
              raise SystemExit('detail action strong css anchor not found')
          css = css.replace(old_strong, new_strong, 1)
          css_path.write_text(css)

          test_path = Path('tests/unit/features/team/PlayerHubScreen.test.tsx')
          tests = test_path.read_text()
          old = '''    expect(
      within(rosterRow).queryByRole("button", { name: /練習/ }),
    ).toBeNull();

    fireEvent.click(detailButton);
    const settings = screen.getByRole("region", { name: "選手設定" });
    const trainingButton = within(settings).getByRole("button", {
      name: `${player.lastName} ${player.firstName} 個人練習 全体`,
    });
'''
          new = '''    expect(
      within(rosterRow).queryByRole("button", { name: /練習/ }),
    ).toBeNull();
    expect(
      within(rosterRow).queryByRole("button", { name: /重点育成/ }),
    ).toBeNull();

    fireEvent.click(detailButton);
    const settings = screen.getByRole("region", { name: "選手設定" });
    expect(
      within(settings).getByRole("button", {
        name: `重点育成から外す ${player.lastName} ${player.firstName}`,
      }),
    ).toBeVisible();
    const trainingButton = within(settings).getByRole("button", {
      name: `${player.lastName} ${player.firstName} 個人練習 全体`,
    });
'''
          if old not in tests:
              raise SystemExit('compact status test anchor not found')
          tests = tests.replace(old, new, 1)

          old_priority = '''    const fourthAdd = screen.getByRole("button", {
      name: `重点育成に追加 ${fourth.lastName} ${fourth.firstName}`,
    });
    expect(fourthAdd).toBeDisabled();

    const first = state.players[firstThree[0]!]!;
    fireEvent.click(
      screen.getByRole("button", {
        name: `重点育成から外す ${first.lastName} ${first.firstName}`,
      }),
    );
    expect(onSetDevelopmentPriorities).toHaveBeenLastCalledWith(
      firstThree.slice(1),
    );

    view.rerender(
      <PlayerHubScreen
        data={gameData}
        onAssignLeadership={vi.fn()}
        onChange={vi.fn()}
        onSetDevelopmentPriorities={onSetDevelopmentPriorities}
        selection={autoSelectTeam({ state, schoolId: state.userSchoolId })}
        state={{
          ...state,
          teamPlanning: {
            ...state.teamPlanning,
            developmentPriorityPlayerIds: firstThree.slice(1),
          },
        }}
      />,
    );

    fireEvent.click(
      screen.getByRole("button", {
        name: `重点育成に追加 ${fourth.lastName} ${fourth.firstName}`,
      }),
    );
    expect(onSetDevelopmentPriorities).toHaveBeenLastCalledWith([
      ...firstThree.slice(1),
      fourthId,
    ]);
'''
          new_priority = '''    fireEvent.click(
      screen.getByRole("button", {
        name: `選手詳細 ${fourth.lastName} ${fourth.firstName}`,
      }),
    );
    const fourthAdd = screen.getByRole("button", {
      name: `重点育成に追加 ${fourth.lastName} ${fourth.firstName}`,
    });
    expect(fourthAdd).toBeDisabled();
    fireEvent.click(screen.getByRole("button", { name: "選手一覧へ戻る" }));

    const first = state.players[firstThree[0]!]!;
    fireEvent.click(
      screen.getByRole("button", {
        name: `選手詳細 ${first.lastName} ${first.firstName}`,
      }),
    );
    fireEvent.click(
      screen.getByRole("button", {
        name: `重点育成から外す ${first.lastName} ${first.firstName}`,
      }),
    );
    expect(onSetDevelopmentPriorities).toHaveBeenLastCalledWith(
      firstThree.slice(1),
    );

    view.rerender(
      <PlayerHubScreen
        data={gameData}
        onAssignLeadership={vi.fn()}
        onChange={vi.fn()}
        onSetDevelopmentPriorities={onSetDevelopmentPriorities}
        selection={autoSelectTeam({ state, schoolId: state.userSchoolId })}
        state={{
          ...state,
          teamPlanning: {
            ...state.teamPlanning,
            developmentPriorityPlayerIds: firstThree.slice(1),
          },
        }}
      />,
    );
    fireEvent.click(screen.getByRole("button", { name: "選手一覧へ戻る" }));
    fireEvent.click(
      screen.getByRole("button", {
        name: `選手詳細 ${fourth.lastName} ${fourth.firstName}`,
      }),
    );
    fireEvent.click(
      screen.getByRole("button", {
        name: `重点育成に追加 ${fourth.lastName} ${fourth.firstName}`,
      }),
    );
    expect(onSetDevelopmentPriorities).toHaveBeenLastCalledWith([
      ...firstThree.slice(1),
      fourthId,
    ]);
'''
          if old_priority not in tests:
              raise SystemExit('priority mutation test anchor not found')
          tests = tests.replace(old_priority, new_priority, 1)

          old_pending = '''    const priorityButtons = screen.getAllByRole("button", {
      name: /重点育成(に追加|から外す)/,
    });
    expect(priorityButtons.length).toBeGreaterThan(0);
    expect(
      priorityButtons.every((button) => button.hasAttribute("disabled")),
    ).toBe(true);
'''
          new_pending = '''    const first = state.players[school.playerIds[0]!]!;
    fireEvent.click(
      screen.getByRole("button", {
        name: `選手詳細 ${first.lastName} ${first.firstName}`,
      }),
    );
    expect(
      screen.getByRole("button", {
        name: `重点育成から外す ${first.lastName} ${first.firstName}`,
      }),
    ).toBeDisabled();
'''
          if old_pending not in tests:
              raise SystemExit('priority pending test anchor not found')
          tests = tests.replace(old_pending, new_pending, 1)
          test_path.write_text(tests)

          app_path = Path('tests/unit/app/GameApp.playerHubPlanning.test.tsx')
          app = app_path.read_text()
          old_app = '''    fireEvent.click(screen.getByRole("button", { name: "選手" }));
    fireEvent.click(
      await screen.findByRole("button", {
        name: `重点育成に追加 ${playerName}`,
      }),
    );
'''
          new_app = '''    fireEvent.click(screen.getByRole("button", { name: "選手" }));
    fireEvent.click(
      await screen.findByRole("button", {
        name: `選手詳細 ${playerName}`,
      }),
    );
    fireEvent.click(
      screen.getByRole("button", {
        name: `重点育成に追加 ${playerName}`,
      }),
    );
'''
          if old_app not in app:
              raise SystemExit('GameApp planning anchor not found')
          app = app.replace(old_app, new_app, 1)
          app_path.write_text(app)
          PY

      - name: Format changed files
        run: npx prettier --write src/features/team/PlayerHubScreen.tsx src/features/team/player-hub.css tests/unit/features/team/PlayerHubScreen.test.tsx tests/unit/app/GameApp.playerHubPlanning.test.tsx

      - name: Focused regression tests
        run: npm test -- tests/unit/features/team/PlayerHubScreen.test.tsx tests/unit/features/training/TrainingFlow.test.tsx tests/unit/app/GameAppActions.test.tsx tests/unit/app/GameApp.playerHubPlanning.test.tsx

      - name: Full verify
        run: npm run verify

      - name: Commit verified final Phase22-3 changes
        shell: bash
        run: |
          rm .github/workflows/phase22-3-final-ui.yml
          git config user.name "court-legacy-bot"
          git config user.email "court-legacy-bot@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move player planning controls into detail"
          git push origin HEAD:tmp/phase22-3-compact-player-list
