name: Phase22-3 Final UI Gate

on:
  push:
    branches:
      - tmp/phase22-3-compact-player-list

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply compact-control refinement
        run: |
          echo '' | base64 -d > /tmp/phase22-3-final.py
          python3 /tmp/phase22-3-final.py

      - name: Format changed files
        run: npx prettier --write src/features/team/PlayerHubScreen.tsx src/features/team/player-hub.css tests/unit/features/team/PlayerHubScreen.test.tsx tests/unit/app/GameApp.playerHubPlanning.test.tsx

      - name: Focused regression tests
        run: npm test -- tests/unit/features/team/PlayerHubScreen.test.tsx tests/unit/features/training/TrainingFlow.test.tsx tests/unit/app/GameAppActions.test.tsx tests/unit/app/GameApp.playerHubPlanning.test.tsx

      - name: Full verify
        run: npm run verify

      - name: Commit verified final Phase22-3 changes
        shell: bash
        run: |
          rm .github/workflows/phase22-3-final-ui.yml
          git config user.name "court-legacy-bot"
          git config user.email "court-legacy-bot@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move player planning controls into detail"
          git push origin HEAD:tmp/phase22-3-compact-player-list
