name: Phase 6 Format Docs

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  format-docs:
    if: github.event.head_commit.message != 'chore: format Phase 6 docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format Phase 6 docs
        run: >-
          npx prettier
          docs/superpowers/specs/2026-08-29-phase6-official-tournaments-design.md
          docs/superpowers/plans/2026-08-29-phase6-official-tournaments.md
          --write
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-08-29-phase6-official-tournaments-design.md docs/superpowers/plans/2026-08-29-phase6-official-tournaments.md
          git commit -m "chore: format Phase 6 docs"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
