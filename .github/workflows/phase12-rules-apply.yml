name: Phase 12 Rules Apply

on:
  push:
    branches: [feature/phase12-game-loop-polish]
    paths: [scripts/phase12-rules-apply.py]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase12-game-loop-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Add Phase 12 rule tests
        run: python scripts/phase12-rules-apply.py tests
      - name: Confirm RED
        shell: bash
        run: |
          set +e
          npx vitest run tests/unit/domain/training/phase12TrainingRules.test.ts tests/unit/domain/weekly/phase12AutoRest.test.ts tests/unit/domain/training/phase12RestTraining.test.ts
          status=$?
          set -e
          test "$status" -ne 0
      - name: Apply production rules
        run: python scripts/phase12-rules-apply.py production
      - name: Confirm focused GREEN
        run: npx vitest run tests/unit/domain/training/phase12TrainingRules.test.ts tests/unit/domain/weekly/phase12AutoRest.test.ts tests/unit/domain/training/phase12RestTraining.test.ts tests/unit/domain/training/resolveWeeklyTraining.test.ts tests/unit/domain/training/resolvePlayerTrainingActivity.test.ts tests/unit/domain/training/trainingSafety.test.ts tests/unit/domain/training/calculateGrowth.test.ts
      - name: Run full verification
        run: npm run verify
      - name: Remove temporary assets
        run: rm -f scripts/phase12-rules-apply.py .github/workflows/phase12-rules-apply.yml
      - name: Commit rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make condition drive weekly gameplay"
          git push origin HEAD:feature/phase12-game-loop-polish
