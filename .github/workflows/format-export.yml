name: Format Export

on:
  push:
    branches:
      - fix/player-art-rendering

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format target files
        run: >-
          npx prettier --write
          docs/superpowers/plans/2026-08-05-general-player-modular-art.md
          tests/unit/domain/appearance/playerAppearance.test.ts
          tests/unit/domain/appearance/playerArtDiversity.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-red-files
          path: |
            docs/superpowers/plans/2026-08-05-general-player-modular-art.md
            tests/unit/domain/appearance/playerAppearance.test.ts
            tests/unit/domain/appearance/playerArtDiversity.test.ts
          retention-days: 1
