name: Format Export

on:
  push:
    branches:
      - fix/player-art-rendering

permissions:
  contents: write

jobs:
  format-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-art-rendering
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format and commit target files
        run: |
          npx prettier --write \
            docs/superpowers/plans/2026-08-05-general-player-modular-art.md \
            tests/unit/domain/appearance/playerAppearance.test.ts \
            tests/unit/domain/appearance/playerArtDiversity.test.ts
          git rm .github/workflows/format-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-08-05-general-player-modular-art.md
          git add tests/unit/domain/appearance/playerAppearance.test.ts
          git add tests/unit/domain/appearance/playerArtDiversity.test.ts
          git commit -m "style: format modular player art red tests"
          git push origin HEAD:fix/player-art-rendering
