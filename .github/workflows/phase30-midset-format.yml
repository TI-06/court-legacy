name: Phase30 Midset Format Diagnostic

on:
  push:
    branches:
      - diag/phase30-midset-format

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Show exact Prettier diff
        shell: bash
        run: |
          npx prettier tests/unit/domain/match/phase16ResumableMatch.test.ts tests/unit/worker/phase16OfficialMatchSession.test.ts --write
          git diff -- tests/unit/domain/match/phase16ResumableMatch.test.ts tests/unit/worker/phase16OfficialMatchSession.test.ts
