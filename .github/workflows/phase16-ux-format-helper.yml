name: Phase16 UX Format Helper

on:
  push:
    branches:
      - feat/phase16-match-command-ux

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format Phase16 UX files
        run: |
          npx prettier --write docs/superpowers/plans/2026-09-10-phase16-match-command-ux.md tests/unit/worker/phase16PracticeMatchSession.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-10-phase16-match-command-ux.md tests/unit/worker/phase16PracticeMatchSession.test.ts
          git commit -m "chore: format Phase16 UX RED files"
          git push
