name: Phase10 training finalize

on:
  push:
    branches:
      - feature/phase10-mobile-ui-completion
    paths:
      - .github/workflows/phase10-training-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase10-mobile-ui-completion
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: python scripts/phase10-training-finalize.py
      - run: npm ci
      - run: npx prettier src/app/GameApp.tsx src/features/training/TrainingScreen.tsx src/features/training/TrainingScoutingEntry.tsx src/features/training/training-direct.css src/features/training/training-scouting-entry.css tests/unit/features/training/TrainingFlow.test.tsx --write
      - run: npm test -- tests/unit/features/training/TrainingFlow.test.tsx
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/GameApp.tsx src/features/training/TrainingScreen.tsx src/features/training/TrainingScoutingEntry.tsx src/features/training/training-direct.css src/features/training/training-scouting-entry.css tests/unit/features/training/TrainingFlow.test.tsx
          git commit -m "feat: complete compact phase10 training ui"
          git push origin HEAD:feature/phase10-mobile-ui-completion
