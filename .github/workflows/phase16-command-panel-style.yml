name: Phase16 Command Panel Style

on:
  push:
    branches:
      - feat/phase16-match-command-ux

permissions:
  contents: write

jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Add compact decision panel styles
        run: |
          cat <<'CSS' >> src/features/match/match.css

          .match-command-panel {
            display: grid;
            min-width: 0;
            padding: 14px;
            background: #fff8e9;
            border: 1px solid #e6c98f;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgb(18 36 50 / 6%);
            gap: 12px;
          }

          .match-command-panel__heading {
            min-width: 0;
          }

          .match-command-panel__heading > span {
            display: inline-flex;
            min-height: 24px;
            padding: 4px 8px;
            color: #8b5b19;
            font-size: 0.61rem;
            font-weight: 900;
            background: #ffe7b7;
            border-radius: 999px;
            align-items: center;
          }

          .match-command-panel__heading h2 {
            margin: 7px 0 0;
            color: #173b52;
            font-size: 1rem;
          }

          .match-command-panel__heading p {
            margin: 5px 0 0;
            color: #6f5d3c;
            font-size: 0.72rem;
            font-weight: 800;
            line-height: 1.5;
          }

          .match-command-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            min-width: 0;
            gap: 8px;
          }

          .match-command-actions button {
            min-width: 0;
            min-height: 44px;
            padding: 8px 6px;
            color: #254855;
            font-size: 0.72rem;
            font-weight: 900;
            background: #fff;
            border: 1px solid #d6e0e5;
            border-radius: 12px;
          }

          .match-command-actions button:disabled {
            color: #9aa5aa;
            background: #f2f4f5;
          }

          .match-command-actions__continue {
            grid-column: 1 / -1;
            color: #fff !important;
            background: #286d7a !important;
            border-color: #286d7a !important;
          }

          .match-command-actions__continue:disabled {
            color: #eef3f5 !important;
            background: #91a7ae !important;
            border-color: #91a7ae !important;
          }
          CSS
          npx prettier --write src/features/match/match.css src/features/match/MatchCommandPanel.tsx
          npx vitest run tests/unit/features/match/matchCommandPresentation.test.ts tests/unit/features/match/Phase16MatchCommandUx.test.tsx
          git rm .github/workflows/phase16-command-panel-style.yml
      - name: Commit decision panel styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: style match command decision panel"
          git push
