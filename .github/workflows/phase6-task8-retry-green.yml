name: Phase 6 Task 8 Retry Green

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  retry-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier tests/unit/app/GameApp.officialTournamentRetry.test.tsx --write
      - name: Verify official retry and UI
        run: |
          npm test -- tests/unit/app/GameApp.officialTournamentRetry.test.tsx tests/unit/app/GameApp.officialTournament.test.tsx tests/unit/features/tournament/TournamentPendingStatus.test.tsx tests/unit/features/tournament/TournamentScreen.test.tsx tests/unit/features/match/MatchOfficialEntry.test.tsx tests/unit/features/home/HomeScreen.test.tsx
          npm run typecheck
      - name: Commit formatted retry regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/app/GameApp.officialTournamentRetry.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format official tournament retry regression"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
