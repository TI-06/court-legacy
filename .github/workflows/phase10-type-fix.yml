name: Phase10 type fix

on:
  push:
    branches:
      - feature/phase10-mobile-ui-completion
    paths:
      - .github/workflows/phase10-type-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase10-mobile-ui-completion
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply narrow type fixes
        run: |
          perl -0pi -e 's/const outgoingId = next\.liberoPlayerId;/const outgoingId = next.liberoPlayerId!;/' src/features/team/TeamScreen.tsx
          perl -0pi -e 's/\n        latestResult=\{null\}//g' tests/unit/features/shop/ShopTargetUx.test.tsx
          npx prettier src/features/team/TeamScreen.tsx tests/unit/features/shop/ShopTargetUx.test.tsx --write
      - run: npm run typecheck
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/team/TeamScreen.tsx tests/unit/features/shop/ShopTargetUx.test.tsx
          git diff --cached --quiet || git commit -m "fix: resolve phase10 type errors"
          git push origin HEAD:feature/phase10-mobile-ui-completion
