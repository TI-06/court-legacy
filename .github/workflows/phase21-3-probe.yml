name: Phase21-3 Task1 Green Probe

on:
  push:
    branches:
      - tmp/phase21-3-hidden-character-traits

permissions:
  contents: write

jobs:
  task1-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Apply Task1 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          schema_path = Path("src/domain/validation/gameDataSchema.ts")
          schema = schema_path.read_text(encoding="utf-8")
          if "characterTraitDefinitionSchema" not in schema:
              marker = 'export const trainingMenuDefinitionSchema = z.object({'
              insert = '''export const characterTraitDiscoveryConditionSchema = z.discriminatedUnion(
            "type",
            [
              z.object({
                type: z.literal("trust-min"),
                value: z.number().int().min(0).max(100),
              }),
              z.object({
                type: z.literal("appearances-min"),
                value: z.number().int().min(1).max(1000),
              }),
              z.object({ type: z.literal("captaincy") }),
              z.object({
                type: z.literal("special-relationship"),
                kind: z.enum(["rival", "mentor", "partner"]).optional(),
              }),
              z.object({
                type: z.literal("event-tag"),
                tag: z.string().trim().min(1).max(30),
              }),
            ],
          );

          export const characterTraitDefinitionSchema = z.object({
            id: dataIdSchema,
            name: z.string().trim().min(1).max(24),
            description: z.string().trim().min(1).max(180),
            eventTags: z.array(z.string().trim().min(1).max(30)).max(8),
            relationshipBias: z.number().int().min(-10).max(10),
            discoveryConditions: z
              .array(characterTraitDiscoveryConditionSchema)
              .min(1)
              .max(4),
          });

          '''
              if marker not in schema:
                  raise SystemExit("schema insertion marker missing")
              schema = schema.replace(marker, insert + marker, 1)
              schema = schema.replace(
                  '  traits: z.array(traitDefinitionSchema).min(1),\n',
                  '  traits: z.array(traitDefinitionSchema).min(1),\n  characterTraits: z.array(characterTraitDefinitionSchema).min(1),\n',
                  1,
              )
              schema = schema.replace(
                  'export type TraitDefinition = z.infer<typeof traitDefinitionSchema>;\n',
                  'export type TraitDefinition = z.infer<typeof traitDefinitionSchema>;\nexport type CharacterTraitDefinition = z.infer<\n  typeof characterTraitDefinitionSchema\n>;\n',
                  1,
              )
              schema_path.write_text(schema, encoding="utf-8")

          raw_path = Path("src/data/rawGameData.ts")
          raw = raw_path.read_text(encoding="utf-8")
          if "const characterTraits: CharacterTraitDefinition[]" not in raw:
              raw = raw.replace(
                  '  AbilityKey,\n',
                  '  AbilityKey,\n  CharacterTraitDefinition,\n',
                  1,
              )
              marker = 'const trainingMenus: TrainingMenuDefinition[] = ['
              catalog = '''const characterTraits: CharacterTraitDefinition[] = [
            {
              id: "character.caring",
              name: "面倒見がいい",
              description: "後輩や仲間の様子に気づき、自然に支えようとする。",
              eventTags: ["mentor", "guidance", "teamwork"],
              relationshipBias: 5,
              discoveryConditions: [
                { type: "special-relationship", kind: "mentor" },
                { type: "event-tag", tag: "guidance" },
              ],
            },
            {
              id: "character.analytical",
              name: "研究熱心",
              description: "プレーを観察し、理由を考えて改善点を探すのが好き。",
              eventTags: ["analysis", "tactics"],
              relationshipBias: 0,
              discoveryConditions: [
                { type: "event-tag", tag: "analysis" },
                { type: "appearances-min", value: 8 },
              ],
            },
            {
              id: "character.training-lover",
              name: "練習の虫",
              description: "地道な反復を苦にせず、納得するまで練習を続ける。",
              eventTags: ["practice", "training"],
              relationshipBias: 0,
              discoveryConditions: [
                { type: "event-tag", tag: "practice" },
                { type: "trust-min", value: 65 },
              ],
            },
            {
              id: "character.resilient",
              name: "負けを引きずらない",
              description: "失敗や敗戦を切り替え、次の行動へ意識を向けられる。",
              eventTags: ["recovery", "adversity", "match"],
              relationshipBias: 1,
              discoveryConditions: [
                { type: "appearances-min", value: 6 },
                { type: "event-tag", tag: "recovery" },
              ],
            },
            {
              id: "character.team-first",
              name: "仲間思い",
              description: "自分の成果より、チーム全体が動きやすい選択を優先する。",
              eventTags: ["teamwork", "cooperation", "pair"],
              relationshipBias: 6,
              discoveryConditions: [
                { type: "special-relationship", kind: "partner" },
                { type: "trust-min", value: 75 },
              ],
            },
            {
              id: "character.bottles-up",
              name: "一人で抱え込みやすい",
              description: "悩みを周囲に見せず、自分だけで解決しようとしやすい。",
              eventTags: ["quiet", "pressure", "concern"],
              relationshipBias: -5,
              discoveryConditions: [
                { type: "trust-min", value: 60 },
                { type: "event-tag", tag: "concern" },
              ],
            },
            {
              id: "character.spotlight",
              name: "注目されると燃える",
              description: "責任や視線が集まる場面ほど、気持ちを前向きに高める。",
              eventTags: ["leadership", "spotlight", "match"],
              relationshipBias: 0,
              discoveryConditions: [
                { type: "captaincy" },
                { type: "appearances-min", value: 10 },
              ],
            },
            {
              id: "character.competitive-growth",
              name: "競争相手がいると伸びる",
              description: "身近な競争相手の存在を、自分を高める刺激に変える。",
              eventTags: ["competition", "rivalry"],
              relationshipBias: -1,
              discoveryConditions: [
                { type: "special-relationship", kind: "rival" },
                { type: "event-tag", tag: "competition" },
              ],
            },
            {
              id: "character.quiet-observer",
              name: "静かな観察眼",
              description: "多くを語らず、周囲の変化や相手の癖をよく見ている。",
              eventTags: ["analysis", "quiet", "observation"],
              relationshipBias: 1,
              discoveryConditions: [
                { type: "appearances-min", value: 12 },
                { type: "event-tag", tag: "analysis" },
              ],
            },
            {
              id: "character.clutch-support",
              name: "ここぞで支える",
              description: "重要な局面で周囲に声をかけ、仲間を支える行動を選ぶ。",
              eventTags: ["leadership", "teamwork", "support"],
              relationshipBias: 4,
              discoveryConditions: [
                { type: "captaincy" },
                { type: "special-relationship" },
              ],
            },
          ];

          '''
              if marker not in raw:
                  raise SystemExit("raw catalog insertion marker missing")
              raw = raw.replace(marker, catalog + marker, 1)
              raw = raw.replace(
                  '  traits,\n  trainingMenus,',
                  '  traits,\n  characterTraits,\n  trainingMenus,',
                  1,
              )
              raw_path.write_text(raw, encoding="utf-8")

          registry_path = Path("src/data/dataRegistry.ts")
          registry = registry_path.read_text(encoding="utf-8")
          if "characterTraits: ReadonlyMap" not in registry:
              registry = registry.replace(
                  '  rawGameDataSchema,\n',
                  '  rawGameDataSchema,\n  type CharacterTraitDefinition,\n',
                  1,
              )
              registry = registry.replace(
                  '  traits: ReadonlyMap<string, TraitDefinition>;\n',
                  '  traits: ReadonlyMap<string, TraitDefinition>;\n  characterTraits: ReadonlyMap<string, CharacterTraitDefinition>;\n',
                  1,
              )
              registry = registry.replace(
                  '  assertUniqueIds("traits", parsed.traits);\n',
                  '  assertUniqueIds("traits", parsed.traits);\n  assertUniqueIds("characterTraits", parsed.characterTraits);\n',
                  1,
              )
              registry = registry.replace(
                  '    traits: createReadOnlyMap(parsed.traits, (item) => item.id),\n',
                  '    traits: createReadOnlyMap(parsed.traits, (item) => item.id),\n    characterTraits: createReadOnlyMap(\n      parsed.characterTraits,\n      (item) => item.id,\n    ),\n',
                  1,
              )
              registry_path.write_text(registry, encoding="utf-8")
          PY
          npx prettier src/domain/validation/gameDataSchema.ts src/data/rawGameData.ts src/data/dataRegistry.ts tests/unit/data/phase21CharacterTraits.test.ts --write
          git diff --check
      - name: Run Task1 focused tests
        run: npx vitest run tests/unit/data/phase21CharacterTraits.test.ts tests/unit/data/gameDataRegistry.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit Task1 implementation
        shell: bash
        run: |
          if git diff --quiet -- src/domain/validation/gameDataSchema.ts src/data/rawGameData.ts src/data/dataRegistry.ts; then
            echo "Task1 implementation already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/validation/gameDataSchema.ts src/data/rawGameData.ts src/data/dataRegistry.ts
          git commit -m "feat: add character trait catalog"
          git push origin HEAD:tmp/phase21-3-hidden-character-traits
