name: Phase21-3 Task5 Discovery Handoff Probe

on:
  push:
    branches:
      - tmp/phase21-3-hidden-character-traits

permissions:
  contents: write

jobs:
  task5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Add Task5 failing tests
        shell: bash
        run: |
          mkdir -p tests/unit/domain/events
          cat > tests/unit/domain/events/phase21CharacterTraitEventDiscovery.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { createInitialGame } from "../../../../src/app/createInitialGame";
          import { loadGameData } from "../../../../src/data/dataRegistry";
          import { rawGameData } from "../../../../src/data/rawGameData";
          import { resolveEventChoice } from "../../../../src/domain/events/resolveEventChoice";
          import { eventId } from "../../../../src/domain/model/identifiers";
          import { SeededRandom } from "../../../../src/domain/random/SeededRandom";
          import type { EventDefinition } from "../../../../src/domain/validation/gameDataSchema";

          const baseData = loadGameData(rawGameData);

          function createState() {
            const state = createInitialGame({
              seed: "phase21-event-discovery",
              schoolName: "青葉高校",
              schoolShortName: "青葉",
              coachName: "高橋 監督",
              regionId: "region.chiba",
              uniform: {
                primary: "#17365D",
                secondary: "#FFFFFF",
                accent: "#D99B2B",
              },
            });
            for (const player of Object.values(state.players)) {
              player.hiddenTraitIds = [];
              player.revealedHiddenTraitIds = [];
              player.hiddenTraitAssignmentInitialized = true;
            }
            return state;
          }

          describe("Phase21 event-tag character trait discovery", () => {
            it("reveals an assigned event-tag trait from the resolved event context", () => {
              const state = createState();
              const playerId = state.schools[state.userSchoolId]!.playerIds[0]!;
              const player = state.players[playerId]!;
              player.hiddenTraitIds = ["character.analytical"];
              player.revealedHiddenTraitIds = [];
              player.career.appearances = 0;

              const event: EventDefinition = {
                id: "event.phase21-analysis-reveal",
                version: 1,
                category: "individual",
                title: "映像分析",
                bodyTemplate: "映像を見返した。",
                tags: ["analysis"],
                trigger: {},
                weight: 1,
                cooldownWeeks: 0,
                oncePerCareer: false,
                actorCount: 1,
                choices: [
                  {
                    id: "observe",
                    label: "分析する",
                    detail: "映像を確認する",
                    effects: [{ type: "trust-change", amount: 0 }],
                  },
                  {
                    id: "skip",
                    label: "切り上げる",
                    detail: "今日はここまでにする",
                    effects: [{ type: "morale-change", amount: 0 }],
                  },
                ],
              };
              const data = {
                ...baseData,
                events: new Map([...baseData.events, [event.id, event]]),
              };
              state.pendingEvent = {
                eventId: eventId(event.id),
                actorPlayerIds: [playerId],
                targetSchoolId: null,
                surfacedDate: state.date,
                choiceIds: event.choices.map((choice) => choice.id),
                chainId: null,
                chainStage: null,
              };

              const result = resolveEventChoice(
                state,
                "observe",
                data,
                new SeededRandom(state.seed, state.randomCursor),
              );

              expect(result.characterTraitDiscoveries).toEqual([
                { playerId, traitId: "character.analytical" },
              ]);
              expect(result.state.players[playerId]!.revealedHiddenTraitIds).toEqual([
                "character.analytical",
              ]);
              expect(result.occurrence.visibleResultCodes).not.toContain(
                "character.analytical",
              );
            });
          });
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path("tests/unit/worker/gameAction.test.ts")
          text = path.read_text(encoding="utf-8")
          marker = 'describe("game action route", () => {\n'
          if 'reveals an eligible trait after a canonical action without surfacing a new event' not in text:
              addition = '''  it("reveals an eligible trait after a canonical action without surfacing a new event", async () => {
            const snapshot = createSnapshot();
            for (const player of Object.values(snapshot.state.players)) {
              player.hiddenTraitIds = [];
              player.revealedHiddenTraitIds = [];
              player.hiddenTraitAssignmentInitialized = true;
            }
            const playerId = snapshot.state.schools[snapshot.state.userSchoolId]!.playerIds[0]!;
            const player = snapshot.state.players[playerId]!;
            player.hiddenTraitIds = ["character.training-lover"];
            player.trust = 65;
            snapshot.state.pendingEvent = null;
            const store = createStore(snapshot);
            const handler = createGameActionHandler(store);

            const response = await handler(
              actionRequest({
                ...operation,
                action: {
                  type: "team-selection",
                  selection: snapshot.teamSelection,
                },
              }),
              { id: "user-123" },
            );

            expect(response.status).toBe(200);
            const [persisted] = vi.mocked(store.applyOperation).mock.calls[0]!;
            expect(persisted.state.players[playerId]!.revealedHiddenTraitIds).toEqual([
              "character.training-lover",
            ]);
            expect(persisted.state.pendingEvent).toBeNull();
          });

          '''
              if marker not in text:
                  raise SystemExit("game action describe marker missing")
              text = text.replace(marker, marker + addition, 1)
              path.write_text(text, encoding="utf-8")
          PY
          npx prettier tests/unit/domain/events/phase21CharacterTraitEventDiscovery.test.ts tests/unit/worker/gameAction.test.ts --write
          git diff --check
      - name: Prove Task5 RED
        id: red
        continue-on-error: true
        run: npx vitest run tests/unit/domain/events/phase21CharacterTraitEventDiscovery.test.ts tests/unit/worker/gameAction.test.ts
      - name: Assert Task5 was RED before implementation
        run: test "${{ steps.red.outcome }}" = "failure"
      - name: Implement Task5 discovery handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          event_path = Path("src/domain/events/resolveEventChoice.ts")
          event = event_path.read_text(encoding="utf-8")
          if 'player/characterTraitDiscovery' not in event:
              marker = 'import type { GameDataRegistry } from "../../data/dataRegistry";\n'
              if marker not in event:
                  raise SystemExit("resolveEventChoice import marker missing")
              event = event.replace(
                  marker,
                  marker + 'import {\n  discoverEligibleCharacterTraits,\n  type CharacterTraitDiscovery,\n} from "../player/characterTraitDiscovery";\n',
                  1,
              )
          old_interface = '''export interface ResolveEventChoiceResult {
            state: GameState;
            occurrence: EventOccurrence;
            specialRelationshipTransitions: SpecialRelationshipTransition[];
          }
          '''
          if 'characterTraitDiscoveries: CharacterTraitDiscovery[];' not in event:
              new_interface = '''export interface ResolveEventChoiceResult {
            state: GameState;
            occurrence: EventOccurrence;
            specialRelationshipTransitions: SpecialRelationshipTransition[];
            characterTraitDiscoveries: CharacterTraitDiscovery[];
          }
          '''
              if old_interface not in event:
                  raise SystemExit("resolveEventChoice result interface marker missing")
              event = event.replace(old_interface, new_interface, 1)
          old_return = '  return { state: nextState, occurrence, specialRelationshipTransitions };\n'
          if old_return in event:
              new_return = '''  const characterTraitDiscovery = discoverEligibleCharacterTraits(
            nextState,
            data,
            {
              eventTags: event.tags,
              captainPlayerId: nextState.teamDynamics.captainPlayerId,
              viceCaptainPlayerId: nextState.teamDynamics.viceCaptainPlayerId,
            },
          );
          nextState = characterTraitDiscovery.state;

          return {
            state: nextState,
            occurrence,
            specialRelationshipTransitions,
            characterTraitDiscoveries: characterTraitDiscovery.discoveries,
          };
          '''
              event = event.replace(old_return, new_return, 1)
          elif 'characterTraitDiscoveries: characterTraitDiscovery.discoveries' not in event:
              raise SystemExit("resolveEventChoice return marker missing")
          event_path.write_text(event, encoding="utf-8")

          worker_path = Path("worker/game/applyGameAction.ts")
          worker = worker_path.read_text(encoding="utf-8")
          if 'player/characterTraitDiscovery' not in worker:
              marker = 'import { ensureCharacterTraitAssignments } from "../../src/domain/player/characterTraitAssignment";\n'
              if marker not in worker:
                  raise SystemExit("worker assignment import marker missing")
              worker = worker.replace(
                  marker,
                  marker + 'import {\n  discoverEligibleCharacterTraits,\n  type CharacterTraitDiscovery,\n} from "../../src/domain/player/characterTraitDiscovery";\n',
                  1,
              )
          interface_marker = '''export interface AppliedGameAction {
            state: GameState;
            teamSelection: TeamSelection;
            outcome?: unknown;
          }
          '''
          if 'characterTraitDiscoveries?: CharacterTraitDiscovery[];' not in worker:
              replacement = '''export interface AppliedGameAction {
            state: GameState;
            teamSelection: TeamSelection;
            outcome?: unknown;
            characterTraitDiscoveries?: CharacterTraitDiscovery[];
          }
          '''
              if interface_marker not in worker:
                  raise SystemExit("AppliedGameAction marker missing")
              worker = worker.replace(interface_marker, replacement, 1)

          event_return_marker = '''      teamSelection,
                outcome: resolution.occurrence,
              };
          '''
          if 'characterTraitDiscoveries: resolution.characterTraitDiscoveries' not in worker:
              replacement = '''      teamSelection,
                outcome: resolution.occurrence,
                characterTraitDiscoveries: resolution.characterTraitDiscoveries,
              };
          '''
              if event_return_marker not in worker:
                  raise SystemExit("event action return marker missing")
              worker = worker.replace(event_return_marker, replacement, 1)

          old_header = '''export function applyGameAction(
            snapshot: CloudGameSnapshot,
            action: GameAction,
            context: ApplyGameActionContext = {},
          ): AppliedGameAction {
            const state = ensureCharacterTraitAssignments(
              structuredClone(snapshot.state) as GameState,
              gameData,
            );
            const teamSelection = cloneTeamSelection(snapshot.teamSelection);

            switch (action.type) {
          '''
          if 'function applyActionByType(' not in worker:
              new_header = '''function applyActionByType(
            state: GameState,
            teamSelection: TeamSelection,
            action: GameAction,
            context: ApplyGameActionContext,
          ): AppliedGameAction {
            switch (action.type) {
          '''
              if old_header not in worker:
                  raise SystemExit("applyGameAction header marker missing")
              worker = worker.replace(old_header, new_header, 1)

          if 'const finalized = discoverEligibleCharacterTraits(applied.state, gameData' not in worker:
              wrapper = '''

          export function applyGameAction(
            snapshot: CloudGameSnapshot,
            action: GameAction,
            context: ApplyGameActionContext = {},
          ): AppliedGameAction {
            const state = ensureCharacterTraitAssignments(
              structuredClone(snapshot.state) as GameState,
              gameData,
            );
            const teamSelection = cloneTeamSelection(snapshot.teamSelection);
            const applied = applyActionByType(state, teamSelection, action, context);
            const finalized = discoverEligibleCharacterTraits(applied.state, gameData, {
              captainPlayerId: applied.state.teamDynamics.captainPlayerId,
              viceCaptainPlayerId: applied.state.teamDynamics.viceCaptainPlayerId,
            });
            const characterTraitDiscoveries = [
              ...(applied.characterTraitDiscoveries ?? []),
              ...finalized.discoveries,
            ].sort(
              (left, right) =>
                left.playerId.localeCompare(right.playerId) ||
                left.traitId.localeCompare(right.traitId),
            );

            return {
              state: finalized.state,
              teamSelection: applied.teamSelection,
              ...(applied.outcome !== undefined ? { outcome: applied.outcome } : {}),
              ...(characterTraitDiscoveries.length > 0
                ? { characterTraitDiscoveries }
                : {}),
            };
          }
          '''
              worker = worker.rstrip() + wrapper
          worker_path.write_text(worker, encoding="utf-8")
          PY
          npx prettier src/domain/events/resolveEventChoice.ts worker/game/applyGameAction.ts tests/unit/domain/events/phase21CharacterTraitEventDiscovery.test.ts tests/unit/worker/gameAction.test.ts --write
          git diff --check
      - name: Run Task5 GREEN regression
        run: npx vitest run tests/unit/domain/events/phase21CharacterTraitEventDiscovery.test.ts tests/unit/worker/gameAction.test.ts tests/unit/worker/applyGameAction.test.ts tests/unit/domain/player/characterTraitDiscovery.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified Task5 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/events/resolveEventChoice.ts worker/game/applyGameAction.ts tests/unit/domain/events/phase21CharacterTraitEventDiscovery.test.ts tests/unit/worker/gameAction.test.ts
          if git diff --cached --quiet; then
            echo "Task5 changes already committed"
            exit 0
          fi
          git commit -m "feat: reveal character traits from gameplay context"
          git push origin HEAD:tmp/phase21-3-hidden-character-traits
