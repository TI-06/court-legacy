name: Phase21-3 Legacy Fixture Repair

on:
  push:
    branches:
      - tmp/phase21-3-hidden-character-traits

permissions:
  contents: write

jobs:
  repair-fixtures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Align legacy and training fixtures with Phase21 backfill contract
        shell: bash
        run: |
          cat > tests/unit/persistence/phase21LegacyCharacterTraitTestHelpers.ts <<'EOF'
          export function stripCharacterTraitFieldsFromLegacyPlayers(
            players: unknown,
          ): void {
            const record = players as Record<string, Record<string, unknown>>;
            for (const player of Object.values(record)) {
              delete player.hiddenTraitIds;
              delete player.revealedHiddenTraitIds;
              delete player.hiddenTraitAssignmentInitialized;
            }
          }

          export function withoutCharacterTraitFields(
            players: unknown,
          ): Record<string, unknown> {
            const record = players as Record<string, unknown>;
            return Object.fromEntries(
              Object.entries(record).map(([playerId, player]) => {
                const copy = structuredClone(player) as Record<string, unknown>;
                delete copy.hiddenTraitIds;
                delete copy.revealedHiddenTraitIds;
                delete copy.hiddenTraitAssignmentInitialized;
                return [playerId, copy];
              }),
            );
          }

          export function hasPendingCharacterTraitAssignments(
            players: unknown,
          ): boolean {
            const record = players as Record<
              string,
              {
                hiddenTraitIds?: unknown;
                revealedHiddenTraitIds?: unknown;
                hiddenTraitAssignmentInitialized?: unknown;
              }
            >;
            return Object.values(record).every(
              (player) =>
                player.hiddenTraitAssignmentInitialized === false &&
                Array.isArray(player.hiddenTraitIds) &&
                player.hiddenTraitIds.length === 0 &&
                Array.isArray(player.revealedHiddenTraitIds) &&
                player.revealedHiddenTraitIds.length === 0,
            );
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          migration_files = [
              "tests/unit/persistence/phase6GameStateMigration.test.ts",
              "tests/unit/persistence/phase7GameStateMigration.test.ts",
              "tests/unit/persistence/phase8GameStateMigration.test.ts",
              "tests/unit/persistence/phase10GameStateMigration.test.ts",
          ]
          helper_import = '''import {
            hasPendingCharacterTraitAssignments,
            stripCharacterTraitFieldsFromLegacyPlayers,
            withoutCharacterTraitFields,
          } from "./phase21LegacyCharacterTraitTestHelpers";
          '''

          for filename in migration_files:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if 'phase21LegacyCharacterTraitTestHelpers' not in text:
                  codec_import = 'import { decodeGameState } from "../../../src/persistence/gameStateCodec";\n'
                  if codec_import not in text:
                      raise SystemExit(f"codec import marker missing: {filename}")
                  text = text.replace(codec_import, codec_import + helper_import, 1)

              if 'stripCharacterTraitFieldsFromLegacyPlayers(legacy.players);' not in text:
                  delete_markers = [
                      '    delete legacy.officialSeason;\n',
                      '    delete legacy.teamDynamics;\n',
                      '    delete legacy.weeklySchedule;\n',
                      '    delete legacy.notifications;\n',
                  ]
                  insertion = '''    stripCharacterTraitFieldsFromLegacyPlayers(legacy.players);
          '''
                  for marker in delete_markers:
                      if marker in text:
                          text = text.replace(marker, insertion + marker, 1)
                          break
                  else:
                      raise SystemExit(f"legacy delete marker missing: {filename}")

              exact_candidates = [
                  '    expect(migrated.players).toEqual(originalPlayers);\n',
                  '    expect(migrated.players).toEqual(current.players);\n',
              ]
              if 'hasPendingCharacterTraitAssignments(migrated.players)' not in text:
                  replacement = '''    expect(withoutCharacterTraitFields(migrated.players)).toEqual(
                withoutCharacterTraitFields(ORIGINAL_PLAYERS),
              );
              expect(hasPendingCharacterTraitAssignments(migrated.players)).toBe(true);
          '''
                  replaced = False
                  for candidate in exact_candidates:
                      if candidate in text:
                          original_expr = 'originalPlayers' if 'originalPlayers' in candidate else 'current.players'
                          text = text.replace(
                              candidate,
                              replacement.replace('ORIGINAL_PLAYERS', original_expr),
                              1,
                          )
                          replaced = True
                          break
                  if not replaced:
                      raise SystemExit(f"player equality marker missing: {filename}")

              path.write_text(text, encoding="utf-8")

          deferred_path = Path("tests/unit/worker/deferredTrainingPlan.test.ts")
          deferred = deferred_path.read_text(encoding="utf-8")
          if 'deferred-training fixture intentionally disables unrelated Phase21 trait discovery' not in deferred:
              marker = '''  });

            return {
          '''
              replacement = '''  });

            // This suite isolates deferred training behavior. Trait discovery has its own
            // focused coverage and must not add unrelated player/notification changes here.
            for (const player of Object.values(state.players)) {
              player.hiddenTraitIds = [];
              player.revealedHiddenTraitIds = [];
              player.hiddenTraitAssignmentInitialized = true;
            }
            // deferred-training fixture intentionally disables unrelated Phase21 trait discovery

            return {
          '''
              if marker not in deferred:
                  raise SystemExit("deferred snapshot return marker missing")
              deferred = deferred.replace(marker, replacement, 1)
              deferred_path.write_text(deferred, encoding="utf-8")
          PY
          npx prettier \
            tests/unit/persistence/phase21LegacyCharacterTraitTestHelpers.ts \
            tests/unit/persistence/phase6GameStateMigration.test.ts \
            tests/unit/persistence/phase7GameStateMigration.test.ts \
            tests/unit/persistence/phase8GameStateMigration.test.ts \
            tests/unit/persistence/phase10GameStateMigration.test.ts \
            tests/unit/worker/deferredTrainingPlan.test.ts --write
          git diff --check
      - name: Run previously failing suites
        run: |
          npx vitest run \
            tests/unit/worker/deferredTrainingPlan.test.ts \
            tests/unit/persistence/phase6GameStateMigration.test.ts \
            tests/unit/persistence/phase7GameStateMigration.test.ts \
            tests/unit/persistence/phase8GameStateMigration.test.ts \
            tests/unit/persistence/phase10GameStateMigration.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified fixture repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/unit/persistence/phase21LegacyCharacterTraitTestHelpers.ts \
            tests/unit/persistence/phase6GameStateMigration.test.ts \
            tests/unit/persistence/phase7GameStateMigration.test.ts \
            tests/unit/persistence/phase8GameStateMigration.test.ts \
            tests/unit/persistence/phase10GameStateMigration.test.ts \
            tests/unit/worker/deferredTrainingPlan.test.ts
          if git diff --cached --quiet; then
            echo "Fixture repairs already committed"
            exit 0
          fi
          git commit -m "test: isolate phase21 trait backfill fixtures"
          git push origin HEAD:tmp/phase21-3-hidden-character-traits
