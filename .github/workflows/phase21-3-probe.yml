name: Phase21-3 Task6 Notification Probe

on:
  push:
    branches:
      - tmp/phase21-3-hidden-character-traits

permissions:
  contents: write

jobs:
  task6:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Add Task6 failing tests
        shell: bash
        run: |
          mkdir -p tests/unit/notifications
          cat > tests/unit/notifications/phase21CharacterTraitNotifications.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { createInitialGame } from "../../../src/app/createInitialGame";
          import { gameData } from "../../../src/app/createDemoGame";
          import {
            appendNotification,
            buildCharacterTraitDiscoveredNotification,
            selectHomeCharacterTraitNotifications,
          } from "../../../src/domain/notifications/gameNotifications";

          function createState() {
            return createInitialGame({
              seed: "phase21-trait-notification",
              schoolName: "青葉高校",
              schoolShortName: "青葉",
              coachName: "高橋 監督",
              regionId: "region.chiba",
              uniform: {
                primary: "#17365D",
                secondary: "#FFFFFF",
                accent: "#D99B2B",
              },
            });
          }

          describe("Phase21 character trait discovery notifications", () => {
            it("builds player and trait display data from canonical state and registry", () => {
              const state = createState();
              const playerId = state.schools[state.userSchoolId]!.playerIds[0]!;
              const player = state.players[playerId]!;
              const trait = gameData.characterTraits.get("character.training-lover")!;

              const notification = buildCharacterTraitDiscoveredNotification(
                state,
                { playerId, traitId: trait.id },
                gameData,
              );

              expect(notification).toMatchObject({
                type: "character-trait-discovered",
                createdGameDate: state.date,
                academicYearIndex: state.yearIndex,
                weekOfYear: state.calendar.weekOfYear,
                readAtGameDate: null,
                payload: {
                  playerId,
                  displayName: `${player.lastName} ${player.firstName}`,
                  traitId: trait.id,
                  traitName: trait.name,
                  description: trait.description,
                },
              });
            });

            it("retains only the newest discovery notification of this type", () => {
              const state = createState();
              const [firstPlayerId, secondPlayerId] = state.schools[state.userSchoolId]!.playerIds;
              const first = buildCharacterTraitDiscoveredNotification(
                state,
                { playerId: firstPlayerId!, traitId: "character.training-lover" },
                gameData,
              );
              const second = buildCharacterTraitDiscoveredNotification(
                state,
                { playerId: secondPlayerId!, traitId: "character.team-first" },
                gameData,
              );

              const once = appendNotification({ items: [] }, first);
              const twice = appendNotification(once, second);
              const duplicate = appendNotification(twice, second);

              expect(twice.items).toEqual([second]);
              expect(duplicate).toBe(twice);
              expect(selectHomeCharacterTraitNotifications(twice)).toEqual([second]);
            });
          });
          EOF

          python - <<'PY'
          from pathlib import Path

          route_path = Path("tests/unit/worker/gameAction.test.ts")
          route = route_path.read_text(encoding="utf-8")
          marker = '''    expect(persisted.state.pendingEvent).toBeNull();
          '''
          if 'character-trait-discovered' not in route:
              replacement = '''    expect(persisted.state.pendingEvent).toBeNull();
              expect(persisted.state.notifications.items).toEqual(
                expect.arrayContaining([
                  expect.objectContaining({
                    type: "character-trait-discovered",
                    payload: expect.objectContaining({
                      playerId,
                      traitId: "character.training-lover",
                    }),
                  }),
                ]),
              );
          '''
              if marker not in route:
                  raise SystemExit("route notification assertion marker missing")
              route = route.replace(marker, replacement, 1)
              route_path.write_text(route, encoding="utf-8")

          home_path = Path("tests/unit/features/home/HomeScreen.test.tsx")
          home = home_path.read_text(encoding="utf-8")
          if 'buildCharacterTraitDiscoveredNotification' not in home:
              home = home.replace(
                  'import type { TrainingResultNotification } from "../../../../src/domain/notifications/gameNotifications";\n',
                  'import {\n  buildCharacterTraitDiscoveredNotification,\n  type TrainingResultNotification,\n} from "../../../../src/domain/notifications/gameNotifications";\n',
                  1,
              )
          test_marker = '  it("disables conflicting actions while an authoritative operation is pending", () => {\n'
          if 'shows a compact character trait discovery without opening a fullscreen event' not in home:
              addition = '''  it("shows a compact character trait discovery without opening a fullscreen event", () => {
                const props = createProps();
                const playerId = props.state.schools[props.state.userSchoolId]!.playerIds[0]!;
                const notification = buildCharacterTraitDiscoveredNotification(
                  props.state,
                  { playerId, traitId: "character.training-lover" },
                  gameData,
                );
                props.state.notifications.items = [notification];

                render(<HomeScreen {...props} />);

                expect(screen.getByText("新しい個性を発見！")).toBeInTheDocument();
                expect(screen.queryByTestId("fullscreen-event")).not.toBeInTheDocument();
                fireEvent.click(
                  screen.getByRole("button", { name: /新しい個性を発見！/ }),
                );
                expect(props.onMarkNotificationRead).toHaveBeenCalledWith(notification.id);
              });

          '''
              if test_marker not in home:
                  raise SystemExit("HomeScreen test marker missing")
              home = home.replace(test_marker, addition + test_marker, 1)
              home_path.write_text(home, encoding="utf-8")
          PY
          npx prettier tests/unit/notifications/phase21CharacterTraitNotifications.test.ts tests/unit/worker/gameAction.test.ts tests/unit/features/home/HomeScreen.test.tsx --write
          git diff --check
      - name: Prove Task6 RED
        id: red
        continue-on-error: true
        run: npx vitest run tests/unit/notifications/phase21CharacterTraitNotifications.test.ts tests/unit/worker/gameAction.test.ts tests/unit/features/home/HomeScreen.test.tsx
      - name: Assert Task6 was RED before implementation
        run: test "${{ steps.red.outcome }}" = "failure"
      - name: Implement Task6 notification pipeline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          notifications_path = Path("src/domain/notifications/gameNotifications.ts")
          text = notifications_path.read_text(encoding="utf-8")
          if 'player/characterTraitDiscovery' not in text:
              marker = 'import type { Position } from "../model/Player";\n'
              text = text.replace(
                  marker,
                  marker + 'import type { CharacterTraitDiscovery } from "../player/characterTraitDiscovery";\n',
                  1,
              )
          if 'export interface CharacterTraitDiscoveredNotification' not in text:
              marker = '''export type GameNotification =
          '''
              block = '''export interface CharacterTraitDiscoveredNotification {
            id: string;
            type: "character-trait-discovered";
            createdGameDate: GameDate;
            academicYearIndex: number;
            weekOfYear: number;
            readAtGameDate: GameDate | null;
            payload: {
              playerId: PlayerId;
              displayName: string;
              traitId: string;
              traitName: string;
              description: string;
            };
          }

          '''
              if marker not in text:
                  raise SystemExit("notification union marker missing")
              text = text.replace(marker, block + marker, 1)
          old_union = '''export type GameNotification =
            | TrainingResultNotification
            | ConcernResolutionNotification
            | SpecialRelationshipNotification;
          '''
          if '| CharacterTraitDiscoveredNotification' not in text:
              new_union = '''export type GameNotification =
            | TrainingResultNotification
            | ConcernResolutionNotification
            | SpecialRelationshipNotification
            | CharacterTraitDiscoveredNotification;
          '''
              if old_union not in text:
                  raise SystemExit("notification union block missing")
              text = text.replace(old_union, new_union, 1)
          if 'buildCharacterTraitDiscoveredNotification(' not in text:
              marker = 'export function appendNotification(\n'
              builder = '''export function buildCharacterTraitDiscoveredNotification(
            state: GameState,
            discovery: CharacterTraitDiscovery,
            data: GameDataRegistry,
          ): CharacterTraitDiscoveredNotification {
            const player = state.players[discovery.playerId];
            if (!player) {
              throw new Error(
                `character trait notification references unknown player: ${discovery.playerId}`,
              );
            }
            const trait = data.characterTraits.get(discovery.traitId);
            if (!trait) {
              throw new Error(
                `character trait notification references unknown trait: ${discovery.traitId}`,
              );
            }

            return {
              id: `character-trait-discovered:${state.userSchoolId}:${state.yearIndex}:${state.calendar.weekOfYear}:${state.date}:${discovery.playerId}:${discovery.traitId}`,
              type: "character-trait-discovered",
              createdGameDate: state.date,
              academicYearIndex: state.yearIndex,
              weekOfYear: state.calendar.weekOfYear,
              readAtGameDate: null,
              payload: {
                playerId: player.id,
                displayName: `${player.lastName} ${player.firstName}`,
                traitId: trait.id,
                traitName: trait.name,
                description: trait.description,
              },
            };
          }

          '''
              if marker not in text:
                  raise SystemExit("appendNotification marker missing")
              text = text.replace(marker, builder + marker, 1)
          if 'selectHomeCharacterTraitNotifications' not in text:
              text = text.rstrip() + '''

          export function selectHomeCharacterTraitNotifications(
            state: GameNotificationState,
          ): CharacterTraitDiscoveredNotification[] {
            const items = state.items.filter(
              (item): item is CharacterTraitDiscoveredNotification =>
                item.type === "character-trait-discovered",
            );
            const newest = items[items.length - 1];
            return newest ? [newest] : [];
          }
          '''
          notifications_path.write_text(text, encoding="utf-8")

          worker_path = Path("worker/game/applyGameAction.ts")
          worker = worker_path.read_text(encoding="utf-8")
          if 'type { GameDataRegistry }' not in worker:
              worker = worker.replace(
                  'import { gameDataBootstrap } from "../../src/data/gameData";\n',
                  'import type { GameDataRegistry } from "../../src/data/dataRegistry";\nimport { gameDataBootstrap } from "../../src/data/gameData";\n',
                  1,
              )
          if 'buildCharacterTraitDiscoveredNotification' not in worker:
              worker = worker.replace(
                  '  appendNotification,\n',
                  '  appendNotification,\n  buildCharacterTraitDiscoveredNotification,\n',
                  1,
              )
          helper_marker = 'function applyTraining(\n'
          if 'function appendCharacterTraitDiscoveryNotifications(' not in worker:
              helper = '''function appendCharacterTraitDiscoveryNotifications(
            applied: AppliedGameAction,
            discoveries: readonly CharacterTraitDiscovery[],
            data: GameDataRegistry,
          ): AppliedGameAction {
            if (discoveries.length === 0) {
              return applied;
            }
            let notifications = applied.state.notifications;
            for (const discovery of discoveries) {
              notifications = appendNotification(
                notifications,
                buildCharacterTraitDiscoveredNotification(
                  applied.state,
                  discovery,
                  data,
                ),
              );
            }
            return notifications === applied.state.notifications
              ? applied
              : {
                  ...applied,
                  state: { ...applied.state, notifications },
                };
          }

          '''
              if helper_marker not in worker:
                  raise SystemExit("worker helper marker missing")
              worker = worker.replace(helper_marker, helper + helper_marker, 1)
          old_return = '''  return {
            state: finalized.state,
            teamSelection: applied.teamSelection,
            ...(applied.outcome !== undefined ? { outcome: applied.outcome } : {}),
            ...(characterTraitDiscoveries.length > 0
              ? { characterTraitDiscoveries }
              : {}),
          };
          '''
          if 'appendCharacterTraitDiscoveryNotifications(' not in worker.split('export function applyGameAction', 1)[1]:
              new_return = '''  const finalizedApplied: AppliedGameAction = {
            state: finalized.state,
            teamSelection: applied.teamSelection,
            ...(applied.outcome !== undefined ? { outcome: applied.outcome } : {}),
            ...(characterTraitDiscoveries.length > 0
              ? { characterTraitDiscoveries }
              : {}),
          };

          return appendCharacterTraitDiscoveryNotifications(
            finalizedApplied,
            characterTraitDiscoveries,
            gameData,
          );
          '''
              if old_return not in worker:
                  raise SystemExit("worker final return marker missing")
              worker = worker.replace(old_return, new_return, 1)
          worker_path.write_text(worker, encoding="utf-8")

          model_path = Path("src/features/home/homeCommandCenter.ts")
          model = model_path.read_text(encoding="utf-8")
          if 'selectHomeCharacterTraitNotifications' not in model:
              model = model.replace(
                  '  selectHomeConcernResolutionNotifications,\n',
                  '  selectHomeCharacterTraitNotifications,\n  selectHomeConcernResolutionNotifications,\n',
                  1,
              )
              model = model.replace(
                  '  type ConcernResolutionNotification,\n',
                  '  type CharacterTraitDiscoveredNotification,\n  type ConcernResolutionNotification,\n',
                  1,
              )
          union_marker = '''  | {
              id: string;
              kind: "growth";
          '''
          if 'kind: "character-trait-discovered"' not in model:
              block = '''  | {
              id: string;
              kind: "character-trait-discovered";
              title: string;
              detail: string;
              notification: CharacterTraitDiscoveredNotification;
            }
          '''
              if union_marker not in model:
                  raise SystemExit("HomeCommandNews union marker missing")
              model = model.replace(union_marker, block + union_marker, 1)
          selection_marker = '''  const specialRelationship = selectHomeSpecialRelationshipNotifications(
            state.notifications,
          )[0];
          '''
          if 'const characterTraitDiscovery =' not in model:
              addition = '''  const characterTraitDiscovery = selectHomeCharacterTraitNotifications(
            state.notifications,
          )[0];
          '''
              if selection_marker not in model:
                  raise SystemExit("home news selection marker missing")
              model = model.replace(selection_marker, selection_marker + addition, 1)
          insertion_marker = '  if (notification) {\n'
          if 'news:character-trait:' not in model:
              block = '''  if (characterTraitDiscovery) {
            candidates.push({
              order: characterTraitDiscovery.readAtGameDate === null ? 3 : 43,
              news: {
                id: `news:character-trait:${characterTraitDiscovery.id}`,
                kind: "character-trait-discovered",
                title: "新しい個性を発見！",
                detail: `${characterTraitDiscovery.payload.displayName}・${characterTraitDiscovery.payload.traitName}`,
                notification: characterTraitDiscovery,
              },
            });
          }

          '''
              if insertion_marker not in model:
                  raise SystemExit("home news insertion marker missing")
              model = model.replace(insertion_marker, block + insertion_marker, 1)
          model_path.write_text(model, encoding="utf-8")

          center_path = Path("src/features/home/HomeCommandCenter.tsx")
          center = center_path.read_text(encoding="utf-8")
          if 'CharacterTraitDiscoveredNotification' not in center:
              center = center.replace(
                  'import type {\n  SpecialRelationshipNotification,\n',
                  'import type {\n  CharacterTraitDiscoveredNotification,\n  SpecialRelationshipNotification,\n',
                  1,
              )
          props_marker = '''  onOpenRelationshipNotification: (
            notification: SpecialRelationshipNotification,
          ) => void;
          '''
          if 'onAcknowledgeCharacterTraitNotification' not in center:
              addition = '''  onAcknowledgeCharacterTraitNotification: (
            notification: CharacterTraitDiscoveredNotification,
          ) => void;
          '''
              if props_marker not in center:
                  raise SystemExit("HomeCommandCenter props marker missing")
              center = center.replace(props_marker, props_marker + addition, 1)
              center = center.replace(
                  '  onOpenRelationshipNotification,\n}: HomeCommandCenterProps) {',
                  '  onOpenRelationshipNotification,\n  onAcknowledgeCharacterTraitNotification,\n}: HomeCommandCenterProps) {',
                  1,
              )
          render_marker = '              if (news.kind === "growth") {\n'
          if 'news.kind === "character-trait-discovered"' not in center:
              block = '''              if (news.kind === "character-trait-discovered") {
                const unread = news.notification.readAtGameDate === null;
                return (
                  <button
                    aria-label={`${news.title} ${news.detail}`}
                    className={`home-command-news-row${unread ? " is-unread" : ""}`}
                    data-testid="home-command-news"
                    key={news.id}
                    onClick={() =>
                      onAcknowledgeCharacterTraitNotification(news.notification)
                    }
                    type="button"
                  >
                    <span>
                      <strong>{news.title}</strong>
                      <small>{news.detail}</small>
                    </span>
                    <b aria-hidden="true">›</b>
                  </button>
                );
              }
          '''
              if render_marker not in center:
                  raise SystemExit("HomeCommandCenter render marker missing")
              center = center.replace(render_marker, block + render_marker, 1)
          center_path.write_text(center, encoding="utf-8")

          home_path = Path("src/features/home/HomeScreen.tsx")
          home = home_path.read_text(encoding="utf-8")
          if 'CharacterTraitDiscoveredNotification' not in home:
              home = home.replace(
                  'import type {\n  SpecialRelationshipNotification,\n',
                  'import type {\n  CharacterTraitDiscoveredNotification,\n  SpecialRelationshipNotification,\n',
                  1,
              )
          relationship_handler = '''  const acknowledgeRelationshipNotification = (
            notification: SpecialRelationshipNotification,
          ) => {
            if (notification.readAtGameDate === null) {
              void onMarkNotificationRead(notification.id);
            }
          };
          '''
          if 'acknowledgeCharacterTraitNotification' not in home:
              addition = '''

          const acknowledgeCharacterTraitNotification = (
            notification: CharacterTraitDiscoveredNotification,
          ) => {
            if (notification.readAtGameDate === null) {
              void onMarkNotificationRead(notification.id);
            }
          };
          '''
              if relationship_handler not in home:
                  raise SystemExit("HomeScreen handler marker missing")
              home = home.replace(
                  relationship_handler,
                  relationship_handler + addition,
                  1,
              )
              home = home.replace(
                  '        onOpenRelationshipNotification={acknowledgeRelationshipNotification}\n',
                  '        onOpenRelationshipNotification={acknowledgeRelationshipNotification}\n        onAcknowledgeCharacterTraitNotification={acknowledgeCharacterTraitNotification}\n',
                  1,
              )
          home_path.write_text(home, encoding="utf-8")
          PY
          npx prettier src/domain/notifications/gameNotifications.ts worker/game/applyGameAction.ts src/features/home/homeCommandCenter.ts src/features/home/HomeCommandCenter.tsx src/features/home/HomeScreen.tsx tests/unit/notifications/phase21CharacterTraitNotifications.test.ts tests/unit/worker/gameAction.test.ts tests/unit/features/home/HomeScreen.test.tsx --write
          git diff --check
      - name: Run Task6 GREEN regression
        run: npx vitest run tests/unit/notifications/phase21CharacterTraitNotifications.test.ts tests/unit/worker/gameAction.test.ts tests/unit/features/home/HomeScreen.test.tsx tests/unit/worker/applyGameAction.test.ts tests/unit/domain/events/phase21CharacterTraitEventDiscovery.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified Task6 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/notifications/gameNotifications.ts worker/game/applyGameAction.ts src/features/home/homeCommandCenter.ts src/features/home/HomeCommandCenter.tsx src/features/home/HomeScreen.tsx tests/unit/notifications/phase21CharacterTraitNotifications.test.ts tests/unit/worker/gameAction.test.ts tests/unit/features/home/HomeScreen.test.tsx
          if git diff --cached --quiet; then
            echo "Task6 changes already committed"
            exit 0
          fi
          git commit -m "feat: notify discovered character traits"
          git push origin HEAD:tmp/phase21-3-hidden-character-traits
