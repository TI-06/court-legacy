name: Phase16 PvP public contract GREEN

on:
  push:
    branches: [feat/phase16-official-pvp-completion]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier --write worker/pvp/pvpMatchSession.ts tests/unit/worker/phase16PvpMatchSession.test.ts
      - run: npx vitest run tests/unit/worker/phase16PvpMatchSession.test.ts tests/unit/worker/phase16PvpChallengeRoutes.test.ts tests/unit/worker/phase16PvpCommandResumeRoutes.test.ts tests/unit/worker/phase16PvpCommandFinalizationRoutes.test.ts
      - run: npm run typecheck
      - name: Cleanup and commit
        if: always()
        run: |
          git rm .github/workflows/phase16-pvp-public-contract-green.yml
          git add worker/pvp/pvpMatchSession.ts tests/unit/worker/phase16PvpMatchSession.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: finalize safe PvP public command state"
          git push
