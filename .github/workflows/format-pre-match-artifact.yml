name: Format Pre-Match Artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'feat/pre-match-lineup-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Format changed pre-match files
        run: >-
          npx prettier
          src/app/GameApp.tsx
          src/domain/pvp/pvpContracts.ts
          src/features/match/PreMatchLineupScreen.tsx
          src/features/match/pre-match-lineup.css
          src/features/match/preMatchPreparation.ts
          tests/unit/features/match/PreMatchLineupScreen.test.tsx
          tests/unit/worker/preMatchAction.test.ts
          worker/game/actionSchema.ts
          worker/game/applyServerGameAction.ts
          worker/routes/pvpChallenge.ts
          --write
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-pre-match
          path: |
            src/app/GameApp.tsx
            src/domain/pvp/pvpContracts.ts
            src/features/match/PreMatchLineupScreen.tsx
            src/features/match/pre-match-lineup.css
            src/features/match/preMatchPreparation.ts
            tests/unit/features/match/PreMatchLineupScreen.test.tsx
            tests/unit/worker/preMatchAction.test.ts
            worker/game/actionSchema.ts
            worker/game/applyServerGameAction.ts
            worker/routes/pvpChallenge.ts
          retention-days: 1
