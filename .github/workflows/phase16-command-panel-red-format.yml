name: Phase16 Command Panel RED Format

on:
  push:
    branches:
      - feat/phase16-match-command-ux

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format RED test
        run: |
          npx prettier --write tests/unit/features/match/Phase16MatchCommandUx.test.tsx
          git rm .github/workflows/phase16-command-panel-red-format.yml
      - name: Commit RED formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: format Phase16 command panel RED"
          git push
