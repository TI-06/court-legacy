name: Phase 6 Task 6 Verify

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  verify-task6:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format Task 6 files
        run: >-
          npx prettier
          src/domain/tournament/playerTournamentStats.ts
          src/domain/tournament/recordOfficialMatch.ts
          tests/unit/domain/tournament/recordOfficialMatch.test.ts
          --write
      - name: Verify Task 6 focused behavior
        run: |
          npm test -- tests/unit/domain/tournament/recordOfficialMatch.test.ts
          npm run typecheck
      - name: Commit Task 6 formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/tournament/playerTournamentStats.ts src/domain/tournament/recordOfficialMatch.ts tests/unit/domain/tournament/recordOfficialMatch.test.ts
          git commit -m "chore: finalize Phase 6 Task 6 files"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
