name: Temporary Rival World Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-rival-world-progression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply integration and formatting
        run: |
          npm ci
          node scripts/tmp-integrate-rival-world.mjs
          npm run format
          rm scripts/tmp-integrate-rival-world.mjs
          rm .github/workflows/tmp-rival-world-integrate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 試合と年度更新へライバル世界進行を接続"
          git push origin HEAD:feature/m3-rival-world-progression
