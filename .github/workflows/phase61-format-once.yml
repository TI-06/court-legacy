name: Phase61 temporary format
on:
  push:
    branches:
      - fix/phase61-home-single-screen-tabs

permissions:
  contents: write

jobs:
  format-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase61-home-single-screen-tabs
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format changes and remove temporary workflow
        run: |
          npx prettier --write src/features/home/HomeCommandCenter.tsx src/features/home/home-phase61.css tests/e2e/phase61-home-one-screen.spec.ts
          git rm .github/workflows/phase61-format-once.yml
          git add src/features/home/HomeCommandCenter.tsx src/features/home/home-phase61.css tests/e2e/phase61-home-one-screen.spec.ts
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "style: format Phase61 mobile Home implementation"
          git push origin HEAD:fix/phase61-home-single-screen-tabs
