name: Phase21 PR21-2 Task8 GREEN

on:
  push:
    branches:
      - feat/phase21-2-relationship-model-persistence

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply Task8 implementation
        id: apply
        continue-on-error: true
        run: |
          python3 -m py_compile .github/phase21-task8-apply.py
          python3 .github/phase21-task8-apply.py
          npx prettier --write \
            src/persistence/gameStateCodec.ts \
            tests/unit/persistence/phase21GameStateMigration.test.ts
      - name: Run persistence tests
        id: tests
        continue-on-error: true
        run: |
          npx vitest run \
            tests/unit/persistence/phase21GameStateMigration.test.ts \
            tests/unit/persistence/gameStateCodec.test.ts \
            tests/unit/persistence/phase20PracticeOfferCanonicalCodec.test.ts \
            tests/unit/persistence/phase20PracticeOfferHistoryCodec.test.ts
      - name: Run typecheck
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Report result
        if: always()
        run: |
          echo "apply=${{ steps.apply.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          echo "types=${{ steps.types.outcome }}"
      - name: Commit verified Task8 implementation
        if: ${{ steps.apply.outcome == 'success' && steps.tests.outcome == 'success' && steps.types.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm .github/phase21-task8-apply.py .github/workflows/phase21-pr21-2-task8-green.yml
          git config user.name "TI-06"
          git config user.email "iretaku.shop@gmail.com"
          git add -A
          git commit -m "feat: migrate game state to schema v9"
          git push origin HEAD:feat/phase21-2-relationship-model-persistence
