name: Phase 6 Task 7 Format Current

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  format-task7-current:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier
          worker/game/actionSchema.ts
          worker/game/applyGameAction.ts
          tests/unit/worker/officialMatchAction.test.ts
          tests/unit/domain/tournament/officialWeekProgression.test.ts
          --write
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/game/actionSchema.ts worker/game/applyGameAction.ts tests/unit/worker/officialMatchAction.test.ts tests/unit/domain/tournament/officialWeekProgression.test.ts
          git commit -m "chore: format current Phase 6 Task 7 files"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
