name: Phase21 PR21-2 Task6 GREEN

on:
  push:
    branches:
      - feat/phase21-2-relationship-model-persistence

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply Task6 implementation
        id: apply
        continue-on-error: true
        run: |
          python3 -m py_compile .github/phase21-task6-apply.py
          python3 .github/phase21-task6-apply.py
          npx prettier --write \
            src/domain/relationships/relationshipPresentation.ts \
            src/features/team/PlayerHubScreen.tsx \
            src/features/team/player-hub.css \
            src/features/home/FullscreenEventExperience.tsx \
            src/features/home/fullscreen-event.css \
            tests/unit/features/team/Phase21PlayerHubRelationships.test.tsx
      - name: Run focused tests
        id: tests
        continue-on-error: true
        run: |
          npx vitest run \
            tests/unit/domain/relationships/relationshipPresentation.test.ts \
            tests/unit/domain/relationships/phase21RelationshipPresentationSelector.test.ts \
            tests/unit/features/team/Phase21PlayerHubRelationships.test.tsx \
            tests/unit/features/team/PlayerHubScreen.test.tsx \
            tests/unit/features/home/Phase21EventRelationships.test.tsx \
            tests/unit/features/home/EventDialog.test.tsx
      - name: Run typecheck
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Report result
        if: always()
        run: |
          echo "apply=${{ steps.apply.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          echo "types=${{ steps.types.outcome }}"
      - name: Commit verified Task6 implementation
        if: ${{ steps.apply.outcome == 'success' && steps.tests.outcome == 'success' && steps.types.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm .github/phase21-task6-apply.py .github/workflows/phase21-pr21-2-task6-green.yml
          git config user.name "TI-06"
          git config user.email "iretaku.shop@gmail.com"
          git add -A
          git commit -m "feat: present player relationships in game UI"
          git push origin HEAD:feat/phase21-2-relationship-model-persistence
