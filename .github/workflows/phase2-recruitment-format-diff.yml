name: Phase 2 Recruitment Format Diff

on:
  pull_request:

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier worker/routes/scoutingRecruitment.ts --write
      - run: git diff -- worker/routes/scoutingRecruitment.ts
