name: Phase19 Expected RED

on:
  push:
    branches:
      - feature/phase19-cpu-school-balance

permissions:
  contents: read

jobs:
  expected-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Confirm isolated Phase19 contract is RED
        shell: bash
        run: |
          set +e
          npx vitest run tests/unit/domain/world/phase19SchoolBalance.test.ts > phase19-red.log 2>&1
          status=$?
          set -e
          cat phase19-red.log
          if [ "$status" -eq 0 ]; then
            echo "Phase19 contract unexpectedly passed before implementation"
            exit 1
          fi
          echo "Expected RED confirmed without failing the workflow"
