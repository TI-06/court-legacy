name: Temporary Event Report Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-event-catalog-180
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Format and generate report
        run: |
          npm ci
          npm run format
          node scripts/event-distribution-report.mjs --write docs/event-distribution-report.md
          npm run format
          rm .github/workflows/tmp-format-event-report.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: 1000シーズンイベント分布レポートを生成"
          git push origin HEAD:feature/m3-event-catalog-180
