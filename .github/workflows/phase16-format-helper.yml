name: Phase16 Format Helper

on:
  push:
    branches: ["feature/phase16-match-command-ci"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format Phase16 files
        run: |
          npx prettier \
            docs/superpowers/plans/2026-09-10-phase16-match-command-foundation.md \
            src/domain/match/applyMatchCommand.ts \
            src/domain/match/simulateMatch.ts \
            tests/unit/domain/match/phase16MatchCommands.test.ts \
            tests/unit/domain/match/phase16ResumableMatch.test.ts \
            --write
      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/superpowers/plans/2026-09-10-phase16-match-command-foundation.md \
            src/domain/match/applyMatchCommand.ts \
            src/domain/match/simulateMatch.ts \
            tests/unit/domain/match/phase16MatchCommands.test.ts \
            tests/unit/domain/match/phase16ResumableMatch.test.ts
          git commit -m "chore: format Phase16 foundation"
          git push
