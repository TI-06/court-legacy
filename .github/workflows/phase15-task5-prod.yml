name: Phase15 Task5 Production

on:
  push:
    branches: [feat/phase15-tactics-ux]
    paths:
      - .phase15/task5_prod.py
      - .github/workflows/phase15-task5-prod.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase15-tactics-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: python .phase15/task5_prod.py
      - run: npx prettier src/app/GameApp.tsx src/features/pvp/PvpScreen.tsx src/features/pvp/pvp.css --write
      - shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/GameApp.tsx src/features/pvp/PvpScreen.tsx src/features/pvp/pvp.css
          git commit -m "feat: wire Phase15 match tactics UX"
          git push origin HEAD:feat/phase15-tactics-ux
