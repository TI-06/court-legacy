name: PR65 Carryover Fix

on:
  push:
    branches:
      - feat/scout-inventory-radar-grades

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scout-inventory-radar-grades
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Preserve inventory when academic year changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/StaticShopHarness.ts')
          text = path.read_text()
          old = '''  private syncYear(yearIndex: number): void {
              if (this.yearIndex === yearIndex) {
                return;
              }

              this.yearIndex = yearIndex;
              this.items.clear();
              for (const definition of PHASE5_SHOP_ITEMS) {
                this.items.set(definition.itemId, {
                  purchasedCount: 0,
                  usedCount: 0,
                  quantityOwned: 0,
                });
              }
            }
          '''
          # Exact block with repository indentation.
          old = old.replace('          ', '')
          new = '''  private syncYear(yearIndex: number): void {
            if (this.yearIndex === yearIndex) {
              return;
            }

            const carriedInventory = new Map(
              [...this.items.entries()].map(([itemId, item]) => [
                itemId,
                item.quantityOwned,
              ]),
            );
            this.yearIndex = yearIndex;
            this.items.clear();
            for (const definition of PHASE5_SHOP_ITEMS) {
              this.items.set(definition.itemId, {
                purchasedCount: 0,
                usedCount: 0,
                quantityOwned: carriedInventory.get(definition.itemId) ?? 0,
              });
            }
          }
          '''
          if old not in text:
              raise SystemExit('syncYear block not found; refusing blind edit')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/pr65-format.yml
          rm -f .github/workflows/pr65-carryover-fix.yml
      - name: Format changed files
        run: npx prettier src/app/StaticShopHarness.ts tests/e2e/shop-flow.spec.ts --write
      - name: Verify repository
        run: npm run verify
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: preserve shop inventory across academic years'
          git push origin HEAD:feat/scout-inventory-radar-grades
