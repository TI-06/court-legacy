name: Phase 7 Task 6 Implement

on:
  push:
    branches:
      - feature/court-legacy-v2-phase7-team-dynamics

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase7-team-dynamics
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply Task 6 integration
        run: |
          python - <<'PY'
          from pathlib import Path

          simulate = Path("src/domain/match/simulateMatch.ts")
          text = simulate.read_text()
          old = "  bestOfSets: 3 | 5;\n  random: RandomSource;\n}"
          new = "  bestOfSets: 3 | 5;\n  random: RandomSource;\n  dynamicsReadinessByPlayerId?: Readonly<Partial<Record<PlayerId, number>>>;\n}"
          if old not in text:
              raise SystemExit("simulateMatch input anchor missing")
          text = text.replace(old, new, 1)

          anchor = '''function clamp(value: number, minimum: number, maximum: number): number {
            return Math.max(minimum, Math.min(maximum, value));
          }
          '''
          helper = '''function clamp(value: number, minimum: number, maximum: number): number {
            return Math.max(minimum, Math.min(maximum, value));
          }

          function applyDynamicsReadinessToState(
            state: GameState,
            readinessByPlayerId: Readonly<Partial<Record<PlayerId, number>>> | undefined,
          ): GameState {
            if (!readinessByPlayerId) {
              return state;
            }

            const players = { ...state.players };
            let changed = false;
            for (const [rawPlayerId, rawMultiplier] of Object.entries(readinessByPlayerId)) {
              const playerId = rawPlayerId as PlayerId;
              const player = state.players[playerId];
              if (!player || rawMultiplier === undefined || !Number.isFinite(rawMultiplier)) {
                continue;
              }
              const multiplier = clamp(rawMultiplier, 0.95, 1.05);
              players[playerId] = {
                ...player,
                abilities: {
                  ...player.abilities,
                  decision: clamp(player.abilities.decision * multiplier, 0, 100),
                  mental: clamp(player.abilities.mental * multiplier, 0, 100),
                },
              };
              changed = true;
            }

            return changed ? { ...state, players } : state;
          }
          '''
          if anchor not in text:
              raise SystemExit("simulateMatch clamp anchor missing")
          text = text.replace(anchor, helper, 1)

          old = '''  const initialRandom = input.random.snapshot();
            const homeSchool = input.state.schools[input.homeSchoolId]!;
            const awaySchool = input.state.schools[input.awaySchoolId]!;'''
          new = '''  const initialRandom = input.random.snapshot();
            const simulationState = applyDynamicsReadinessToState(
              input.state,
              input.dynamicsReadinessByPlayerId,
            );
            const homeSchool = simulationState.schools[input.homeSchoolId]!;
            const awaySchool = simulationState.schools[input.awaySchoolId]!;'''
          if old not in text:
              raise SystemExit("simulateMatch state anchor missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              "const winner = simulateRally(input.state, runtime, input.random, writer);",
              "const winner = simulateRally(simulationState, runtime, input.random, writer);",
              1,
          )
          text = text.replace(
              "analysis: createMatchAnalysis(input.state, match),",
              "analysis: createMatchAnalysis(simulationState, match),",
              1,
          )
          simulate.write_text(text)

          action = Path("worker/game/applyGameAction.ts")
          text = action.read_text()
          anchor = '''import {
            setTeamLeadership,
            TeamLeadershipValidationError,
          } from "../../src/domain/dynamics/setTeamLeadership";
          '''
          replacement = anchor + '''import { buildPveDynamicsReadinessByPlayerId } from "../../src/domain/dynamics/officialMatchDynamics";
          '''
          if anchor not in text:
              raise SystemExit("applyGameAction import anchor missing")
          text = text.replace(anchor, replacement, 1)
          start = text.index("function applyOfficialMatch(")
          end = text.index("function applyAdvanceWeek(", start)
          section = text[start:end]
          old = '''      bestOfSets: 3,
                random,
              });'''
          new = '''      bestOfSets: 3,
                random,
                dynamicsReadinessByPlayerId: buildPveDynamicsReadinessByPlayerId(state),
              });'''
          if old not in section:
              raise SystemExit("official simulate anchor missing")
          section = section.replace(old, new, 1)
          text = text[:start] + section + text[end:]
          action.write_text(text)

          record = Path("src/domain/tournament/recordOfficialMatch.ts")
          text = record.read_text()
          import_anchor = '''import type { GameState, HistoricalMatchSummary } from "../model/GameState";
          '''
          import_replacement = import_anchor + '''import { applyOfficialMatchDynamicsFeedback } from "../dynamics/officialMatchDynamics";
          '''
          if import_anchor not in text:
              raise SystemExit("record import anchor missing")
          text = text.replace(import_anchor, import_replacement, 1)
          start = text.index("  let next = applyOfficialMatchPlayerStats({")
          marker = "\n\n  const containsGuest ="
          end = text.index(marker, start)
          block = text[start:end]
          feedback = '''

            next = applyOfficialMatchDynamicsFeedback({
              state: next,
              match: input.match,
              won: userWon,
            });'''
          text = text[:end] + feedback + text[end:]
          record.write_text(text)
          PY
      - name: Format Task 6 production files
        run: |
          npx prettier src/domain/dynamics/officialMatchDynamics.ts src/domain/match/simulateMatch.ts src/domain/tournament/recordOfficialMatch.ts worker/game/applyGameAction.ts tests/unit/domain/dynamics/officialMatchDynamics.test.ts .github/workflows/phase7-task6-implement.yml --write
      - name: Verify Task 6 focused behavior
        run: |
          npx vitest run tests/unit/domain/dynamics/officialMatchDynamics.test.ts tests/unit/domain/tournament/recordOfficialMatch.test.ts tests/unit/worker/officialMatchAction.test.ts
          npm run typecheck
      - name: Commit Task 6 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/dynamics/officialMatchDynamics.ts src/domain/match/simulateMatch.ts src/domain/tournament/recordOfficialMatch.ts worker/game/applyGameAction.ts tests/unit/domain/dynamics/officialMatchDynamics.test.ts .github/workflows/phase7-task6-implement.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat: apply dynamics to official matches"
            git push origin HEAD:feature/court-legacy-v2-phase7-team-dynamics
          fi
