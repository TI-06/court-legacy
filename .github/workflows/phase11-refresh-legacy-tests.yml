name: Phase11 Refresh Legacy Tests

on:
  push:
    branches:
      - feature/phase11-home-week-progression
    paths:
      - .github/workflows/phase11-refresh-legacy-tests.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase11-home-week-progression
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Update stale GameApp expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/unit/app/GameAppActions.test.tsx')
          text = p.read_text()
          start = text.index('  it("requests a scheduled practice match from the server and renders only its returned simulation", async () => {')
          end = text.index('\n  it("persists a facility upgrade through the server before showing the new funds and level",', start)
          replacement = '''  it("resolves a scheduled practice match through Home week progression", async () => {
            const snapshot = createSnapshot();
            schedulePracticeOpponent(snapshot);
            const applyAction = vi.fn(
              async (_accessToken: string, request: GameActionRequest) =>
                responseFor(snapshot, request),
            );
            const api: GameApiClient = {
              bootstrap: vi.fn(),
              onboard: vi.fn(),
              applyAction,
            };

            render(
              <GameApp
                api={api}
                auth={authClient()}
                session={session}
                snapshot={snapshot}
              />,
            );

            fireEvent.click(screen.getByRole("button", { name: "次の週へ進む" }));

            expect(applyAction).toHaveBeenCalledTimes(1);
            expect(applyAction.mock.calls[0]![1]).toMatchObject({
              revision: 1,
              action: { type: "advance-week" },
            });
            expect(
              await screen.findByRole("heading", { name: "試合ダイジェスト" }),
            ).toBeVisible();
          });
          '''
          p.write_text(text[:start] + replacement + text[end:])

          p = Path('tests/unit/app/GameApp.practiceScheduling.test.tsx')
          text = p.read_text()
          text = text.replace(
            'it("accepts an incoming practice offer and shows the scheduled opponent with match start", async () => {',
            'it("accepts an incoming practice offer and keeps execution on Home progression", async () => {',
          )
          text = text.replace(
            '    expect(screen.getByRole("button", { name: "試合開始" })).toBeVisible();',
            '    expect(screen.getByText(\'ホームの「次の週へ進む」で実施\')).toBeVisible();\n    expect(screen.queryByRole("button", { name: "試合開始" })).toBeNull();',
          )
          p.write_text(text)

          p = Path('tests/unit/app/GameApp.officialTournament.test.tsx')
          text = p.read_text()
          text = text.replace('import { fireEvent, render, screen, within } from "@testing-library/react";', 'import { fireEvent, render, screen } from "@testing-library/react";')
          start = text.index('  it("opens the authoritative bracket from home and submits only the generic official-match action", async () => {')
          end = text.index('\n  });', start) + len('\n  });')
          replacement = '''  it("keeps the bracket reference-only and resolves the due official match from Home", async () => {
            let serverSnapshot = createOfficialSnapshot();
            const applyAction = vi.fn(
              async (_accessToken: string, request: GameActionRequest) => {
                const response = responseFor(serverSnapshot, request);
                serverSnapshot = response.game;
                return response;
              },
            );
            const api: GameApiClient = {
              bootstrap: vi.fn(),
              onboard: vi.fn(),
              applyAction,
            };

            render(
              <GameApp
                api={api}
                auth={authClient()}
                session={session}
                snapshot={serverSnapshot}
              />,
            );

            fireEvent.click(screen.getByRole("button", { name: "大会表を見る" }));
            expect(
              screen.getByRole("heading", { name: "インターハイ 県大会" }),
            ).toBeVisible();
            expect(screen.queryByRole("button", { name: "公式戦を開始" })).toBeNull();
            expect(
              screen.getByText('ホームの「次の週へ進む」で試合を実施します'),
            ).toBeVisible();

            fireEvent.click(screen.getByRole("button", { name: "ホーム" }));
            fireEvent.click(screen.getByRole("button", { name: "次の週へ進む" }));

            expect(applyAction).toHaveBeenCalledTimes(1);
            expect(applyAction.mock.calls[0]![0]).toBe(session.accessToken);
            expect(applyAction.mock.calls[0]![1]).toMatchObject({
              revision: 9,
              action: { type: "advance-week" },
            });
            expect(
              await screen.findByRole("heading", { name: "試合ダイジェスト" }),
            ).toBeVisible();
            expect(screen.getByRole("status")).toHaveTextContent("保存済み ✓");
          });'''
          p.write_text(text[:start] + replacement + text[end:])

          p = Path('tests/unit/app/GameApp.officialTournamentRetry.test.tsx')
          text = p.read_text()
          text = text.replace('import { fireEvent, render, screen, within } from "@testing-library/react";', 'import { fireEvent, render, screen } from "@testing-library/react";')
          start = text.index('  it("retries an ambiguous official result with the exact same operation request", async () => {')
          end = text.index('\n  });', start) + len('\n  });')
          replacement = '''  it("retries an ambiguous Home progression request with the exact same operation id", async () => {
            const snapshot = createOfficialSnapshot();
            const applyAction = vi
              .fn<GameApiClient["applyAction"]>()
              .mockRejectedValueOnce(
                new ApiError(null, "network_error", "サーバーに接続できませんでした"),
              )
              .mockImplementationOnce(async (_accessToken, request) =>
                responseFor(snapshot, request),
              );
            const api: GameApiClient = {
              bootstrap: vi.fn(),
              onboard: vi.fn(),
              applyAction,
            };

            render(
              <GameApp
                api={api}
                auth={authClient()}
                session={session}
                snapshot={snapshot}
              />,
            );

            fireEvent.click(screen.getByRole("button", { name: "次の週へ進む" }));

            expect(await screen.findByText("オフライン")).toBeVisible();
            expect(applyAction).toHaveBeenCalledTimes(1);
            const firstRequest = applyAction.mock.calls[0]![1];
            expect(firstRequest).toMatchObject({
              revision: 9,
              action: { type: "advance-week" },
            });

            fireEvent.click(screen.getByRole("button", { name: "再試行" }));

            expect(await screen.findByText("保存済み ✓")).toBeVisible();
            expect(applyAction).toHaveBeenCalledTimes(2);
            expect(applyAction.mock.calls[1]![1]).toEqual(firstRequest);
            expect(firstRequest.operationId).toBe(
              applyAction.mock.calls[1]![1].operationId,
            );
            expect(
              await screen.findByRole("heading", { name: "試合ダイジェスト" }),
            ).toBeVisible();
          });'''
          p.write_text(text[:start] + replacement + text[end:])
          PY
          npx prettier --write tests/unit/app/GameAppActions.test.tsx tests/unit/app/GameApp.practiceScheduling.test.tsx tests/unit/app/GameApp.officialTournament.test.tsx tests/unit/app/GameApp.officialTournamentRetry.test.tsx
      - name: Verify refreshed tests
        run: npm test -- tests/unit/app/GameAppActions.test.tsx tests/unit/app/GameApp.practiceScheduling.test.tsx tests/unit/app/GameApp.officialTournament.test.tsx tests/unit/app/GameApp.officialTournamentRetry.test.tsx
      - name: Commit refreshed tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/app/GameAppActions.test.tsx tests/unit/app/GameApp.practiceScheduling.test.tsx tests/unit/app/GameApp.officialTournament.test.tsx tests/unit/app/GameApp.officialTournamentRetry.test.tsx
          git commit -m "test: align GameApp PvE flows with Home progression"
          git push origin HEAD:feature/phase11-home-week-progression
