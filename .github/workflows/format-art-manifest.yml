name: Format art manifest

on:
  push:
    branches:
      - feature/m6-game-ui-refresh
    paths:
      - .github/workflows/format-art-manifest.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m6-game-ui-refresh
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/player-art/generatedArtManifest.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/player-art/generatedArtManifest.ts
          git commit -m "style: format generated art manifest"
          git push
