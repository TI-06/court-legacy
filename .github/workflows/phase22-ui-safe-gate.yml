name: Phase22 UI Safe Gate

on:
  push:
    branches:
      - feat/phase22-match-skip-home-training

permissions:
  contents: write

jobs:
  phase22-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Phase22-2 implementation in workspace
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f"expected source block not found: {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all(path: str, old: str, new: str, expected: int) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(
                      f"expected {expected} source blocks in {path}, found {count}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          def replace_between(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if replacement in text:
                  return
              start = text.find(start_marker)
              end = text.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise RuntimeError(f"expected marker range not found: {path}")
              file.write_text(
                  text[:start] + replacement + "\n\n" + text[end:],
                  encoding="utf-8",
              )

          replace_once(
              "src/domain/model/Match.ts",
              '  | { type: "continue" };',
              '  | { type: "continue" }\n  | { type: "skip-to-result" };',
          )

          replace_once(
              "worker/game/actionSchema.ts",
              '  z.object({ type: z.literal("continue") }).strict(),\n]);',
              '  z.object({ type: z.literal("continue") }).strict(),\n'
              '  z.object({ type: z.literal("skip-to-result") }).strict(),\n'
              ']);',
          )

          replace_once(
              "src/domain/match/applyMatchCommand.ts",
              '  const historyEventSequence = match.eventLog.length;\n\n  switch (input.command.type) {',
              '  const historyEventSequence = match.eventLog.length;\n'
              '  const skipToResult = input.command.type === "skip-to-result";\n'
              '  const recordedCommand: MatchCommand = skipToResult\n'
              '    ? { type: "continue" }\n'
              '    : input.command;\n\n'
              '  switch (input.command.type) {',
          )
          replace_once(
              "src/domain/match/applyMatchCommand.ts",
              '    case "continue":\n      break;',
              '    case "continue":\n'
              '    case "skip-to-result":\n'
              '      break;',
          )
          replace_once(
              "src/domain/match/applyMatchCommand.ts",
              '    command: structuredClone(input.command),',
              '    command: structuredClone(recordedCommand),',
          )
          replace_once(
              "src/domain/match/applyMatchCommand.ts",
              '  match.pendingCoachCommandForSchoolId = null;\n'
              '  runtime.pendingDecisionReason = null;\n\n'
              '  return match;',
              '  match.pendingCoachCommandForSchoolId = null;\n'
              '  runtime.pendingDecisionReason = null;\n'
              '  if (skipToResult) {\n'
              '    runtime.controlledSchoolId = null;\n'
              '  }\n\n'
              '  return match;',
          )

          replace_once(
              "src/features/match/MatchScreen.tsx",
              '  const [speed, setSpeed] = useState<PlaybackSpeed>(1);\n'
              '  const result = presentation?.simulation ?? legacyResult;',
              '  const [speed, setSpeed] = useState<PlaybackSpeed>(1);\n'
              '  const [skipTargetMatchId, setSkipTargetMatchId] = useState<string | null>(null);\n'
              '  const result = presentation?.simulation ?? legacyResult;',
          )
          replace_once(
              "src/features/match/MatchScreen.tsx",
              '  const presentedEvents = useMemo(() => {',
              '  useEffect(() => {\n'
              '    if (\n'
              '      !result?.analysis ||\n'
              '      skipTargetMatchId !== String(result.match.id)\n'
              '    ) {\n'
              '      return;\n'
              '    }\n'
              '    setPlaying(false);\n'
              '    setVisibleEventIndex(lastEventIndex);\n'
              '    setSkipTargetMatchId(null);\n'
              '  }, [lastEventIndex, result, skipTargetMatchId]);\n\n'
              '  const presentedEvents = useMemo(() => {',
          )
          replace_once(
              "src/features/match/MatchScreen.tsx",
              '                {result.analysis ? "結果まで進む" : "次の判断まで進む"}\n'
              '              </button>\n'
              '            </div>',
              '                {result.analysis ? "ダイジェスト末尾へ" : "次の判断まで進む"}\n'
              '              </button>\n'
              '              <button\n'
              '                disabled={commandPending || (!result.analysis && !onCommand)}\n'
              '                onClick={() => {\n'
              '                  setPlaying(false);\n'
              '                  if (result.analysis) {\n'
              '                    setVisibleEventIndex(lastEventIndex);\n'
              '                    return;\n'
              '                  }\n'
              '                  if (!onCommand) return;\n'
              '                  setSkipTargetMatchId(String(result.match.id));\n'
              '                  void Promise.resolve(\n'
              '                    onCommand({ type: "skip-to-result" }),\n'
              '                  ).catch(() => setSkipTargetMatchId(null));\n'
              '                }}\n'
              '                type="button"\n'
              '              >\n'
              '                結果までスキップ\n'
              '              </button>\n'
              '            </div>',
          )

          replace_once(
              "src/features/home/HomeScreen.tsx",
              '  data?: Pick<GameDataRegistry, "trainingMenus">;',
              '  data?: Pick<\n'
              '    GameDataRegistry,\n'
              '    "trainingMenus" | "individualTrainingInstructions"\n'
              '  >;',
          )
          replace_all(
              "src/features/home/homeCommandCenter.ts",
              'Pick<GameDataRegistry, "trainingMenus">',
              'Pick<\n    GameDataRegistry,\n    "trainingMenus" | "individualTrainingInstructions"\n  >',
              2,
          )

          training_replacement = '''  const trainingCompleted = isWeeklyActionCompleted(state, "training");
  const assignmentByPlayerId = new Map(
    state.weeklySchedule.trainingPlan.individualAssignments
      .filter((assignment) => school.playerIds.includes(assignment.playerId))
      .map((assignment) => [assignment.playerId, assignment.instructionId]),
  );
  const instructionCounts = new Map<
    string,
    { name: string; count: number }
  >();
  let configuredCount = 0;
  for (const playerId of school.playerIds) {
    const instructionId = assignmentByPlayerId.get(playerId);
    if (!instructionId) continue;
    const instruction = data.individualTrainingInstructions.get(instructionId);
    if (!instruction) continue;
    configuredCount += 1;
    const current = instructionCounts.get(instruction.id);
    instructionCounts.set(instruction.id, {
      name: instruction.name,
      count: (current?.count ?? 0) + 1,
    });
  }
  const unconfiguredCount = school.playerIds.length - configuredCount;
  const individualSummary = [...instructionCounts.entries()]
    .sort(([left], [right]) => left.localeCompare(right))
    .map(([, summary]) => `${summary.name} ${summary.count}名`);
  if (unconfiguredCount > 0) {
    individualSummary.push(`未設定 ${unconfiguredCount}名`);
  }
  individualSummary.push(
    `設定済み ${configuredCount}/${school.playerIds.length}名`,
  );
  const needsIndividualSetup = !trainingCompleted && unconfiguredCount > 0;
  candidates.push({
    order: 50,
    task: {
      id: "training:weekly",
      kind: "action",
      priority: trainingCompleted ? "complete" : "normal",
      category: "training",
      title: "個人練習",
      detail: trainingCompleted
        ? `${individualSummary.join("・")}・今週分完了 ✓`
        : individualSummary.join("・"),
      action: needsIndividualSetup ? { target: "team" } : undefined,
      actionLabel: needsIndividualSetup ? "個人練習を設定" : undefined,
      complete: trainingCompleted,
    },
  });'''
          replace_between(
              "src/features/home/homeCommandCenter.ts",
              '  const trainingCompleted = isWeeklyActionCompleted(state, "training");',
              '  const affordableFacilities = FACILITY_DEFINITIONS.filter(',
              training_replacement,
          )
          PY
          apply_status=$?
          set -e
          if [ "$apply_status" -ne 0 ]; then
            echo "PHASE22_APPLY=NEEDS_FIX"
            touch /tmp/phase22-apply-failed
          else
            echo "PHASE22_APPLY=OK"
          fi

      - name: Format candidate implementation
        shell: bash
        run: |
          if [ -f /tmp/phase22-apply-failed ]; then
            echo "Implementation patch needs a fix; skipping format."
            exit 0
          fi
          npx prettier --write \
            src/domain/model/Match.ts \
            src/domain/match/applyMatchCommand.ts \
            worker/game/actionSchema.ts \
            src/features/match/MatchScreen.tsx \
            src/features/home/HomeScreen.tsx \
            src/features/home/homeCommandCenter.ts \
            tests/unit/features/home/Phase22HomeTraining.test.tsx \
            tests/unit/features/match/Phase22MatchSkip.test.tsx \
            tests/unit/worker/phase22MatchSkip.test.ts

      - name: Verify focused Phase22-2 changes without red workflow mail
        shell: bash
        run: |
          if [ -f /tmp/phase22-apply-failed ]; then
            echo "PHASE22_SAFE_GATE=NEEDS_FIX"
            exit 0
          fi

          set +e
          npm test -- \
            tests/unit/features/home/Phase22HomeTraining.test.tsx \
            tests/unit/features/home/homeCommandCenter.test.ts \
            tests/unit/features/match/Phase22MatchSkip.test.tsx \
            tests/unit/features/match/Phase16MatchScreenPlayback.test.tsx \
            tests/unit/worker/phase22MatchSkip.test.ts \
            tests/unit/worker/phase16OfficialMatchSession.test.ts 2>&1 | tee /tmp/phase22-tests.log
          test_status=${PIPESTATUS[0]}

          npm run typecheck 2>&1 | tee /tmp/phase22-typecheck.log
          type_status=${PIPESTATUS[0]}

          npx prettier --check \
            src/domain/model/Match.ts \
            src/domain/match/applyMatchCommand.ts \
            worker/game/actionSchema.ts \
            src/features/match/MatchScreen.tsx \
            src/features/home/HomeScreen.tsx \
            src/features/home/homeCommandCenter.ts \
            tests/unit/features/home/Phase22HomeTraining.test.tsx \
            tests/unit/features/match/Phase22MatchSkip.test.tsx \
            tests/unit/worker/phase22MatchSkip.test.ts 2>&1 | tee /tmp/phase22-format.log
          format_status=${PIPESTATUS[0]}

          npx eslint \
            src/domain/model/Match.ts \
            src/domain/match/applyMatchCommand.ts \
            worker/game/actionSchema.ts \
            src/features/match/MatchScreen.tsx \
            src/features/home/HomeScreen.tsx \
            src/features/home/homeCommandCenter.ts \
            tests/unit/features/home/Phase22HomeTraining.test.tsx \
            tests/unit/features/match/Phase22MatchSkip.test.tsx \
            tests/unit/worker/phase22MatchSkip.test.ts 2>&1 | tee /tmp/phase22-lint.log
          lint_status=${PIPESTATUS[0]}
          set -e

          echo "tests=$test_status typecheck=$type_status format=$format_status lint=$lint_status"
          if [ "$test_status" -ne 0 ] || [ "$type_status" -ne 0 ] || [ "$format_status" -ne 0 ] || [ "$lint_status" -ne 0 ]; then
            echo "PHASE22_SAFE_GATE=NEEDS_FIX"
            git diff --check || true
            git diff || true
            exit 0
          fi

          echo "PHASE22_SAFE_GATE=GREEN" | tee /tmp/phase22-green

      - name: Commit verified implementation
        shell: bash
        run: |
          if [ ! -f /tmp/phase22-green ]; then
            echo "Verification needs a fix; nothing will be pushed."
            exit 0
          fi

          git add \
            src/domain/model/Match.ts \
            src/domain/match/applyMatchCommand.ts \
            worker/game/actionSchema.ts \
            src/features/match/MatchScreen.tsx \
            src/features/home/HomeScreen.tsx \
            src/features/home/homeCommandCenter.ts \
            tests/unit/features/home/Phase22HomeTraining.test.tsx \
            tests/unit/features/match/Phase22MatchSkip.test.tsx \
            tests/unit/worker/phase22MatchSkip.test.ts

          if git diff --cached --quiet; then
            echo "Verified implementation already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add Phase22 match skip and home training summary"
          git push origin HEAD:feat/phase22-match-skip-home-training
