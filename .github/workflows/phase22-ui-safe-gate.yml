name: Phase22 UI Safe Gate

on:
  push:
    branches:
      - feat/phase22-match-skip-home-training

permissions:
  contents: write

jobs:
  phase22-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply candidate patch
        shell: bash
        run: |
          set +e
          node scripts/phase22Patch.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "PHASE22_APPLY=NEEDS_FIX"
            touch /tmp/phase22-apply-failed
          else
            echo "PHASE22_APPLY=OK"
          fi

      - name: Format candidate
        shell: bash
        run: |
          if [ -f /tmp/phase22-apply-failed ]; then
            echo "Skipping format because patch application needs a fix."
            exit 0
          fi
          npx prettier --write \
            src/app/GameApp.tsx \
            src/domain/model/Match.ts \
            src/domain/match/applyMatchCommand.ts \
            worker/game/actionSchema.ts \
            src/features/match/MatchScreen.tsx \
            src/features/match/matchCommandPresentation.ts \
            src/features/home/HomeScreen.tsx \
            src/features/home/homeCommandCenter.ts \
            tests/unit/features/home/Phase22HomeTraining.test.tsx \
            tests/unit/features/home/homeCommandCenter.test.ts \
            tests/unit/features/match/Phase22MatchSkip.test.tsx \
            tests/unit/worker/phase22MatchSkip.test.ts

      - name: Verify candidate without failing workflow
        shell: bash
        run: |
          if [ -f /tmp/phase22-apply-failed ]; then
            echo "PHASE22_SAFE_GATE=NEEDS_FIX"
            exit 0
          fi

          set +e
          npm test -- \
            tests/unit/features/home/Phase22HomeTraining.test.tsx \
            tests/unit/features/home/homeCommandCenter.test.ts \
            tests/unit/features/match/Phase22MatchSkip.test.tsx \
            tests/unit/features/match/Phase16MatchScreenPlayback.test.tsx \
            tests/unit/worker/phase22MatchSkip.test.ts \
            tests/unit/worker/phase16OfficialMatchSession.test.ts
          test_status=$?

          npm run typecheck
          type_status=$?

          npx prettier --check \
            src/app/GameApp.tsx \
            src/domain/model/Match.ts \
            src/domain/match/applyMatchCommand.ts \
            worker/game/actionSchema.ts \
            src/features/match/MatchScreen.tsx \
            src/features/match/matchCommandPresentation.ts \
            src/features/home/HomeScreen.tsx \
            src/features/home/homeCommandCenter.ts \
            tests/unit/features/home/Phase22HomeTraining.test.tsx \
            tests/unit/features/home/homeCommandCenter.test.ts \
            tests/unit/features/match/Phase22MatchSkip.test.tsx \
            tests/unit/worker/phase22MatchSkip.test.ts
          format_status=$?

          npx eslint \
            src/app/GameApp.tsx \
            src/domain/model/Match.ts \
            src/domain/match/applyMatchCommand.ts \
            worker/game/actionSchema.ts \
            src/features/match/MatchScreen.tsx \
            src/features/match/matchCommandPresentation.ts \
            src/features/home/HomeScreen.tsx \
            src/features/home/homeCommandCenter.ts \
            tests/unit/features/home/Phase22HomeTraining.test.tsx \
            tests/unit/features/home/homeCommandCenter.test.ts \
            tests/unit/features/match/Phase22MatchSkip.test.tsx \
            tests/unit/worker/phase22MatchSkip.test.ts
          lint_status=$?
          set -e

          echo "tests=$test_status typecheck=$type_status format=$format_status lint=$lint_status"
          if [ "$test_status" -ne 0 ] || [ "$type_status" -ne 0 ] || [ "$format_status" -ne 0 ] || [ "$lint_status" -ne 0 ]; then
            echo "PHASE22_SAFE_GATE=NEEDS_FIX"
            git diff --check || true
            exit 0
          fi

          echo "PHASE22_SAFE_GATE=GREEN" > /tmp/phase22-green
          cat /tmp/phase22-green

      - name: Commit verified implementation
        shell: bash
        run: |
          if [ ! -f /tmp/phase22-green ]; then
            echo "Verification needs a fix; nothing will be pushed."
            exit 0
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "Verified implementation already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add Phase22 match skip and home training summary"
          git push origin HEAD:feat/phase22-match-skip-home-training
