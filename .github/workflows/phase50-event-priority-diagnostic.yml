name: Phase50 Event Priority Diagnostic

on:
  push:
    branches:
      - test/phase50-investment-long-balance
    paths:
      - ".github/workflows/phase50-event-priority-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare Super Rare event priority candidates
        shell: bash
        run: |
          set -u
          cp src/domain/events/selectEvent.ts /tmp/selectEvent.ts
          for chance in 5 10 15 20 25 30 40; do
            cp /tmp/selectEvent.ts src/domain/events/selectEvent.ts
            CHANCE="$chance" node - <<'NODE'
          const fs = require("fs");
          const path = "src/domain/events/selectEvent.ts";
          const chance = process.env.CHANCE;
          const before = fs.readFileSync(path, "utf8");
          const after = before.replace(
            '{ rarity: "super-rare" as const, chance: 50 }',
            `{ rarity: "super-rare" as const, chance: ${chance} }`,
          );
          if (after === before) throw new Error("priority replacement failed");
          fs.writeFileSync(path, after);
          NODE
            echo "=== priority=$chance phase21 ==="
            if npx vitest run tests/unit/domain/events/phase21RelationshipLongRun.test.ts > "/tmp/phase21-$chance.log" 2>&1; then
              echo "phase21=PASS"
              grep "\[phase21-long-run\]" "/tmp/phase21-$chance.log" | tail -n 4 || true
              echo "=== priority=$chance 10y ==="
              npm run soak:balance -- --seed phase50-balance-a --seed phase50-balance-b > "/tmp/soak-$chance.log" 2>&1
              grep "\[phase18-soak\]" "/tmp/soak-$chance.log" | tail -n 4 || true
            else
              echo "phase21=FAIL"
              grep -E "AssertionError|phase21-social|expected" "/tmp/phase21-$chance.log" | tail -n 8 || true
            fi
          done
          cp /tmp/selectEvent.ts src/domain/events/selectEvent.ts
