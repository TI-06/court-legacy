name: Phase20-3 Task1 Safe Check

on:
  push:
    branches:
      - "feature/phase20-3-practice-offer-frequency"

permissions:
  contents: write

jobs:
  practice-offer-safe-check:
    if: github.event.head_commit.message != 'phase20-3-task1-green'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Implement monthly cap and offer diversity
        run: |
          python - <<'PY'
          from pathlib import Path

          types = Path('src/domain/weekly/weeklyScheduleTypes.ts')
          text = types.read_text()
          old = '''export interface PracticeMatchHistoryEntry {\n  opponentSchoolId: SchoolId;\n  date: GameDate;\n}\n'''
          new = '''export interface PracticeMatchHistoryEntry {\n  opponentSchoolId: SchoolId;\n  date: GameDate;\n}\n\nexport interface PracticeIncomingOfferHistoryEntry {\n  schoolId: SchoolId;\n  date: GameDate;\n}\n'''
          if old not in text:
              raise SystemExit('weeklyScheduleTypes history target not found')
          text = text.replace(old, new, 1)
          old = '''    scheduledOpponentId: SchoolId | null;\n    scheduledBy: "incoming" | "outgoing" | null;\n  };'''
          new = '''    scheduledOpponentId: SchoolId | null;\n    scheduledBy: "incoming" | "outgoing" | null;\n    incomingOfferHistory?: PracticeIncomingOfferHistoryEntry[];\n  };'''
          if old not in text:
              raise SystemExit('weeklyScheduleTypes practice target not found')
          types.write_text(text.replace(old, new, 1))

          planning = Path('src/domain/weekly/practiceMatchPlanning.ts')
          text = planning.read_text()
          old = '''  PracticeMatchCandidateTier,\n  PracticeMatchHistoryEntry,\n  PracticeMatchOffer,'''
          new = '''  PracticeMatchCandidateTier,\n  PracticeIncomingOfferHistoryEntry,\n  PracticeMatchHistoryEntry,\n  PracticeMatchOffer,'''
          if old not in text:
              raise SystemExit('planning import target not found')
          text = text.replace(old, new, 1)
          old = '''export const PRACTICE_INCOMING_TARGET_RATIO: Record<SchoolReputation, number> =\n  {\n    unknown: 0.9,\n    "district-contender": 0.95,\n    "prefectural-power": 1,\n    "national-qualifier": 1.05,\n    "national-regular": 1.1,\n    elite: 1.15,\n  };\n'''
          new = '''export const PRACTICE_INCOMING_TARGET_RATIO: Record<SchoolReputation, number> =\n  {\n    unknown: 0.9,\n    "district-contender": 0.95,\n    "prefectural-power": 1,\n    "national-qualifier": 1.05,\n    "national-regular": 1.1,\n    elite: 1.15,\n  };\n\nexport const PRACTICE_INCOMING_MONTHLY_LIMIT = 2;\nexport const PRACTICE_INCOMING_HISTORY_LIMIT = 24;\nconst PRACTICE_INCOMING_HISTORY_REPEAT_PENALTY = 0.2;\n'''
          if old not in text:
              raise SystemExit('planning constants target not found')
          text = text.replace(old, new, 1)
          old = '''export interface PracticePlanningResult {\n  incomingOffer: PracticeMatchOffer | null;\n  outgoingCandidates: PracticeMatchCandidate[];\n}\n'''
          new = '''export interface PracticePlanningResult {\n  incomingOffer: PracticeMatchOffer | null;\n  outgoingCandidates: PracticeMatchCandidate[];\n  incomingOfferHistory: PracticeIncomingOfferHistoryEntry[];\n}\n'''
          if old not in text:
              raise SystemExit('planning result target not found')
          text = text.replace(old, new, 1)
          marker = '''function buildIncomingOffer(\n  state: PracticePlanningSource,\n  recentPracticeMatches: readonly PracticeMatchHistoryEntry[],\n): PracticeMatchOffer | null {\n  const { homeSchool, opponents } = rankedOpponents(state);\n  if (opponents.length === 0) return null;\n'''
          replacement = '''function calendarMonth(date: string): string {\n  return date.slice(0, 7);\n}\n\nfunction incomingOfferCount(\n  history: readonly PracticeIncomingOfferHistoryEntry[],\n  schoolId: string,\n): number {\n  return history.filter((entry) => entry.schoolId === schoolId).length;\n}\n\nfunction appendIncomingOfferHistory(\n  history: readonly PracticeIncomingOfferHistoryEntry[],\n  offer: PracticeMatchOffer | null,\n  date: PracticePlanningSource["date"],\n): PracticeIncomingOfferHistoryEntry[] {\n  const bounded = [...history].slice(-PRACTICE_INCOMING_HISTORY_LIMIT);\n  if (!offer) return bounded;\n  if (\n    bounded.some(\n      (entry) => entry.date === date && entry.schoolId === offer.schoolId,\n    )\n  ) {\n    return bounded;\n  }\n  return [...bounded, { schoolId: offer.schoolId, date }].slice(\n    -PRACTICE_INCOMING_HISTORY_LIMIT,\n  );\n}\n\nfunction buildIncomingOffer(\n  state: PracticePlanningSource,\n  recentPracticeMatches: readonly PracticeMatchHistoryEntry[],\n  incomingOfferHistory: readonly PracticeIncomingOfferHistoryEntry[],\n): PracticeMatchOffer | null {\n  const { homeSchool, opponents } = rankedOpponents(state);\n  if (opponents.length === 0) return null;\n\n  const currentMonth = calendarMonth(state.date);\n  const offersThisMonth = incomingOfferHistory.filter(\n    (entry) => calendarMonth(entry.date) === currentMonth,\n  );\n  if (offersThisMonth.length >= PRACTICE_INCOMING_MONTHLY_LIMIT) {\n    return null;\n  }\n'''
          if marker not in text:
              raise SystemExit('planning incoming function target not found')
          text = text.replace(marker, replacement, 1)
          old = '''    const leftRepeatPenalty =\n      meetingCount(recentPracticeMatches, left.school.id) * 0.035;\n    const rightRepeatPenalty =\n      meetingCount(recentPracticeMatches, right.school.id) * 0.035;\n    return (\n      Math.abs(left.ratio - targetRatio) +\n        leftRepeatPenalty -\n        (Math.abs(right.ratio - targetRatio) + rightRepeatPenalty) ||\n      left.school.id.localeCompare(right.school.id)\n    );'''
          new = '''    const leftRepeatPenalty =\n      meetingCount(recentPracticeMatches, left.school.id) * 0.035 +\n      incomingOfferCount(incomingOfferHistory, left.school.id) *\n        PRACTICE_INCOMING_HISTORY_REPEAT_PENALTY;\n    const rightRepeatPenalty =\n      meetingCount(recentPracticeMatches, right.school.id) * 0.035 +\n      incomingOfferCount(incomingOfferHistory, right.school.id) *\n        PRACTICE_INCOMING_HISTORY_REPEAT_PENALTY;\n    return (\n      Math.abs(left.ratio - targetRatio) +\n        leftRepeatPenalty -\n        (Math.abs(right.ratio - targetRatio) + rightRepeatPenalty) ||\n      left.school.id.localeCompare(right.school.id)\n    );'''
          if old not in text:
              raise SystemExit('planning ranking target not found')
          text = text.replace(old, new, 1)
          old = '''  const withoutImmediateRepeat =\n    lastOpponentId && ranked.length > 1\n      ? ranked.filter((opponent) => opponent.school.id !== lastOpponentId)\n      : ranked;\n  const pool = (\n    withoutImmediateRepeat.length > 0 ? withoutImmediateRepeat : ranked\n  ).slice(0, Math.min(4, ranked.length));'''
          new = '''  const offeredThisMonthSchoolIds = new Set(\n    offersThisMonth.map((entry) => entry.schoolId),\n  );\n  const withoutMonthlyRepeat = ranked.some(\n    (opponent) => !offeredThisMonthSchoolIds.has(opponent.school.id),\n  )\n    ? ranked.filter(\n        (opponent) => !offeredThisMonthSchoolIds.has(opponent.school.id),\n      )\n    : ranked;\n  const withoutImmediateRepeat =\n    lastOpponentId && withoutMonthlyRepeat.length > 1\n      ? withoutMonthlyRepeat.filter(\n          (opponent) => opponent.school.id !== lastOpponentId,\n        )\n      : withoutMonthlyRepeat;\n  const candidatePool =\n    withoutImmediateRepeat.length > 0\n      ? withoutImmediateRepeat\n      : withoutMonthlyRepeat;\n  const pool = candidatePool.slice(0, Math.min(4, candidatePool.length));'''
          if old not in text:
              raise SystemExit('planning pool target not found')
          text = text.replace(old, new, 1)
          old = '''function buildPracticePlanningFromSource(\n  state: PracticePlanningSource,\n  recentPracticeMatches: readonly PracticeMatchHistoryEntry[],\n): PracticePlanningResult {\n  if (hasDueOfficialMatch(state)) {\n    return {\n      incomingOffer: null,\n      outgoingCandidates: [],\n    };\n  }\n\n  const incomingOffer = buildIncomingOffer(state, recentPracticeMatches);\n  return {\n    incomingOffer,\n    outgoingCandidates: buildOutgoingCandidates(\n      state,\n      recentPracticeMatches,\n      incomingOffer ? new Set([incomingOffer.schoolId]) : undefined,\n    ),\n  };\n}\n\nexport function buildInitialPracticePlanning(\n  state: PracticePlanningSource,\n): PracticePlanningResult {\n  return buildPracticePlanningFromSource(state, []);\n}\n\nexport function buildPracticePlanning(\n  state: GameState,\n): PracticePlanningResult {\n  return buildPracticePlanningFromSource(\n    state,\n    state.weeklySchedule.recentPracticeMatches,\n  );\n}\n'''
          new = '''function buildPracticePlanningFromSource(\n  state: PracticePlanningSource,\n  recentPracticeMatches: readonly PracticeMatchHistoryEntry[],\n  incomingOfferHistory: readonly PracticeIncomingOfferHistoryEntry[],\n): PracticePlanningResult {\n  if (hasDueOfficialMatch(state)) {\n    return {\n      incomingOffer: null,\n      outgoingCandidates: [],\n      incomingOfferHistory: appendIncomingOfferHistory(\n        incomingOfferHistory,\n        null,\n        state.date,\n      ),\n    };\n  }\n\n  const incomingOffer = buildIncomingOffer(\n    state,\n    recentPracticeMatches,\n    incomingOfferHistory,\n  );\n  return {\n    incomingOffer,\n    outgoingCandidates: buildOutgoingCandidates(\n      state,\n      recentPracticeMatches,\n      incomingOffer ? new Set([incomingOffer.schoolId]) : undefined,\n    ),\n    incomingOfferHistory: appendIncomingOfferHistory(\n      incomingOfferHistory,\n      incomingOffer,\n      state.date,\n    ),\n  };\n}\n\nexport function buildInitialPracticePlanning(\n  state: PracticePlanningSource,\n): PracticePlanningResult {\n  return buildPracticePlanningFromSource(state, [], []);\n}\n\nexport function buildPracticePlanning(\n  state: GameState,\n): PracticePlanningResult {\n  return buildPracticePlanningFromSource(\n    state,\n    state.weeklySchedule.recentPracticeMatches,\n    state.weeklySchedule.practiceMatch.incomingOfferHistory ?? [],\n  );\n}\n'''
          if old not in text:
              raise SystemExit('planning footer target not found')
          planning.write_text(text.replace(old, new, 1))

          codec = Path('src/persistence/gameStateCodec.ts')
          text = codec.read_text()
          old = '''const practiceMatchHistoryEntrySchema = z\n  .object({\n    opponentSchoolId: z.string().min(1),\n    date: gameDateSchema,\n  })\n  .strict();\n'''
          new = '''const practiceMatchHistoryEntrySchema = z\n  .object({\n    opponentSchoolId: z.string().min(1),\n    date: gameDateSchema,\n  })\n  .strict();\n\nconst practiceIncomingOfferHistoryEntrySchema = z\n  .object({\n    schoolId: z.string().min(1),\n    date: gameDateSchema,\n  })\n  .strict();\n'''
          if old not in text:
              raise SystemExit('codec history schema target not found')
          text = text.replace(old, new, 1)
          old = '''        scheduledOpponentId: z.string().min(1).nullable(),\n        scheduledBy: z.enum(["incoming", "outgoing"]).nullable(),\n      })'''
          new = '''        scheduledOpponentId: z.string().min(1).nullable(),\n        scheduledBy: z.enum(["incoming", "outgoing"]).nullable(),\n        incomingOfferHistory: z\n          .array(practiceIncomingOfferHistoryEntrySchema)\n          .max(24)\n          .default([]),\n      })'''
          if old not in text:
              raise SystemExit('codec weekly practice target not found')
          codec.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write \
            src/domain/weekly/weeklyScheduleTypes.ts \
            src/domain/weekly/practiceMatchPlanning.ts \
            src/persistence/gameStateCodec.ts \
            tests/unit/domain/weekly/phase20PracticeOfferFrequency.test.ts
      - name: Run focused tests
        run: npx vitest run tests/unit/domain/weekly/practiceMatchPlanning.test.ts tests/unit/domain/weekly/phase20PracticeOfferFrequency.test.ts tests/unit/persistence/gameStateCodec.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified implementation
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/domain/weekly/weeklyScheduleTypes.ts \
            src/domain/weekly/practiceMatchPlanning.ts \
            src/persistence/gameStateCodec.ts \
            tests/unit/domain/weekly/phase20PracticeOfferFrequency.test.ts
          git commit -m "phase20-3-task1-green"
          git push
