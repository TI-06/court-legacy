name: Phase71 Format Once
on:
  push:
    branches:
      - fix/phase71-match-hub-single-screen-20261017
permissions:
  contents: write
jobs:
  format-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase71-match-hub-single-screen-20261017
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --fund=false
      - run: npx prettier --write src/features/match/MatchOfficialEntry.tsx src/features/match/matchOfficialEntry.css src/features/match/match.css tests/e2e/phase71-match-hub-single-screen.spec.ts
      - run: npm run typecheck
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase71-format-once.yml
          git add src/features/match/MatchOfficialEntry.tsx src/features/match/matchOfficialEntry.css src/features/match/match.css tests/e2e/phase71-match-hub-single-screen.spec.ts
          git commit -m "style(mobile): normalize match hub layout formatting"
          git push origin HEAD:fix/phase71-match-hub-single-screen-20261017
