name: Phase16 PvP session GREEN

on:
  push:
    branches:
      - feat/phase16-official-pvp-completion
    paths:
      - .github/workflows/phase16-pvp-session-green.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Patch generic automatic coach hook
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/domain/match/simulateMatch.ts')
          text = path.read_text()

          text = text.replace(
          '''import type {\n  MatchAnalysis,\n  MatchAnalysisFactor,\n  MatchEvent,\n  MatchRuntimeState,\n  MatchSetState,\n  MatchState,\n} from "../model/Match";''',
          '''import type {\n  CoachDecisionReason,\n  MatchAnalysis,\n  MatchAnalysisFactor,\n  MatchCommand,\n  MatchEvent,\n  MatchRuntimeState,\n  MatchSetState,\n  MatchState,\n} from "../model/Match";''')

          text = text.replace(
          '''export interface StartMatchInput extends SimulateMatchInput {\n  controlledSchoolId: SchoolId;\n}\n\nexport interface ResumeMatchInput {\n  state: GameState;\n  match: MatchState;\n}''',
          '''export interface AutomaticCoachDecisionInput {\n  state: GameState;\n  match: MatchState;\n  schoolId: SchoolId;\n  reason: CoachDecisionReason;\n}\n\nexport type AutomaticCoachPolicy = (\n  input: AutomaticCoachDecisionInput,\n) => Extract<MatchCommand, { type: "timeout" } | { type: "continue" }>;\n\nexport interface StartMatchInput extends SimulateMatchInput {\n  controlledSchoolId: SchoolId;\n  automaticCoachSchoolId?: SchoolId;\n  automaticCoach?: AutomaticCoachPolicy;\n}\n\nexport interface ResumeMatchInput {\n  state: GameState;\n  match: MatchState;\n  automaticCoachSchoolId?: SchoolId;\n  automaticCoach?: AutomaticCoachPolicy;\n}''')

          marker = '''function decrementTimeoutBoost(match: MatchState): void {\n  const runtime = runtimeOrThrow(match);\n  if (!runtime.timeoutBoost) {\n    return;\n  }\n  runtime.timeoutBoost.ralliesRemaining -= 1;\n  if (runtime.timeoutBoost.ralliesRemaining <= 0) {\n    runtime.timeoutBoost = null;\n  }\n}\n'''
          addition = marker + '''\nfunction automaticDecisionAlreadyConsumed(\n  match: MatchState,\n  schoolId: SchoolId,\n  reason: CoachDecisionReason,\n): boolean {\n  const runtime = runtimeOrThrow(match);\n  return runtime.commandHistory.some(\n    (record) =>\n      record.schoolId === schoolId &&\n      record.setNumber === match.currentSetNumber &&\n      record.decisionReason === reason,\n  );\n}\n\nfunction recordAutomaticCoachCommand(\n  match: MatchState,\n  schoolId: SchoolId,\n  reason: CoachDecisionReason,\n  command: Extract<MatchCommand, { type: "timeout" } | { type: "continue" }>,\n): void {\n  const runtime = runtimeOrThrow(match);\n  const eventSequence = match.eventLog.length;\n\n  if (command.type === "timeout") {\n    if (reason === "set-break") {\n      throw new Error("automatic coach cannot use timeout at a set break");\n    }\n    if (runtime.timeoutUsedSchoolIds.includes(schoolId)) {\n      throw new Error("automatic coach attempted a duplicate timeout");\n    }\n    runtime.timeoutUsedSchoolIds.push(schoolId);\n    runtime.timeoutBoost = { schoolId, ralliesRemaining: 5 };\n    match.eventLog.push({\n      sequence: match.eventLog.length + 1,\n      type: "timeout",\n      setNumber: match.currentSetNumber,\n      homeScore: runtime.homeScore,\n      awayScore: runtime.awayScore,\n      actorPlayerId: null,\n      targetPlayerId: null,\n      winnerSchoolId: schoolId,\n      detailCode: "timeout.automatic-coach",\n    });\n  }\n\n  runtime.commandHistory.push({\n    sequence: runtime.commandHistory.length + 1,\n    schoolId,\n    setNumber: match.currentSetNumber,\n    homeScore: runtime.homeScore,\n    awayScore: runtime.awayScore,\n    decisionReason: reason,\n    command: structuredClone(command),\n    eventSequence,\n  });\n}\n\nfunction maybeApplyAutomaticCoachDecision(\n  state: GameState,\n  match: MatchState,\n  schoolId: SchoolId | undefined,\n  reason: CoachDecisionReason,\n  policy: AutomaticCoachPolicy | undefined,\n): void {\n  if (!schoolId || !policy) {\n    return;\n  }\n  const runtime = runtimeOrThrow(match);\n  if (schoolId === runtime.controlledSchoolId) {\n    throw new Error("automatic coach cannot control the human-controlled school");\n  }\n  if (schoolId !== match.homeSchoolId && schoolId !== match.awaySchoolId) {\n    throw new Error("automatic coach school must be part of the match");\n  }\n  if (automaticDecisionAlreadyConsumed(match, schoolId, reason)) {\n    return;\n  }\n  if (\n    reason === "opponent-run" &&\n    (runtime.runLength < 4 ||\n      runtime.runWinnerSchoolId === null ||\n      runtime.runWinnerSchoolId === schoolId)\n  ) {\n    return;\n  }\n\n  const command = policy({ state, match, schoolId, reason });\n  recordAutomaticCoachCommand(match, schoolId, reason, command);\n}\n'''
          if marker not in text:
              raise SystemExit('decrementTimeoutBoost marker missing')
          text = text.replace(marker, addition, 1)

          old_finish = '''function finishSet(\n  match: MatchState,\n  rallyRuntime: RallyRuntime,\n  writer: EventWriter,\n  simulationState: GameState,\n): MatchStepResult | null {'''
          new_finish = '''function finishSet(\n  match: MatchState,\n  rallyRuntime: RallyRuntime,\n  writer: EventWriter,\n  simulationState: GameState,\n  automaticCoachSchoolId?: SchoolId,\n  automaticCoach?: AutomaticCoachPolicy,\n): MatchStepResult | null {'''
          if old_finish not in text:
              raise SystemExit('finishSet signature missing')
          text = text.replace(old_finish, new_finish, 1)

          old_before_human = '''  if (runtime.controlledSchoolId !== null) {\n    match.phase = "coach-decision";\n    match.pendingCoachCommandForSchoolId = runtime.controlledSchoolId;\n    runtime.pendingDecisionReason = "set-break";\n    return { match, analysis: null };\n  }'''
          new_before_human = '''  maybeApplyAutomaticCoachDecision(\n    simulationState,\n    match,\n    automaticCoachSchoolId,\n    "set-break",\n    automaticCoach,\n  );\n\n  if (runtime.controlledSchoolId !== null) {\n    match.phase = "coach-decision";\n    match.pendingCoachCommandForSchoolId = runtime.controlledSchoolId;\n    runtime.pendingDecisionReason = "set-break";\n    return { match, analysis: null };\n  }'''
          if old_before_human not in text:
              raise SystemExit('set-break human block missing')
          text = text.replace(old_before_human, new_before_human, 1)

          old_run_sig = '''function runUntilBoundary(\n  state: GameState,\n  sourceMatch: MatchState,\n  randomOverride?: RandomSource,\n): MatchStepResult {'''
          new_run_sig = '''function runUntilBoundary(\n  state: GameState,\n  sourceMatch: MatchState,\n  randomOverride?: RandomSource,\n  automaticCoachSchoolId?: SchoolId,\n  automaticCoach?: AutomaticCoachPolicy,\n): MatchStepResult {'''
          if old_run_sig not in text:
              raise SystemExit('runUntilBoundary signature missing')
          text = text.replace(old_run_sig, new_run_sig, 1)

          old_finish_call = '''      const completed = finishSet(match, rallyRuntime, writer, simulationState);'''
          new_finish_call = '''      const completed = finishSet(\n        match,\n        rallyRuntime,\n        writer,\n        simulationState,\n        automaticCoachSchoolId,\n        automaticCoach,\n      );'''
          if old_finish_call not in text:
              raise SystemExit('finishSet call missing')
          text = text.replace(old_finish_call, new_finish_call, 1)

          old_human_check = '''    if (shouldOpenOpponentRunDecision(match)) {\n      match.phase = "coach-decision";'''
          new_human_check = '''    maybeApplyAutomaticCoachDecision(\n      simulationState,\n      match,\n      automaticCoachSchoolId,\n      "opponent-run",\n      automaticCoach,\n    );\n\n    if (shouldOpenOpponentRunDecision(match)) {\n      match.phase = "coach-decision";'''
          if old_human_check not in text:
              raise SystemExit('human opponent-run block missing')
          text = text.replace(old_human_check, new_human_check, 1)

          old_exports = '''export function startMatch(input: StartMatchInput): MatchStepResult {\n  const match = createInitialMatchState(input, input.controlledSchoolId);\n  return runUntilBoundary(input.state, match);\n}\n\nexport function resumeMatch(input: ResumeMatchInput): MatchStepResult {\n  return runUntilBoundary(input.state, input.match);\n}'''
          new_exports = '''export function startMatch(input: StartMatchInput): MatchStepResult {\n  const match = createInitialMatchState(input, input.controlledSchoolId);\n  return runUntilBoundary(\n    input.state,\n    match,\n    undefined,\n    input.automaticCoachSchoolId,\n    input.automaticCoach,\n  );\n}\n\nexport function resumeMatch(input: ResumeMatchInput): MatchStepResult {\n  return runUntilBoundary(\n    input.state,\n    input.match,\n    undefined,\n    input.automaticCoachSchoolId,\n    input.automaticCoach,\n  );\n}'''
          if old_exports not in text:
              raise SystemExit('start/resume exports missing')
          text = text.replace(old_exports, new_exports, 1)
          path.write_text(text)
          PY
      - name: Remove unused public-builder parameter
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('worker/pvp/pvpMatchSession.ts')
          text = path.read_text()
          text = text.replace(
          '''function sideForSchool(\n  match: MatchState,\n  challengerSchoolId: SchoolId,\n  schoolId: SchoolId | null,\n): "challenger" | "defender" | null {''',
          '''function sideForSchool(\n  challengerSchoolId: SchoolId,\n  schoolId: SchoolId | null,\n): "challenger" | "defender" | null {''')
          text = text.replace('''      winner: sideForSchool(\n        session.match,\n        session.challengerSchoolId,''', '''      winner: sideForSchool(\n        session.challengerSchoolId,''')
          path.write_text(text)
          PY
      - run: npx prettier --write src/domain/match/simulateMatch.ts worker/pvp/automaticDefenderCoach.ts worker/pvp/pvpMatchSession.ts tests/unit/worker/phase16PvpMatchSession.test.ts
      - name: Focused tests
        run: npx vitest run tests/unit/worker/phase16PvpMatchSession.test.ts tests/unit/worker/buildPvpSimulationState.test.ts tests/unit/worker/phase15PvpMatchTactics.test.ts tests/unit/domain/match/phase16ResumableMatch.test.ts tests/unit/domain/match/phase16MatchCommands.test.ts tests/unit/domain/match/phase16RandomCompatibility.test.ts
      - name: Remove temporary files and commit
        run: |
          git rm .github/workflows/phase16-pvp-session-green.yml docs/superpowers/.phase16-red-ci-marker.md
          git add src/domain/match/simulateMatch.ts worker/pvp/automaticDefenderCoach.ts worker/pvp/pvpMatchSession.ts tests/unit/worker/phase16PvpMatchSession.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: add resumable PvP match sessions"
          git push
