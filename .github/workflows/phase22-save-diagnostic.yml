name: Phase22 Save Diagnostic

on:
  push:
    branches:
      - tmp/phase22-1-long-run-save-stability

permissions:
  contents: read

jobs:
  save-growth-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Check compact save payload expectation
        id: payload-check
        continue-on-error: true
        run: npx vitest run tests/unit/worker/data/SupabaseGameStore.test.ts --reporter=verbose
      - name: Record payload check result
        run: echo "payload_check=${{ steps.payload-check.outcome }}"
      - name: Measure 156-week save growth
        run: npx vitest run tests/unit/diagnostics/phase22SaveGrowthDiagnostic.test.ts --reporter=verbose
      - name: Upload save growth diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase22-save-growth
          path: .phase22-diagnostics/save-growth.json
          retention-days: 3
