name: Format year-end regression

on:
  push:
    branches:
      - fix/year-end-advance-week-deadlock

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/year-end-advance-week-deadlock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier tests/unit/worker/yearEndCommittedRecruitAdvance.test.ts --write
      - run: rm -f .github/workflows/format-year-end-regression.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: format year-end advance regression'
          git push origin HEAD:fix/year-end-advance-week-deadlock
