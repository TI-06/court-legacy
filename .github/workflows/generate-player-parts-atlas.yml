name: Generate Player Parts Atlas

on:
  push:
    branches: ["feature/m6-game-ui-refresh"]
    paths:
      - "scripts/generate_player_parts_atlas.py"
      - ".github/workflows/generate-player-parts-atlas.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m6-game-ui-refresh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate transparent WebP atlas
        run: python scripts/generate_player_parts_atlas.py
      - name: Commit generated atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/player-parts/v1/all-parts-atlas.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: generate player parts WebP atlas"
          git push origin HEAD:feature/m6-game-ui-refresh
