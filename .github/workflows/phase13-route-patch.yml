name: Phase 13 Route Patch

on:
  push:
    branches:
      - feat/phase13-home-command-center

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply routing changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          player_path = Path('src/features/team/PlayerHubScreen.tsx')
          player = player_path.read_text()
          player = replace_once(
              player,
              '  leadershipPending?: boolean;\n  trainingPending?: boolean;',
              '  initialPlayerId?: PlayerId | null;\n  leadershipPending?: boolean;\n  trainingPending?: boolean;',
              'player props',
          )
          player = replace_once(
              player,
              '  onAssignLeadership,\n  leadershipPending = false,',
              '  onAssignLeadership,\n  initialPlayerId = null,\n  leadershipPending = false,',
              'player destructure',
          )
          player = replace_once(
              player,
              '  const [selectedPlayerId, setSelectedPlayerId] = useState<PlayerId | null>(\n    null,\n  );',
              '  const [selectedPlayerId, setSelectedPlayerId] = useState<PlayerId | null>(\n    initialPlayerId,\n  );',
              'player initial state',
          )
          player_path.write_text(player)

          app_path = Path('src/app/GameApp.tsx')
          app = app_path.read_text()
          app = replace_once(
              app,
              'import { HomeScreen } from "../features/home/HomeScreen";\n',
              'import { HomeScreen } from "../features/home/HomeScreen";\nimport type { HomeCommandAction } from "../features/home/homeCommandCenter";\n',
              'home action import',
          )
          app = replace_once(
              app,
              'import { SchoolScreen } from "../features/school/SchoolScreen";\n',
              'import { SchoolScreen } from "../features/school/SchoolScreen";\nimport { requestSchoolView } from "../features/school/SchoolNavigationState";\n',
              'school view import',
          )
          app = replace_once(
              app,
              '  const [latestMatchResult, setLatestMatchResult] =\n    useState<SimulateMatchResult | null>(null);',
              '  const [, setLatestMatchResult] = useState<SimulateMatchResult | null>(null);',
              'latest match setter',
          )
          app = replace_once(
              app,
              '  const [preMatch, setPreMatch] = useState<PreMatchContext | null>(null);\n',
              '  const [preMatch, setPreMatch] = useState<PreMatchContext | null>(null);\n  const [teamInitialPlayerId, setTeamInitialPlayerId] =\n    useState<PlayerId | null>(null);\n',
              'team initial state',
          )
          app = replace_once(
              app,
              '  const changeTab = (tab: AppTab) => {\n    if (tab !== "more") setMoreView("menu");',
              '  const changeTab = (tab: AppTab) => {\n    if (tab === "team") setTeamInitialPlayerId(null);\n    if (tab !== "more") setMoreView("menu");',
              'change tab reset',
          )
          app = replace_once(
              app,
              '    await executeAdvanceWeek();\n  };\n\n  const chooseEvent = async (choiceId: string) => {',
              '''    await executeAdvanceWeek();
  };

  const handleHomeCommand = (action: HomeCommandAction) => {
    switch (action.target) {
      case "team":
        setTeamInitialPlayerId(null);
        setActiveTab("team");
        return;
      case "player":
        setTeamInitialPlayerId(action.playerId);
        setActiveTab("team");
        return;
      case "school":
        requestSchoolView(action.view);
        setScoutingOpen(false);
        setActiveTab("school");
        return;
      case "scouting":
        setActiveTab("school");
        openScouting();
        return;
      case "practice":
        openFreshPracticeMatch();
        return;
      case "tournament":
        openOfficialTournament();
        return;
      case "start-week-match":
        void advanceWeek();
        return;
    }
  };

  const chooseEvent = async (choiceId: string) => {''',
              'home command handler',
          )
          old_home = '''      <HomeScreen
        homeStrength={homeStrength}
        latestMatch={latestMatchResult}
        onAdvanceWeek={advanceWeek}
        onMarkNotificationRead={markNotificationRead}
        onOpenMatch={openFreshPracticeMatch}
        onOpenOfficialTournament={openOfficialTournament}
        onOpenTeam={() => setActiveTab("team")}
        onOpenSchool={() => setActiveTab("school")}
        onAcceptPracticeOffer={() => void acceptPracticeOffer()}
        onDeclinePracticeOffer={() => void declinePracticeOffer()}
        operationPending={cloudSession.operation.status === "submitting"}
        opponent={opponent}
        practiceMatchCompleted={practiceMatchCompleted}
        state={gameState}
        trainingCompleted={trainingCompleted}
      />'''
          new_home = '''      <HomeScreen
        data={gameData}
        homeStrength={homeStrength}
        onAcceptPracticeOffer={() => void acceptPracticeOffer()}
        onAdvanceWeek={advanceWeek}
        onCommand={handleHomeCommand}
        onDeclinePracticeOffer={() => void declinePracticeOffer()}
        onMarkNotificationRead={markNotificationRead}
        operationPending={cloudSession.operation.status === "submitting"}
        state={gameState}
      />'''
          app = replace_once(app, old_home, new_home, 'home render')
          app = replace_once(
              app,
              '      <PlayerHubScreen\n        leadershipPending={cloudSession.operation.status === "submitting"}',
              '      <PlayerHubScreen\n        initialPlayerId={teamInitialPlayerId}\n        leadershipPending={cloudSession.operation.status === "submitting"}',
              'player hub render',
          )
          app_path.write_text(app)
          PY
          npx prettier src/app/GameApp.tsx src/features/team/PlayerHubScreen.tsx --write
      - name: Commit routing implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/GameApp.tsx src/features/team/PlayerHubScreen.tsx
          git commit -m "feat: route Home coaching commands"
          git push origin HEAD:feat/phase13-home-command-center
