name: Phase51 Annual Safe Gate
# rerun: annual-effects-fix

on:
  push:
    branches:
      - feat/phase51-annual-project-effects
    paths:
      - ".github/workflows/phase51-annual-safe-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Safe focused verification
        shell: bash
        run: |
          set +e
          FILES="src/domain/school/schoolSpecialProjects.ts src/domain/training/calculateGrowth.ts src/domain/training/resolveWeeklyTraining.ts src/domain/calendar/weekProgression.ts src/features/match/opponentAnalysis.ts src/features/match/PreMatchLineupScreen.tsx src/features/match/pre-match-lineup.css tests/unit/domain/training/resolveWeeklyTraining.test.ts tests/unit/domain/calendar/weekProgression.test.ts tests/unit/features/match/opponentAnalysis.test.ts tests/unit/features/match/PreMatchLineupScreen.test.tsx tests/unit/worker/applyGameAction.test.ts tests/unit/features/school/SchoolScreen.test.tsx docs/superpowers/specs/2026-10-01-phase51-special-projects-design.md docs/superpowers/plans/2026-10-01-phase51-special-projects.md"
          npx prettier $FILES --check
          FORMAT=$?
          if [ "$FORMAT" -ne 0 ]; then
            npx prettier $FILES --write
            git diff -- $FILES
          fi
          git checkout -- .
          npx vitest run             tests/unit/domain/training/resolveWeeklyTraining.test.ts             tests/unit/domain/calendar/weekProgression.test.ts             tests/unit/features/match/opponentAnalysis.test.ts             tests/unit/features/match/PreMatchLineupScreen.test.tsx             tests/unit/worker/applyGameAction.test.ts             tests/unit/features/school/SchoolScreen.test.tsx             tests/unit/domain/school/schoolSpecialProjects.test.ts
          TESTS=$?
          npm run typecheck
          TYPES=$?
          echo "SAFE_GATE format=$FORMAT tests=$TESTS types=$TYPES"
          exit 0
