name: Temporary Destiny Rival UI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-rival-world-progression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Add destiny rival UI
        run: |
          npm ci
          node scripts/tmp-add-destiny-rival-ui.mjs
          npm run format
          rm scripts/tmp-add-destiny-rival-ui.mjs
          rm .github/workflows/tmp-destiny-rival-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 学校画面へ宿命校と因縁度を表示"
          git push origin HEAD:feature/m3-rival-world-progression
