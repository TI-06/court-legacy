name: Phase16 Command Presentation Helper

on:
  push:
    branches:
      - feat/phase16-match-command-ux

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format and verify command presentation
        run: |
          npx prettier --write src/features/match/matchCommandPresentation.ts tests/unit/features/match/matchCommandPresentation.test.ts
          npx vitest run tests/unit/features/match/matchCommandPresentation.test.ts
          git rm .github/workflows/phase16-presentation-helper.yml
      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize match command impact presentation"
          git push
