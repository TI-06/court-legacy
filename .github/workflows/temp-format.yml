name: Temporary branch formatter

on:
  push:
    branches:
      - codex/coach-development-directives-and-match-playback

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/coach-development-directives-and-match-playback
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier src/domain/training/coachTrainingRecommendations.ts src/domain/training/resolveWeeklyTraining.ts src/features/team/player-hub.css src/features/team/PlayerHubScreen.tsx tests/unit/domain/training/coachTrainingRecommendations.test.ts --write
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/training/coachTrainingRecommendations.ts src/domain/training/resolveWeeklyTraining.ts src/features/team/player-hub.css src/features/team/PlayerHubScreen.tsx tests/unit/domain/training/coachTrainingRecommendations.test.ts
          git diff --cached --quiet || git commit -m "style: apply prettier formatting"
          git push
