name: Phase10 Diagnose CI Guards

on:
  push:
    branches:
      - feature/phase10-training-player-mobile-ui
    paths:
      - .github/workflows/phase10-diagnose-ci-guards.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase10-training-player-mobile-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: V2 structure
        continue-on-error: true
        run: node scripts/verifyStructureCli.mjs
      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
