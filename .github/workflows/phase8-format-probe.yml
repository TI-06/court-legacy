name: Phase 8 format probe

on:
  push:
    branches:
      - feature/phase8-mobile-game-loop-impl

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Print Prettier diff
        run: |
          npx prettier tests/unit/domain/generation/phase8InitialWorld.test.ts tests/unit/persistence/phase8GameStateMigration.test.ts --write
          git diff -- tests/unit/domain/generation/phase8InitialWorld.test.ts tests/unit/persistence/phase8GameStateMigration.test.ts
          exit 1
