name: Phase11 Format Plan

on:
  push:
    branches:
      - feature/phase11-home-week-progression
    paths:
      - .github/workflows/phase11-format-plan.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase11-home-week-progression
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/superpowers/plans/2026-08-31-phase11-home-week-progression.md
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/plans/2026-08-31-phase11-home-week-progression.md
          git commit -m "docs: format phase11 implementation plan"
          git push origin HEAD:feature/phase11-home-week-progression
