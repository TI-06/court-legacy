name: Phase4 history perspective patch

on:
  push:
    branches:
      - feature/court-legacy-v2-phase4-async-pvp
    paths:
      - .github/workflows/phase4-history-perspective-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase4-async-pvp
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Align history perspective fixtures and docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found: {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "tests/unit/app/GameApp.pvp.test.tsx",
              '  opponentSchoolName: opponent.schoolName,\n  outcome: "win",',
              '  opponentSchoolName: opponent.schoolName,\n  perspective: "challenger",\n  outcome: "win",',
          )

          replace(
              "src/app/createBrowserAppDependencies.ts",
              '      opponentSchoolName: opponent.schoolName,\n      outcome: result.outcome,',
              '      opponentSchoolName: opponent.schoolName,\n      perspective: "challenger",\n      outcome: result.outcome,',
          )

          replace(
              "tests/unit/worker/supabasePvPStore.test.ts",
              '            opponent_school_name: "白峰高校",\n            outcome: "win",',
              '            opponent_school_name: "白峰高校",\n            perspective: "challenger",\n            outcome: "win",',
          )

          replace(
              "tests/unit/worker/supabasePvPStore.test.ts",
              '        opponentSchoolName: "白峰高校",\n        outcome: "win",',
              '        opponentSchoolName: "白峰高校",\n        perspective: "challenger",\n        outcome: "win",',
          )

          replace(
              "tests/unit/worker/pvpChallenge.test.ts",
              '    const body = await response.json();',
              '    expect(store.committed[0]?.result).toEqual(\n      expect.objectContaining({ challengerSchoolName: "青葉高校" }),\n    );\n\n    const body = await response.json();',
          )

          replace(
              "tests/unit/worker/pvpChallenge.test.ts",
              '    expect(serialized).not.toContain("actorPlayerId");',
              '    expect(serialized).not.toContain("actorPlayerId");\n    expect(serialized).not.toContain("challengerSchoolName");',
          )

          replace(
              "README.md",
              '4. `supabase/migrations/202608280004_async_pvp.sql`',
              '4. `supabase/migrations/202608280004_async_pvp.sql`\n5. `supabase/migrations/202608280005_pvp_history_perspective.sql`',
          )

          replace(
              "README.md",
              '`202608280004_async_pvp.sql` adds append-only published team snapshots, seasonal ratings, rated match history, operation idempotency, and atomic rating/match persistence. Rating updates for both users and the match record are committed through the server-side persistence boundary rather than separate browser writes.',
              '`202608280004_async_pvp.sql` adds append-only published team snapshots, seasonal ratings, rated match history, operation idempotency, and atomic rating/match persistence. `202608280005_pvp_history_perspective.sql` normalizes history for both challenger and defender views without inventing a challenger snapshot ID. Rating updates for both users and the match record are committed through the server-side persistence boundary rather than separate browser writes.',
          )

          replace(
              "README.md",
              '1. Apply all Supabase migrations through `202608280004_async_pvp.sql`.',
              '1. Apply all Supabase migrations through `202608280005_pvp_history_perspective.sql`.',
          )
          PY
      - run: npx prettier src/app/createBrowserAppDependencies.ts tests/unit/app/GameApp.pvp.test.tsx tests/unit/worker/supabasePvPStore.test.ts tests/unit/worker/pvpChallenge.test.ts README.md --write
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/createBrowserAppDependencies.ts tests/unit/app/GameApp.pvp.test.tsx tests/unit/worker/supabasePvPStore.test.ts tests/unit/worker/pvpChallenge.test.ts README.md
          git commit -m "fix: align PvP history perspective fixtures"
          git push origin HEAD:feature/court-legacy-v2-phase4-async-pvp
