name: Phase10 Diagnose Task2

on:
  push:
    branches:
      - feature/phase10-training-player-mobile-ui
    paths:
      - .github/workflows/phase10-diagnose-task2.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase10-training-player-mobile-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        continue-on-error: true
        run: npm run format:check
      - name: Lint
        continue-on-error: true
        run: npm run lint
      - name: Type check
        continue-on-error: true
        run: npm run typecheck
      - name: Migration and codec tests
        continue-on-error: true
        run: npm test -- tests/unit/persistence/gameStateCodec.test.ts tests/unit/persistence/phase10GameStateMigration.test.ts tests/unit/persistence/phase6GameStateMigration.test.ts tests/unit/persistence/phase7GameStateMigration.test.ts tests/unit/persistence/phase8GameStateMigration.test.ts
      - name: Full unit tests
        continue-on-error: true
        run: npm test
      - name: Production build
        continue-on-error: true
        run: npm run build
