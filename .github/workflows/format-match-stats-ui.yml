name: Format match stats UI

on:
  push:
    branches:
      - feat/game-like-match-stats-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format changed match UI files
        run: npx prettier --write src/features/match/MatchScreen.tsx src/features/match/MatchStatPanels.tsx src/features/match/matchPresentation.ts src/features/match/matchGameStats.css
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/match/MatchScreen.tsx src/features/match/MatchStatPanels.tsx src/features/match/matchPresentation.ts src/features/match/matchGameStats.css
          git commit -m 'style: format volleyball match stats UI'
          git push
