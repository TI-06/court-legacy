name: Phase 7 Format Preview

on:
  push:
    branches: [feature/court-legacy-v2-phase7-team-dynamics]

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Print formatted Task 10 files
        run: |
          echo '---TEAM-DYNAMICS-LONG-RUN---'
          npx prettier tests/unit/domain/dynamics/teamDynamicsLongRun.test.ts
          echo '---TEAM-DYNAMICS-E2E---'
          npx prettier tests/e2e/team-dynamics-flow.spec.ts
