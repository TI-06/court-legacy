name: Branch format

on:
  push:
    branches: [feat/gameplay-home-school-polish]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gameplay-home-school-polish
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/EventDialog.tsx src/features/home/HomeScreen.tsx src/features/team/team-dynamics.css tests/unit/features/home/EventDialog.test.tsx tests/unit/features/home/HomeScreen.test.tsx tests/unit/features/team/PlayerHubScreen.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply prettier formatting"
            git push origin HEAD:feat/gameplay-home-school-polish
          fi
