name: Branch format

on:
  push:
    branches: [feat/gameplay-home-school-polish]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gameplay-home-school-polish
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier tests/unit/domain/player/playerDevelopmentPresentation.test.ts --write
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/domain/player/playerDevelopmentPresentation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply prettier to player development test"
            git push origin HEAD:feat/gameplay-home-school-polish
          fi
