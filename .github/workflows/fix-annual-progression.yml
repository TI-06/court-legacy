name: Fix annual progression

on:
  push:
    branches: [feature/m3-annual-progression]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-annual-progression
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply review fixes and format
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/domain/calendar/academicYearProgression.ts')
          text = path.read_text().replace(
            'currentPlayers: Object.values(players),',
            '''currentPlayers: returningPlayerIds\n        .map((playerId) => players[playerId])\n        .filter((player): player is Player => Boolean(player)),''',
          )
          path.write_text(text)

          path = Path('src/features/home/YearTransitionDialog.tsx')
          text = path.read_text()
          text = text.replace(
            'import type { GameState } from "../../domain/model/GameState";',
            'import type { GameState } from "../../domain/model/GameState";\nimport type { Player } from "../../domain/model/Player";',
          )
          text = text.replace(
            '''    .map((playerId) => state.players[playerId])\n    .filter((player) => Boolean(player))\n    .map((player) => `${player!.lastName} ${player!.firstName}`);''',
            '''    .map((playerId) => state.players[playerId])\n    .filter((player): player is Player => Boolean(player))\n    .map((player) => `${player.lastName} ${player.firstName}`);''',
          )
          path.write_text(text)

          path = Path('tests/e2e/annual-progression.spec.ts')
          path.write_text(path.read_text().replace(
            'await expect(page.getByText("2年目")).toBeVisible();',
            'await expect(page.getByText("YEAR 2")).toBeVisible();',
          ))
          PY
          npx prettier src/domain/calendar/academicYearProgression.ts src/features/home/YearTransitionDialog.tsx tests/e2e/annual-progression.spec.ts tests/unit/domain/calendar/academicYearProgression.test.ts tests/unit/features/home/YearTransitionDialog.test.tsx --write
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix: 年度更新を長期運用向けに調整"
          git push origin HEAD:feature/m3-annual-progression
