name: Fix facility mobile wrap

on:
  push:
    branches:
      - feat/facility-50-assistant-coach

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 360px facility title fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/school/school-screen.css')
          text = path.read_text()
          old = '''.facility-tile__top strong {
  overflow: hidden;
  font-size: 0.76rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}'''
          new = '''.facility-tile__top strong {
  min-width: 0;
  overflow: visible;
  font-size: 0.76rem;
  line-height: 1.25;
  overflow-wrap: anywhere;
  text-overflow: clip;
  white-space: normal;
}'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix when changed
        run: |
          if git diff --quiet -- src/features/school/school-screen.css; then
            echo 'No facility mobile fix needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/school/school-screen.css
          git commit -m 'fix: wrap facility titles on narrow mobile'
          git push
