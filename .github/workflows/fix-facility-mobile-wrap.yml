name: Fix facility mobile wrap

on:
  push:
    branches:
      - feat/facility-50-assistant-coach

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 360px facility title fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/school/school-screen.css')
          text = path.read_text()
          old = ".facility-tile__top strong {\n  overflow: hidden;\n  font-size: 0.76rem;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}"
          new = ".facility-tile__top strong {\n  min-width: 0;\n  overflow: visible;\n  font-size: 0.76rem;\n  line-height: 1.25;\n  overflow-wrap: anywhere;\n  text-overflow: clip;\n  white-space: normal;\n}"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix when changed
        run: |
          if git diff --quiet -- src/features/school/school-screen.css; then
            echo 'No facility mobile fix needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/school/school-screen.css
          git commit -m 'fix: wrap facility titles on narrow mobile'
          git push
