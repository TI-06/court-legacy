name: Phase 12 UI Apply
on:
  push:
    branches: [feature/phase12-game-loop-polish]
    paths:
      - scripts/phase12-ui-apply.py
      - scripts/phase12-ui-integration-fix.py
      - scripts/phase12-home-fix.py
      - .github/workflows/phase12-ui-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feature/phase12-game-loop-polish, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: python scripts/phase12-ui-apply.py tests
      - name: Confirm RED
        shell: bash
        run: |
          set +e
          npx vitest run tests/unit/ui/shell/phase12Navigation.test.ts tests/unit/ui/OperationBlockingOverlay.test.tsx
          status=$?
          set -e
          test "$status" -ne 0
      - run: python scripts/phase12-ui-apply.py production
      - name: Apply integration repairs
        run: python scripts/phase12-ui-integration-fix.py
      - name: Finalize Home
        run: python scripts/phase12-home-fix.py
      - name: Confirm focused GREEN
        run: npx vitest run tests/unit/ui/shell/phase12Navigation.test.ts tests/unit/ui/OperationBlockingOverlay.test.tsx tests/unit/features/more/MoreScreen.test.tsx tests/unit/features/school/SchoolScreen.test.tsx
      - name: Typecheck
        run: npm run typecheck && npm run typecheck:worker
      - name: Cleanup
        run: rm -f scripts/phase12-ui-apply.py scripts/phase12-ui-integration-fix.py scripts/phase12-home-fix.py .github/workflows/phase12-ui-apply.yml
      - name: Commit UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Phase 12 mobile game UI"
          git push origin HEAD:feature/phase12-game-loop-polish
