name: Phase 6 Task 8 Screen Green

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  screen-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format tournament screen
        run: >-
          npx prettier
          src/features/tournament/TournamentScreen.tsx
          src/features/tournament/tournament.css
          tests/unit/features/tournament/TournamentScreen.test.tsx
          --write
      - name: Verify tournament screen
        run: |
          npm test -- tests/unit/features/tournament/TournamentScreen.test.tsx tests/unit/domain/tournament/tournamentSelectors.test.ts
          npm run typecheck
      - name: Commit formatted tournament screen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/tournament/TournamentScreen.tsx src/features/tournament/tournament.css tests/unit/features/tournament/TournamentScreen.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format Phase 6 tournament screen"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
