name: Format Task 2 Artifact

on:
  push:
    branches: ["feature/m6-game-ui-refresh"]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Task 2 files
        run: >-
          npx prettier
          src/ui/player-art/generatedArtManifest.ts
          tests/unit/ui/player-art/generatedArtManifest.test.ts
          --write
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-task-2
          path: |
            src/ui/player-art/generatedArtManifest.ts
            tests/unit/ui/player-art/generatedArtManifest.test.ts
          retention-days: 1
