name: Phase50 Funds Balance Check

on:
  push:
    branches:
      - test/phase50-funds-zero-diagnosis
    paths:
      - ".github/workflows/phase50-funds-diagnosis.yml"
      - "src/dev/soak/**"
      - "tests/unit/soak/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused soak driver tests
        run: npx vitest run tests/unit/soak/soakDriver.test.ts
      - name: Re-run affected 10-season seed
        run: npm run soak:balance -- --seed phase50-balance-b
