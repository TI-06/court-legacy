name: Phase21 PR21-2 Task5 GREEN

on:
  push:
    branches:
      - feat/phase21-2-relationship-model-persistence

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply Task5 implementation
        id: apply
        continue-on-error: true
        run: |
          python3 .github/phase21-task5-apply-v2.py
          npx prettier --write \
            src/domain/notifications/gameNotifications.ts \
            worker/game/applyGameAction.ts \
            src/features/home/homeCommandCenter.ts \
            src/features/home/HomeCommandCenter.tsx \
            src/features/home/HomeScreen.tsx
      - name: Run focused tests
        id: tests
        continue-on-error: true
        run: npx vitest run tests/unit/domain/notifications tests/unit/worker/phase21SpecialRelationshipNotifications.test.ts tests/unit/worker/applyGameAction.test.ts tests/unit/features/home/Phase21RelationshipNotice.test.tsx tests/unit/features/home/HomeScreen.test.tsx
      - name: Run typecheck
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Report result
        if: always()
        run: |
          echo "apply=${{ steps.apply.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          echo "types=${{ steps.types.outcome }}"
      - name: Commit verified Task5 implementation
        if: ${{ steps.apply.outcome == 'success' && steps.tests.outcome == 'success' && steps.types.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm .github/phase21-task5-apply.py .github/phase21-task5-apply-v2.py .github/workflows/phase21-pr21-2-task5-green.yml
          git config user.name "TI-06"
          git config user.email "iretaku.shop@gmail.com"
          git add -A
          git commit -m "feat: notify special relationship changes"
          git push origin HEAD:feat/phase21-2-relationship-model-persistence
