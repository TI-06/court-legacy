name: Phase 6 Format Task 2 Prod

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  format-task2-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier
          src/domain/tournament/createNationalStage.ts
          src/domain/tournament/resolveNpcTournamentMatch.ts
          --write
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/tournament/createNationalStage.ts src/domain/tournament/resolveNpcTournamentMatch.ts
          git commit -m "chore: format Phase 6 Task 2 implementation"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
