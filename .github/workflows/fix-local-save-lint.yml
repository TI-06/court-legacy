name: Fix local save lint

on:
  push:
    branches: [feature/m1-local-save-recovery]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-local-save-recovery
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Remove synchronous effect state updates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/save/SaveSheet.tsx')
          text = path.read_text()
          text = text.replace('  const [loading, setLoading] = useState(false);\n', '')
          text = text.replace('    setLoading(true);\n    setMessage(null);\n    setError(null);\n', '')
          text = text.replace('      .finally(() => {\n        if (active) {\n          setLoading(false);\n        }\n      });\n', '      ;\n')
          text = text.replace('        {loading ? (\n          <p className="save-sheet-status">セーブ情報を確認中です</p>\n        ) : null}\n', '')
          path.write_text(text)
          PY
          npx prettier src/features/save/SaveSheet.tsx --write
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/save/SaveSheet.tsx
          git commit -m "fix: effect内の同期state更新を除去"
          git push origin HEAD:feature/m1-local-save-recovery
