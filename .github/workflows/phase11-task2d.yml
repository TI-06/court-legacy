name: Phase11 Task2 Retry

on:
  push:
    branches:
      - feature/phase11-home-week-progression
    paths:
      - .github/workflows/phase11-task2d.yml

permissions:
  contents: write

jobs:
  task2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase11-home-week-progression
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: python .github/phase11_task2.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/GameApp.tsx src/features/match/MatchScreen.tsx src/features/match/matchPresentation.ts tests/unit/features/match/MatchFlow.test.tsx
          git commit -m "feat: present week progression matches from home"
          git push origin HEAD:feature/phase11-home-week-progression
