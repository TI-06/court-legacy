name: Phase21 Prettier Apply

on:
  push:
    branches:
      - tmp/phase21-prettier-probe

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Apply Prettier
        run: |
          npx prettier tests/unit/domain/events/phase21SpecialRelationshipEffects.test.ts tests/unit/domain/relationships/phase21RelationshipPresentationSelector.test.ts tests/unit/soak/soakDeterminism.test.ts --write
          npx prettier tests/unit/domain/events/phase21SpecialRelationshipEffects.test.ts tests/unit/domain/relationships/phase21RelationshipPresentationSelector.test.ts tests/unit/soak/soakDeterminism.test.ts --check
          git diff --check
      - name: Commit exact formatter output when needed
        run: |
          if git diff --quiet -- tests/unit/domain/events/phase21SpecialRelationshipEffects.test.ts tests/unit/domain/relationships/phase21RelationshipPresentationSelector.test.ts tests/unit/soak/soakDeterminism.test.ts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/domain/events/phase21SpecialRelationshipEffects.test.ts tests/unit/domain/relationships/phase21RelationshipPresentationSelector.test.ts tests/unit/soak/soakDeterminism.test.ts
          git commit -m "chore: apply phase21 prettier output"
          git push origin HEAD:tmp/phase21-prettier-probe
