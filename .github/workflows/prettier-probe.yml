name: Phase21 Final Preflight

on:
  push:
    branches:
      - tmp/phase21-prettier-probe

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Check changed-file formatting
        run: |
          npx prettier tests/unit/domain/events/phase21SpecialRelationshipEffects.test.ts tests/unit/domain/relationships/phase21RelationshipPresentationSelector.test.ts tests/unit/persistence/phase21GameStateMigration.test.ts tests/unit/persistence/phase14GameStateMigration.test.ts tests/unit/persistence/phase17GameStateCodec.test.ts tests/unit/persistence/phase20ConcernNotificationCodec.test.ts tests/unit/pwa/saveCompatibility.test.ts tests/unit/soak/soakDeterminism.test.ts tests/unit/soak/soakDriver.test.ts --check
          git diff --check
      - name: Run focused regression suites
        run: npx vitest run tests/unit/domain/events/phase21SpecialRelationshipEffects.test.ts tests/unit/domain/relationships/specialRelationships.test.ts tests/unit/domain/relationships/phase21RelationshipPresentationSelector.test.ts tests/unit/persistence/phase21GameStateMigration.test.ts tests/unit/persistence/phase14GameStateMigration.test.ts tests/unit/persistence/phase17GameStateCodec.test.ts tests/unit/persistence/phase20ConcernNotificationCodec.test.ts tests/unit/pwa/saveCompatibility.test.ts tests/unit/soak/soakDeterminism.test.ts tests/unit/soak/soakDriver.test.ts
      - name: Run full verify
        run: npm run verify
      - name: Verify release metadata and evidence
        run: npm run release:check
      - name: Run Phase18 soak smoke preset
        run: npm run soak:smoke
