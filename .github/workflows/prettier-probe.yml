name: Prettier Probe

on:
  push:
    branches:
      - tmp/phase21-prettier-probe

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Diagnose release-a funds ledger
        run: npx vitest run tests/unit/soak/phase21FundsDiagnostic.test.ts --reporter=verbose
