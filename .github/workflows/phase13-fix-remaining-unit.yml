name: Phase 13 Fix Remaining Unit Regressions

on:
  push:
    branches:
      - feat/phase13-home-command-center

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply remaining Phase 13 test migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tests/unit/app/GameAppActions.test.tsx",
              '''    fireEvent.click(screen.getByRole("button", { name: "今週を進める" }));

    expect(applyAction).toHaveBeenCalledTimes(2);''',
              '''    fireEvent.click(screen.getByRole("button", { name: "今週を進める" }));
    const warning = screen.getByRole("dialog", {
      name: "未回答の申し込みがあります",
    });
    fireEvent.click(
      within(warning).getByRole("button", { name: "そのまま進む" }),
    );

    expect(applyAction).toHaveBeenCalledTimes(2);''',
          )

          replace_once(
              "tests/unit/features/training/TrainingFlow.test.tsx",
              '''    fireEvent.click(nextWeekButton);

    expect(await screen.findAllByText("2026年4月8日")).not.toHaveLength(0);''',
              '''    fireEvent.click(nextWeekButton);
    const warning = screen.getByRole("dialog", {
      name: "未回答の申し込みがあります",
    });
    fireEvent.click(
      within(warning).getByRole("button", { name: "そのまま進む" }),
    );

    expect(await screen.findAllByText("2026年4月8日")).not.toHaveLength(0);''',
          )

          replace_once(
              "tests/unit/features/home/HomePracticeSchedule.test.tsx",
              '''    const teamStatus = screen.getByRole("region", { name: "チーム状況" });
    expect(within(teamStatus).getByText(String(homeStrength))).toBeVisible();''',
              '''    const teamStatus = screen.getByRole("region", { name: "チーム状況" });
    const strengthCard = within(teamStatus).getByText("戦力").closest("article");
    if (!strengthCard) throw new Error("Home strength card missing");
    expect(within(strengthCard).getByText(String(homeStrength))).toBeVisible();''',
          )

          replace_once(
              "tests/unit/app/GameApp.practiceScheduling.test.tsx",
              'ホームの「次の週へ進む」で実施',
              'ホームの「今週を進める」で実施',
          )
          replace_once(
              "tests/unit/features/tournament/TournamentScreen.test.tsx",
              '/ホームの「次の週へ進む」で試合を実施/',
              '/ホームの「今週を進める」で試合を実施/',
          )
          replace_once(
              "tests/unit/features/match/Phase11PvePlanning.test.tsx",
              '/ホームの「次の週へ進む」で試合を実施/',
              '/ホームの「今週を進める」で試合を実施/',
          )
          PY
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Format changed tests
        run: npx prettier tests/unit/app/GameAppActions.test.tsx tests/unit/app/GameApp.practiceScheduling.test.tsx tests/unit/features/tournament/TournamentScreen.test.tsx tests/unit/features/training/TrainingFlow.test.tsx tests/unit/features/home/HomePracticeSchedule.test.tsx tests/unit/features/match/Phase11PvePlanning.test.tsx --write
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/app/GameAppActions.test.tsx tests/unit/app/GameApp.practiceScheduling.test.tsx tests/unit/features/tournament/TournamentScreen.test.tsx tests/unit/features/training/TrainingFlow.test.tsx tests/unit/features/home/HomePracticeSchedule.test.tsx tests/unit/features/match/Phase11PvePlanning.test.tsx
          git diff --cached --check
          git commit -m "fix: align remaining Phase 13 unit regressions"
          git push origin HEAD:feat/phase13-home-command-center
