name: PR65 Finish

on:
  push:
    branches:
      - feat/scout-inventory-radar-grades

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scout-inventory-radar-grades
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Apply finishing changes
        run: |
          python3 scripts/finish_pr65.py
          python3 scripts/fix_pr65_inventory_types.py
      - name: Format repository
        run: npm run format
      - name: Remove temporary finishing helpers
        run: |
          rm scripts/finish_pr65.py
          rm scripts/fix_pr65_inventory_types.py
          rm .github/workflows/pr65-finish.yml
      - name: Verify repository
        run: npm run verify
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit finishing changes
        run: |
          git config user.name "TI-06"
          git config user.email "iretaku.shop@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: finish scout inventory and matchup UX"
          git push origin HEAD:feat/scout-inventory-radar-grades
