name: Apply shop retry patch

on:
  push:
    branches:
      - feature/court-legacy-v2-phase5-shop-mvp
    paths:
      - .github/workflows/apply-shop-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase5-shop-mvp
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: python scripts/applyShopRetryPatch.py
      - run: npx prettier --write src/app/GameApp.tsx src/features/shop/ShopScreen.tsx
      - run: npm run test -- tests/unit/app/GameApp.shop.test.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/GameApp.tsx src/features/shop/ShopScreen.tsx
          git commit -m "fix: recover and retry shop mutations"
          git push origin HEAD:feature/court-legacy-v2-phase5-shop-mvp
