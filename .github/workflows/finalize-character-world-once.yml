name: Finalize character world once

on:
  push:
    branches:
      - feature/m5-character-world-integration

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-character-world-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply screen integration replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/features/team/TeamScreen.tsx'): [
                  ('uniform={school.uniform}', 'school={school}'),
              ],
              Path('src/features/training/TrainingScreen.tsx'): [
                  ('uniform={school.uniform}', 'school={school}'),
              ],
              Path('src/domain/generation/generateWorld.ts'): [
                  ('{ shortName: "梟谷", fullName: "梟谷学院" }', '{ shortName: "梟峰", fullName: "梟峰学院" }'),
                  ('{ shortName: "雷門", fullName: "雷門工業" }', '{ shortName: "雷煌", fullName: "雷煌工業" }'),
                  ('{ shortName: "翔陽", fullName: "翔陽学園" }', '{ shortName: "翔陵", fullName: "翔陵学園" }'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          npm run format
          rm .github/workflows/finalize-character-world-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: キャラクター世界観を主要画面へ統合"
          git push
