name: Phase11 Task5

on:
  push:
    branches:
      - feature/phase11-home-week-progression
    paths:
      - .github/workflows/phase11-task5.yml

permissions:
  contents: write

jobs:
  task5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase11-home-week-progression
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python .github/phase11_task5.py
      - run: npx prettier --write tests/e2e/home-match-flow.spec.ts tests/e2e/official-tournament-flow.spec.ts
      - name: Run focused mobile E2E
        run: npx playwright test tests/e2e/home-match-flow.spec.ts tests/e2e/official-tournament-flow.spec.ts
      - name: Commit Task5
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/home-match-flow.spec.ts tests/e2e/official-tournament-flow.spec.ts
          git commit -m "test: cover home-driven pve progression on mobile"
          git push origin HEAD:feature/phase11-home-week-progression
