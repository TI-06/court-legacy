name: Phase19 Focused Probe

on:
  push:
    branches:
      - feature/phase19-cpu-school-balance

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Probe focused Phase19 checks without failure notifications
        shell: bash
        run: |
          set +e
          npx prettier --check \
            src/domain/generation/generatePlayer.ts \
            src/domain/world/rivalSchoolBalance.ts \
            src/domain/world/rivalWorldProgression.ts \
            tests/unit/domain/world/phase19SchoolBalance.test.ts \
            docs/superpowers/plans/2026-09-14-phase19-pr19-1-cpu-school-balance.md
          format_status=$?
          npx tsc --noEmit
          type_status=$?
          npx vitest run \
            tests/unit/domain/world/phase19SchoolBalance.test.ts \
            tests/unit/domain/world/rivalWorldProgression.test.ts
          test_status=$?
          set -e
          echo "PHASE19_PROBE format=${format_status} type=${type_status} tests=${test_status}"
          exit 0
