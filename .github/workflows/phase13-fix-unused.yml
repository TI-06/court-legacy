name: Phase 13 Fix Unused

on:
  push:
    branches:
      - feat/phase13-home-command-center

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply focused fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/home/homeCommandCenter.ts')
          text = path.read_text()
          text = text.replace(
              'function injuryTask(\n  state: GameState,\n  players: readonly Player[],\n): TaskCandidate | null {',
              'function injuryTask(players: readonly Player[]): TaskCandidate | null {'
          )
          text = text.replace(
              'const injury = injuryTask(state, players);',
              'const injury = injuryTask(players);'
          )
          path.write_text(text)
          PY
          npx prettier src/features/home/homeCommandCenter.ts --write
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/homeCommandCenter.ts
          git commit -m "fix: remove unused Phase 13 selector argument"
          git push origin HEAD:feat/phase13-home-command-center
