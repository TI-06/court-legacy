name: Phase15 Fix E2E Expectations

on:
  push:
    branches: [feat/phase15-tactics-ux]
    paths:
      - .phase15/fix_e2e_expectations.py
      - .github/workflows/phase15-fix-e2e-expectations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase15-tactics-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: python .phase15/fix_e2e_expectations.py
      - run: npx prettier tests/e2e --write
      - shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e
          git commit -m "test: align E2E with Phase15 tactics UX"
          git push origin HEAD:feat/phase15-tactics-ux
