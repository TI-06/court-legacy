name: Phase 6 Task 9 Verification

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  task9-verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier tests/unit/domain/tournament/tournamentLongRun.test.ts tests/unit/app/tournamentBrowserAuthority.test.ts tests/unit/worker/pvpTournamentLeakage.test.ts --write
      - name: Run Task 9 focused verification
        run: |
          npm test -- tests/unit/domain/tournament/tournamentLongRun.test.ts tests/unit/domain/tournament/persistentGuestNpcRecord.test.ts tests/unit/app/tournamentBrowserAuthority.test.ts tests/unit/app/createBrowserAppDependencies.test.ts tests/unit/worker/pvpTournamentLeakage.test.ts tests/unit/worker/pvpPublish.test.ts tests/unit/worker/buildPvpSimulationState.test.ts
          npm run typecheck
      - name: Commit formatted tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/domain/tournament/tournamentLongRun.test.ts tests/unit/app/tournamentBrowserAuthority.test.ts tests/unit/worker/pvpTournamentLeakage.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format phase 6 task 9 tests"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
