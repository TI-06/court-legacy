name: Phase10 install dnd

on:
  push:
    branches:
      - feature/phase10-mobile-ui-completion
    paths:
      - .github/workflows/phase10-install-dnd.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase10-mobile-ui-completion
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install @dnd-kit/core
      - name: Commit dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add dnd-kit core"
          git push origin HEAD:feature/phase10-mobile-ui-completion
