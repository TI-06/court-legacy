name: Phase21 PR21-2 Task1 Locate Initializers

on:
  push:
    branches:
      - feat/phase21-2-relationship-model-persistence

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate GameState and EventMemory initializers
        shell: bash
        run: |
          echo '=== playerRelationships initializers ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'playerRelationships:' src worker tests | head -80 || true
          echo '=== recentPrimaryActorPlayerIds initializers ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'recentPrimaryActorPlayerIds:' src worker tests | head -80 || true
          echo '=== schemaVersion initializers ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'schemaVersion:' src worker tests | head -80 || true
