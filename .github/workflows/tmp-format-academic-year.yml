name: Temporary academic-year formatter

on:
  push:
    branches:
      - fix/academic-year-training-plan

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format regression tests
        run: >-
          npx prettier
          tests/unit/app/useGameSessionConflictClassification.test.tsx
          tests/unit/domain/calendar/academicYearTrainingPlan.test.ts
          tests/unit/worker/academicYearTrainingRecovery.test.ts
          --write
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/app/useGameSessionConflictClassification.test.tsx tests/unit/domain/calendar/academicYearTrainingPlan.test.ts tests/unit/worker/academicYearTrainingRecovery.test.ts
          git commit -m "style: apply exact prettier output"
          git push
