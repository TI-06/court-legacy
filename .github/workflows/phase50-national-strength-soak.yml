name: Phase50 National Strength Soak

on:
  pull_request:
    paths:
      - ".github/workflows/phase50-national-strength-soak.yml"
      - "src/dev/soak/**"
      - "tests/unit/soak/**"

permissions:
  contents: read

jobs:
  national-strength-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 10-season verification
        run: npm run soak:balance -- --seed phase50-balance-a --seed phase50-balance-b
      - name: 30-season verification
        run: npm run soak:long -- --seed phase50-long-a --seed phase50-long-b
