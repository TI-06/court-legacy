name: Remove obsolete mobile UI helper

on:
  push:
    branches:
      - feature/m1-mobile-ui-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-mobile-ui-foundation
      - name: Remove obsolete status helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/team/TeamScreen.tsx')
          text = path.read_text(encoding='utf-8')
          start = text.index('function statusLabel(')
          end = text.index('function replacementText(', start)
          path.write_text(text[:start] + text[end:], encoding='utf-8')
          PY
      - name: Remove temporary files
        run: rm -f .github/workflows/fix-mobile-ui-unused.yml .github/fix-mobile-ui-unused.trigger .github/workflows/diagnose-mobile-ui.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: remove obsolete team status helper"
          git push origin HEAD:feature/m1-mobile-ui-foundation
