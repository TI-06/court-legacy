name: Temporary Worker Auth Formatter

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - .github/workflows/format-worker-auth-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier worker/auth/verifyAccessToken.ts --write
      - name: Commit formatting
        run: |
          if git diff --quiet -- worker/auth/verifyAccessToken.ts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/auth/verifyAccessToken.ts
          git commit -m "style: format Worker auth verifier"
          git push
