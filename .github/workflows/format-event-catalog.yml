name: Format event catalog

on:
  push:
    branches: ["feature/m2-event-catalog-85"]
    paths:
      - "src/data/events/**"
      - "src/data/completeRawGameData.ts"
      - "tests/unit/data/eventCatalog*.test.ts"
      - "docs/event-authoring.md"
      - ".github/workflows/format-event-catalog.yml"

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-event-catalog-85
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format catalog
        run: npm run format
      - name: Verify catalog
        run: npm run verify
      - name: Commit formatted files and remove temporary workflow
        run: |
          rm .github/workflows/format-event-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: イベントカタログを整形" || exit 0
          git push origin HEAD:feature/m2-event-catalog-85
