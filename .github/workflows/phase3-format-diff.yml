name: Phase 3 Format Diff

on:
  pull_request:

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier docs/superpowers/plans/2026-08-28-phase3-scouting-ui.md --write
      - run: git diff -- docs/superpowers/plans/2026-08-28-phase3-scouting-ui.md
