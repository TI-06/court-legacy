name: Phase4 Task6 format RED

on:
  push:
    branches:
      - feature/court-legacy-v2-phase4-async-pvp
    paths:
      - .github/workflows/phase4-task6-format-red.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase4-async-pvp
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier tests/unit/services/GameApiClient.pvp.test.ts tests/unit/services/GameApiClient.scoutingRoute.test.ts --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/services/GameApiClient.pvp.test.ts tests/unit/services/GameApiClient.scoutingRoute.test.ts
          git commit -m "style: format PvP API client RED tests"
          git push origin HEAD:feature/court-legacy-v2-phase4-async-pvp
