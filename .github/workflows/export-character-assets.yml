name: Export Character Assets

on:
  push:
    branches:
      - feature/m6-game-ui-refresh

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload featured character assets
        uses: actions/upload-artifact@v4
        with:
          name: featured-character-assets
          path: src/assets/characters/featured
          retention-days: 1
