name: Fix event types

on:
  push:
    branches: [feature/m2-event-engine]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-event-engine
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/domain/events/eventEligibility.ts')
          text = path.read_text()
          text = text.replace(
            'import type { PlayerId } from "../model/identifiers";',
            'import type { PlayerId } from "../model/identifiers";\nimport { eventId } from "../model/identifiers";',
          )
          text = text.replace(
            'state.eventMemory.lastOccurredDateByEventId[event.id]',
            'state.eventMemory.lastOccurredDateByEventId[eventId(event.id)]',
          )
          path.write_text(text)

          path = Path('src/domain/events/resolveEventChoice.ts')
          text = path.read_text()
          text = text.replace(
            'import type { EventId, PlayerId } from "../model/identifiers";',
            'import type { PlayerId } from "../model/identifiers";',
          )
          text = text.replace('eventId: pending.eventId as EventId,', 'eventId: pending.eventId,')
          text = text.replace('[event.id]: state.date,', '[pending.eventId]: state.date,')
          text = text.replace(
            '[event.id]:\n          (nextState.eventMemory.occurrenceCountByEventId[event.id] ?? 0) + 1,',
            '[pending.eventId]:\n          (nextState.eventMemory.occurrenceCountByEventId[pending.eventId] ?? 0) + 1,',
          )
          path.write_text(text)

          path = Path('src/domain/events/selectEvent.ts')
          text = path.read_text()
          needle = '''  const pendingEvent = createPendingEvent(\n    state,\n    selected.event,\n    selected.actorPlayerIds,\n  );'''
          replacement = '''  if (!selected) {\n    return { state, pendingEvent: null };\n  }\n  const pendingEvent = createPendingEvent(\n    state,\n    selected.event,\n    selected.actorPlayerIds,\n  );'''
          text = text.replace(needle, replacement)
          path.write_text(text)

          path = Path('src/domain/validation/gameDataSchema.ts')
          text = path.read_text().replace(
            'abilityRanges: z.record(abilityKeySchema, numericRangeSchema).optional(),',
            'abilityRanges: z.partialRecord(abilityKeySchema, numericRangeSchema).optional(),',
          )
          path.write_text(text)

          path = Path('src/domain/generation/generateWorld.ts')
          text = path.read_text()
          start = text.index('export function assignGenerationalTalent(')
          text = text[:start] + '''export function assignGenerationalTalent(\n  input: AssignGenerationalTalentInput,\n): GenerationalTalentAssignment {\n  const school = weightedChoice(\n    Object.values(input.state.schools).map((candidate) => ({\n      value: candidate,\n      weight: Math.max(1, 40 + candidate.reputationPoints / 5),\n    })),\n    input.random,\n  );\n  if (!school) {\n    throw new Error("generational talent requires at least one school");\n  }\n  const existingPlayers = Object.values(input.state.players);\n  const nextNumber = nextPlayerNumber(input.state);\n  const player = generatePlayer({\n    id: playerId(`player-${nextNumber}`),\n    schoolId: school.id,\n    enrolledYear: input.academicYear,\n    grade: 1,\n    data: input.data,\n    random: input.random,\n    tier: "generational",\n    excludedFullNames: new Set(\n      existingPlayers.map((candidate) =>\n        `${candidate.lastName} ${candidate.firstName}`,\n      ),\n    ),\n    excludedAppearanceSeeds: new Set(\n      existingPlayers.map((candidate) => candidate.appearanceSeed),\n    ),\n  });\n\n  return {\n    schoolId: school.id,\n    player,\n    nextGenerationalTalentYear: scheduleNextGenerationalTalentYear(\n      input.academicYear,\n      input.random,\n    ),\n  };\n}\n'''
          path.write_text(text)

          path = Path('src/data/dataRegistry.ts')
          text = path.read_text()
          text = text.replace(
            '''      if (choice.followUp && !eventIds.has(choice.followUp.eventId)) {\n        throw new Error(\n          `event ${event.id} references unknown follow-up: ${choice.followUp.eventId}`,\n        );\n      }''',
            '''      if (choice.followUp && !eventIds.has(choice.followUp.eventId)) {\n        throw new Error(\n          `event ${event.id} references unknown follow-up: ${choice.followUp.eventId}`,\n        );\n      }\n      for (const effect of choice.effects) {\n        if (effect.type === "schedule-event" && !eventIds.has(effect.eventId)) {\n          throw new Error(\n            `event ${event.id} references unknown scheduled event: ${effect.eventId}`,\n          );\n        }\n      }''',
          )
          path.write_text(text)
          PY
          npx prettier src/domain/events src/domain/generation/generateWorld.ts src/domain/validation/gameDataSchema.ts src/data/dataRegistry.ts --write
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: イベントエンジンの型整合性を修正"
          git push origin HEAD:feature/m2-event-engine
