name: Phase52 Format Diagnostic

on:
  push:
    branches:
      - feat/phase52-command-path-review
    paths:
      - ".github/workflows/phase52-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show formatted diff
        run: |
          npx prettier src/features/match/MatchCommandPanel.tsx src/features/match/pvpMatchPresentation.ts tests/unit/worker/phase16OfficialMatchSession.test.ts tests/unit/worker/phase16PracticeMatchSession.test.ts tests/unit/worker/phase16PvpMatchSession.test.ts tests/unit/worker/phase51InvitationalCup.test.ts --write
          git diff -- src/features/match/MatchCommandPanel.tsx src/features/match/pvpMatchPresentation.ts tests/unit/worker/phase16OfficialMatchSession.test.ts tests/unit/worker/phase16PracticeMatchSession.test.ts tests/unit/worker/phase16PvpMatchSession.test.ts tests/unit/worker/phase51InvitationalCup.test.ts
