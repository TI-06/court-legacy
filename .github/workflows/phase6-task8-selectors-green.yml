name: Phase 6 Task 8 Selectors Green

on:
  push:
    branches:
      - feature/court-legacy-v2-phase6-official-tournaments

permissions:
  contents: write

jobs:
  selectors-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/court-legacy-v2-phase6-official-tournaments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format selector implementation
        run: npx prettier src/domain/tournament/tournamentSelectors.ts tests/unit/domain/tournament/tournamentSelectors.test.ts --write
      - name: Verify selector behavior
        run: |
          npm test -- tests/unit/domain/tournament/tournamentSelectors.test.ts
          npm run typecheck
      - name: Commit formatted selectors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/tournament/tournamentSelectors.ts tests/unit/domain/tournament/tournamentSelectors.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format Phase 6 tournament selectors"
          git push origin HEAD:feature/court-legacy-v2-phase6-official-tournaments
