name: Format PvP Artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'feat/pre-match-lineup-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Format PvP route
        run: npx prettier worker/routes/pvpChallenge.ts --write
      - name: Upload formatted file
        uses: actions/upload-artifact@v4
        with:
          name: formatted-pvp
          path: worker/routes/pvpChallenge.ts
          retention-days: 1
