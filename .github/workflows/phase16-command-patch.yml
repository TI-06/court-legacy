name: Phase16 Practice Command Patch

on:
  push:
    branches:
      - feat/phase16-match-command-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply practice command continuation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('worker/game/applyGameAction.ts')
          text = path.read_text()
          import_anchor = 'import { resolveEventChoice } from "../../src/domain/events/resolveEventChoice";\n'
          command_import = '''import {
            applyMatchCommand,
            MatchCommandValidationError,
          } from "../../src/domain/match/applyMatchCommand";
          '''
          if command_import not in text:
              if import_anchor not in text:
                  raise SystemExit('command import anchor missing')
              text = text.replace(import_anchor, import_anchor + command_import, 1)

          old = '''import {
            simulateMatch,
            startMatch,
            type MatchStepResult,
            type SimulateMatchResult,
          } from "../../src/domain/match/simulateMatch";'''
          new = '''import {
            resumeMatch,
            simulateMatch,
            startMatch,
            type MatchStepResult,
            type SimulateMatchResult,
          } from "../../src/domain/match/simulateMatch";'''
          if old not in text:
              raise SystemExit('simulate import anchor missing')
          text = text.replace(old, new, 1)

          marker = 'function applyOfficialMatch(\n'
          helper = '''function applyPracticeMatchCommand(
            state: GameState,
            teamSelection: TeamSelection,
            action: Extract<GameAction, { type: "match-command" }>,
          ): AppliedGameAction {
            const activeMatch = state.activeMatch;
            const scheduledOpponentId =
              state.weeklySchedule.practiceMatch.scheduledOpponentId;
            if (!activeMatch?.runtime || !scheduledOpponentId) {
              return conflict(
                "active_practice_match_not_found",
                "進行中の練習試合がありません",
              );
            }
            if (activeMatch.runtime.controlledSchoolId !== state.userSchoolId) {
              return conflict(
                "active_practice_match_not_controlled",
                "この試合では監督指示を実行できません",
              );
            }
            const opponentSchoolId =
              activeMatch.homeSchoolId === state.userSchoolId
                ? activeMatch.awaySchoolId
                : activeMatch.awaySchoolId === state.userSchoolId
                  ? activeMatch.homeSchoolId
                  : null;
            if (opponentSchoolId !== scheduledOpponentId) {
              return conflict(
                "active_practice_match_mismatch",
                "進行中の試合と練習試合予定が一致しません",
              );
            }

            try {
              const commandedMatch = applyMatchCommand({
                state,
                match: activeMatch,
                schoolId: state.userSchoolId,
                command: action.command,
              });
              const simulation = resumeMatch({ state, match: commandedMatch });
              const resumedState: GameState = {
                ...state,
                randomCursor: simulation.match.randomCursor,
                activeMatch: simulation.match,
              };

              if (!simulation.analysis) {
                return {
                  state: resumedState,
                  teamSelection,
                  outcome: buildPracticePresentation(resumedState, simulation),
                };
              }

              const recorded = recordMatchOutcome(resumedState, {
                matchId: simulation.match.id,
                date: state.date,
                homeSchoolId: simulation.match.homeSchoolId,
                awaySchoolId: simulation.match.awaySchoolId,
                winnerSchoolId: simulation.analysis.winnerSchoolId,
                homeSetsWon: simulation.match.homeSetsWon,
                awaySetsWon: simulation.match.awaySetsWon,
                tournamentId: null,
              });
              const completedState = markWeeklyActionCompleted(
                recorded,
                "practice-match",
              );
              const finalizedState: GameState = {
                ...completedState,
                weeklySchedule: {
                  ...completedState.weeklySchedule,
                  practiceMatch: {
                    ...completedState.weeklySchedule.practiceMatch,
                    scheduledOpponentId: null,
                    scheduledBy: null,
                  },
                  recentPracticeMatches: [
                    ...completedState.weeklySchedule.recentPracticeMatches,
                    {
                      opponentSchoolId: scheduledOpponentId,
                      date: state.date,
                    },
                  ].slice(-8),
                },
              };
              return {
                state: finalizedState,
                teamSelection,
                outcome: buildPracticePresentation(finalizedState, simulation),
              };
            } catch (error) {
              if (error instanceof MatchCommandValidationError) {
                return conflict(error.code.replaceAll("-", "_"), error.message);
              }
              if (error instanceof GameRuleConflictError) {
                throw error;
              }
              return conflict(
                "match_command_unavailable",
                error instanceof Error
                  ? error.message
                  : "試合中の監督指示を処理できません",
              );
            }
          }

          '''
          if marker not in text:
              raise SystemExit('official match marker missing')
          text = text.replace(marker, helper + marker, 1)

          practice_start = text.index('function practicePresentation(\n')
          official_start = text.index('function officialPresentation(\n', practice_start)
          replacement = '''function buildPracticePresentation(
            state: GameState,
            simulation: MatchStepResult,
          ): PendingMatchPresentation {
            return {
              kind: "practice",
              simulation,
              homeTeam: teamPresentation(state, simulation.match.homeSchoolId),
              awayTeam: teamPresentation(state, simulation.match.awaySchoolId),
            };
          }
          function practicePresentation(
            state: GameState,
            applied: AppliedGameAction,
          ): PendingMatchPresentation {
            return buildPracticePresentation(
              state,
              applied.outcome as MatchStepResult,
            );
          }
          '''
          text = text[:practice_start] + replacement + text[official_start:]

          switch_start = text.index('    case "match-command":\n')
          switch_end = text.index('    case "official-match":\n', switch_start)
          text = (
              text[:switch_start]
              + '    case "match-command":\n'
              + '      return applyPracticeMatchCommand(state, teamSelection, action);\n'
              + text[switch_end:]
          )
          path.write_text(text)
          PY
          npx prettier --write worker/game/applyGameAction.ts
          npx vitest run tests/unit/worker/phase16PracticeMatchSession.test.ts
          git rm .github/workflows/phase16-command-patch.yml
      - name: Commit practice command continuation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: resume practice matches from coach commands"
          git push
