name: Phase16 temporary formatter

on:
  push:
    branches:
      - feat/phase16-match-command-ux

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-match-command-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier src/features/match/MatchScreen.tsx --write
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/match/MatchScreen.tsx
          git rm .github/workflows/phase16-format-temp.yml
          git commit -m "chore: format Phase16 MatchScreen"
          git push origin HEAD:feat/phase16-match-command-ux
