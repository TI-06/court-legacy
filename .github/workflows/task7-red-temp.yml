name: Task 7 RED Check

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - tests/unit/App.test.tsx
      - tests/unit/services/GameApiClient.test.ts
      - tests/unit/app/AppBootstrap.test.tsx
      - tests/unit/features/onboarding/SchoolSetupScreen.test.tsx
      - .github/workflows/task7-red-temp.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run focused Task 7 tests
        run: npm test -- tests/unit/App.test.tsx tests/unit/services/GameApiClient.test.ts tests/unit/app/AppBootstrap.test.tsx tests/unit/features/onboarding/SchoolSetupScreen.test.tsx
