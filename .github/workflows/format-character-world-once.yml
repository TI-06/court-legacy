name: Format character world once

on:
  push:
    branches:
      - feature/m5-character-world-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-character-world-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Format and remove one-shot workflow
        run: |
          npm run format
          rm .github/workflows/format-character-world-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: キャラクター描画コードを整形"
          git push
