name: Worker Diagnostics

on:
  push:
    branches: [feature/phase12-game-loop-polish]
    paths:
      - .github/workflows/worker-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase12-game-loop-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Reproduce Phase 12 applied tree
        run: |
          python scripts/phase12-finish-apply.py
          python scripts/phase12-week-progression-cleanup.py
      - name: Capture worker test failures
        shell: bash
        run: |
          set +e
          NO_COLOR=1 npx vitest run tests/unit/worker --reporter=verbose 2>&1 | tee worker-test-output.txt
          status=${PIPESTATUS[0]}
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "418982982+github-actions[bot]@users.noreply.github.com"
          git add worker-test-output.txt
          git commit -m "ci: capture worker test output" || true
          git push origin HEAD:feature/phase12-game-loop-polish
          exit "$status"
