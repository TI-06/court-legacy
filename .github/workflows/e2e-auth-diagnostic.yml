name: E2E Auth Diagnostic

on:
  push:
    branches:
      - feature/court-legacy-v2-phase1
    paths:
      - .github/workflows/e2e-auth-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify E2E flag reaches build
        env:
          VITE_E2E_AUTH_BYPASS: "true"
        run: |
          echo "workflow_flag=${VITE_E2E_AUTH_BYPASS}"
          npm run build
          if grep -R -q "e2e-access-token" dist; then
            echo "built_bundle_contains_e2e_session=yes"
          else
            echo "built_bundle_contains_e2e_session=no"
            exit 1
          fi
