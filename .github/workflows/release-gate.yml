name: Release Gate

on:
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Audit production dependencies
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "npm audit attempt ${attempt}/3"
            if npm audit --omit=dev --audit-level=high \
              --fetch-retries=2 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=5000 \
              --fetch-timeout=15000; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run v0.1.0 release gate
        env:
          COURT_LEGACY_RELEASE_LONG_SOAK: "1"
        run: npm run release:gate
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
