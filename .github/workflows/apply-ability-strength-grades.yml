name: Apply ability and school strength grades

on:
  push:
    branches:
      - fix/ability-and-school-strength-grades
    paths:
      - .github/workflows/apply-ability-strength-grades.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ability-and-school-strength-grades
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply grade presentation changes
        run: python .github/scripts/apply-ability-strength-grades.py
      - name: Remove temporary helpers
        run: rm -f .github/workflows/apply-ability-strength-grades.yml .github/scripts/apply-ability-strength-grades.py
      - name: Format
        run: npx prettier src/domain/selectors/ratingGrades.ts src/features/match/teamRatingGrade.ts src/features/team/PlayerHubScreen.tsx src/features/match/MatchStatPanels.tsx src/features/match/matchRadar.css src/features/home/HomeScreen.tsx src/features/home/home.css src/features/match/PracticeMatchPlanning.tsx tests/unit/features/abilityStrengthGrades.test.tsx --write
      - name: Verify focused regressions
        run: npx vitest run tests/unit/features/abilityStrengthGrades.test.tsx tests/unit/features/match/teamGrade.test.ts tests/unit/features/match/PreMatchComparisonRadar.test.tsx tests/unit/features/team/PlayerHubScreen.test.tsx tests/unit/features/home/HomeScreen.test.tsx tests/unit/features/match/MatchFlow.test.tsx
      - name: Verify project
        run: npm run verify
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github
          git commit -m 'fix: show ability and school strength grades'
          git push origin HEAD:fix/ability-and-school-strength-grades
