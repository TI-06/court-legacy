name: Phase57 Post-merge Pacing Measurement

on:
  push:
    branches:
      - tmp/phase57-4-post-merge-soak

permissions:
  contents: read

jobs:
  pacing-30-season:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Run 30-season pacing soak
        run: node scripts/runBalanceSoak.mjs --preset long --seed phase57-pacing-30
