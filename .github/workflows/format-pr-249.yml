name: Format PR 249

on:
  push:
    branches:
      - feat/post-max-facility-investments

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/post-max-facility-investments
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier --write src/app/GameApp.tsx src/domain/model/SchoolManagement.ts src/domain/school/annualInvestment.ts src/features/school/school-economy.css src/features/school/SchoolScreen.tsx worker/game/applyGameAction.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format annual investment changes"
          git push
