name: Apply fixed navigation

on:
  push:
    branches:
      - feature/m1-school-calendar-fixed-nav

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-school-calendar-fixed-nav
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Patch navigation styles
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/app.css')
          text = app.read_text()
          text = text.replace(
              '.app-shell {\n  width: 100%;',
              '.app-shell {\n  --bottom-navigation-offset: 0px;\n  --bottom-navigation-height: calc(70px + env(safe-area-inset-bottom));\n\n  width: 100%;',
          )
          text = text.replace(
              '  padding: 16px 14px 24px;\n}',
              '  padding: 16px 14px calc(24px + var(--bottom-navigation-height) + var(--bottom-navigation-offset));\n}',
              1,
          )
          text = text.replace(
              '.bottom-navigation {\n  position: sticky;\n  z-index: 20;\n  bottom: 0;\n  display: grid;',
              '.bottom-navigation {\n  position: fixed;\n  z-index: 30;\n  right: 0;\n  bottom: var(--bottom-navigation-offset);\n  left: 0;\n  display: grid;',
          )
          text = text.replace(
              '  width: 100%;\n  min-height: 70px;\n  padding: 5px 5px max(7px, env(safe-area-inset-bottom));',
              '  width: 100%;\n  max-width: 480px;\n  min-height: 70px;\n  margin-inline: auto;\n  padding: 5px 5px max(7px, env(safe-area-inset-bottom));',
              1,
          )
          text = text.replace(
              '  .app-shell {\n    max-width: 480px;',
              '  .app-shell {\n    --bottom-navigation-offset: 20px;\n\n    max-width: 480px;',
          )
          app.write_text(text)

          ui = Path('src/ui/ui.css')
          text = ui.read_text().replace(
              '  bottom: 70px;\n  display: flex;',
              '  bottom: calc(var(--bottom-navigation-height, 70px) + var(--bottom-navigation-offset, 0px));\n  display: flex;',
          )
          ui.write_text(text)
          PY
      - run: npx prettier src/app.css src/ui/ui.css --write
      - name: Commit fixed navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.css src/ui/ui.css
          git commit -m "fix: 下部ナビを画面下へ固定"
          git push origin HEAD:feature/m1-school-calendar-fixed-nav
