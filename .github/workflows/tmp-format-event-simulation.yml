name: Temporary Event Simulation Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-event-catalog-180
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Format simulation test
        run: |
          npm ci
          npm run format
          rm .github/workflows/tmp-format-event-simulation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: 180本カタログの長期検証を整形"
          git push origin HEAD:feature/m3-event-catalog-180
