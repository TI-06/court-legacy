name: Phase 5 Type Narrowing Patch

on:
  push:
    branches:
      - feature/court-legacy-v2-phase5-shop-mvp

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Patch narrowed scouting target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/createBrowserAppDependencies.ts')
          text = path.read_text()
          old = '''      const cycleKey = harnessScoutingCycleKey(snapshot.state);\n      const reports = this.scoutingReports.get(cycleKey);\n      const candidate = reports?.find(\n        (report) => report.candidateId === request.target!.candidateId,\n      );'''
          new = '''      const targetCandidateId = request.target.candidateId;\n      const cycleKey = harnessScoutingCycleKey(snapshot.state);\n      const reports = this.scoutingReports.get(cycleKey);\n      const candidate = reports?.find(\n        (report) => report.candidateId === targetCandidateId,\n      );'''
          if old not in text:
              raise SystemExit('expected source block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier src/app/createBrowserAppDependencies.ts --write
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/createBrowserAppDependencies.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve scouting target type narrowing"
          git push
