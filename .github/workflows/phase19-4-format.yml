name: Phase19-4 Format Cleanup

on:
  push:
    branches:
      - feature/phase19-match-difficulty-strategic-identities
    paths:
      - .github/workflows/phase19-4-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase19-match-difficulty-strategic-identities
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Format Phase19-4 files and remove formatter
        shell: bash
        run: |
          npx prettier --write \
            docs/superpowers/plans/2026-09-14-phase19-4-match-difficulty-strategic-identities.md \
            docs/superpowers/reports/2026-09-14-phase19-pr19-4-match-strategy-balance-results.md \
            src/domain/match/schoolMatchIdentity.ts \
            tests/unit/domain/match/phase19StrategicIdentity.test.ts
          git rm .github/workflows/phase19-4-format.yml
          git config user.name "court-legacy-bot"
          git config user.email "court-legacy-bot@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-14-phase19-4-match-difficulty-strategic-identities.md \
            docs/superpowers/reports/2026-09-14-phase19-pr19-4-match-strategy-balance-results.md \
            src/domain/match/schoolMatchIdentity.ts \
            tests/unit/domain/match/phase19StrategicIdentity.test.ts
          git commit -m "style: format phase19-4 changes"
          git push origin HEAD:feature/phase19-match-difficulty-strategic-identities
