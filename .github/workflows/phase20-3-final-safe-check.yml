name: Phase20-3 Final Safe Check

on:
  push:
    branches:
      - "feature/phase20-3-practice-offer-frequency"

permissions:
  contents: write

jobs:
  safe-check:
    if: github.event.head_commit.message != 'phase20-3-format-green'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Apply known formatting fix
        run: npx prettier --write tests/unit/persistence/phase20PracticeOfferHistoryCodec.test.ts
      - name: Verify formatting, lint, types, tests, and build
        run: npm run verify
      - name: Verify release metadata and evidence
        run: npm run release:check
      - name: Run Phase18 soak smoke preset
        run: npm run soak:smoke
      - name: Commit verified formatting fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/persistence/phase20PracticeOfferHistoryCodec.test.ts
          git commit -m "phase20-3-format-green"
          git push
