name: PR65 Format

on:
  push:
    branches:
      - feat/scout-inventory-radar-grades

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scout-inventory-radar-grades
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier tests/e2e/shop-flow.spec.ts --write
      - name: Commit formatting
        run: |
          if git diff --quiet -- tests/e2e/shop-flow.spec.ts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/shop-flow.spec.ts
          git commit -m "style: format PR65 mobile shop test"
          git push origin HEAD:feat/scout-inventory-radar-grades
