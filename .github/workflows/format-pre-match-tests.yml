name: Format Pre-Match Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/pre-match-lineup-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Format changed tests
        run: npx prettier tests/unit/app/GameAppActions.test.tsx tests/unit/app/GameApp.pvp.test.tsx tests/unit/app/GameApp.officialTournament.test.tsx tests/unit/app/GameApp.officialTournamentRetry.test.tsx --write
      - name: Commit formatted tests
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/app/GameAppActions.test.tsx tests/unit/app/GameApp.pvp.test.tsx tests/unit/app/GameApp.officialTournament.test.tsx tests/unit/app/GameApp.officialTournamentRetry.test.tsx
          git commit -m "style: format pre-match flow tests"
          git push origin HEAD:${{ github.head_ref }}
