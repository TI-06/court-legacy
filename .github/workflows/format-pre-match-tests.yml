name: Format Pre-Match Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'feat/pre-match-lineup-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Format changed tests
        run: npx prettier tests/unit/app/GameAppActions.test.tsx tests/unit/app/GameApp.pvp.test.tsx tests/unit/app/GameApp.officialTournament.test.tsx tests/unit/app/GameApp.officialTournamentRetry.test.tsx --write
      - name: Upload formatted tests
        uses: actions/upload-artifact@v4
        with:
          name: formatted-pre-match-tests
          path: |
            tests/unit/app/GameAppActions.test.tsx
            tests/unit/app/GameApp.pvp.test.tsx
            tests/unit/app/GameApp.officialTournament.test.tsx
            tests/unit/app/GameApp.officialTournamentRetry.test.tsx
          retention-days: 1
