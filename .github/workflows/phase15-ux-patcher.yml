name: Phase15 UX Patcher

on:
  push:
    branches: [feat/phase15-tactics-ux]
    paths:
      - .phase15/patch.py
      - .github/workflows/phase15-ux-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase15-tactics-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Apply GameApp tactics wiring
        run: python .phase15/patch.py
      - name: Format GameApp
        run: npx prettier src/app/GameApp.tsx --write
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/GameApp.tsx
          git commit -m "feat: wire authoritative team tactics save"
          git push origin HEAD:feat/phase15-tactics-ux
