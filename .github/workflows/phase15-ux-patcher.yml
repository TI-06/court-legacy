name: Phase15 UX Patcher

on:
  push:
    branches: [feat/phase15-tactics-ux]
    paths:
      - .phase15/patch.py
      - .github/workflows/phase15-ux-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase15-tactics-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Apply Phase15 UX patch
        run: python .phase15/patch.py
      - name: Format Phase15 UX files
        run: npx prettier tests/unit/app/GameApp.teamTactics.test.tsx --write
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/team/PlayerHubScreen.tsx src/features/team/player-hub.css tests/unit/app/GameApp.teamTactics.test.tsx
          git commit -m "chore: format Phase15 tactics UX"
          git push origin HEAD:feat/phase15-tactics-ux
