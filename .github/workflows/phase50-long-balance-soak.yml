name: Phase50 Long Balance Soak

on:
  pull_request:
    paths:
      - ".github/workflows/phase50-long-balance-soak.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  phase50-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 10-season Phase50 balance
        run: npm run soak:balance -- --seed phase50-balance-a --seed phase50-balance-b
      - name: 30-season Phase50 long
        run: npm run soak:long -- --seed phase50-long-a --seed phase50-long-b
