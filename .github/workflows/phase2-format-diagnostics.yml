name: Phase 2 Format Diagnostics

on:
  pull_request:

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format changed Phase 2 files
        run: npx prettier src/domain/school/reputation.ts src/features/school/SchoolScreen.tsx --write
      - name: Show formatting diff
        run: git diff -- src/domain/school/reputation.ts src/features/school/SchoolScreen.tsx
