name: Dev Per Ability Growth

on:
  push:
    branches:
      - fix/long-term-balance-gameplay-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/long-term-balance-gameplay-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Add regression test first
        run: |
          cat > tests/unit/domain/training/longTermAbilityGrowth.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { applyLongTermAbilityGrowth } from "../../../../src/domain/training/resolveWeeklyTraining";

          describe("applyLongTermAbilityGrowth", () => {
            it("prevents an ordinary player from training a focused ability past the potential ceiling", () => {
              expect(applyLongTermAbilityGrowth(92, 8, 75, "normal")).toBe(93);
              expect(applyLongTermAbilityGrowth(93, 8, 75, "normal")).toBe(93);
            });

            it("keeps ordinary growth unchanged below the high-ability bands", () => {
              expect(applyLongTermAbilityGrowth(70, 4, 75, "normal")).toBe(74);
            });

            it("lets a top generational talent reach 100 only through slow late growth", () => {
              expect(applyLongTermAbilityGrowth(98, 8, 100, "generational")).toBe(99);
              expect(applyLongTermAbilityGrowth(99, 8, 100, "generational")).toBe(100);
            });
          });
          EOF
          npx prettier --write tests/unit/domain/training/longTermAbilityGrowth.test.ts
      - name: Confirm regression is red
        run: |
          set +e
          npx vitest run tests/unit/domain/training/longTermAbilityGrowth.test.ts > /tmp/red.log 2>&1
          status=$?
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Regression test unexpectedly passed before implementation"
            exit 1
          fi
          echo "Expected RED confirmed"
      - name: Implement per-ability ceiling and soft cap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/domain/training/resolveWeeklyTraining.ts')
          text = path.read_text()
          old = '''function applyGrowth(\n  player: Player,\n  targets: readonly AbilityKey[],\n  amount: number,\n) {\n  const abilities = { ...player.abilities };\n  const changes: Partial<Record<AbilityKey, number>> = {};\n  for (const key of targets) {\n    const before = abilities[key];\n    const next = clampAbility(before + amount);\n    abilities[key] = next;\n    changes[key] = next - before;\n  }\n  return { abilities, changes };\n}'''
          new = '''function abilityCeilingTierBonus(tier: Player["tier"]): number {\n  if (tier === "generational") return 4;\n  if (tier === "monster") return 3;\n  if (tier === "elite") return 2;\n  if (tier === "promising" || tier === "prospect") return 1;\n  return 0;\n}\n\nexport function applyLongTermAbilityGrowth(\n  before: number,\n  amount: number,\n  potential: number | undefined,\n  tier: Player["tier"],\n): number {\n  const current = clampAbility(before);\n  if (amount <= 0) return current;\n\n  const safePotential = Math.max(0, Math.min(100, potential ?? 75));\n  const ceiling = clampAbility(\n    82 + safePotential * 0.14 + abilityCeilingTierBonus(tier),\n  );\n  if (current >= ceiling) return current;\n\n  const scale = current >= 95 ? 0.15 : current >= 90 ? 0.3 : current >= 80 ? 0.6 : 1;\n  let adjustedGrowth = Math.max(1, Math.round(amount * scale));\n  if (ceiling - current <= 2) {\n    adjustedGrowth = Math.min(adjustedGrowth, 1);\n  }\n  return Math.min(ceiling, current + adjustedGrowth);\n}\n\nfunction applyGrowth(\n  player: Player,\n  targets: readonly AbilityKey[],\n  amount: number,\n) {\n  const abilities = { ...player.abilities };\n  const changes: Partial<Record<AbilityKey, number>> = {};\n  for (const key of targets) {\n    const before = abilities[key];\n    const next = applyLongTermAbilityGrowth(\n      before,\n      amount,\n      player.potential,\n      player.tier,\n    );\n    abilities[key] = next;\n    changes[key] = next - before;\n  }\n  return { abilities, changes };\n}'''
          if old not in text:
              raise SystemExit('expected applyGrowth block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write \
            src/domain/training/resolveWeeklyTraining.ts \
            tests/unit/domain/training/longTermAbilityGrowth.test.ts
      - name: Verify green
        run: |
          npx vitest run \
            tests/unit/domain/training/longTermAbilityGrowth.test.ts \
            tests/unit/domain/training/calculateGrowth.test.ts \
            tests/unit/domain/training/resolveWeeklyTraining.test.ts
          npm run lint
          npm run typecheck
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/domain/training/resolveWeeklyTraining.ts \
            tests/unit/domain/training/longTermAbilityGrowth.test.ts
          git commit -m "fix: cap long-term growth per ability"
          git push origin HEAD:fix/long-term-balance-gameplay-ux
