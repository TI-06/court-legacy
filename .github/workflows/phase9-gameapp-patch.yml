name: Phase9 GameApp Patch

on:
  push:
    branches:
      - feature/phase9-mobile-game-ui

permissions:
  contents: write

jobs:
  patch-gameapp:
    if: github.event.head_commit.message == 'chore: apply phase9 gameapp patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Patch GameApp progress label
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/app/GameApp.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const importLine = 'import type { SchoolReputation } from "../domain/model/School";\n';
          if (!source.includes(importLine)) throw new Error('SchoolReputation import not found');
          source = source.replace(importLine, '');

          const mapping = `const reputationLabels: Record<SchoolReputation, string> = {\n  unknown: "E 無名",\n  "district-contender": "D 地区レベル",\n  "prefectural-power": "C 県大会常連",\n  "national-qualifier": "B 県内強豪",\n  "national-regular": "A 全国出場級",\n  elite: "S 全国常連",\n};\n\n`;
          if (!source.includes(mapping)) throw new Error('reputationLabels mapping not found');
          source = source.replace(mapping, '');

          const oldProp = '        reputationLabel={reputationLabels[school.reputation]}\n';
          const newProp = '        progressLabel={`就任${gameState.yearIndex}年目・${gameState.calendar.weekOfYear}週目`}\n';
          if (!source.includes(oldProp)) throw new Error('GamePageFrame reputationLabel prop not found');
          source = source.replace(oldProp, newProp);

          fs.writeFileSync(path, source);
          NODE
          npx prettier --write src/app/GameApp.tsx
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/GameApp.tsx
          git commit -m 'feat: supply phase9 progress label'
          git push origin HEAD:feature/phase9-mobile-game-ui
