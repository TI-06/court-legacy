name: Phase21 PR21-2 Task1 RED

on:
  push:
    branches:
      - feat/phase21-2-relationship-model-persistence

permissions:
  contents: read

jobs:
  expected-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Confirm Task1 tests are RED without failing workflow
        shell: bash
        run: |
          set +e
          npx vitest run \
            tests/unit/domain/relationships/relationshipPresentation.test.ts \
            tests/unit/domain/relationships/specialRelationships.test.ts 2>&1 | tee /tmp/task1-red.log
          test_status=${PIPESTATUS[0]}
          set -e

          echo "test_status=$test_status"
          if [ "$test_status" -ne 0 ] && grep -Eq "relationshipPresentation|specialRelationships" /tmp/task1-red.log; then
            echo "PHASE21_PR21_2_TASK1_RED_CONFIRMED=true"
          else
            echo "PHASE21_PR21_2_TASK1_RED_CONFIRMED=false"
          fi
