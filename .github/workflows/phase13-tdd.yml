name: Phase13 TDD

on:
  push:
    branches: [fix/practice-match-and-result-ux]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/practice-match-and-result-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Phase13 additions
        run: npx prettier docs/superpowers/plans/2026-09-04-practice-match-result-ux-polish.md tests/unit/features/phase13GameLoopPolish.test.tsx --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/plans/2026-09-04-practice-match-result-ux-polish.md tests/unit/features/phase13GameLoopPolish.test.tsx
          git commit -m "style: format Phase13 regression tests"
          git push origin HEAD:fix/practice-match-and-result-ux
      - name: Run focused regression test
        run: npm test -- tests/unit/features/phase13GameLoopPolish.test.tsx
