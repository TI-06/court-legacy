name: Phase15 Format E2E

on:
  push:
    branches: [feat/phase15-tactics-ux]
    paths:
      - .github/workflows/phase15-format-e2e.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase15-tactics-ux
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npx prettier tests/e2e/phase15-tactics-ux.spec.ts --write
      - shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/phase15-tactics-ux.spec.ts
          git commit -m "style: format Phase15 tactics E2E"
          git push origin HEAD:feat/phase15-tactics-ux
