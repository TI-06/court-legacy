name: Phase16 PvP session store GREEN

on:
  push:
    branches:
      - feat/phase16-official-pvp-completion
    paths:
      - .github/workflows/phase16-pvp-session-store-green.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase16-official-pvp-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Add session store mapping and RPC methods
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('worker/data/SupabasePvPStore.ts')
          text = path.read_text()

          old_import = '''import type {\n  CommitRatedPvpMatchInput,\n  CommittedRatedPvpMatch,\n  PersistedPvpOperation,\n  PublishedPvpTeamSnapshot,\n  PublishPvpSnapshotInput,\n  PvPStore,\n  PvpHistoryEntry,\n  PvpHistoryQuery,\n  PvpListQuery,\n  PvpOpponentQuery,\n  PvpOpponentSummary,\n  PvpRankingEntry,\n} from "./PvPStore";'''
          new_import = '''import type {\n  CommitRatedPvpMatchInput,\n  CommittedRatedPvpMatch,\n  CreatePvpMatchSessionInput,\n  PersistedPvpMatchSession,\n  PersistedPvpOperation,\n  PublishedPvpTeamSnapshot,\n  PublishPvpSnapshotInput,\n  PvPStore,\n  PvpHistoryEntry,\n  PvpHistoryQuery,\n  PvpListQuery,\n  PvpOpponentQuery,\n  PvpOpponentSummary,\n  PvpRankingEntry,\n  SavedPvpMatchSessionCommand,\n  SavePvpMatchSessionCommandInput,\n  StorePvpMatchSessionFinalResponseInput,\n} from "./PvPStore";'''
          if old_import not in text:
              raise SystemExit('PvPStore import block not found')
          text = text.replace(old_import, new_import, 1)

          marker = '''const committedMatchRowSchema = z.object({\n  match_id: z.string().min(1),'''
          schemas = '''const matchSessionRowSchema = z.object({\n  challenger_user_id: z.string().min(1),\n  operation_id: z.string().min(1),\n  defender_snapshot_id: z.string().min(1),\n  challenger_source_revision: z.number().int().positive(),\n  current_cursor: z.number().int().nonnegative(),\n  private_session: z.unknown(),\n  public_response: z.unknown(),\n  final_response: z.unknown().nullable(),\n  created_at: z.string().min(1),\n  updated_at: z.string().min(1),\n});\n\nconst savedMatchSessionCommandRowSchema = matchSessionRowSchema.extend({\n  replayed: z.boolean(),\n  command_response: z.unknown(),\n});\n\n'''
          if marker not in text:
              raise SystemExit('committed match schema marker not found')
          text = text.replace(marker, schemas + marker, 1)

          marker = '''function throwRpcError(label: string, error: unknown): never {\n  throw new PvPStoreDataError(`${label} failed`, { cause: error });\n}\n'''
          mapper = marker + '''\nfunction mapMatchSession(value: unknown): PersistedPvpMatchSession {\n  const parsed = matchSessionRowSchema.safeParse(value);\n  if (!parsed.success) {\n    throw new PvPStoreDataError("PvP match session row is invalid", {\n      cause: parsed.error,\n    });\n  }\n  const row = parsed.data;\n  return {\n    challengerUserId: row.challenger_user_id,\n    operationId: row.operation_id,\n    defenderSnapshotId: row.defender_snapshot_id,\n    challengerSourceRevision: row.challenger_source_revision,\n    currentCursor: row.current_cursor,\n    privateSession: row.private_session,\n    publicResponse: row.public_response,\n    finalResponse: row.final_response,\n    createdAt: row.created_at,\n    updatedAt: row.updated_at,\n  };\n}\n'''
          if marker not in text:
              raise SystemExit('throwRpcError marker not found')
          text = text.replace(marker, mapper, 1)

          marker = '''  async commitRatedMatch(\n    input: CommitRatedPvpMatchInput,\n  ): Promise<CommittedRatedPvpMatch> {'''
          methods = '''  async createMatchSession(\n    input: CreatePvpMatchSessionInput,\n  ): Promise<PersistedPvpMatchSession> {\n    const { data, error } = await this.client.rpc("create_pvp_match_session", {\n      p_challenger_user_id: input.challengerUserId,\n      p_operation_id: input.operationId,\n      p_defender_snapshot_id: input.defenderSnapshotId,\n      p_challenger_source_revision: input.challengerSourceRevision,\n      p_current_cursor: input.currentCursor,\n      p_private_session: input.privateSession,\n      p_public_response: input.publicResponse,\n    });\n    if (error) throwRpcError("PvP match session create", error);\n    const rows = parseRows(data, matchSessionRowSchema, "PvP match session create response");\n    if (rows.length !== 1) {\n      throw new PvPStoreDataError("PvP match session create response must contain one row");\n    }\n    return mapMatchSession(rows[0]);\n  }\n\n  async getMatchSession(\n    challengerUserId: string,\n    operationId: string,\n  ): Promise<PersistedPvpMatchSession | null> {\n    const { data, error } = await this.client.rpc("get_pvp_match_session", {\n      p_challenger_user_id: challengerUserId,\n      p_operation_id: operationId,\n    });\n    if (error) throwRpcError("PvP match session lookup", error);\n    const rows = parseRows(data, matchSessionRowSchema, "PvP match session lookup response");\n    if (rows.length === 0) return null;\n    if (rows.length !== 1) {\n      throw new PvPStoreDataError("PvP match session lookup response has duplicate rows");\n    }\n    return mapMatchSession(rows[0]);\n  }\n\n  async saveMatchSessionCommand(\n    input: SavePvpMatchSessionCommandInput,\n  ): Promise<SavedPvpMatchSessionCommand> {\n    const { data, error } = await this.client.rpc("save_pvp_match_session_command", {\n      p_challenger_user_id: input.challengerUserId,\n      p_operation_id: input.operationId,\n      p_command_id: input.commandId,\n      p_command: input.command,\n      p_expected_cursor: input.expectedCursor,\n      p_next_cursor: input.nextCursor,\n      p_private_session: input.privateSession,\n      p_public_response: input.publicResponse,\n    });\n    if (error) throwRpcError("PvP match session command save", error);\n    const rows = parseRows(\n      data,\n      savedMatchSessionCommandRowSchema,\n      "PvP match session command response",\n    );\n    if (rows.length !== 1) {\n      throw new PvPStoreDataError("PvP match session command response must contain one row");\n    }\n    const row = rows[0]!;\n    return {\n      session: mapMatchSession(row),\n      replayed: row.replayed,\n      commandResponse: row.command_response,\n    };\n  }\n\n  async storeMatchSessionFinalResponse(\n    input: StorePvpMatchSessionFinalResponseInput,\n  ): Promise<PersistedPvpMatchSession> {\n    const { data, error } = await this.client.rpc(\n      "store_pvp_match_session_final_response",\n      {\n        p_challenger_user_id: input.challengerUserId,\n        p_operation_id: input.operationId,\n        p_final_response: input.finalResponse,\n      },\n    );\n    if (error) throwRpcError("PvP match session final response store", error);\n    const rows = parseRows(\n      data,\n      matchSessionRowSchema,\n      "PvP match session final response",\n    );\n    if (rows.length !== 1) {\n      throw new PvPStoreDataError("PvP match session final response must contain one row");\n    }\n    return mapMatchSession(rows[0]);\n  }\n\n'''
          if marker not in text:
              raise SystemExit('commitRatedMatch marker not found')
          text = text.replace(marker, methods + marker, 1)
          path.write_text(text)
          PY
      - run: npx prettier --write worker/data/SupabasePvPStore.ts worker/data/PvPStore.ts tests/unit/worker/phase16PvpSessionStore.test.ts
      - name: Focused tests
        run: npx vitest run tests/unit/worker/phase16PvpSessionStore.test.ts tests/unit/worker/supabasePvPStore.test.ts tests/unit/worker/pvpMigration.test.ts tests/unit/worker/pvpChallenge.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Remove temporary files and commit
        run: |
          git rm .github/workflows/phase16-pvp-session-store-green.yml
          if [ -f docs/superpowers/.phase16-task3-red-marker.md ]; then git rm docs/superpowers/.phase16-task3-red-marker.md; fi
          git add worker/data/SupabasePvPStore.ts worker/data/PvPStore.ts supabase/migrations/202609100001_phase16_pvp_match_sessions.sql tests/unit/worker/phase16PvpSessionStore.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: persist authoritative PvP match sessions"
          git push
